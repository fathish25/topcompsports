<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --success: #10b981;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--black);
            color: var(--white); 
            min-height: 100vh;
        }

        .header {
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(10px);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-blue);
        }

        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--accent-yellow); }

        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; }
        .nav a:hover { color: var(--primary-blue); }

        .btn { padding: 8px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-logout { background: transparent; border: 2px solid var(--white); color: var(--white); }
        .btn-logout:hover { background: var(--white); color: var(--black); }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .welcome-section {
            background: var(--gradient-blue);
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .welcome-section h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .welcome-section p { color: rgba(255,255,255,0.8); font-size: 1.1rem; }

        .profile-card {
            background: var(--dark-gray);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid var(--medium-gray);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--medium-gray);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent-yellow);
            background: var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            flex-shrink: 0;
        }

        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .profile-info h2 { color: var(--accent-yellow); margin-bottom: 10px; font-size: 2rem; }
        .profile-info p { color: rgba(255,255,255,0.7); margin-bottom: 5px; }
        .profile-info .email { color: var(--primary-blue); font-weight: 600; }

        .profile-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .detail-item {
            background: var(--black);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-blue);
        }

        .detail-label { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 5px; }
        .detail-value { color: var(--white); font-size: 1.1rem; font-weight: 600; }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn-primary { background: var(--primary-blue); color: var(--white); padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        
        .btn-secondary { background: var(--success); color: var(--white); padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }

        .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); font-size: 1.2rem; }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .profile-header { flex-direction: column; text-align: center; }
            .profile-info h2 { font-size: 1.5rem; }
            .welcome-section h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-text">TopCompSports</div>
        </div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="index.html#tournaments">Tournaments</a>
            <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="welcome-section">
            <h1>Welcome to Your Dashboard! </h1>
            <p>Manage your profile and track your tournament journey</p>
        </div>

        <div id="loading" class="loading">Loading your profile...</div>

        <div id="profileContent" style="display: none;">
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">
                        <span>👤</span>
                    </div>
                    <div class="profile-info">
                        <h2 id="profileName">User Name</h2>
                        <p class="email" id="profileEmail">user@email.com</p>
                        <p id="profileType">Athlete</p>
                    </div>
                </div>

                <div class="profile-details">
                    <div class="detail-item">
                        <div class="detail-label"> Date of Birth</div>
                        <div class="detail-value" id="profileDob">Not provided</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">👤 Gender</div>
                        <div class="detail-value" id="profileGender">Not provided</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">🌍 Country</div>
                        <div class="detail-value" id="profileCountry">Not provided</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">📱 Phone</div>
                        <div class="detail-value" id="profilePhone">Not provided</div>
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn-primary" onclick="window.location.href='profile.html'">
                        ✏️ Edit Profile
                    </button>
                    <button class="btn-secondary" onclick="window.location.href='index.html#tournaments'">
                         Browse Tournaments
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        window.onload = async function() {
            const { data: { user }, error } = await dbClient.auth.getUser();
            
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;
            
            // Check if profile is complete
            const { data: profile } = await dbClient
                .from('users')
                .select('*')
                .eq('id', user.id)
                .maybeSingle();

            if (!profile || !profile.full_name || !profile.date_of_birth || !profile.gender) {
                // Profile not complete, redirect to profile page
                console.log('Profile not complete, redirecting to profile.html');
                window.location.href = 'profile.html';
                return;
            }

            await loadUserProfile();
        };

        async function loadUserProfile() {
            try {
                const { data: profile, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) throw error;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('profileContent').style.display = 'block';

                if (profile) {
                    document.getElementById('profileName').textContent = profile.full_name || 'User';
                    document.getElementById('profileEmail').textContent = profile.email;
                    document.getElementById('profileType').textContent = 
                        (profile.user_type || 'Athlete').charAt(0).toUpperCase() + (profile.user_type || 'Athlete').slice(1);
                    
                    document.getElementById('profileDob').textContent = profile.date_of_birth || 'Not provided';
                    document.getElementById('profileGender').textContent = profile.gender || 'Not provided';
                    document.getElementById('profileCountry').textContent = profile.country || 'Not provided';
                    document.getElementById('profilePhone').textContent = profile.phone || 'Not provided';

                    if (profile.profile_picture_url) {
                        document.getElementById('profileAvatar').innerHTML = 
                            `<img src="${profile.profile_picture_url}" alt="Profile">`;
                    }
                } else {
                    document.getElementById('profileName').textContent = currentUser.email.split('@')[0];
                    document.getElementById('profileEmail').textContent = currentUser.email;
                }

            } catch (err) {
                console.error('Load profile error:', err);
                document.getElementById('loading').textContent = 'Error loading profile. Please try again.';
            }
        }

        async function handleLogout() {
            await dbClient.auth.signOut();
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
