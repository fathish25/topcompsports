<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Management - TopCompSports Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17; --bg-card: #151d2b; --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB; --accent: #f1c40f; --accent-dark: #d4a017;
            --text-main: #ffffff; --text-muted: rgba(255,255,255,0.7);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        
        .sidebar { 
            width: 280px; 
            background: rgba(21, 29, 43, 0.98); 
            border-left: 2px solid var(--primary); 
            position: fixed; 
            height: 100vh; 
            padding: 20px; 
            right: 0; 
            overflow-y: auto; 
            z-index: 100; 
            display: flex;
            flex-direction: column;
        }
        [dir="ltr"] .sidebar { right: auto; left: 0; border-left: none; border-right: 2px solid var(--primary); }
        
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            padding: 20px; 
            margin-bottom: 30px; 
            border-bottom: 2px solid rgba(255,255,255,0.1); 
        }
        .logo-icon { 
            width: 50px; 
            height: 50px; 
            background: linear-gradient(135deg, var(--accent), var(--accent-dark)); 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            font-weight: bold; 
            color: var(--bg-dark); 
        }
        .logo-text { 
            font-size: 22px; 
            font-weight: bold; 
        }
        
        .nav-menu { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            flex: 1;
        }
        .nav-item { 
            padding: 15px 20px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: all 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 15px; 
            text-decoration: none; 
            color: var(--text-main); 
        }
        .nav-item:hover { 
            background: rgba(255,255,255,0.05); 
        }
        .nav-item.active { 
            background: linear-gradient(135deg, var(--primary), #1d4ed8); 
        }
        .nav-item .icon {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
        }
        
        .role-badge {
            background: var(--accent);
            color: var(--bg-dark);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: auto;
            display: block;
            text-align: center;
        }
        
        .main-content { margin-right: 280px; padding: 40px; }
        [dir="ltr"] .main-content { margin-right: 0; margin-left: 280px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .page-title { font-size: 32px; font-weight: bold; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        .lang-switcher { display: flex; gap: 10px; }
        .lang-btn { background: transparent; border: 2px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .lang-btn.active { background: var(--primary); color: var(--text-main); }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: var(--bg-dark); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: var(--text-main); }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: var(--text-main); }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: var(--text-main); }
        .btn-info { background: linear-gradient(135deg, var(--primary), #1d4ed8); color: var(--text-main); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 32px; font-weight: bold; color: var(--accent); }
        .stat-label { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        .section { background: var(--bg-card); border-radius: 16px; padding: 30px; margin-bottom: 30px; }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: var(--accent); }
        .filters { display: grid; grid-template-columns: 2fr 1fr auto; gap: 15px; margin-bottom: 25px; align-items: end; }
        .form-input, .form-select { background: var(--bg-input); border: 2px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
        .form-label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px; }
        select.form-select option { background-color: var(--bg-card) !important; color: var(--text-main) !important; }

        .org-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; transition: all 0.3s; }
        .org-card:hover { border-color: var(--primary); background: rgba(37, 99, 235, 0.05); }
        .org-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .org-name { font-size: 20px; font-weight: bold; color: var(--accent); }
        .org-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .info-item { display: flex; gap: 10px; align-items: center; }
        .info-label { color: var(--text-muted); font-size: 13px; }
        .info-value { font-weight: 600; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }

        .status-badge { padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-verified { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-suspended { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: 16px; padding: 30px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 22px; font-weight: bold; color: var(--accent); }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        .close-modal:hover { color: var(--text-main); }
        .form-group { margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; justify-content: center; }

        .user-images { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .image-box { text-align: center; }
        .image-box img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); cursor: pointer; }
        .image-box p { margin-top: 8px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .image-box .no-image { width: 100%; height: 150px; background: rgba(255,255,255,0.03); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 3rem; border: 2px dashed rgba(255,255,255,0.1); }
        
        .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
        .detail-item { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .detail-label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .detail-value { font-weight: 600; color: var(--text-main); word-break: break-word; }

        @media (max-width: 1024px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main-content { margin-right: 0; margin-left: 0; padding: 20px; }
            .filters { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; }
            .user-images { grid-template-columns: 1fr; }
            .details-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                </div>
                <button class="btn btn-primary" onclick="showCreateModal()">
                    <i class="fas fa-plus"></i>

        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label" data-en="Total Organizers" data-ar="إجمالي الجهات">Total Organizers</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statVerified">0</div>
                <div class="stat-label" data-en="Verified" data-ar="المُتحقق منها">Verified</div>
            </div>
            <div class="stat-card">

                <div>
                    <label class="form-label" data-en="Status" data-ar="الحالة">Status</label>

                    <i class="fas fa-times"></i> 
                    <span data-en="Cancel" data-ar="إلغاء">Cancel</span>
                </button>
            </div>
        </div>
    </div>

        let suspendTargetId = null;

        window.onload = async () => {
            await checkAuth();
            window.setLang(currentLang);
            
            const urlParams = new URLSearchParams(window.location.search);
            const filterParam = urlParams.get('filter');
            if (filterParam === 'pending') {
                document.getElementById('filterStatus').value = 'pending';
            }
            
            await loadOrganizations();
        };

        window.setLang = function(lang) {
            currentLang = lang;
            localStorage.setItem('selectedLanguage', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if ((lang === 'en' && btn.textContent.trim() === 'EN') || (lang === 'ar' && btn.textContent.trim() === 'AR')) {
                    btn.classList.add('active');
                }
            });
            
            document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
            });
            document.querySelectorAll('[data-placeholder-en][data-placeholder-ar]').forEach(el => {
                el.placeholder = lang === 'ar' ? el.dataset.placeholderAr : el.dataset.placeholderEn;
            });
        };

        async function checkAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'admin-login.html'; return; }
            const { data: admin } = await supabaseClient.from('admin_profiles').select('*').eq('id', user.id).maybeSingle();
            if (!admin) { window.location.href = 'index.html'; return; }
        }

        async function loadOrganizations() {
            const search = document.getElementById('searchOrg').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            const { data, error } = await supabaseClient
                .from('organizers')
                .select('id, user_id, full_name, org_name, email, country, city, phone, verification_status, is_suspended, suspension_reason, profile_photo_url, id_document_url, website, bio, created_at')
                .order('created_at', { ascending: false });

            if (error) { console.error('Error:', error); return; }

            allOrganizations = (data || []).map(org => {
                let status = 'pending';
                if (org.is_suspended) status = 'suspended';
                else if (org.verification_status === 'approved') status = 'verified';
                return { ...org, status };
            });

            let filtered = allOrganizations;
            if (search) {
                filtered = filtered.filter(o => 
                    (o.org_name && o.org_name.toLowerCase().includes(search)) ||
                    (o.full_name && o.full_name.toLowerCase().includes(search)) ||
                    (o.email && o.email.toLowerCase().includes(search))
                );
            }
            if (statusFilter) filtered = filtered.filter(o => o.status === statusFilter);

            document.getElementById('statTotal').textContent = allOrganizations.length;
            document.getElementById('statVerified').textContent = allOrganizations.filter(o => o.status === 'verified').length;
            document.getElementById('statPending').textContent = allOrganizations.filter(o => o.status === 'pending').length;

            const listDiv = document.getElementById('organizationsList');
            if (filtered.length === 0) {
                listDiv.innerHTML = `<div style="text-align: center; padding: 40px; color: var(--text-muted);" data-en="No organizers found" data-ar="لا توجد جهات منظمة">No organizers found</div>`;
                return;
            }

            listDiv.innerHTML = filtered.map(org => {
                const statusClass = org.status === 'verified' ? 'status-verified' : org.status === 'suspended' ? 'status-suspended' : 'status-pending';
                const statusText = { verified: currentLang === 'ar' ? 'مُتحقق منها' : 'Verified', suspended: currentLang === 'ar' ? 'موقوفة' : 'Suspended', pending: currentLang === 'ar' ? 'قيد الانتظار' : 'Pending' }[org.status];
                const name = org.org_name || org.full_name || (currentLang === 'ar' ? 'بدون اسم' : 'No Name');

                return `
                    <div class="org-card">
                        <div class="org-header">
                            <div>
                                <div class="org-name">${name}</div>
                                <div style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">${org.email || '-'}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="org-info">
                            <div class="info-item"><span class="info-label"></span><span class="info-value">${org.city || '-'}, ${org.country || '-'}</span></div>
                            <div class="info-item"><span class="info-label">📞</span><span class="info-value">${org.phone || '-'}</span></div>
                            <div class="info-item"><span class="info-label">📅</span><span class="info-value">${org.created_at ? new Date(org.created_at).toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US') : '-'}</span></div>
                        </div>
                        <div class="action-btns">
                            <button class="btn btn-info btn-sm" onclick="viewOrganization('${org.id}')">
                                <i class="fas fa-eye"></i> 
                                <span data-en="View" data-ar="عرض">View</span>
                            </button>
                            <button class="btn btn-primary btn-sm" onclick="editOrganization('${org.id}')">
                                <i class="fas fa-edit"></i> 
                                <span data-en="Edit" data-ar="تعديل">Edit</span>
                            </button>
                            ${org.status !== 'verified' ? `<button class="btn btn-success btn-sm" onclick="verifyOrganization('${org.id}')">
                                <i class="fas fa-check"></i> 
                                <span data-en="Verify" data-ar="تحقق">Verify</span>
                            </button>` : ''}
                            ${org.status !== 'suspended' ? `<button class="btn btn-warning btn-sm" onclick="openSuspendModal('${org.id}')">
                                <i class="fas fa-ban"></i> 
                                <span data-en="Suspend" data-ar="تعليق">Suspend</span>
                            </button>` : `<button class="btn btn-success btn-sm" onclick="activateOrganization('${org.id}')">
                                <i class="fas fa-play"></i> 
                                <span data-en="Activate" data-ar="تنشيط">Activate</span>
                            </button>`}
                            <button class="btn btn-danger btn-sm" onclick="deleteOrganization('${org.id}')">
                                <i class="fas fa-trash"></i> 
                                <span data-en="Delete" data-ar="حذف">Delete</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function viewOrganization(id) {
            const org = allOrganizations.find(o => o.id === id);
            if (!org) return;
            
            const statusText = { verified: currentLang === 'ar' ? 'مُتحقق منها' : 'Verified', suspended: currentLang === 'ar' ? 'موقوفة' : 'Suspended', pending: currentLang === 'ar' ? 'قيد الانتظار' : 'Pending' }[org.status];
            const reasonText = org.suspension_reason ? `<p style="color: var(--danger); margin-top: 10px; font-weight: 600;"><i class="fas fa-exclamation-triangle"></i> ${currentLang === 'ar' ? 'سبب التعليق:' : 'Suspension Reason:'} ${org.suspension_reason}</p>` : '';

            const profilePhotoHtml = org.profile_photo_url ? 
                `<img src="${org.profile_photo_url}" alt="Profile" onclick="window.open('${org.profile_photo_url}', '_blank')">` :
                `<div class="no-image"><i class="fas fa-user"></i></div>`;

            const idDocumentHtml = org.id_document_url ? 
                `<img src="${org.id_document_url}" alt="ID Document" onclick="window.open('${org.id_document_url}', '_blank')">` :
                `<div class="no-image"><i class="fas fa-id-card"></i></div>`;

            document.getElementById('viewModalContent').innerHTML = `
                <div class="details-grid">
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'الاسم' : 'Name'}</div><div class="detail-value">${org.full_name || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'اسم المنظمة' : 'Organization'}</div><div class="detail-value">${org.org_name || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'البريد' : 'Email'}</div><div class="detail-value">${org.email || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'الهاتف' : 'Phone'}</div><div class="detail-value">${org.phone || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'الدولة' : 'Country'}</div><div class="detail-value">${org.country || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'المدينة' : 'City'}</div><div class="detail-value">${org.city || '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'الموقع' : 'Website'}</div><div class="detail-value">${org.website ? `<a href="${org.website}" target="_blank" style="color: var(--primary);">${org.website}</a>` : '-'}</div></div>
                    <div class="detail-item"><div class="detail-label">${currentLang === 'ar' ? 'الحالة' : 'Status'}</div><div class="detail-value">${statusText}</div></div>
                </div>
                ${org.bio ? `<div class="detail-item" style="margin-bottom: 15px;"><div class="detail-label">${currentLang === 'ar' ? 'نبذة' : 'Bio'}</div><div class="detail-value" style="font-weight: normal; line-height: 1.5;">${org.bio}</div></div>` : ''}
                ${reasonText}
                <div class="user-images">
                    <div class="image-box">
                        ${profilePhotoHtml}
                        <p>${currentLang === 'ar' ? 'صورة البروفايل' : 'Profile Photo'}</p>
                    </div>
                    <div class="image-box">
                        ${idDocumentHtml}
                        <p>${currentLang === 'ar' ? 'صورة الهوية' : 'ID Document'}</p>
                    </div>
                </div>
            `;
            document.getElementById('viewModal').classList.add('active');
        }

        function editOrganization(id) {
            const org = allOrganizations.find(o => o.id === id);
            if (!org) return;

            document.getElementById('editId').value = org.id;
            document.getElementById('editFullName').value = org.full_name || '';
            document.getElementById('editOrgName').value = org.org_name || '';
            document.getElementById('editEmail').value = org.email || '';
            document.getElementById('editPhone').value = org.phone || '';
            document.getElementById('editCountry').value = org.country || '';
            document.getElementById('editCity').value = org.city || '';
            document.getElementById('editWebsite').value = org.website || '';
            document.getElementById('editVerification').value = org.verification_status || 'pending';
            document.getElementById('editBio').value = org.bio || '';

            document.getElementById('editModal').classList.add('active');
        }

        async function saveEdit(e) {
            e.preventDefault();
            const updateData = {
                full_name: document.getElementById('editFullName').value,
                org_name: document.getElementById('editOrgName').value,
                email: document.getElementById('editEmail').value,
                phone: document.getElementById('editPhone').value,
                country: document.getElementById('editCountry').value,
                city: document.getElementById('editCity').value,
                website: document.getElementById('editWebsite').value,
                verification_status: document.getElementById('editVerification').value,
                bio: document.getElementById('editBio').value,
                updated_at: new Date().toISOString()
            };

            try {
                const { error } = await supabaseClient.from('organizers').update(updateData).eq('id', document.getElementById('editId').value);
                if (error) throw error;
                
                alert(currentLang === 'ar' ? '✅ تم التعديل بنجاح' : '✅ Updated successfully');
                closeEditModal();
                loadOrganizations();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function closeViewModal() { document.getElementById('viewModal').classList.remove('active'); }
        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }
        function closeCreateModal() { 
            document.getElementById('createModal').classList.remove('active');
            ['orgName', 'orgEmail', 'orgPassword', 'orgPhone', 'orgCountry', 'orgCity'].forEach(id => document.getElementById(id).value = '');
        }
        function showCreateModal() { document.getElementById('createModal').classList.add('active'); }
        
        function openSuspendModal(id) {
            suspendTargetId = id;
            document.getElementById('suspendReason').value = '';
            document.getElementById('suspendModal').classList.add('active');
        }
        function closeSuspendModal() { 
            document.getElementById('suspendModal').classList.remove('active'); 
            suspendTargetId = null;
        }

        async function createOrganization() {
            const orgName = document.getElementById('orgName').value.trim();
            const email = document.getElementById('orgEmail').value.trim();
            const password = document.getElementById('orgPassword').value;
            const phone = document.getElementById('orgPhone').value.trim();
            const country = document.getElementById('orgCountry').value.trim();
            const city = document.getElementById('orgCity').value.trim();

            if (!orgName || !email || !password) {
                alert(currentLang === 'ar' ? 'الرجاء ملء الحقول المطلوبة' : 'Please fill required fields');
                return;
            }

            const btn = document.querySelector('#createModal .btn-success');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/create-regular-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
                    body: JSON.stringify({ email, password, full_name: orgName, role: 'organizer', org_name: orgName, phone, country, city })
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Failed to create organizer');
                
                alert(currentLang === 'ar' ? '✅ تم إنشاء الجهة المنظمة بنجاح' : '✅ Organizer created successfully');
                closeCreateModal();
                loadOrganizations();
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-check"></i> <span data-en="Create" data-ar="إنشاء">Create</span>`;
            }
        }

        async function verifyOrganization(id) {
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد من التحقق من هذه الجهة؟' : 'Are you sure you want to verify this organizer?')) return;
            const { error } = await supabaseClient.from('organizers').update({ verification_status: 'approved', updated_at: new Date().toISOString() }).eq('id', id);
            if (error) { alert('Error: ' + error.message); return; }
            alert(currentLang === 'ar' ? 'تم التحقق بنجاح' : 'Verified successfully');
            loadOrganizations();
        }

        async function confirmSuspend() {
            const reason = document.getElementById('suspendReason').value.trim();
            if (!reason) { alert(currentLang === 'ar' ? 'يرجى إدخال سبب التعليق' : 'Please enter a reason for suspension'); return; }
            const { error } = await supabaseClient.from('organizers').update({ is_suspended: true, suspension_reason: reason, updated_at: new Date().toISOString() }).eq('id', suspendTargetId);
            if (error) { alert('Error: ' + error.message); return; }
            alert(currentLang === 'ar' ? '✅ تم تعليق الجهة بنجاح' : '✅ Organizer suspended successfully');
            closeSuspendModal();
            loadOrganizations();
        }

        async function activateOrganization(id) {
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد من تنشيط هذه الجهة؟' : 'Are you sure you want to activate this organizer?')) return;
            const { error } = await supabaseClient.from('organizers').update({ is_suspended: false, suspension_reason: null, updated_at: new Date().toISOString() }).eq('id', id);
            if (error) { alert('Error: ' + error.message); return; }
            alert(currentLang === 'ar' ? '✅ تم تنشيط الجهة بنجاح' : '✅ Organizer activated successfully');
            loadOrganizations();
        }

        async function deleteOrganization(id) {
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد من حذف هذه الجهة المنظمة؟' : 'Are you sure you want to delete this organizer?')) return;
            const { error } = await supabaseClient.from('organizers').delete().eq('id', id);
            if (error) { alert('Error: ' + error.message); return; }
            alert(currentLang === 'ar' ? 'تم الحذف بنجاح' : 'Deleted successfully');
            loadOrganizations();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
