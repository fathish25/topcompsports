<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الجهات المنظمة - TopCompSports Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; }
        .sidebar { width: 280px; background: rgba(21, 29, 43, 0.98); border-left: 2px solid #2563EB; position: fixed; height: 100vh; padding: 20px; right: 0; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 15px; padding: 20px; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #0a0e17; }
        .logo-text { font-size: 22px; font-weight: bold; }
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 15px 20px; border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; font-size: 15px; text-decoration: none; color: #fff; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: linear-gradient(135deg, #2563EB, #1d4ed8); }
        .main-content { margin-right: 280px; padding: 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .page-title { font-size: 32px; font-weight: bold; }
        .section { background: #151d2b; border-radius: 16px; padding: 30px; margin-bottom: 30px; }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #f1c40f; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        th { background: rgba(241, 196, 15, 0.1); color: #f1c40f; font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .status-badge { padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-verified { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-suspended { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .filters { display: grid; grid-template-columns: 2fr 1fr auto; gap: 15px; margin-bottom: 25px; align-items: end; }
        .form-input, .form-select { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #f1c40f; }
        .form-label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.8); font-size: 13px; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #151d2b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #f1c40f; }
        .stat-label { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 5px; }
        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .org-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .org-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px; }
        .org-name { font-size: 20px; font-weight: bold; color: #f1c40f; }
        .org-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .info-item { display: flex; gap: 10px; }
        .info-label { color: rgba(255,255,255,0.6); font-size: 13px; }
        .info-value { font-weight: 600; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #151d2b; border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-title { font-size: 22px; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }
        @media (max-width: 1024px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            .main-content { margin-right: 0; }
            .filters { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; }
            .org-info { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div class="nav-menu">
            <a class="nav-item" href="admin-dashboard.html">📊 لوحة التحكم</a>
            <a class="nav-item" href="admin-tournaments.html">🏆 البطولات</a>
            <a class="nav-item" href="admin-users.html"> المستخدمون</a>
            <a class="nav-item" href="admin-registrations.html">📝 التسجيلات</a>
            <a class="nav-item active">🏢 الجهات المنظمة</a>
            <a class="nav-item" href="admin-reports.html">📈 التقارير</a>
            <a class="nav-item" href="admin-settings.html">⚙️ الإعدادات</a>
            <a class="nav-item" onclick="logout()">🚪 تسجيل الخروج</a>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1 class="page-title">إدارة الجهات المنظمة</h1>
            <button class="btn btn-primary" onclick="showCreateModal()">➕ إضافة جهة منظمة</button>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">إجمالي الجهات</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statVerified">0</div>
                <div class="stat-label">المُتحقق منها</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label">قيد الانتظار</div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">قائمة الجهات المنظمة</h2>
            
            <div class="filters">
                <div>
                    <label class="form-label">بحث</label>
                    <input type="text" class="form-input" id="searchOrg" placeholder="ابحث بالاسم أو البريد..." onkeyup="loadOrganizations()">
                </div>
                <div>
                    <label class="form-label">الحالة</label>
                    <select class="form-select" id="filterStatus" onchange="loadOrganizations()">
                        <option value="">جميع الحالات</option>
                        <option value="verified">مُتحقق منها</option>
                        <option value="pending">قيد الانتظار</option>
                        <option value="suspended">موقوفة</option>
                    </select>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="loadOrganizations()" style="width: 100%;">🔄 تحديث</button>
                </div>
            </div>

            <div id="organizationsList">
                <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <!-- Modal إضافة جهة -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <h3 class="modal-title">إضافة جهة منظمة جديدة</h3>
            <div class="form-group">
                <label class="form-label">اسم المنظمة</label>
                <input type="text" class="form-input" id="orgName" placeholder="أدخل اسم المنظمة">
            </div>
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-input" id="orgEmail" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-input" id="orgPassword" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label class="form-label">الدولة</label>
                <input type="text" class="form-input" id="orgCountry" placeholder="الدولة">
            </div>
            <div class="form-group">
                <label class="form-label">المدينة</label>
                <input type="text" class="form-input" id="orgCity" placeholder="المدينة">
            </div>
            <div class="modal-actions">
                <button class="btn btn-success" onclick="createOrganization()">✅ إنشاء</button>
                <button class="btn btn-danger" onclick="closeModal()">❌ إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allOrganizations = [];

        window.onload = async () => {
            await checkAuth();
            await loadOrganizations();
        };

        async function checkAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { window.location.href = 'admin-login.html'; return; }
            const { data: admin } = await supabaseClient.from('admin_profiles').select('*').eq('id', user.id).maybeSingle();
            if (!admin) { window.location.href = 'index.html'; return; }
        }

        async function loadOrganizations() {
            const search = document.getElementById('searchOrg').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            const { data, error } = await supabaseClient
                .from('organizers')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error:', error);
                return;
            }

            allOrganizations = data || [];

            // تطبيق الفلاتر
            let filtered = allOrganizations;
            if (search) {
                filtered = filtered.filter(o => 
                    (o.org_name && o.org_name.toLowerCase().includes(search)) ||
                    (o.email && o.email.toLowerCase().includes(search)) ||
                    (o.full_name && o.full_name.toLowerCase().includes(search))
                );
            }
            if (statusFilter) filtered = filtered.filter(o => o.status === statusFilter);

            // تحديث الإحصائيات
            document.getElementById('statTotal').textContent = allOrganizations.length;
            document.getElementById('statVerified').textContent = allOrganizations.filter(o => o.status === 'verified').length;
            document.getElementById('statPending').textContent = allOrganizations.filter(o => o.status === 'pending').length;

            // عرض البيانات
            const listDiv = document.getElementById('organizationsList');
            
            if (filtered.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.5);">لا توجد جهات منظمة</div>';
                return;
            }

            listDiv.innerHTML = filtered.map((org, i) => {
                const statusClass = org.status === 'verified' ? 'status-verified' : 
                                   org.status === 'suspended' ? 'status-suspended' : 'status-pending';
                const statusText = { verified: 'مُتحقق منها', suspended: 'موقوفة', pending: 'قيد الانتظار' }[org.status] || org.status;

                return `
                    <div class="org-card">
                        <div class="org-header">
                            <div>
                                <div class="org-name">${org.org_name || org.full_name || 'بدون اسم'}</div>
                                <div style="color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 5px;">${org.email || '-'}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="org-info">
                            <div class="info-item">
                                <span class="info-label">📍 الموقع:</span>
                                <span class="info-value">${org.city || '-'}, ${org.country || '-'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">📞 الهاتف:</span>
                                <span class="info-value">${org.phone || '-'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">📅 تاريخ التسجيل:</span>
                                <span class="info-value">${org.created_at ? new Date(org.created_at).toLocaleDateString('ar-SA') : '-'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">🏆 عدد البطولات:</span>
                                <span class="info-value">${org.tournament_count || 0}</span>
                            </div>
                        </div>
                        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                            ${org.status !== 'verified' ? `<button class="btn btn-success" onclick="verifyOrganization('${org.id}')" style="padding: 8px 15px; font-size: 13px;">✅ تحقق</button>` : ''}
                            ${org.status !== 'suspended' ? `<button class="btn btn-warning" onclick="suspendOrganization('${org.id}')" style="padding: 8px 15px; font-size: 13px;">️ إيقاف</button>` : ''}
                            <button class="btn btn-danger" onclick="deleteOrganization('${org.id}')" style="padding: 8px 15px; font-size: 13px;">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showCreateModal() {
            document.getElementById('createModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('active');
            document.getElementById('orgName').value = '';
            document.getElementById('orgEmail').value = '';
            document.getElementById('orgPassword').value = '';
            document.getElementById('orgCountry').value = '';
            document.getElementById('orgCity').value = '';
        }

        async function createOrganization() {
            const orgName = document.getElementById('orgName').value;
            const email = document.getElementById('orgEmail').value;
            const password = document.getElementById('orgPassword').value;
            const country = document.getElementById('orgCountry').value;
            const city = document.getElementById('orgCity').value;

            if (!orgName || !email || !password) {
                alert('الرجاء ملء الحقول المطلوبة');
                return;
            }

            // إنشاء حساب organizer
            const { data: userData, error: authError } = await supabaseClient.auth.admin.createUser({
                email: email,
                password: password,
                email_confirm: true
            });

            if (authError) {
                alert('خطأ في إنشاء الحساب: ' + authError.message);
                return;
            }

            // إضافة إلى جدول organizers
            const { error: insertError } = await supabaseClient.from('organizers').insert({
                id: userData.user.id,
                org_name: orgName,
                full_name: orgName,
                email: email,
                country: country,
                city: city,
                status: 'pending',
                created_at: new Date().toISOString()
            });

            if (insertError) {
                alert('خطأ: ' + insertError.message);
                return;
            }

            alert('تم إنشاء الجهة المنظمة بنجاح');
            closeModal();
            loadOrganizations();
        }

        async function verifyOrganization(id) {
            const { error } = await supabaseClient.from('organizers').update({ status: 'verified' }).eq('id', id);
            if (error) { alert('خطأ: ' + error.message); return; }
            alert('تم التحقق من الجهة المنظمة');
            loadOrganizations();
        }

        async function suspendOrganization(id) {
            const { error } = await supabaseClient.from('organizers').update({ status: 'suspended' }).eq('id', id);
            if (error) { alert('خطأ: ' + error.message); return; }
            alert('تم إيقاف الجهة المنظمة');
            loadOrganizations();
        }

        async function deleteOrganization(id) {
            if (!confirm('هل أنت متأكد من حذف هذه الجهة المنظمة؟')) return;
            const { error } = await supabaseClient.from('organizers').delete().eq('id', id);
            if (error) { alert('خطأ: ' + error.message); return; }
            alert('تم الحذف بنجاح');
            loadOrganizations();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
