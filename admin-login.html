<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopCompSports - Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #151d2b;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f1c40f, #d4a017);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            color: #0a0e17;
            margin: 0 auto 20px;
        }
        .logo-text { font-size: 28px; font-weight: bold; color: #f1c40f; }
        .logo-subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 25px; }
        .form-label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 600;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #f1c40f;
            background: rgba(241, 196, 15, 0.05);
        }
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #f1c40f, #d4a017);
            color: #0a0e17;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            white-space: pre-line;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #10b981;
        }
        .alert.show { display: block; }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-link a:hover { color: #f1c40f; }
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            display: none;
        }
        .debug-info.show { display: block; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
            <div class="logo-subtitle">Admin Control Panel</div>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-input" id="email" placeholder="admin@topcompsports.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <input type="password" class="form-input" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">🔐 تسجيل الدخول</button>
        </form>

        <div class="debug-info" id="debugInfo"></div>

        <div class="back-link">
            <a href="index.html">← العودة للموقع الرئيسي</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if already logged in as admin
        window.onload = async () => {
            console.log('🔍 Checking existing session...');
            const { data: { user }, error } = await supabase.auth.getUser();
            
            if (error) {
                console.log(' No existing session:', error.message);
                return;
            }

            if (user) {
                console.log('✅ Found user:', user.email);
                // Check if user is admin
                const { data: admin, error: adminError } = await supabase
                    .from('admin_profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (adminError) {
                    console.log('❌ Not an admin:', adminError.message);
                    await supabase.auth.signOut();
                    return;
                }

                if (admin) {
                    console.log('✅ Admin found, redirecting...');
                    window.location.href = 'admin-dashboard.html';
                }
            }
        };

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const loginBtn = document.getElementById('loginBtn');
            const debugInfo = document.getElementById('debugInfo');

            // Hide alerts
            errorAlert.classList.remove('show');
            successAlert.classList.remove('show');

            // Disable button
            loginBtn.disabled = true;
            loginBtn.textContent = ' جاري تسجيل الدخول...';

            console.log('🔐 Attempting login for:', email);

            try {
                // Step 1: Sign in
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('❌ Login error:', error);
                    errorAlert.textContent = '❌ خطأ: ' + error.message;
                    errorAlert.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '🔐 تسجيل الدخول';
                    return;
                }

                console.log('✅ Login successful, user:', data.user.id);
                successAlert.textContent = '✅ تم تسجيل الدخول بنجاح! جاري التحقق من الصلاحيات...';
                successAlert.classList.add('show');

                // Step 2: Check if user is admin
                const { data: admin, error: adminError } = await supabase
                    .from('admin_profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();

                if (adminError) {
                    console.error('❌ Admin check error:', adminError);
                    errorAlert.textContent = '⚠️ هذا الحساب ليس لديه صلاحيات مدير\n\nتفاصيل: ' + adminError.message;
                    errorAlert.classList.add('show');
                    successAlert.classList.remove('show');
                    await supabase.auth.signOut();
                    loginBtn.disabled = false;
                    loginBtn.textContent = ' تسجيل الدخول';
                    return;
                }

                if (!admin) {
                    console.error('❌ No admin profile found');
                    errorAlert.textContent = '⚠️ هذا الحساب ليس لديه صلاحيات مدير';
                    errorAlert.classList.add('show');
                    successAlert.classList.remove('show');
                    await supabase.auth.signOut();
                    loginBtn.disabled = false;
                    loginBtn.textContent = ' تسجيل الدخول';
                    return;
                }

                console.log('✅ Admin verified:', admin.role);
                successAlert.textContent = '✅ تم التحقق! جاري التحويل إلى لوحة التحكم...';

                // Step 3: Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);

            } catch (err) {
                console.error('❌ Unexpected error:', err);
                errorAlert.textContent = '❌ خطأ غير متوقع: ' + err.message;
                errorAlert.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = '🔐 تسجيل الدخول';
            }
        }
    </script>
</body>
</html>
