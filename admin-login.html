<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>TopCompSports - Admin Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0a0e17; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: #151d2b; padding: 40px; border-radius: 20px; width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { width: 80px; height: 80px; background: #f1c40f; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; color: #0a0e17; margin: 0 auto 20px; }
        .logo-text { font-size: 28px; font-weight: bold; color: #f1c40f; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; font-size: 15px; }
        button { width: 100%; padding: 15px; background: #f1c40f; color: #0a0e17; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .msg { padding: 15px; border-radius: 10px; margin: 10px 0; display: none; }
        .err { background: rgba(239,68,68,0.2); color: #ef4444; }
        .ok { background: rgba(16,185,129,0.2); color: #10b981; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
            <div style="color: rgba(255,255,255,0.6); margin-top: 5px;">Admin Control Panel</div>
        </div>
        <div class="msg err" id="err"></div>
        <div class="msg ok" id="ok"></div>
        <input type="email" id="email" placeholder="البريد الإلكتروني" value="admin@topcompsports.com">
        <input type="password" id="pass" placeholder="كلمة المرور" value="TCS@2026!Admin">
        <button onclick="login()">تسجيل الدخول</button>
    </div>
    <script>
        const sb = window.supabase.createClient('https://ngiclnkmbvzjhylwhzyn.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w');
        
        async function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const err = document.getElementById('err');
            const ok = document.getElementById('ok');
            
            err.style.display = 'none';
            ok.style.display = 'none';
            
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
                
                if (error) {
                    err.textContent = 'خطأ: ' + error.message;
                    err.style.display = 'block';
                    return;
                }
                
                ok.textContent = 'تم تسجيل الدخول! جاري التحويل...';
                ok.style.display = 'block';
                
                // التحقق من admin_profiles
                const { data: admin, error: adminErr } = await sb.from('admin_profiles').select('*').eq('id', data.user.id).maybeSingle();
                
                if (adminErr) {
                    err.textContent = 'خطأ في قاعدة البيانات: ' + adminErr.message;
                    err.style.display = 'block';
                    return;
                }
                
                if (!admin) {
                    err.textContent = 'هذا الحساب ليس مدير';
                    err.style.display = 'block';
                    return;
                }
                
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 1000);
                
            } catch (e) {
                err.textContent = 'خطأ: ' + e.message;
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
