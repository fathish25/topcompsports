<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --white: #FFFFFF;
            --light-bg: #F5F7FA;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-bg); color: var(--black); min-height: 100vh; }

        .header { background: var(--black); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--primary-blue); }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; }
        .nav a:hover { color: var(--accent-yellow); }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { background: var(--white); border-radius: 15px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .tournament-info { background: var(--gradient-blue); color: var(--white); padding: 30px; border-radius: 12px; margin-bottom: 30px; }
        .tournament-info h1 { font-size: 2rem; margin-bottom: 10px; }
        .tournament-info p { opacity: 0.9; }

        .form-section { margin-bottom: 30px; }
        .section-title { font-size: 1.3rem; font-weight: bold; color: var(--dark-blue); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #E5E7EB; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--black); }
        .form-input, .form-select { width: 100%; padding: 12px 15px; border: 2px solid #E5E7EB; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary-blue); }

        .radio-group { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .radio-option { display: flex; align-items: center; gap: 12px; padding: 15px; border: 2px solid #E5E7EB; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .radio-option:hover { border-color: var(--primary-blue); background: rgba(0,102,204,0.02); }
        .radio-option input[type="radio"] { width: 20px; height: 20px; accent-color: var(--primary-blue); }
        .radio-option.selected { border-color: var(--primary-blue); background: rgba(0,102,204,0.05); }
        .radio-label { font-weight: 600; color: var(--dark-blue); }
        .radio-desc { font-size: 0.85rem; color: #64748B; margin-left: 32px; }

        .btn { padding: 14px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; width: 100%; }
        .btn-primary { background: var(--gradient-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .nav { display: none; }
            .container { margin: 20px auto; }
            .card { padding: 25px; }
            .tournament-info h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-text">TopCompSports</div>
        </a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="tournaments.html">Tournaments</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <div class="tournament-info">
                <h1 id="tournamentName">Loading Tournament...</h1>
                <p id="tournamentDetails">Please wait...</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="registrationForm" onsubmit="handleRegistration(event)">
                <!-- Player Info Section -->
                <div class="form-section">
                    <h2 class="section-title">👤 Player Information</h2>
                    
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="playerName" class="form-input" readonly>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="playerEmail" class="form-input" readonly>
                    </div>
                </div>

                <!-- Registration Type Section -->
                <div class="form-section">
                    <h2 class="section-title">🏆 Registration Type</h2>
                    <div class="radio-group" id="regTypeGroup">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Team Selection (if applicable) -->
                <div class="form-section" id="teamSection" style="display: none;">
                    <h2 class="section-title">👥 Select Your Team</h2>
                    <div class="form-group">
                        <select id="teamSelect" class="form-select">
                            <option value="">Choose your team...</option>
                        </select>
                    </div>
                </div>

                <!-- Competition Details -->
                <div class="form-section">
                    <h2 class="section-title">📋 Competition Details</h2>
                    
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">Age Group *</label>
                            <select id="ageGroup" class="form-select" required>
                                <option value="">Select age group...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Gender *</label>
                            <select id="gender" class="form-select" required>
                                <option value="">Select gender...</option>
                                <option value="Men">Men</option>
                                <option value="Women">Women</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">Weight Class *</label>
                            <select id="weightClass" class="form-select" required>
                                <option value="">Select weight class...</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Belt Level *</label>
                            <select id="beltLevel" class="form-select" required>
                                <option value="">Select belt level...</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <i class="fas fa-check-circle"></i> Complete Registration
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const tournamentId = urlParams.get('id');
        
        let currentAthlete = null;
        let playerTeams = [];
        let ageGroups = {};
        let weightClasses = {};
        let beltLevels = [];

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        async function init() {
            if (!tournamentId) {
                showAlert('Invalid tournament link', 'error');
                return;
            }

            try {
                // 1. Get current user
                const { data: { user }, error: userError } = await db.auth.getUser();
                if (userError || !user) {
                    showAlert('Please login first', 'error');
                    setTimeout(() => window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href), 2000);
                    return;
                }

                // 2. Get athlete profile
                const { data: athlete, error: athleteError } = await db
                    .from('athletes')
                    .select('*')
                    .eq('user_id', user.id)
                    .single();

                if (athleteError || !athlete) {
                    showAlert('Athlete profile not found. Please complete your profile first.', 'error');
                    setTimeout(() => window.location.href = 'my-profile.html', 2000);
                    return;
                }

                currentAthlete = athlete;
                document.getElementById('playerName').value = athlete.full_name || '';
                document.getElementById('playerEmail').value = user.email || '';

                // 3. Load tournament details
                await loadTournamentDetails();

                // 4. Load reference data
                await loadReferenceData();

                // 5. Load player's teams
                await loadPlayerTeams();

                // 6. Render registration type options
                renderRegistrationTypeOptions();

            } catch (error) {
                console.error('Initialization error:', error);
                showAlert('Error loading registration form', 'error');
            }
        }

        async function loadTournamentDetails() {
            const { data: tournament, error } = await db
                .from('tournaments')
                .select('*')
                .eq('id', tournamentId)
                .single();

            if (error || !tournament) {
                showAlert('Tournament not found', 'error');
                return;
            }

            document.getElementById('tournamentName').textContent = tournament.name;
            document.getElementById('tournamentDetails').textContent = 
                `${tournament.event_start_date || 'TBD'} | ${tournament.location || 'TBD'}`;
        }

        async function loadReferenceData() {
            // Load Age Groups
            const { data: ageData } = await db.from('ajp_age_divisions').select('*').order('min_age');
            if (ageData) {
                ageData.forEach(ag => {
                    ageGroups[ag.id] = ag.name;
                    const option = document.createElement('option');
                    option.value = ag.id;
                    option.textContent = `${ag.name} (${ag.min_age}-${ag.max_age || '99'})`;
                    document.getElementById('ageGroup').appendChild(option);
                });
            }

            // Load Weight Classes
            const { data: weightData } = await db.from('ajp_weight_classes').select('*').order('min_weight');
            if (weightData) {
                weightData.forEach(wc => {
                    if (!weightClasses[wc.gender]) weightClasses[wc.gender] = {};
                    if (!weightClasses[wc.gender][wc.age_division_id]) {
                        weightClasses[wc.gender][wc.age_division_id] = [];
                    }
                    weightClasses[wc.gender][wc.age_division_id].push(wc);
                });
            }

            // Load Belt Levels
            const { data: beltData } = await db.from('ajp_belt_levels').select('*').order('sort_order');
            if (beltData) {
                beltLevels = beltData;
                beltData.forEach(belt => {
                    const option = document.createElement('option');
                    option.value = belt.id;
                    option.textContent = belt.name;
                    document.getElementById('beltLevel').appendChild(option);
                });
            }

            // Add event listener for age group change to update weight classes
            document.getElementById('ageGroup').addEventListener('change', updateWeightClasses);
            document.getElementById('gender').addEventListener('change', updateWeightClasses);
        }

        function updateWeightClasses() {
            const ageGroupId = document.getElementById('ageGroup').value;
            const gender = document.getElementById('gender').value;
            const weightSelect = document.getElementById('weightClass');
            
            // Clear existing options
            weightSelect.innerHTML = '<option value="">Select weight class...</option>';
            
            if (ageGroupId && gender && weightClasses[gender] && weightClasses[gender][ageGroupId]) {
                weightClasses[gender][ageGroupId].forEach(wc => {
                    const option = document.createElement('option');
                    option.value = wc.id;
                    option.textContent = `${wc.name} (${wc.min_weight}-${wc.max_weight || '+'}kg)`;
                    weightSelect.appendChild(option);
                });
            }
        }

        async function loadPlayerTeams() {
            if (!currentAthlete) return;

            const { data: memberships, error } = await db
                .from('team_members')
                .select(`
                    team_id,
                    teams (
                        id,
                        name,
                        logo_url
                    )
                `)
                .eq('athlete_id', currentAthlete.id)
                .eq('status', 'approved');

            if (error) {
                console.error('Error loading teams:', error);
                return;
            }

            playerTeams = memberships || [];
            
            const teamSelect = document.getElementById('teamSelect');
            playerTeams.forEach(m => {
                const option = document.createElement('option');
                option.value = m.team_id;
                option.textContent = m.teams.name;
                teamSelect.appendChild(option);
            });
        }

        function renderRegistrationTypeOptions() {
            const group = document.getElementById('regTypeGroup');
            group.innerHTML = '';

            if (playerTeams.length > 0) {
                // Team option
                const teamOption = document.createElement('div');
                teamOption.className = 'radio-option';
                teamOption.onclick = () => selectRegType('team');
                teamOption.innerHTML = `
                    <input type="radio" name="regType" value="team" id="regTeam">
                    <div>
                        <div class="radio-label">Represent My Team</div>
                        <div class="radio-desc">Compete under one of your approved teams</div>
                    </div>
                `;
                group.appendChild(teamOption);
            }

            // Free Player option
            const freeOption = document.createElement('div');
            freeOption.className = 'radio-option';
            freeOption.onclick = () => selectRegType('free_player');
            freeOption.innerHTML = `
                <input type="radio" name="regType" value="free_player" id="regFree" ${playerTeams.length === 0 ? 'checked' : ''}>
                <div>
                    <div class="radio-label">Free Player</div>
                    <div class="radio-desc">Compete as an independent athlete</div>
                </div>
            `;
            group.appendChild(freeOption);

            // TCS Player option
            const tcsOption = document.createElement('div');
            tcsOption.className = 'radio-option';
            tcsOption.onclick = () => selectRegType('tcs_player');
            tcsOption.innerHTML = `
                <input type="radio" name="regType" value="tcs_player" id="regTCS">
                <div>
                    <div class="radio-label">TCS Player</div>
                    <div class="radio-desc">Compete under TopCompSports banner</div>
                </div>
            `;
            group.appendChild(tcsOption);

            // Set default selection
            if (playerTeams.length === 0) {
                selectRegType('free_player');
            }
        }

        function selectRegType(type) {
            // Remove selected class from all options
            document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
            
            // Add selected class to clicked option
            const selectedOption = document.querySelector(`input[value="${type}"]`).closest('.radio-option');
            selectedOption.classList.add('selected');
            
            // Show/hide team section
            const teamSection = document.getElementById('teamSection');
            if (type === 'team') {
                teamSection.style.display = 'block';
                document.getElementById('teamSelect').required = true;
            } else {
                teamSection.style.display = 'none';
                document.getElementById('teamSelect').required = false;
            }
        }

        async function handleRegistration(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';

            try {
                const regType = document.querySelector('input[name="regType"]:checked').value;
                
                // Determine team name
                let teamName = '';
                let teamId = null;
                
                if (regType === 'team') {
                    teamId = document.getElementById('teamSelect').value;
                    const selectedTeam = playerTeams.find(m => m.team_id === teamId);
                    teamName = selectedTeam ? selectedTeam.teams.name : 'Unknown Team';
                } else if (regType === 'free_player') {
                    teamName = 'Free Player';
                } else if (regType === 'tcs_player') {
                    teamName = 'TCS Player';
                }

                // Get ranking (next available)
                const { count } = await db
                    .from('ajp_tournament_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('tournament_id', tournamentId);

                const ranking = (count || 0) + 1;

                // Insert into ajp_tournament_participants
                const { data, error } = await db.from('ajp_tournament_participants').insert({
                    tournament_id: tournamentId,
                    user_id: currentAthlete.user_id,
                    player_name: currentAthlete.full_name,
                    team: teamName,
                    age_group_id: document.getElementById('ageGroup').value,
                    weight_class_id: document.getElementById('weightClass').value,
                    belt_level_id: document.getElementById('beltLevel').value,
                    gender: document.getElementById('gender').value,
                    ranking: ranking,
                    status: 'approved', // Auto-approve for now
                    registration_type: regType,
                    registered_by: currentAthlete.id,
                    is_suspended: false,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }).select().single();

                if (error) throw error;

                showAlert('✅ Registration successful! You are now registered for this tournament.', 'success');
                
                setTimeout(() => {
                    window.location.href = 'tournaments.html';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                showAlert('❌ Registration failed: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Complete Registration';
            }
        }

        // Initialize on page load
        window.onload = init;
    </script>
</body>
</html>
