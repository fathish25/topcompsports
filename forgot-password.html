<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0066CC 0%, #003366 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #1A1A1A;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #2A2A2A;
        }

        .logo { text-align: center; margin-bottom: 30px; }
        .logo-img { 
            width: 80px; 
            height: auto; 
            margin: 0 auto 15px;
            display: block;
        }
        .logo-text { font-size: 24px; font-weight: bold; color: #FFB800; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; color: #FFB800; }
        .header p { color: rgba(255,255,255,0.6); font-size: 0.95rem; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .form-input {
            width: 100%; background: #0A0A0A; border: 2px solid #2A2A2A; color: #fff;
            padding: 14px 16px; border-radius: 10px; font-size: 1rem; transition: all 0.3s;
        }
        .form-input:focus { outline: none; border-color: #0066CC; }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1.05rem; margin-top: 10px;
        }
        .btn-primary { background: #0066CC; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-secondary {
            background: transparent;
            border: 2px solid #2A2A2A;
            color: #fff;
            margin-top: 15px;
        }
        .btn-secondary:hover { background: #2A2A2A; }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-info { background: rgba(14,165,233,0.2); border: 1px solid #0ea5e9; color: #0ea5e9; }

        .back-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .back-link a { color: #FFB800; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }

        .lang-switcher { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .lang-btn.active { background: #0066CC; border-color: #0066CC; }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .header h1 { font-size: 1.5rem; }
            .lang-switcher { top: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ar')">AR</button>
    </div>

    <div class="container">
        <div class="logo">
            <img src="logo2.png" alt="TopCompSports Logo" class="logo-img">
            <div class="logo-text">TopCompSports</div>
        </div>

        <div class="header">
            <h1 data-en="Forgot Password?" data-ar="نسيت كلمة المرور؟">Forgot Password?</h1>
            <p data-en="Enter your email address and we'll send you a link to reset your password." data-ar="أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.">Enter your email address and we'll send you a link to reset your password.</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
                <input type="email" class="form-input" id="email" required placeholder="your.email@example.com" autocomplete="off" data-en-placeholder="your.email@example.com" data-ar-placeholder="your.email@example.com">
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn" data-en="Send Reset Link →" data-ar="← إرسال رابط إعادة التعيين">Send Reset Link →</button>
            <button type="button" class="btn btn-secondary" onclick="window.location.href='login.html'" data-en="← Back to Login" data-ar="العودة لتسجيل الدخول →">← Back to Login</button>
        </form>

        <div class="back-link">
            <a href="login.html" data-en="Remember your password? Sign in" data-ar="تذكرت كلمة المرور؟ سجل الدخول">Remember your password? Sign in</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.textContent = text;
            });
            
            document.querySelectorAll('[data-en-placeholder]').forEach(el => {
                const placeholder = el.getAttribute(`data-${lang}-placeholder`);
                if (placeholder) el.placeholder = placeholder;
            });
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-' + type + ' show';
            alert.textContent = message;
            setTimeout(function() { alert.classList.remove('show'); }, 6000);
        }

        async function handleForgotPassword(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = currentLang === 'ar' ? 'جاري الإرسال...' : 'Sending...';

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'
                });

                if (error) {
                    throw error;
                }

                showAlert('success', currentLang === 'ar' 
                    ? '✅ تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.' 
                    : '✅ Password reset link has been sent to your email address.');
                
                document.getElementById('forgotPasswordForm').reset();
                
            } catch (error) {
                console.error('Password reset error:', error);
                showAlert('error', currentLang === 'ar' 
                    ? '❌ خطأ: ' + error.message 
                    : '❌ Error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = currentLang === 'ar' ? '← إرسال رابط إعادة التعيين' : 'Send Reset Link →';
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('reset') === 'sent') {
                showAlert('success', currentLang === 'ar' 
                    ? '✅ تم إرسال رابط إعادة التعيين بنجاح!' 
                    : '✅ Reset link sent successfully!');
            }
        };
    </script>
</body>
</html>
