<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المنظم - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; }
        .header { background: rgba(21, 29, 43, 0.95); backdrop-filter: blur(10px); padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a3548; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 45px; height: 45px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #0a0e17; }
        .logo-text { font-size: 22px; font-weight: bold; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; text-decoration: none; display: inline-block; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-info { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-sm { padding: 8px 16px; font-size: 0.9rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 50px; }
        .section { background: #151d2b; border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid #2a3548; }
        .section-title { font-size: 1.8rem; font-weight: bold; color: #f1c40f; margin-bottom: 25px; border-bottom: 2px solid #2a3548; padding-bottom: 15px; }
        .tournament-card { background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 25px; margin-bottom: 20px; transition: all 0.3s; }
        .tournament-card:hover { border-color: #f1c40f; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(241,196,15,0.15); }
        .tournament-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .tournament-name { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
        .tournament-meta { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; color: rgba(255,255,255,0.7); font-size: 0.95rem; }
        .tournament-meta span { display: flex; align-items: center; gap: 5px; }
        .tournament-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(241,196,15,0.1); border: 1px solid rgba(241,196,15,0.3); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #f1c40f; }
        .stat-label { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: rgba(241,196,15,0.1); color: #f1c40f; font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.03); }
        .hidden { display: none !important; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: #151d2b; border-radius: 16px; padding: 30px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; border: 2px solid #f1c40f; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
        .modal-close { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #f1c40f; }
        @media (max-width: 768px) { .container { padding: 20px; } .tournament-header { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" onclick="logout()">🚪 خروج</button>
        </div>
    </header>

    <div class="container">
        <div id="alert" class="alert"></div>

        <div class="section">
            <div class="section-title">🏆 لوحة تحكم المنظم</div>
            
            <div style="margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="openCreateTournamentModal()"> إنشاء بطولة جديدة</button>
                <button class="btn btn-info" onclick="loadTournaments()"> تحديث القائمة</button>
            </div>

            <div id="tournamentsList">
                <div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.6);">
                    جاري تحميل البطولات...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Create Tournament -->
    <div class="modal-overlay" id="createModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title"> إنشاء بطولة جديدة</div>
                <button class="modal-close" onclick="closeCreateModal()">✕</button>
            </div>
            <form id="createTournamentForm">
                <div class="form-group">
                    <label>اسم البطولة *</label>
                    <input type="text" id="tournamentName" required placeholder="مثال: بطولة الرياض المفتوحة">
                </div>
                <div class="form-group">
                    <label>الوصف</label>
                    <textarea id="tournamentDesc" rows="3" placeholder="وصف البطولة..."></textarea>
                </div>
                <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>📅 تاريخ البطولة *</label>
                        <input type="date" id="tournamentDate" required>
                    </div>
                    <div class="form-group">
                        <label>⏰ نهاية التسجيل</label>
                        <input type="date" id="registrationDeadline">
                    </div>
                </div>
                <div class="form-group">
                    <label>📍 الموقع</label>
                    <input type="text" id="tournamentLocation" placeholder="مثال: الرياض، السعودية">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">💾 حفظ البطولة</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        window.onload = async () => {
            await checkAuth();
            await loadTournaments();
        };

        async function checkAuth() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html?redirect=organizer-dashboard.html';
                return;
            }
            currentUser = user;
        }

        async function loadTournaments() {
            const container = document.getElementById('tournamentsList');
            container.innerHTML = '<div style="text-align: center; padding: 40px; color: rgba(255,255,255,0.6);">جاري التحميل...</div>';

            try {
                const { data, error } = await supabase
                    .from('tournaments')
                    .select('*')
                    .eq('organizer_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6);">
                            <div style="font-size: 3rem; margin-bottom: 20px;"></div>
                            <h3 style="margin-bottom: 10px;">لا توجد بطولات بعد</h3>
                            <p>اضغط على "إنشاء بطولة جديدة" للبدء</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(tournament => {
                    const date = new Date(tournament.date);
                    const formattedDate = date.toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
                    
                    return `
                        <div class="tournament-card">
                            <div class="tournament-header">
                                <div class="tournament-name">${tournament.name}</div>
                                <div style="display: flex; gap: 10px;">
                                    <button class="btn btn-sm btn-warning" onclick="editTournament('${tournament.id}')">✏️ تعديل</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteTournament('${tournament.id}')">️ حذف</button>
                                </div>
                            </div>
                            
                            <div class="tournament-meta">
                                <span> ${formattedDate}</span>
                                <span>📍 ${tournament.location || 'غير محدد'}</span>
                                <span> ${tournament.max_participants || 'غير محدود'} لاعب</span>
                            </div>

                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div class="stat-value" id="regCount_${tournament.id}">-</div>
                                    <div class="stat-label">مسجلين</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="matchCount_${tournament.id}">-</div>
                                    <div class="stat-label">مباريات</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="matCount_${tournament.id}">-</div>
                                    <div class="stat-label">بساط</div>
                                </div>
                            </div>

                            <div class="tournament-actions">
                                <a href="tournament-details.html?tournament_id=${tournament.id}" target="_blank" class="btn btn-info btn-sm">
                                    👁️ عرض البطولة
                                </a>
                                <button class="btn btn-success btn-sm" onclick="copyRegistrationLink('${tournament.id}')">
                                    📋 نسخ رابط التسجيل
                                </button>
                                <a href="tournament-manager.html?tournament_id=${tournament.id}" class="btn btn-primary btn-sm">
                                    ⚙️ إدارة البطولة
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

                // تحميل الإحصائيات لكل بطولة
                data.forEach(tournament => {
                    loadTournamentStats(tournament.id);
                });

            } catch (error) {
                console.error('Error loading tournaments:', error);
                container.innerHTML = `<div class="alert alert-error show">❌ خطأ في تحميل البطولات: ${error.message}</div>`;
            }
        }

        async function loadTournamentStats(tournamentId) {
            try {
                // عدد المسجلين
                const { count: regCount } = await supabase
                    .from('tournament_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('tournament_id', tournamentId);

                if (document.getElementById(`regCount_${tournamentId}`)) {
                    document.getElementById(`regCount_${tournamentId}`).textContent = regCount || 0;
                }

                // عدد المباريات
                const { count: matchCount } = await supabase
                    .from('matches')
                    .select('*', { count: 'exact', head: true })
                    .eq('tournament_id', tournamentId);

                if (document.getElementById(`matchCount_${tournamentId}`)) {
                    document.getElementById(`matchCount_${tournamentId}`).textContent = matchCount || 0;
                }

                // عدد البساط (من localStorage أو قاعدة البيانات)
                const matsKey = `mats_${tournamentId}`;
                const matsData = localStorage.getItem(matsKey);
                const matCount = matsData ? JSON.parse(matsData).length : 0;
                
                if (document.getElementById(`matCount_${tournamentId}`)) {
                    document.getElementById(`matCount_${tournamentId}`).textContent = matCount;
                }

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function openCreateTournamentModal() {
            document.getElementById('createModal').classList.add('show');
        }

        function closeCreateModal() {
            document.getElementById('createModal').classList.remove('show');
            document.getElementById('createTournamentForm').reset();
        }

        document.getElementById('createTournamentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const tournamentData = {
                organizer_id: currentUser.id,
                name: document.getElementById('tournamentName').value,
                description: document.getElementById('tournamentDesc').value,
                date: document.getElementById('tournamentDate').value,
                registration_deadline: document.getElementById('registrationDeadline').value || null,
                location: document.getElementById('tournamentLocation').value,
                max_participants: 200, // يمكن تعديله لاحقاً
                status: 'draft',
                created_at: new Date().toISOString()
            };

            try {
                const { data, error } = await supabase
                    .from('tournaments')
                    .insert([tournamentData])
                    .select()
                    .single();

                if (error) throw error;

                showAlert('success', '✅ تم إنشاء البطولة بنجاح!');
                closeCreateModal();
                await loadTournaments();

            } catch (error) {
                showAlert('error', '❌ خطأ في إنشاء البطولة: ' + error.message);
            }
        });

        async function copyRegistrationLink(tournamentId) {
            const registrationUrl = `${window.location.origin}/player-registration.html?tournament_id=${tournamentId}`;
            
            try {
                await navigator.clipboard.writeText(registrationUrl);
                showAlert('success', `✅ تم نسخ رابط التسجيل!\n\n${registrationUrl}\n\nأرسل هذا الرابط للاعبين عبر واتساب أو الإيميل.`);
            } catch (err) {
                // بديل في حالة فشل النسخ
                const textArea = document.createElement('textarea');
                textArea.value = registrationUrl;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showAlert('success', `✅ تم نسخ رابط التسجيل!\n\n${registrationUrl}`);
            }
        }

        async function editTournament(tournamentId) {
            // يمكن تطويرها لاحقاً لفتح modal التعديل
            showAlert('info', 'ميزة التعديل قريباً...');
        }

        async function deleteTournament(tournamentId) {
            if (!confirm('هل أنت متأكد من حذف هذه البطولة؟ سيتم حذف جميع البيانات المرتبطة بها!')) return;

            try {
                const { error } = await supabase
                    .from('tournaments')
                    .delete()
                    .eq('id', tournamentId);

                if (error) throw error;

                showAlert('success', '✅ تم حذف البطولة بنجاح!');
                await loadTournaments();

            } catch (error) {
                showAlert('error', '❌ خطأ في الحذف: ' + error.message);
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
