<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">لوحة تحكم المنظم - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --accent-orange: #FF8C00;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --gradient-primary: linear-gradient(135deg, var(--accent-yellow) 0%, var(--accent-orange) 100%);
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        
        .header { 
            background: rgba(10, 10, 10, 0.98); 
            backdrop-filter: blur(10px); 
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--accent-yellow); 
            box-shadow: 0 4px 20px rgba(0, 102, 204, 0.3);
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-icon { width: 45px; height: 45px; background: var(--gradient-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: var(--black); }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--white); }
        
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .lang-switcher { display: flex; gap: 5px; background: var(--medium-gray); padding: 5px; border-radius: 8px; border: 2px solid var(--primary-blue); }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--white); cursor: pointer; border-radius: 6px; font-weight: bold; transition: all 0.3s; }
        .lang-btn.active { background: var(--gradient-primary); color: var(--black); }

        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; font-size: 1rem; }
        .btn-primary { background: var(--gradient-primary); color: var(--black); border: 2px solid var(--accent-yellow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 184, 0, 0.4); }
        .btn-secondary { background: var(--gradient-blue); color: var(--white); border: 2px solid var(--primary-blue); }
        .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 102, 204, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: var(--white); border: 2px solid #ef4444; }
        .btn-sm { padding: 8px 16px; font-size: 0.9rem; }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 50px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 2px solid var(--primary-blue); flex-wrap: wrap; gap: 20px; }
        .page-title { font-size: 2.2rem; font-weight: 900; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .tournament-card { background: linear-gradient(135deg, var(--medium-gray) 0%, var(--dark-gray) 100%); border: 2px solid var(--primary-blue); border-radius: 15px; padding: 25px; margin-bottom: 20px; transition: all 0.4s; position: relative; overflow: hidden; }
        .tournament-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gradient-primary); transform: scaleX(0); transition: transform 0.4s; }
        .tournament-card:hover::before { transform: scaleX(1); }
        .tournament-card:hover { border-color: var(--accent-yellow); transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 102, 204, 0.4); }
        
        .tournament-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .tournament-name { font-size: 1.5rem; font-weight: bold; color: var(--white); }
        .tournament-status { background: var(--gradient-primary); color: var(--black); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        
        .tournament-meta { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; color: rgba(255,255,255,0.7); font-size: 0.95rem; }
        .tournament-meta span { display: flex; align-items: center; gap: 5px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(0, 102, 204, 0.1); border: 1px solid rgba(0, 102, 204, 0.3); border-radius: 8px; padding: 15px; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: var(--accent-yellow); }
        .stat-label { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: 5px; }
        
        .tournament-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .tournament-actions .btn { flex: 1; min-width: 120px; justify-content: center; }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-success { background: rgba(16,185,129,0.2); border: 2px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 2px solid #ef4444; color: #ef4444; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal { background: linear-gradient(135deg, var(--medium-gray) 0%, var(--dark-gray) 100%); border-radius: 20px; padding: 35px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; border: 3px solid var(--accent-yellow); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--primary-blue); }
        .modal-title { font-size: 1.8rem; font-weight: 900; color: var(--accent-yellow); }
        .modal-close { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 18px; transition: all 0.3s; }
        .modal-close:hover { background: #ef4444; color: var(--white); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--white); font-size: 0.95rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--black); border: 2px solid var(--primary-blue); color: var(--white); padding: 12px 15px; border-radius: 10px; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent-yellow); box-shadow: 0 0 15px rgba(255, 184, 0, 0.3); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); font-size: 1.1rem; }
        .empty-state { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.6); }
        .empty-state .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .container { padding: 20px; }
            .page-title { font-size: 1.6rem; }
            .form-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
            .tournament-actions { flex-direction: column; }
            .tournament-actions .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div class="header-actions">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="changeLang('ar')" id="btn-ar">عربي</button>
                <button class="lang-btn" onclick="changeLang('en')" id="btn-en">English</button>
            </div>
            <button class="btn btn-danger btn-sm" onclick="logout()" data-i18n="logout">🚪 خروج</button>
        </div>
    </header>

    <div class="container">
        <div id="alert" class="alert"></div>

        <div class="page-header">
            <h1 class="page-title" data-i18n="page_title">🏆 لوحة تحكم المنظم</h1>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-primary" onclick="openCreateModal()" data-i18n="create_tournament">➕ إنشاء بطولة جديدة</button>
                <button class="btn btn-secondary" onclick="loadTournaments()" data-i18n="refresh">🔄 تحديث</button>
            </div>
        </div>

        <div id="tournamentsList">
            <div class="loading" data-i18n="loading">جاري تحميل البطولات...</div>
        </div>
    </div>

    <!-- Modal: Create/Edit Tournament -->
    <div class="modal-overlay" id="tournamentModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle" data-i18n="modal_title_create">🏆 إنشاء بطولة جديدة</div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="tournamentForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editTournamentId">
                <div class="form-group">
                    <label data-i18n="label_name">اسم البطولة *</label>
                    <input type="text" id="tournamentName" required placeholder="مثال: بطولة الرياض المفتوحة">
                </div>
                <div class="form-group">
                    <label data-i18n="label_desc">الوصف</label>
                    <textarea id="tournamentDesc" rows="3" placeholder="وصف البطولة..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="label_date">📅 تاريخ البطولة *</label>
                        <input type="date" id="tournamentDate" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="label_deadline">⏰ نهاية التسجيل</label>
                        <input type="date" id="registrationDeadline">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="label_location">📍 الموقع</label>
                    <input type="text" id="tournamentLocation" placeholder="مثال: الرياض، السعودية">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="label_max">الحد الأقصى للاعبين</label>
                        <input type="number" id="maxParticipants" value="200" min="10">
                    </div>
                    <div class="form-group">
                        <label data-i18n="label_fee">رسوم التسجيل</label>
                        <input type="number" id="registrationFee" value="0" min="0">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;" data-i18n="btn_save">💾 حفظ</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" data-i18n="btn_cancel">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== Supabase Setup (مرة واحدة فقط) =====
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let currentLang = localStorage.getItem('lang') || 'ar';

        // ===== Translations =====
        const translations = {
            ar: {
                logout: '🚪 خروج',
                page_title: '🏆 لوحة تحكم المنظم',
                create_tournament: '➕ إنشاء بطولة جديدة',
                refresh: '🔄 تحديث',
                loading: 'جاري تحميل البطولات...',
                modal_title_create: '🏆 إنشاء بطولة جديدة',
                modal_title_edit: '✏️ تعديل البطولة',
                label_name: 'اسم البطولة *',
                label_desc: 'الوصف',
                label_date: '📅 تاريخ البطولة *',
                label_deadline: '⏰ نهاية التسجيل',
                label_location: '📍 الموقع',
                label_max: 'الحد الأقصى للاعبين',
                label_fee: 'رسوم التسجيل',
                btn_save: '💾 حفظ',
                btn_cancel: 'إلغاء',
                no_tournaments: 'لا توجد بطولات بعد',
                no_tournaments_desc: 'اضغط على "إنشاء بطولة جديدة" للبدء',
                players: 'مسجلين',
                matches: 'مباريات',
                capacity: 'سعة',
                manage: '⚙️ إدارة',
                view: '👁️ عرض',
                copy_link: '📋 نسخ الرابط',
                edit: '✏️ تعديل',
                delete: '🗑️ حذف',
                date: 'التاريخ',
                location: 'الموقع',
                success_create: '✅ تم إنشاء البطولة بنجاح!',
                success_update: '✅ تم تحديث البطولة بنجاح!',
                success_copy: '✅ تم نسخ رابط التسجيل!',
                success_delete: '✅ تم حذف البطولة!',
                error_create: '❌ خطأ في إنشاء البطولة: ',
                error_update: '❌ خطأ في تحديث البطولة: ',
                error_delete: '❌ خطأ في الحذف: ',
                confirm_delete: 'هل أنت متأكد من حذف هذه البطولة؟ سيتم حذف جميع البيانات المرتبطة بها!',
                status_upcoming: 'قادمة',
                status_today: 'اليوم',
                status_completed: 'منتهية'
            },
            en: {
                logout: '🚪 Logout',
                page_title: '🏆 Organizer Dashboard',
                create_tournament: '➕ Create Tournament',
                refresh: '🔄 Refresh',
                loading: 'Loading tournaments...',
                modal_title_create: '🏆 Create New Tournament',
                modal_title_edit: '✏️ Edit Tournament',
                label_name: 'Tournament Name *',
                label_desc: 'Description',
                label_date: '📅 Tournament Date *',
                label_deadline: '⏰ Registration Deadline',
                label_location: '📍 Location',
                label_max: 'Max Participants',
                label_fee: 'Registration Fee',
                btn_save: '💾 Save',
                btn_cancel: 'Cancel',
                no_tournaments: 'No tournaments yet',
                no_tournaments_desc: 'Click "Create Tournament" to start',
                players: 'Players',
                matches: 'Matches',
                capacity: 'Capacity',
                manage: '⚙️ Manage',
                view: '👁️ View',
                copy_link: '📋 Copy Link',
                edit: '✏️ Edit',
                delete: '🗑️ Delete',
                date: 'Date',
                location: 'Location',
                success_create: '✅ Tournament created successfully!',
                success_update: '✅ Tournament updated successfully!',
                success_copy: '✅ Registration link copied!',
                success_delete: '✅ Tournament deleted!',
                error_create: '❌ Error creating tournament: ',
                error_update: '❌ Error updating tournament: ',
                error_delete: '❌ Error deleting: ',
                confirm_delete: 'Are you sure you want to delete this tournament? All associated data will be deleted!',
                status_upcoming: 'Upcoming',
                status_today: 'Today',
                status_completed: 'Completed'
            }
        };

        // ===== Language Switcher =====
        function changeLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang][key]) element.textContent = translations[lang][key];
            });
            loadTournaments();
        }

        // ===== Auth Check =====
        async function checkAuth() {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html?redirect=organizer-dashboard.html';
                return;
            }
            currentUser = user;
        }

        // ===== Modal Functions =====
        function openCreateModal() {
            document.getElementById('tournamentForm').reset();
            document.getElementById('editTournamentId').value = '';
            document.getElementById('modalTitle').textContent = translations[currentLang].modal_title_create;
            document.getElementById('tournamentModal').classList.add('show');
        }

        async function openEditModal(id) {
            try {
                const { data, error } = await supabase.from('tournaments').select('*').eq('id', id).single();
                if (error) throw error;

                document.getElementById('editTournamentId').value = data.id;
                document.getElementById('tournamentName').value = data.name;
                document.getElementById('tournamentDesc').value = data.description || '';
                document.getElementById('tournamentDate').value = data.date;
                document.getElementById('registrationDeadline').value = data.registration_deadline || '';
                document.getElementById('tournamentLocation').value = data.location || '';
                document.getElementById('maxParticipants').value = data.max_participants || 200;
                document.getElementById('registrationFee').value = data.registration_fee || 0;
                
                document.getElementById('modalTitle').textContent = translations[currentLang].modal_title_edit;
                document.getElementById('tournamentModal').classList.add('show');
            } catch (error) {
                showAlert('error', 'Error loading tournament: ' + error.message);
            }
        }

        function closeModal() {
            document.getElementById('tournamentModal').classList.remove('show');
        }

        // ===== Form Submit (Create or Update) =====
        async function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editTournamentId').value;
            
            const tournamentData = {
                organizer_id: currentUser.id,
                name: document.getElementById('tournamentName').value,
                description: document.getElementById('tournamentDesc').value,
                date: document.getElementById('tournamentDate').value,
                registration_deadline: document.getElementById('registrationDeadline').value || null,
                location: document.getElementById('tournamentLocation').value,
                max_participants: parseInt(document.getElementById('maxParticipants').value) || 200,
                registration_fee: parseFloat(document.getElementById('registrationFee').value) || 0,
                status: 'draft'
            };

            try {
                let error;
                if (editId) {
                    const res = await supabase.from('tournaments').update(tournamentData).eq('id', editId);
                    error = res.error;
                    if (!error) showAlert('success', translations[currentLang].success_update);
                } else {
                    tournamentData.created_at = new Date().toISOString();
                    const res = await supabase.from('tournaments').insert([tournamentData]);
                    error = res.error;
                    if (!error) showAlert('success', translations[currentLang].success_create);
                }

                if (error) throw error;
                closeModal();
                await loadTournaments();
            } catch (error) {
                showAlert('error', (editId ? translations[currentLang].error_update : translations[currentLang].error_create) + error.message);
            }
        }

        // ===== Load Tournaments =====
        async function loadTournaments() {
            const container = document.getElementById('tournamentsList');
            container.innerHTML = `<div class="loading">${translations[currentLang].loading}</div>`;

            try {
                const { data, error } = await supabase
                    .from('tournaments')
                    .select('*')
                    .eq('organizer_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🏆</div>
                            <h3>${translations[currentLang].no_tournaments}</h3>
                            <p>${translations[currentLang].no_tournaments_desc}</p>
                        </div>`;
                    return;
                }

                const today = new Date();
                container.innerHTML = '<div>' + data.map(t => {
                    const date = new Date(t.date);
                    const formattedDate = date.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    
                    let statusText = translations[currentLang].status_upcoming;
                    if (date < today && date.toDateString() !== today.toDateString()) statusText = translations[currentLang].status_completed;
                    else if (date.toDateString() === today.toDateString()) statusText = translations[currentLang].status_today;

                    return `
                        <div class="tournament-card">
                            <div class="tournament-header">
                                <div class="tournament-name">${t.name}</div>
                                <span class="tournament-status">${statusText}</span>
                            </div>
                            <div class="tournament-meta">
                                <span>📅 ${translations[currentLang].date}: ${formattedDate}</span>
                                <span>📍 ${translations[currentLang].location}: ${t.location || 'TBD'}</span>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div class="stat-value" id="regCount_${t.id}">-</div>
                                    <div class="stat-label">${translations[currentLang].players}</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="matchCount_${t.id}">-</div>
                                    <div class="stat-label">${translations[currentLang].matches}</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-value" id="matCount_${t.id}">-</div>
                                    <div class="stat-label">${translations[currentLang].capacity}</div>
                                </div>
                            </div>
                            <div class="tournament-actions">
                                <a href="tournament-manager.html?tournament_id=${t.id}" class="btn btn-primary btn-sm">${translations[currentLang].manage}</a>
                                <a href="tournament-details.html?tournament_id=${t.id}" target="_blank" class="btn btn-secondary btn-sm">${translations[currentLang].view}</a>
                                <button class="btn btn-secondary btn-sm" onclick="copyRegistrationLink('${t.id}')">${translations[currentLang].copy_link}</button>
                                <button class="btn btn-sm" style="background: var(--accent-yellow); color: var(--black);" onclick="openEditModal('${t.id}')">${translations[currentLang].edit}</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTournament('${t.id}')">${translations[currentLang].delete}</button>
                            </div>
                        </div>
                    `;
                }).join('') + '</div>';

                data.forEach(t => loadTournamentStats(t.id));
            } catch (error) {
                container.innerHTML = `<div class="alert alert-error show">❌ ${error.message}</div>`;
            }
        }

        async function loadTournamentStats(tournamentId) {
            try {
                const { count: regCount } = await supabase.from('tournament_participants').select('*', { count: 'exact', head: true }).eq('tournament_id', tournamentId);
                if (document.getElementById(`regCount_${tournamentId}`)) document.getElementById(`regCount_${tournamentId}`).textContent = regCount || 0;

                const { count: matchCount } = await supabase.from('matches').select('*', { count: 'exact', head: true }).eq('tournament_id', tournamentId);
                if (document.getElementById(`matchCount_${tournamentId}`)) document.getElementById(`matchCount_${tournamentId}`).textContent = matchCount || 0;

                const matsData = localStorage.getItem(`mats_${tournamentId}`);
                const matCount = matsData ? JSON.parse(matsData).length : 0;
                if (document.getElementById(`matCount_${tournamentId}`)) document.getElementById(`matCount_${tournamentId}`).textContent = matCount || 200;
            } catch (error) { console.error('Stats error:', error); }
        }

        async function copyRegistrationLink(tournamentId) {
            const url = `${window.location.origin}/player-registration.html?tournament_id=${tournamentId}`;
            try {
                await navigator.clipboard.writeText(url);
                showAlert('success', translations[currentLang].success_copy + '\n\n' + url);
            } catch (err) {
                const textArea = document.createElement('textarea');
                textArea.value = url; document.body.appendChild(textArea); textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea);
                showAlert('success', translations[currentLang].success_copy);
            }
        }

        async function deleteTournament(tournamentId) {
            if (!confirm(translations[currentLang].confirm_delete)) return;
            try {
                const { error } = await supabase.from('tournaments').delete().eq('id', tournamentId);
                if (error) throw error;
                showAlert('success', translations[currentLang].success_delete);
                await loadTournaments();
            } catch (error) {
                showAlert('error', translations[currentLang].error_delete + error.message);
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        // ===== Init =====
        window.onload = async () => {
            await checkAuth();
            changeLang(currentLang);
            await loadTournaments();
        };
    </script>
</body>
</html>
