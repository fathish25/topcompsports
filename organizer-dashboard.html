<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --light-bg: #F5F7FA;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-bg); color: var(--black); min-height: 100vh; }

        .header {
            background: var(--black);
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-blue);
        }

        .logo { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-blue);
        }
        
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; }
        .nav a:hover { color: var(--accent-yellow); }
        
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
        .btn-logout { background: transparent; border: 2px solid var(--white); color: var(--white); }
        .btn-logout:hover { background: var(--white); color: var(--black); }
        .btn-primary { background: var(--primary-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }
        .btn-secondary { background: var(--white); color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        
        .lang-switcher { display: flex; gap: 5px; background: var(--medium-gray); padding: 5px; border-radius: 8px; }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--white); cursor: pointer; border-radius: 6px; font-weight: bold; }
        .lang-btn.active { background: var(--primary-blue); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 50px; }
        
        .page-header {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary-blue);
        }

        .page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        
        .tournament-card {
            background: var(--white);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .tournament-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,102,204,0.25);
            border-color: var(--primary-blue);
        }

        .tournament-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--gradient-blue);
        }

        .tournament-content { padding: 25px; }
        
        .tournament-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .tournament-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--black);
            margin-bottom: 5px;
        }

        .tournament-status {
            background: var(--accent-yellow);
            color: var(--black);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .tournament-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            color: rgba(0,0,0,0.7);
        }

        .tournament-meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--light-bg);
            border-radius: 10px;
        }

        .stat-item { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary-blue); }
        .stat-label { font-size: 0.8rem; color: rgba(0,0,0,0.6); margin-top: 3px; }

        .tournament-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tournament-actions .btn { flex: 1; min-width: 100px; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--white);
            border-radius: 20px;
            padding: 35px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--medium-gray);
        }

        .modal-title { font-size: 1.5rem; font-weight: bold; color: var(--primary-blue); }
        .modal-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: rgba(0,0,0,0.5);
        }
        .modal-close:hover { color: var(--black); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--black); }
        .form-input, .form-textarea {
            width: 100%;
            background: var(--white);
            border: 2px solid var(--medium-gray);
            color: var(--black);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
        }
        .form-textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-success { background: rgba(16,185,129,0.2); border: 2px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 2px solid #ef4444; color: #ef4444; }

        .loading, .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .container { padding: 20px; }
            .page-header { flex-direction: column; align-items: stretch; }
            .tournaments-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            TopCompSports
        </div>
        <div class="nav">
            <a href="index.html">Home</a>
            <a href="my-profile.html">My Profile</a>
            <div class="lang-switcher">
                <button class="lang-btn" onclick="window.changeLang('ar')" id="btn-ar">عربي</button>
                <button class="lang-btn active" onclick="window.changeLang('en')" id="btn-en">English</button>
            </div>
            <button class="btn btn-logout" onclick="window.logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div id="alert" class="alert"></div>

        <div class="page-header">
            <h1 class="page-title" id="pageTitle">🏆 Organizer Dashboard</h1>
            <div class="page-actions">
                <button class="btn btn-primary" onclick="window.openCreateModal()" id="btnCreate">➕ Create Tournament</button>
                <button class="btn btn-secondary" onclick="window.loadTournaments()" id="btnRefresh"> Refresh</button>
            </div>
        </div>

        <div id="tournamentsList">
            <div class="loading">Loading tournaments...</div>
        </div>
    </div>

    <div class="modal-overlay" id="tournamentModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Create New Tournament</h2>
                <button class="modal-close" onclick="window.closeModal()">&times;</button>
            </div>
            <form id="tournamentForm" onsubmit="window.handleFormSubmit(event)">
                <input type="hidden" id="editTournamentId">
                
                <div class="form-group">
                    <label class="form-label">Tournament Name *</label>
                    <input type="text" class="form-input" id="tournamentName" required placeholder="Enter tournament name">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="tournamentDesc" placeholder="Tournament description..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">📅 Date *</label>
                        <input type="date" class="form-input" id="tournamentDate" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Registration Deadline</label>
                        <input type="date" class="form-input" id="registrationDeadline">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">📍 Location</label>
                    <input type="text" class="form-input" id="tournamentLocation" placeholder="Enter location">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Max Participants</label>
                        <input type="number" class="form-input" id="maxParticipants" value="200" min="10">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Registration Fee</label>
                        <input type="number" class="form-input" id="registrationFee" value="0" min="0">
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 25px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save</button>
                    <button type="button" class="btn btn-secondary" onclick="window.closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== Global Variables =====
        var dbClient = null;
        var currentUser = null;
        var currentLang = localStorage.getItem('lang') || 'en';

        // ===== Translations =====
        var translations = {
            en: {
                pageTitle: ' Organizer Dashboard',
                btnCreate: ' Create Tournament',
                btnRefresh: '🔄 Refresh',
                loading: 'Loading tournaments...',
                modalTitleCreate: 'Create New Tournament',
                modalTitleEdit: 'Edit Tournament',
                noTournaments: 'No tournaments yet',
                noTournamentsDesc: 'Click "Create Tournament" to start',
                players: 'Players',
                matches: 'Matches',
                capacity: 'Capacity',
                manage: '⚙️ Manage',
                view: '️ View',
                edit: '️ Edit',
                delete: '🗑️ Delete',
                date: 'Date',
                location: 'Location',
                successCreate: '✅ Tournament created successfully!',
                successUpdate: '✅ Tournament updated successfully!',
                successDelete: '✅ Tournament deleted!',
                errorCreate: '❌ Error creating: ',
                errorUpdate: '❌ Error updating: ',
                errorDelete: '❌ Error deleting: ',
                confirmDelete: 'Are you sure you want to delete this tournament?',
                statusUpcoming: 'Upcoming',
                statusToday: 'Today',
                statusCompleted: 'Completed'
            },
            ar: {
                pageTitle: ' لوحة تحكم المنظم',
                btnCreate: '➕ إنشاء بطولة',
                btnRefresh: '🔄 تحديث',
                loading: 'جاري التحميل...',
                modalTitleCreate: 'إنشاء بطولة جديدة',
                modalTitleEdit: 'تعديل البطولة',
                noTournaments: 'لا توجد بطولات',
                noTournamentsDesc: 'اضغط "إنشاء بطولة" للبدء',
                players: 'لاعبين',
                matches: 'مباريات',
                capacity: 'السعة',
                manage: 'إدارة',
                view: 'عرض',
                edit: 'تعديل',
                delete: 'حذف',
                date: 'التاريخ',
                location: 'الموقع',
                successCreate: '✅ تم الإنشاء بنجاح!',
                successUpdate: '✅ تم التحديث بنجاح!',
                successDelete: '✅ تم الحذف!',
                errorCreate: ' خطأ في الإنشاء: ',
                errorUpdate: '❌ خطأ في التحديث: ',
                errorDelete: ' خطأ في الحذف: ',
                confirmDelete: 'هل أنت متأكد من الحذف؟',
                statusUpcoming: 'قادمة',
                statusToday: 'اليوم',
                statusCompleted: 'منتهية'
            }
        };

        // ===== Initialize Supabase =====
        function initSupabase() {
            if (!dbClient) {
                console.log('Initializing Supabase...');
                dbClient = window.supabase.createClient(
                    'https://ngiclnkmbvzjhylwhzyn.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w'
                );
            }
            return dbClient;
        }

        // ===== Language Switcher =====
        window.changeLang = function(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            
            var t = translations[lang];
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('btnCreate').textContent = t.btnCreate;
            document.getElementById('btnRefresh').textContent = t.btnRefresh;
            
            window.loadTournaments();
        };

        // ===== Auth Check =====
        async function checkAuth() {
            try {
                initSupabase();
                var result = await dbClient.auth.getUser();
                if (result.error || !result.data.user) {
                    console.error('Auth failed:', result.error);
                    window.showAlert('error', 'Please login to access this page');
                    setTimeout(function() {
                        window.location.href = 'login.html?redirect=organizer-dashboard.html';
                    }, 2000);
                    return false;
                }
                currentUser = result.data.user;
                console.log('✅ User authenticated:', currentUser.id);
                return true;
            } catch (error) {
                console.error('Auth error:', error);
                window.showAlert('error', 'Authentication error: ' + error.message);
                return false;
            }
        }

        // ===== Modal Functions =====
        window.openCreateModal = function() {
            console.log('Opening create modal');
            if (!currentUser) {
                window.showAlert('error', 'Please login first');
                return;
            }
            document.getElementById('tournamentForm').reset();
            document.getElementById('editTournamentId').value = '';
            document.getElementById('modalTitle').textContent = translations[currentLang].modalTitleCreate;
            document.getElementById('tournamentModal').classList.add('show');
        };

        window.openEditModal = async function(id) {
            console.log('Opening edit modal for:', id);
            if (!currentUser) {
                window.showAlert('error', 'Please login first');
                return;
            }
            try {
                var result = await dbClient.from('tournaments').select('*').eq('id', id).single();
                if (result.error) throw result.error;
                var data = result.data;

                document.getElementById('editTournamentId').value = data.id;
                document.getElementById('tournamentName').value = data.name;
                document.getElementById('tournamentDesc').value = data.description || '';
                // Handle different date column names
                document.getElementById('tournamentDate').value = data.tournament_date || data.date || data.event_date || '';
                document.getElementById('registrationDeadline').value = data.registration_deadline || '';
                document.getElementById('tournamentLocation').value = data.location || data.tournament_location || '';
                document.getElementById('maxParticipants').value = data.max_participants || 200;
                document.getElementById('registrationFee').value = data.registration_fee || 0;
                
                document.getElementById('modalTitle').textContent = translations[currentLang].modalTitleEdit;
                document.getElementById('tournamentModal').classList.add('show');
            } catch (error) {
                window.showAlert('error', 'Error loading tournament: ' + error.message);
            }
        };

        window.closeModal = function() {
            document.getElementById('tournamentModal').classList.remove('show');
        };

        // ===== Form Submit =====
        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            console.log('Form submitted');
            
            if (!currentUser) {
                console.error('No user logged in');
                window.showAlert('error', 'Please login first');
                return;
            }
            
            if (!dbClient) {
                initSupabase();
            }
            
            console.log('Current user ID:', currentUser.id);
            
            var editId = document.getElementById('editTournamentId').value;
            console.log('Edit ID:', editId);
            
            // Create tournament data with flexible column names
            var tournamentData = {
                organizer_id: currentUser.id,
                name: document.getElementById('tournamentName').value,
                description: document.getElementById('tournamentDesc').value,
                tournament_date: document.getElementById('tournamentDate').value,
                registration_deadline: document.getElementById('registrationDeadline').value || null,
                location: document.getElementById('tournamentLocation').value,
                max_participants: parseInt(document.getElementById('maxParticipants').value) || 200,
                registration_fee: parseFloat(document.getElementById('registrationFee').value) || 0,
                status: 'draft',
                updated_at: new Date().toISOString()
            };

            console.log('Tournament data:', tournamentData);

            try {
                var result;
                if (editId) {
                    console.log('Updating tournament:', editId);
                    result = await dbClient.from('tournaments').update(tournamentData).eq('id', editId);
                    if (result.error) throw result.error;
                    window.showAlert('success', translations[currentLang].successUpdate);
                } else {
                    console.log('Creating new tournament');
                    tournamentData.created_at = new Date().toISOString();
                    result = await dbClient.from('tournaments').insert([tournamentData]);
                    if (result.error) throw result.error;
                    window.showAlert('success', translations[currentLang].successCreate);
                }

                console.log('Success:', result);
                window.closeModal();
                await window.loadTournaments();
            } catch (error) {
                console.error('Error:', error);
                window.showAlert('error', (editId ? translations[currentLang].errorUpdate : translations[currentLang].errorCreate) + error.message);
            }
        };

        // ===== Load Tournaments =====
        window.loadTournaments = async function() {
            console.log('Loading tournaments...');
            var container = document.getElementById('tournamentsList');
            container.innerHTML = '<div class="loading">' + translations[currentLang].loading + '</div>';

            try {
                if (!currentUser) {
                    console.error('No user logged in');
                    window.showAlert('error', 'Please login first');
                    return;
                }

                if (!dbClient) {
                    initSupabase();
                }

                console.log('User ID:', currentUser.id);
                var result = await dbClient
                    .from('tournaments')
                    .select('*')
                    .eq('organizer_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (result.error) {
                    console.error('Load error:', result.error);
                    throw result.error;
                }
                
                var data = result.data;
                console.log('Tournaments loaded:', data);

                if (!data || data.length === 0) {
                    var t = translations[currentLang];
                    container.innerHTML = 
                        '<div class="empty-state">' +
                            '<div class="icon"></div>' +
                            '<h3>' + t.noTournaments + '</h3>' +
                            '<p>' + t.noTournamentsDesc + '</p>' +
                        '</div>';
                    return;
                }

                var today = new Date();
                var html = '<div class="tournaments-grid">';
                
                for (var i = 0; i < data.length; i++) {
                    var t = data[i];
                    // Handle different date column names
                    var dateValue = t.tournament_date || t.date || t.event_date;
                    var date = new Date(dateValue);
                    var formattedDate = date.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    
                    var statusText = translations[currentLang].statusUpcoming;
                    if (date < today && date.toDateString() !== today.toDateString()) {
                        statusText = translations[currentLang].statusCompleted;
                    } else if (date.toDateString() === today.toDateString()) {
                        statusText = translations[currentLang].statusToday;
                    }

                    // Handle different location column names
                    var locationValue = t.location || t.tournament_location || 'TBD';

                    html += 
                        '<div class="tournament-card">' +
                            '<div class="tournament-image" style="display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0066CC 0%, #003366 100%);">' +
                                '<span style="font-size: 4rem; opacity: 0.3;">🏆</span>' +
                            '</div>' +
                            '<div class="tournament-content">' +
                                '<div class="tournament-header">' +
                                    '<div>' +
                                        '<div class="tournament-name">' + t.name + '</div>' +
                                    '</div>' +
                                    '<span class="tournament-status">' + statusText + '</span>' +
                                '</div>' +
                                '<div class="tournament-meta">' +
                                    '<div class="tournament-meta-item">' +
                                        '<span>📅</span>' +
                                        '<span>' + translations[currentLang].date + ': ' + formattedDate + '</span>' +
                                    '</div>' +
                                    '<div class="tournament-meta-item">' +
                                        '<span>📍</span>' +
                                        '<span>' + translations[currentLang].location + ': ' + locationValue + '</span>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="stats-row">' +
                                    '<div class="stat-item">' +
                                        '<div class="stat-value" id="regCount_' + t.id + '">-</div>' +
                                        '<div class="stat-label">' + translations[currentLang].players + '</div>' +
                                    '</div>' +
                                    '<div class="stat-item">' +
                                        <div class="stat-value" id="matchCount_' + t.id + '">-</div>' +
                                        '<div class="stat-label">' + translations[currentLang].matches + '</div>' +
                                    '</div>' +
                                    '<div class="stat-item">' +
                                        '<div class="stat-value">' + (t.max_participants || 200) + '</div>' +
                                        '<div class="stat-label">' + translations[currentLang].capacity + '</div>' +
                                    '</div>' +
                                '</div>' +
                                '<div class="tournament-actions">' +
                                    '<a href="tournament-manager.html?tournament_id=' + t.id + '" class="btn btn-primary">' + translations[currentLang].manage + '</a>' +
                                    '<a href="tournament-details.html?tournament_id=' + t.id + '" target="_blank" class="btn btn-secondary">' + translations[currentLang].view + '</a>' +
                                    '<button class="btn btn-secondary" onclick="window.openEditModal(\'' + t.id + '\')">' + translations[currentLang].edit + '</button>' +
                                    '<button class="btn" style="background: #ef4444; color: white;" onclick="window.deleteTournament(\'' + t.id + '\')">' + translations[currentLang].delete + '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                }
                
                html += '</div>';
                container.innerHTML = html;

                // Load stats for each tournament
                for (var j = 0; j < data.length; j++) {
                    window.loadTournamentStats(data[j].id);
                }
            } catch (error) {
                console.error('Load error:', error);
                container.innerHTML = '<div class="alert alert-error show">❌ ' + error.message + '</div>';
            }
        };

        // ===== Load Stats =====
        window.loadTournamentStats = async function(tournamentId) {
            try {
                if (!dbClient) return;
                
                var regResult = await dbClient.from('tournament_participants').select('*', { count: 'exact', head: true }).eq('tournament_id', tournamentId);
                var regCount = regResult.count || 0;
                var regElement = document.getElementById('regCount_' + tournamentId);
                if (regElement) regElement.textContent = regCount;

                var matchResult = await dbClient.from('matches').select('*', { count: 'exact', head: true }).eq('tournament_id', tournamentId);
                var matchCount = matchResult.count || 0;
                var matchElement = document.getElementById('matchCount_' + tournamentId);
                if (matchElement) matchElement.textContent = matchCount;
            } catch (error) { 
                console.error('Stats error:', error); 
            }
        };

        // ===== Delete Tournament =====
        window.deleteTournament = async function(tournamentId) {
            if (!confirm(translations[currentLang].confirmDelete)) return;
            try {
                if (!dbClient) initSupabase();
                
                var result = await dbClient.from('tournaments').delete().eq('id', tournamentId);
                if (result.error) throw result.error;
                window.showAlert('success', translations[currentLang].successDelete);
                await window.loadTournaments();
            } catch (error) {
                window.showAlert('error', translations[currentLang].errorDelete + error.message);
            }
        };

        // ===== Logout =====
        window.logout = async function() {
            if (!dbClient) initSupabase();
            await dbClient.auth.signOut();
            window.location.href = 'index.html';
        };

        // ===== Show Alert =====
        window.showAlert = function(type, message) {
            var alert = document.getElementById('alert');
            alert.className = 'alert alert-' + type + ' show';
            alert.textContent = message;
            setTimeout(function() { 
                alert.classList.remove('show'); 
            }, 5000);
        };

        // ===== Close Modal on Outside Click =====
        window.onclick = function(event) {
            var modal = document.getElementById('tournamentModal');
            if (event.target === modal) {
                window.closeModal();
            }
        };

        // ===== Initialize =====
        window.onload = async function() {
            console.log('Page loaded, initializing...');
            initSupabase();
            var authOk = await checkAuth();
            if (authOk) {
                console.log('Auth successful, loading data...');
                window.changeLang(currentLang);
                await window.loadTournaments();
            }
        };
    </script>
</body>
</html>
