<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Brackets - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --light-gray: #3A3A3A;
            --white: #FFFFFF;
            --success: #10B981;
            --danger: #EF4444;
            --bronze: #CD7F32;
            --silver: #C0C0C0;
            --gold: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--dark-gray); 
            color: var(--white); 
            min-height: 100vh;
        }

        /* Header */
        .header { 
            background: var(--black); 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--primary-blue);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 1.5rem; 
            font-weight: 900; 
            color: var(--accent-yellow);
            text-decoration: none;
        }
        .back-btn { 
            background: var(--medium-gray); 
            color: var(--white); 
            padding: 8px 16px; 
            border-radius: 6px; 
            text-decoration: none; 
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-btn:hover { background: var(--primary-blue); }

        /* Category Info Bar */
        .category-info-bar {
            background: var(--medium-gray);
            padding: 15px 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            border-bottom: 1px solid var(--light-gray);
        }
        .category-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--white);
            flex: 1;
            min-width: 250px;
        }
        .info-chip {
            background: var(--light-gray);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-chip .label { color: rgba(255,255,255,0.6); }
        .info-chip .value { color: var(--accent-yellow); font-weight: 700; }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Bracket Tree */
        .bracket-container {
            overflow-x: auto;
            padding: 20px 0;
            margin-bottom: 40px;
        }
        .bracket-tree {
            display: flex;
            gap: 60px;
            min-width: max-content;
            padding: 20px;
        }
        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            gap: 20px;
            min-width: 280px;
        }
        .round-title {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-blue);
        }
        .bracket-match {
            background: var(--medium-gray);
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s;
        }
        .bracket-match:hover {
            border-color: var(--primary-blue);
            transform: translateY(-2px);
        }
        .bracket-match.bye {
            opacity: 0.6;
        }
        .match-player {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 1px solid var(--light-gray);
        }
        .match-player:last-child { border-bottom: none; }
        .match-player:hover { background: rgba(0,102,204,0.1); }
        .match-player.winner {
            background: rgba(16,185,129,0.15);
            border-left: 3px solid var(--success);
        }
        .match-player.loser {
            opacity: 0.5;
        }
        .match-player.bye-player {
            opacity: 0.4;
            font-style: italic;
        }
        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--light-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            overflow: hidden;
            flex-shrink: 0;
        }
        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-info {
            flex: 1;
            min-width: 0;
        }
        .player-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-team {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-flag {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .match-score {
            background: var(--light-gray);
            color: var(--white);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 30px;
            text-align: center;
        }
        .match-score.winner-score {
            background: var(--success);
        }
        .match-vs {
            text-align: center;
            padding: 4px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            font-weight: 700;
            background: var(--dark-gray);
        }

        /* Connector Lines */
        .bracket-round:not(:last-child) .bracket-match {
            position: relative;
        }
        .bracket-round:not(:last-child) .bracket-match::after {
            content: '';
            position: absolute;
            right: -30px;
            top: 50%;
            width: 30px;
            height: 2px;
            background: var(--light-gray);
        }

        /* Results Table */
        .results-section {
            background: var(--medium-gray);
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
        }
        .results-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--white);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-blue);
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
        }
        .results-table th {
            background: var(--dark-gray);
            padding: 12px 15px;
            text-align: left;
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .results-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--light-gray);
            color: var(--white);
        }
        .results-table tr:hover {
            background: rgba(0,102,204,0.1);
        }
        .placement-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 900;
            font-size: 0.9rem;
        }
        .placement-1 { background: var(--gold); color: var(--black); }
        .placement-2 { background: var(--silver); color: var(--black); }
        .placement-3 { background: var(--bronze); color: var(--white); }
        .placement-other { background: var(--light-gray); color: var(--white); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 30px;
            color: rgba(255,255,255,0.5);
        }
        .empty-state .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.6; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 10px; color: var(--accent-yellow); }

        /* Alert */
        .alert {
            position: fixed;
            top: 80px;
            right: 30px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1000;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .alert.show { display: block; }
        .alert-success { background: var(--success); color: var(--white); }
        .alert-error { background: var(--danger); color: var(--white); }

        /* Responsive */
        @media (max-width: 768px) {
            .header { padding: 12px 15px; flex-direction: column; gap: 10px; }
            .category-info-bar { padding: 12px 15px; }
            .main-container { padding: 15px; }
            .bracket-tree { gap: 30px; }
            .bracket-round { min-width: 240px; }
            .results-table { font-size: 0.85rem; }
            .results-table th, .results-table td { padding: 8px 10px; }
        }

        @media (max-width: 480px) {
            .logo { font-size: 1.2rem; }
            .category-title { font-size: 1rem; }
            .info-chip { font-size: 0.75rem; padding: 4px 10px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="organizer-dashboard.html" class="logo">
            <span>🏆</span>
            <span>TopCompSports</span>
        </a>
        <a href="tournament-manager.html?tournament_id=" id="backToManager" class="back-btn">← Back to Manager</a>
    </header>

    <div class="category-info-bar" id="categoryInfoBar">
        <div class="category-title" id="categoryTitle">Loading...</div>
        <div class="info-chip"><span class="label">Category:</span><span class="value" id="infoCategory">-</span></div>
        <div class="info-chip"><span class="label">Area:</span><span class="value" id="infoArea">Mat 1</span></div>
        <div class="info-chip"><span class="label">Bracket type:</span><span class="value" id="infoType">Single-elimination</span></div>
        <div class="info-chip"><span class="label">Participants:</span><span class="value" id="infoParticipants">0</span></div>
        <div class="info-chip"><span class="label">Nr of matches:</span><span class="value" id="infoMatches">0</span></div>
        <div class="info-chip"><span class="label">Time per match:</span><span class="value" id="infoTime">2:00</span></div>
    </div>

    <div class="main-container">
        <div id="alert" class="alert"></div>

        <div class="bracket-container">
            <div class="bracket-tree" id="bracketTree">
                <div class="empty-state" style="width: 100%;">
                    <div class="icon">🏆</div>
                    <h3>Loading Brackets...</h3>
                </div>
            </div>
        </div>

        <div class="results-section">
            <h2 class="results-title">🏆 RESULTS</h2>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Placement</th>
                        <th>Athlete</th>
                        <th>Academy</th>
                        <th>Affiliation</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                    <tr><td colspan="4" style="text-align: center; padding: 30px; color: rgba(255,255,255,0.5);">No results yet</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tournamentId = null;
        let categoryName = null;
        let bracketData = null;
        let players = [];

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            categoryName = urlParams.get('category');

            if (!tournamentId || !categoryName) {
                showAlert('error', 'Missing tournament or category info');
                return;
            }

            document.getElementById('backToManager').href = `tournament-manager.html?tournament_id=${tournamentId}`;
            document.getElementById('categoryTitle').textContent = decodeURIComponent(categoryName);

            await loadData();
            renderBracket();
            renderResults();
        };

        async function loadData() {
            // Load players from DB
            const { data: playersData } = await dbClient
                .from('tournament_participants')
                .select('*')
                .eq('tournament_id', tournamentId);
            
            players = playersData || [];

            // Load bracket from localStorage
            const savedBrackets = localStorage.getItem(`tournament_${tournamentId}_brackets`);
            const allBrackets = savedBrackets ? JSON.parse(savedBrackets) : {};
            
            bracketData = allBrackets[categoryName];
            
            if (!bracketData) {
                // Generate bracket
                const categoryPlayers = players.filter(p => {
                    const pCategory = `${p.age_group} | ${p.gender} | ${p.weight}kg | ${p.belt_level}`;
                    return pCategory === categoryName;
                });
                
                bracketData = generateSingleElimination(categoryPlayers);
                allBrackets[categoryName] = bracketData;
                localStorage.setItem(`tournament_${tournamentId}_brackets`, JSON.stringify(allBrackets));
            }

            // Update info bar
            document.getElementById('infoCategory').textContent = categoryName.split(' | ')[0] || '-';
            document.getElementById('infoParticipants').textContent = players.filter(p => {
                const pCategory = `${p.age_group} | ${p.gender} | ${p.weight}kg | ${p.belt_level}`;
                return pCategory === categoryName;
            }).length;
            document.getElementById('infoMatches').textContent = bracketData.matches.filter(m => m.player1 && m.player2).length;
        }

        function generateSingleElimination(playersList) {
            const numPlayers = playersList.length;
            let bracketSize = 1;
            while (bracketSize < numPlayers) bracketSize *= 2;
            
            const numRounds = Math.log2(bracketSize);
            const rounds = [];
            const matches = [];

            const firstRoundMatches = [];
            for (let i = 0; i < bracketSize / 2; i++) {
                const player1 = playersList[i * 2] || null;
                const player2 = playersList[i * 2 + 1] || null;
                
                const match = {
                    id: `R1_M${i + 1}`,
                    round: 1,
                    player1: player1,
                    player2: player2,
                    winner: null,
                    nextMatchId: i < bracketSize / 4 ? `R2_M${Math.floor(i / 2) + 1}` : null
                };
                
                // Auto-advance BYE
                if (player1 && !player2) {
                    match.winner = player1;
                    match.isBye = true;
                } else if (!player1 && player2) {
                    match.winner = player2;
                    match.isBye = true;
                }
                
                firstRoundMatches.push(match);
                matches.push(match);
            }
            rounds.push(firstRoundMatches);

            let matchCount = bracketSize / 2;
            for (let round = 2; round <= numRounds; round++) {
                const roundMatches = [];
                matchCount /= 2;
                
                for (let i = 0; i < matchCount; i++) {
                    const match = {
                        id: `R${round}_M${i + 1}`,
                        round: round,
                        player1: null,
                        player2: null,
                        winner: null,
                        nextMatchId: i < matchCount / 2 ? `R${round + 1}_M${Math.floor(i / 2) + 1}` : null
                    };
                    roundMatches.push(match);
                    matches.push(match);
                }
                rounds.push(roundMatches);
            }

            // Auto-advance BYE winners
            propagateByes(matches);

            return { rounds, matches, bracketSize, numRounds };
        }

        function propagateByes(matches) {
            let changed = true;
            while (changed) {
                changed = false;
                matches.forEach(match => {
                    if (match.winner && match.nextMatchId) {
                        const nextMatch = matches.find(m => m.id === match.nextMatchId);
                        if (nextMatch) {
                            if (!nextMatch.player1) {
                                nextMatch.player1 = match.winner;
                                changed = true;
                            } else if (!nextMatch.player2 && nextMatch.player1.id !== match.winner.id) {
                                nextMatch.player2 = match.winner;
                                changed = true;
                            }
                        }
                    }
                });
            }
        }

        function getRoundNames(numRounds) {
            const names = [];
            for (let i = 1; i <= numRounds; i++) {
                const remaining = numRounds - i + 1;
                if (remaining === 1) names.push('FINALS');
                else if (remaining === 2) names.push('SEMIFINALS');
                else if (remaining === 3) names.push('QUARTERFINALS');
                else names.push(`ROUND OF ${Math.pow(2, remaining)}`);
            }
            return names;
        }

        function renderBracket() {
            const container = document.getElementById('bracketTree');
            
            if (!bracketData || bracketData.matches.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="width: 100%;">
                        <div class="icon">🏆</div>
                        <h3>No Bracket Data</h3>
                        <p>Add players to this category first</p>
                    </div>
                `;
                return;
            }

            const roundNames = getRoundNames(bracketData.numRounds);
            
            let html = '';
            bracketData.rounds.forEach((round, roundIndex) => {
                const roundName = roundNames[roundIndex] || `Round ${roundIndex + 1}`;
                html += `<div class="bracket-round">`;
                html += `<div class="round-title">${roundName}</div>`;
                
                round.forEach(match => {
                    html += renderMatch(match);
                });
                
                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function renderMatch(match) {
            const isBye = match.isBye || (!match.player1 && !match.player2);
            const p1Name = match.player1 ? match.player1.player_name : 'BYE';
            const p2Name = match.player2 ? match.player2.player_name : 'BYE';
            const p1Team = match.player1?.team || '';
            const p2Team = match.player2?.team || '';
            const p1Winner = match.winner && match.player1 && match.winner.id === match.player1.id;
            const p2Winner = match.winner && match.player2 && match.winner.id === match.player2.id;
            const p1Bye = !match.player2;
            const p2Bye = !match.player1;

            return `
                <div class="bracket-match ${isBye ? 'bye' : ''}" data-match-id="${match.id}">
                    <div class="match-player ${p1Winner ? 'winner' : ''} ${p2Winner ? 'loser' : ''} ${p1Bye ? 'bye-player' : ''}" 
                         onclick="selectWinner('${match.id}', 'player1')">
                        <div class="player-avatar">${match.player1?.player_name?.charAt(0) || '?'}</div>
                        <div class="player-info">
                            <div class="player-name">${p1Name}</div>
                            <div class="player-team">${p1Team}</div>
                        </div>
                        ${match.winner && p1Winner ? '<div class="match-score winner-score">W</div>' : ''}
                    </div>
                    <div class="match-vs">VS</div>
                    <div class="match-player ${p2Winner ? 'winner' : ''} ${p1Winner ? 'loser' : ''} ${p2Bye ? 'bye-player' : ''}" 
                         onclick="selectWinner('${match.id}', 'player2')">
                        <div class="player-avatar">${match.player2?.player_name?.charAt(0) || '?'}</div>
                        <div class="player-info">
                            <div class="player-name">${p2Name}</div>
                            <div class="player-team">${p2Team}</div>
                        </div>
                        ${match.winner && p2Winner ? '<div class="match-score winner-score">W</div>' : ''}
                    </div>
                </div>
            `;
        }

        function selectWinner(matchId, playerKey) {
            const match = bracketData.matches.find(m => m.id === matchId);
            if (!match || !match.player1 || !match.player2) {
                showAlert('error', 'Both players must be present');
                return;
            }

            const winner = playerKey === 'player1' ? match.player1 : match.player2;
            match.winner = winner;
            match.isBye = false;

            // Advance to next match
            if (match.nextMatchId) {
                const nextMatch = bracketData.matches.find(m => m.id === match.nextMatchId);
                if (nextMatch) {
                    if (!nextMatch.player1) nextMatch.player1 = winner;
                    else if (!nextMatch.player2 && nextMatch.player1.id !== winner.id) nextMatch.player2 = winner;
                }
            }

            // Save
            const savedBrackets = localStorage.getItem(`tournament_${tournamentId}_brackets`);
            const allBrackets = savedBrackets ? JSON.parse(savedBrackets) : {};
            allBrackets[categoryName] = bracketData;
            localStorage.setItem(`tournament_${tournamentId}_brackets`, JSON.stringify(allBrackets));

            renderBracket();
            renderResults();
            showAlert('success', `Winner: ${winner.player_name}`);

            // Check champion
            const finalMatch = bracketData.matches[bracketData.matches.length - 1];
            if (finalMatch && finalMatch.winner) {
                setTimeout(() => {
                    showAlert('success', `🏆 CHAMPION: ${finalMatch.winner.player_name}!`);
                }, 1000);
            }
        }

        function renderResults() {
            const tbody = document.getElementById('resultsBody');
            
            if (!bracketData) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">No results yet</td></tr>';
                return;
            }

            // Calculate placements
            const placements = [];
            const finalMatch = bracketData.matches[bracketData.matches.length - 1];
            const semiFinals = bracketData.rounds.length >= 2 ? bracketData.rounds[bracketData.rounds.length - 2] : [];
            const quarterFinals = bracketData.rounds.length >= 3 ? bracketData.rounds[bracketData.rounds.length - 3] : [];

            // 1st place
            if (finalMatch?.winner) {
                placements.push({ placement: 1, player: finalMatch.winner });
            }
            // 2nd place
            if (finalMatch) {
                const loser = finalMatch.player1?.id === finalMatch.winner?.id ? finalMatch.player2 : finalMatch.player1;
                if (loser) placements.push({ placement: 2, player: loser });
            }
            // 3rd place (losers of semifinals)
            semiFinals.forEach(match => {
                if (match.winner) {
                    const loser = match.player1?.id === match.winner.id ? match.player2 : match.player1;
                    if (loser && !placements.find(p => p.player.id === loser.id)) {
                        placements.push({ placement: 3, player: loser });
                    }
                }
            });
            // 5th place (losers of quarterfinals)
            quarterFinals.forEach(match => {
                if (match.winner) {
                    const loser = match.player1?.id === match.winner.id ? match.player2 : match.player1;
                    if (loser && !placements.find(p => p.player.id === loser.id)) {
                        placements.push({ placement: 5, player: loser });
                    }
                }
            });

            if (placements.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 30px;">Complete matches to see results</td></tr>';
                return;
            }

            tbody.innerHTML = placements.map(p => `
                <tr>
                    <td><span class="placement-badge placement-${p.placement <= 3 ? p.placement : 'other'}">${p.placement}</span></td>
                    <td><strong>${p.player.player_name}</strong></td>
                    <td>${p.player.team || '-'}</td>
                    <td>${p.player.team || '-'}</td>
                </tr>
            `).join('');
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }
    </script>
