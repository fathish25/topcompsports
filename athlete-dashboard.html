<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopCompSports - Athlete Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(21, 29, 43, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a3548;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #2563EB, #1e40af);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #fff;
        }
        .logo-text { font-size: 22px; font-weight: bold; }
        .user-menu { display: flex; align-items: center; gap: 20px; }
        .user-name { color: rgba(255,255,255,0.9); font-weight: 600; }
        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-logout:hover { background: #ef4444; color: #fff; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 50px;
        }
        
        .welcome-section {
            background: linear-gradient(135deg, #2563EB 0%, #1e40af 100%);
            padding: 40px;
            border-radius: 16px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }
        .welcome-section::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 400px; height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .welcome-title { font-size: 32px; font-weight: bold; margin-bottom: 10px; position: relative; z-index: 1; }
        .welcome-subtitle { color: rgba(255,255,255,0.9); font-size: 16px; position: relative; z-index: 1; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #151d2b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #2563EB;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }
        .stat-icon { font-size: 32px; margin-bottom: 15px; }
        .stat-value { font-size: 36px; font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
        .stat-label { color: rgba(255,255,255,0.7); font-size: 14px; }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        
        .profile-card {
            background: #151d2b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
        }
        .profile-photo {
            width: 120px; height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid #2563EB;
        }
        .profile-name { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
        .profile-role { color: #f1c40f; font-size: 14px; margin-bottom: 20px; }
        .profile-info { text-align: left; margin-top: 20px; }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-label { color: rgba(255,255,255,0.7); font-size: 14px; }
        .info-value { font-weight: 600; }
        .btn-edit {
            width: 100%;
            background: #2563EB;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .btn-edit:hover { background: #1d4ed8; }
        
        .main-section {
            background: #151d2b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .section-title { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .btn-primary {
            background: linear-gradient(135deg, #2563EB, #1d4ed8);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3); }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .tab-btn.active {
            background: #2563EB;
            color: #fff;
        }
        .tab-badge {
            background: #f1c40f;
            color: #000;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .items-list { display: flex; flex-direction: column; gap: 15px; }
        .item-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            flex-wrap: wrap;
            gap: 15px;
        }
        .item-card:hover {
            border-color: #2563EB;
            background: rgba(37, 99, 235, 0.05);
            cursor: pointer;
        }
        .item-info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 250px; }
        .item-logo {
            width: 60px; height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #2563EB;
            background: #2563EB;
        }
        .item-logo-placeholder {
            width: 60px; height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            border: 3px solid #f1c40f;
        }
        .item-details h4 { font-size: 18px; margin-bottom: 5px; }
        .item-details p { color: rgba(255,255,255,0.7); font-size: 14px; }
        .item-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-member { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-pending { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pending { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
        .status-accepted { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.5);
        }
        .empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        
        .lang-switcher { display: flex; gap: 10px; }
        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .lang-btn.active { background: #2563EB; border-color: #2563EB; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
            .header { padding: 20px; }
            .container { padding: 20px; }
        }
        @media (max-width: 768px) {
            .item-card { flex-direction: column; text-align: center; }
            .item-info { flex-direction: column; }
            .tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div class="user-menu">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="window.setLang('en')">EN</button>
                <button class="lang-btn" onclick="window.setLang('ar')">AR</button>
            </div>
            <span class="user-name" id="userName">Loading...</span>
            <button class="btn-logout" onclick="window.handleLogout()" data-en="Logout" data-ar="تسجيل الخروج">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="welcome-section">
            <h1 class="welcome-title" data-en="Welcome back, Athlete!" data-ar="مرحباً بك يا بطل!">Welcome back, Athlete!</h1>
            <p class="welcome-subtitle" data-en="Manage your teams and track your tournament progress." data-ar="أدر فرقك وتتبع تقدمك في البطولات.">Manage your teams and track your tournament progress.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-shield-alt"></i></div>
                <div class="stat-value" id="statMyTeams">0</div>
                <div class="stat-label" data-en="My Teams" data-ar="فرقي">My Teams</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-trophy"></i></div>
                <div class="stat-value" id="statTournaments">0</div>
                <div class="stat-label" data-en="Tournaments" data-ar="بطولات">Tournaments</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="statPending">0</div>
                <div class="stat-label" data-en="Pending Requests" data-ar="طلبات معلقة">Pending Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-medal"></i></div>
                <div class="stat-value" id="statBelt">-</div>
                <div class="stat-label" data-en="Belt Level" data-ar="الحزام">Belt Level</div>
            </div>
        </div>

        <div class="content-grid">
            <div class="profile-card">
                <img src="" alt="Profile" class="profile-photo" id="profilePhoto" style="display:none;">
                <div class="profile-photo" id="profilePhotoPlaceholder" style="background: linear-gradient(135deg, #2563EB, #1d4ed8); display:flex; align-items:center; justify-content:center; font-size:48px; color:#fff;">
                    <i class="fas fa-user"></i>
                </div>
                <h2 class="profile-name" id="profileName">Loading...</h2>
                <p class="profile-role" data-en="Athlete" data-ar="لاعب">Athlete</p>
                
                <div class="profile-info">
                    <div class="info-item">
                        <span class="info-label" data-en="Email" data-ar="البريد">Email</span>
                        <span class="info-value" id="profileEmail">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" data-en="Country" data-ar="الدولة">Country</span>
                        <span class="info-value" id="profileCountry">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label" data-en="Belt" data-ar="الحزام">Belt</span>
                        <span class="info-value" id="profileBelt">-</span>
                    </div>
                </div>
                
                <button class="btn-edit" onclick="window.location.href='my-profile.html'" data-en="Edit Profile" data-ar="تعديل الملف">Edit Profile</button>
            </div>

            <div class="main-section">
                <div class="tabs">
                    <button class="tab-btn active" onclick="window.switchTab('teams')">
                        <i class="fas fa-shield-alt"></i> <span data-en="My Teams" data-ar="فرقي">My Teams</span>
                    </button>
                    <button class="tab-btn" onclick="window.switchTab('requests')">
                        <i class="fas fa-clock"></i> <span data-en="Join Requests" data-ar="طلبات الانضمام">Join Requests</span>
                        <span class="tab-badge" id="requestsBadge">0</span>
                    </button>
                    <button class="tab-btn" onclick="window.switchTab('tournaments')">
                        <i class="fas fa-trophy"></i> <span data-en="Tournaments" data-ar="البطولات">Tournaments</span>
                    </button>
                </div>

                <div id="teamsTab" class="tab-content active">
                    <div class="section-header">
                        <h2 class="section-title">
                            <i class="fas fa-shield-alt"></i> <span data-en="My Teams" data-ar="فرقي">My Teams</span>
                        </h2>
                        <a href="teams-directory.html" class="btn-primary">
                            <i class="fas fa-search"></i> <span data-en="Find Teams" data-ar="البحث عن فرق">Find Teams</span>
                        </a>
                    </div>
                    <div class="items-list" id="teamsList">
                        <div class="loading" style="text-align:center; padding:40px;">
                            <i class="fas fa-spinner fa-spin" style="font-size:32px; color:#2563EB;"></i>
                        </div>
                    </div>
                </div>

                <div id="requestsTab" class="tab-content">
                    <div class="section-header">
                        <h2 class="section-title">
                            <i class="fas fa-clock"></i> <span data-en="Join Requests" data-ar="طلبات الانضمام">Join Requests</span>
                        </h2>
                    </div>
                    <div class="items-list" id="requestsList">
                        <div class="loading" style="text-align:center; padding:40px;">
                            <i class="fas fa-spinner fa-spin" style="font-size:32px; color:#2563EB;"></i>
                        </div>
                    </div>
                </div>

                <div id="tournamentsTab" class="tab-content">
                    <div class="section-header">
                        <h2 class="section-title" data-en="My Tournaments" data-ar="بطولاتي">My Tournaments</h2>
                        <a href="events.html" class="btn-primary" data-en="Browse Events" data-ar="تصفح البطولات">Browse Events</a>
                    </div>
                    <div class="items-list" id="tournamentList">
                        <div class="loading" style="text-align:center; padding:40px;">
                            <i class="fas fa-spinner fa-spin" style="font-size:32px; color:#2563EB;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
            
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            let currentAthlete = null;
            let currentLang = localStorage.getItem('selectedLanguage') || 'en';

            window.setLang = function(lang) {
                currentLang = lang;
                localStorage.setItem('selectedLanguage', lang);
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.lang === lang) btn.classList.add('active');
                });
                
                document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                    el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
                });
                
                if (currentAthlete) {
                    loadTeams(currentAthlete.id);
                    loadJoinRequests(currentAthlete.id);
                    loadTournaments(currentAthlete.id);
                }
            };

            window.switchTab = function(tabName) {
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                
                document.getElementById(tabName + 'Tab').classList.add('active');
                event.target.closest('.tab-btn').classList.add('active');
            };

            window.handleLogout = async function() {
                if (confirm(currentLang === 'ar' ? 'هل أنت متأكد من تسجيل الخروج؟' : 'Are you sure you want to logout?')) {
                    await supabaseClient.auth.signOut();
                    window.location.href = 'index.html';
                }
            };

            async function loadProfile() {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                const { data: athlete, error } = await supabaseClient
                    .from('athletes')
                    .select('*')
                    .eq('user_id', user.id)
                    .single();

                if (error || !athlete) {
                    window.location.href = 'my-profile.html';
                    return;
                }

                currentAthlete = athlete;
                document.getElementById('userName').textContent = athlete.full_name;
                document.getElementById('profileName').textContent = athlete.full_name;
                document.getElementById('profileEmail').textContent = athlete.email;
                document.getElementById('profileCountry').textContent = athlete.country || '-';
                document.getElementById('profileBelt').textContent = athlete.belt_level || '-';
                
                if (athlete.profile_photo_url) {
                    document.getElementById('profilePhoto').src = athlete.profile_photo_url;
                    document.getElementById('profilePhoto').style.display = 'block';
                    document.getElementById('profilePhotoPlaceholder').style.display = 'none';
                }

                document.getElementById('statBelt').textContent = athlete.belt_level || '-';

                await Promise.all([
                    loadTeams(athlete.id),
                    loadJoinRequests(athlete.id),
                    loadTournaments(athlete.id)
                ]);
            }

            async function loadTeams(athleteId) {
                try {
                    const { data: members, error } = await supabaseClient
                        .from('team_members')
                        .select(`
                            *,
                            team:teams (
                                id,
                                name,
                                logo_url,
                                city,
                                country,
                                coach:coaches (
                                    full_name
                                )
                            )
                        `)
                        .eq('athlete_id', athleteId)
                        .eq('status', 'approved');

                    if (error) throw error;

                    const list = document.getElementById('teamsList');
                    const count = members ? members.length : 0;
                    document.getElementById('statMyTeams').textContent = count;

                    if (!members || members.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon"><i class="fas fa-shield-alt"></i></div>
                                <p>${currentLang === 'ar' ? 'أنت لست عضواً في أي فرق بعد.' : "You are not a member of any teams yet."}</p>
                                <a href="teams-directory.html" class="btn-primary" style="margin-top: 20px;">
                                    <i class="fas fa-search"></i> ${currentLang === 'ar' ? 'تصفح الفرق' : 'Browse Teams'}
                                </a>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = members.map(member => {
                        const team = member.team;
                        const coach = team.coach;
                        return `
                        <div class="item-card" onclick="window.location.href='team-public.html?id=${team.id}'">
                            <div class="item-info">
                                ${team.logo_url 
                                    ? `<img src="${team.logo_url}" alt="${team.name}" class="item-logo">`
                                    : `<div class="item-logo-placeholder"><i class="fas fa-shield-alt"></i></div>`
                                }
                                <div class="item-details">
                                    <h4>${team.name}</h4>
                                    <p>${team.city || 'N/A'}, ${team.country || 'N/A'} ${coach ? `• ${currentLang === 'ar' ? 'المدرب' : 'Coach'}: ${coach.full_name}` : ''}</p>
                                </div>
                            </div>
                            <span class="item-badge badge-member">${currentLang === 'ar' ? 'عضو' : 'Member'}</span>
                        </div>
                        `;
                    }).join('');

                } catch (error) {
                    console.error('Error loading teams:', error);
                }
            }

            async function loadJoinRequests(athleteId) {
                try {
                    const { data: requests, error } = await supabaseClient
                        .from('team_join_requests')
                        .select(`
                            *,
                            team:teams (
                                id,
                                name,
                                city,
                                country
                            )
                        `)
                        .eq('athlete_id', athleteId)
                        .eq('status', 'pending')
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    const list = document.getElementById('requestsList');
                    const count = requests ? requests.length : 0;
                    document.getElementById('statPending').textContent = count;
                    document.getElementById('requestsBadge').textContent = count;

                    if (!requests || requests.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon"><i class="fas fa-clock"></i></div>
                                <p>${currentLang === 'ar' ? 'لا توجد طلبات معلقة.' : 'No pending requests.'}</p>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = requests.map(request => {
                        const team = request.team;
                        const requestDate = new Date(request.created_at).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });
                        
                        return `
                        <div class="item-card">
                            <div class="item-info">
                                <div class="item-logo-placeholder"><i class="fas fa-shield-alt"></i></div>
                                <div class="item-details">
                                    <h4>${team.name}</h4>
                                    <p>${team.city || 'N/A'}, ${team.country || 'N/A'}</p>
                                    <p style="margin-top: 5px; font-size: 12px; color: rgba(255,255,255,0.6);">
                                        <i class="fas fa-clock"></i> ${currentLang === 'ar' ? 'طُلب في' : 'Requested'} ${requestDate}
                                    </p>
                                </div>
                            </div>
                            <span class="status-badge status-pending">
                                <i class="fas fa-clock"></i> ${currentLang === 'ar' ? 'معلق' : 'Pending'}
                            </span>
                        </div>
                        `;
                    }).join('');

                } catch (error) {
                    console.error('Error loading requests:', error);
                }
            }

            async function loadTournaments(athleteId) {
                try {
                    const { data: registrations, error } = await supabaseClient
                        .from('tournament_registrations')
                        .select(`
                            *,
                            tournaments (
                                name,
                                event_date,
                                location
                            )
                        `)
                        .eq('athlete_id', athleteId)
                        .order('created_at', { ascending: false });

                    if (error) throw error;

                    const list = document.getElementById('tournamentList');
                    const count = registrations ? registrations.length : 0;
                    document.getElementById('statTournaments').textContent = count;

                    if (!registrations || registrations.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon"><i class="fas fa-trophy"></i></div>
                                <p>${currentLang === 'ar' ? 'لم تسجل في أي بطولة بعد.' : "You haven't registered for any tournaments yet."}</p>
                                <a href="events.html" class="btn-primary" style="margin-top: 20px;">
                                    <i class="fas fa-search"></i> ${currentLang === 'ar' ? 'تصفح البطولات' : 'Browse Events'}
                                </a>
                            </div>
                        `;
                        return;
                    }

                    list.innerHTML = registrations.map(reg => {
                        const statusClass = reg.status === 'accepted' ? 'status-accepted' : 
                                           reg.status === 'rejected' ? 'status-rejected' : 'status-pending';
                        const statusText = reg.status === 'accepted' ? (currentLang === 'ar' ? 'مقبول' : 'Accepted') :
                                          reg.status === 'rejected' ? (currentLang === 'ar' ? 'مرفوض' : 'Rejected') :
                                          (currentLang === 'ar' ? 'قيد المراجعة' : 'Pending');
                        
                        return `
                        <div class="item-card">
                            <div class="item-info">
                                <div class="item-logo-placeholder"><i class="fas fa-trophy"></i></div>
                                <div class="item-details">
                                    <h4>${reg.tournaments?.name || 'Tournament'}</h4>
                                    <p>${reg.tournaments?.event_date || ''} • ${reg.tournaments?.location || ''}</p>
                                </div>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        `;
                    }).join('');

                } catch (error) {
                    console.error('Error loading tournaments:', error);
                }
            }

            window.addEventListener('DOMContentLoaded', loadProfile);
        })();
    </script>
</body>
</html>
