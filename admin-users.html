        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; }
        
        .sidebar { width: 280px; background: rgba(21, 29, 43, 0.98); border-left: 2px solid #2563EB; position: fixed; height: 100vh; padding: 20px; right: 0; overflow-y: auto; }
        [dir="rtl"] .sidebar { border-left: none; border-right: 2px solid #2563EB; right: auto; left: 0; }
        
        .logo { display: flex; align-items: center; gap: 15px; padding: 20px; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #0a0e17; }
        .logo-text { font-size: 22px; font-weight: bold; }
        
        .nav-menu { display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 15px 20px; border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; font-size: 15px; text-decoration: none; color: #fff; }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: linear-gradient(135deg, #2563EB, #1d4ed8); }
        
        .lang-switcher { display: flex; gap: 5px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 8px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: rgba(255,255,255,0.7); cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 13px; transition: all 0.3s; flex: 1; }
        .lang-btn.active { background: #2563EB; color: #fff; }
        .lang-btn:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.05); }
        
        .main-content { margin-right: 280px; padding: 40px; }
        [dir="rtl"] .main-content { margin-right: 0; margin-left: 280px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
        .page-title { font-size: 32px; font-weight: bold; }
        
        .section { background: #151d2b; border-radius: 16px; padding: 30px; margin-bottom: 30px; }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #f1c40f; }
        
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(239,68,68,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.4); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(245,158,11,0.4); }
        .btn-info { background: linear-gradient(135deg, #2563EB, #1d4ed8); color: #fff; }
        .btn-info:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37,99,235,0.4); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
        th { background: rgba(241, 196, 15, 0.1); color: #f1c40f; font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.03); }
        
        .status-badge { padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .status-suspended { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        
        .role-badge { padding: 4px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .role-athlete { background: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .role-organizer { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .role-coach { background: rgba(168, 85, 247, 0.2); color: #a855f7; }
        
        .filters { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 15px; margin-bottom: 25px; align-items: end; }
        .form-input, .form-select { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #f1c40f; }
        
        select.form-select {
            background-color: #1a1f2e !important;
            color: #fff !important;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        select.form-select option {
            background-color: #1a1f2e !important;
            color: #fff !important;
            padding: 10px;
        }
        select.form-select option:hover {
            background-color: #2a3548 !important;
        }
        select.form-select option:checked {
            background-color: #f1c40f !important;
            color: #000 !important;
            font-weight: bold;
        }
        
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #151d2b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 32px; font-weight: bold; color: #f1c40f; }
        .stat-label { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 5px; }
        
        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .page-btn { padding: 8px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .page-btn:hover { background: rgba(255,255,255,0.1); }
        .page-btn.active { background: #2563EB; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal { background: #151d2b; border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; }
        .modal-title { font-size: 22px; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.8); font-size: 14px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; }
        
        @media (max-width: 1024px) {
            .sidebar { width: 100%; position: relative; height: auto; }
            [dir="ltr"] .main-content { margin-right: 0; }
            [dir="rtl"] .main-content { margin-left: 0; }
            .filters { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr; }
            .action-btns { flex-direction: column; }
            .action-btns .btn { width: 100%; }
        }

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allUsers = [];
        let currentPage = 1;
        const perPage = 20;
        let editingUser = null;
        let currentLang = localStorage.getItem('lang') || 'en';

        // Translations
        const translations = {

                btn_edit: '✏️ Edit', btn_activate: '✅ Activate', btn_suspend: '️ Suspend', btn_delete: '️ Delete'
            },
            ar: {

                nav_reports: 'التقارير', nav_settings: 'الإعدادات', nav_logout: 'تسجيل الخروج',
                page_title: 'إدارة المستخدمين', btn_create: 'إنشاء حساب جديد',
                stat_total: 'إجمالي المستخدمين', stat_athletes: 'اللاعبون', stat_organizers: 'المنظمون', stat_coaches: 'المدربون',
                section_users_list: 'قائمة المستخدمين',
                filter_search: 'بحث', search_placeholder: 'ابحث بالاسم أو البريد...',
                filter_status: 'الحالة', status_all: 'جميع الحالات', status_active: 'نشط', status_suspended: 'موقوف', status_pending: 'قيد الانتظار',

                th_name: 'الاسم', th_email: 'البريد الإلكتروني', th_role: 'الدور', th_status: 'الحالة', th_date: 'تاريخ التسجيل', th_actions: 'الإجراءات',
                loading: 'جاري التحميل...', no_users: 'لا يوجد مستخدمون',
                modal_create_title: 'إنشاء حساب جديد', modal_edit_title: 'تعديل مستخدم',
                label_fullname: 'الاسم الكامل', placeholder_name: 'أدخل الاسم',
                label_email: 'البريد الإلكتروني', label_password: 'كلمة المرور', label_role: 'الدور',
                btn_save: 'حفظ', btn_cancel: 'إلغاء',

                alert_error: 'خطأ: ',
                alert_suspended: 'تم إيقاف المستخدم',
                alert_activated: 'تم تفعيل المستخدم',
                alert_no_data_export: 'لا توجد بيانات للتصدير',
                status_text_active: 'نشط', status_text_suspended: 'موقوف', status_text_pending: 'قيد الانتظار',
                role_text_athlete: 'لاعب', role_text_organizer: 'منظم', role_text_coach: 'مدرب',
                btn_edit: '️ تعديل', btn_activate: '✅ تفعيل', btn_suspend: '⏸️ إيقاف', btn_delete: '🗑️ حذف'
            }
        };

        function t(key) {
            return translations[currentLang][key] || key;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            
            // Update all data-i18n elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            // Update all data-i18n-placeholder elements
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            
            // Update select options
            document.querySelectorAll('select option[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            
            // Re-render table if data exists
            if (allUsers.length > 0) {
                renderPage();
            }
        }

        window.onload = async () => {
            setLang(currentLang);
            await checkAuth();
            await loadUsers();
        };

        async function checkAuth() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { 
                window.location.href = 'admin-login.html'; 
                return; 
            }
            const { data: admin } = await supabaseClient.from('admin_profiles').select('*').eq('id', user.id).maybeSingle();
            if (!admin) { 
                window.location.href = 'index.html'; 
                return; 
            }
        }

        async function loadUsers() {
            const search = document.getElementById('searchUser').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const roleFilter = document.getElementById('filterRole').value;

            try {
                const [athletesRes, organizersRes, coachesRes] = await Promise.all([
                    supabaseClient.from('athletes').select('*'),
                    supabaseClient.from('organizers').select('*'),
                    supabaseClient.from('coaches').select('*')
                ]);

                let users = [];

                if (athletesRes.data) {
                    athletesRes.data.forEach(a => {
                        users.push({
                            id: a.id,
                            user_id: a.user_id,
                            name: a.full_name || a.name || '-',
                            email: a.email || '-',
                            role: 'athlete',
                            status: a.status || 'active',
                            created_at: a.created_at
                        });
                    });
                }

                if (organizersRes.data) {
                    organizersRes.data.forEach(o => {
                        users.push({
                            id: o.id,
                            user_id: o.user_id,
                            name: o.full_name || o.org_name || '-',
                            email: o.email || '-',
                            role: 'organizer',
                            status: o.status || 'active',
                            created_at: o.created_at
                        });
                    });
                }

                if (coachesRes.data) {
                    coachesRes.data.forEach(c => {
                        users.push({
                            id: c.id,
                            user_id: c.user_id,
                            name: c.full_name || c.name || '-',
                            email: c.email || '-',
                            role: 'coach',
                            status: c.status || 'active',
                            created_at: c.created_at
                        });
                    });
                }

                // Apply filters
                if (search) {
                    users = users.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
                }
                if (statusFilter) users = users.filter(u => u.status === statusFilter);
                if (roleFilter) users = users.filter(u => u.role === roleFilter);

                allUsers = users.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                // Update statistics
                document.getElementById('statTotal').textContent = allUsers.length;
                document.getElementById('statAthletes').textContent = allUsers.filter(u => u.role === 'athlete').length;
                document.getElementById('statOrganizers').textContent = allUsers.filter(u => u.role === 'organizer').length;
                document.getElementById('statCoaches').textContent = allUsers.filter(u => u.role === 'coach').length;

                renderPage();

            } catch (error) {
                console.error('Error loading users:', error);
                alert(t('alert_error') + error.message);
            }
        }

        function renderPage() {
            const totalPages = Math.ceil(allUsers.length / perPage);
            const start = (currentPage - 1) * perPage;
            const pageUsers = allUsers.slice(start, start + perPage);

            const tbody = document.getElementById('usersTable');
            
            if (pageUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">${t('no_users')}</td></tr>`;
            } else {
                tbody.innerHTML = pageUsers.map((u, i) => {
                    const statusClass = u.status === 'active' ? 'status-active' : 
                                       u.status === 'suspended' ? 'status-suspended' : 'status-pending';
                    const statusText = t(`status_text_${u.status}`) || u.status;
                    const roleClass = `role-${u.role}`;
                    const roleText = t(`role_text_${u.role}`) || u.role;
                    const dateLocale = currentLang === 'ar' ? 'ar-SA' : 'en-US';
                    const formattedDate = u.created_at ? new Date(u.created_at).toLocaleDateString(dateLocale) : '-';

                    return `
                        <tr>
                            <td>${start + i + 1}</td>
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td><span class="role-badge ${roleClass}">${roleText}</span></td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>${formattedDate}</td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn btn-info" onclick="editUser('${u.id}', '${u.role}')" style="padding: 5px 10px; font-size: 12px;">${t('btn_edit')}</button>
                                    <button class="btn btn-warning" onclick="toggleStatus('${u.id}', '${u.role}', '${u.status}')" style="padding: 5px 10px; font-size: 12px;">
                                        ${u.status === 'suspended' ? t('btn_activate') : t('btn_suspend')}
                                    </button>
                                    <button class="btn btn-danger" onclick="deleteUser('${u.id}', '${u.role}')" style="padding: 5px 10px; font-size: 12px;">${t('btn_delete')}</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                pagination.innerHTML = Array.from({length: totalPages}, (_, i) => 
                    `<button class="page-btn ${i + 1 === currentPage ? 'active' : ''}" onclick="goToPage(${i + 1})">${i + 1}</button>`
                ).join('');
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderPage();
        }

        function editUser(id, role) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            editingUser = { id, role };
            document.getElementById('modalTitle').textContent = t('modal_edit_title');
            document.getElementById('modalUserName').value = user.name;
            document.getElementById('modalUserEmail').value = user.email;
            document.getElementById('modalUserRole').value = role;
            document.getElementById('modalUserPassword').value = '';
            document.getElementById('passwordGroup').style.display = 'none';
            
            document.getElementById('userModal').classList.add('active');
        }

        async function toggleStatus(id, role, currentStatus) {
            const newStatus = currentStatus === 'suspended' ? 'active' : 'suspended';
            const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
            
            const { error } = await supabaseClient.from(table).update({ status: newStatus }).eq('id', id);
            if (error) { alert(t('alert_error') + error.message); return; }
            
            alert(newStatus === 'suspended' ? t('alert_suspended') : t('alert_activated'));
            loadUsers();
        }

        async function deleteUser(id, role) {
            if (!confirm(t('alert_confirm_delete'))) return;
            const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
            
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (error) { alert(t('alert_error') + error.message); return; }
            
            alert(t('alert_success_delete'));
            loadUsers();
        }

        function showCreateModal() {
            editingUser = null;
            document.getElementById('modalTitle').textContent = t('modal_create_title');
            document.getElementById('modalUserName').value = '';
            document.getElementById('modalUserEmail').value = '';
            document.getElementById('modalUserPassword').value = '';
            document.getElementById('modalUserRole').value = 'athlete';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
            editingUser = null;
        }

        async function saveUser() {
            const name = document.getElementById('modalUserName').value;
            const email = document.getElementById('modalUserEmail').value;
            const password = document.getElementById('modalUserPassword').value;
            const role = document.getElementById('modalUserRole').value;

            if (!name || !email) {
                alert(t('alert_fill_required'));
                return;
            }

            if (!editingUser && !password) {
                alert(t('alert_fill_password'));
                return;
            }

            try {
                if (editingUser) {
                    const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
                    const updateData = {
                        full_name: name,
                        email: email,
                        updated_at: new Date().toISOString()
                    };
                    
                    if (role === 'organizer') updateData.org_name = name;
                    
                    const { error } = await supabaseClient.from(table).update(updateData).eq('id', editingUser.id);
                    if (error) throw error;
                    
                    alert(t('alert_success_update'));
                } else {
                    const { data: userData, error: authError } = await supabaseClient.auth.admin.createUser({
                        email: email,
                        password: password,
                        email_confirm: true
                    });

                    if (authError) throw authError;

                    const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
                    const insertData = {
                        user_id: userData.user.id,
                        email: email,
                        full_name: name,
                        status: 'active',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };

                    if (role === 'organizer') {
                        insertData.org_name = name;
                        insertData.verification_status = 'pending';
                    }

                    const { error: insertError } = await supabaseClient.from(table).insert(insertData);
                    if (insertError) throw insertError;
                    
                    alert(t('alert_success_create'));
                }

                closeModal();
                loadUsers();

            } catch (error) {
                alert(t('alert_error') + error.message);
            }
        }

        function exportUsers() {
            if (allUsers.length === 0) { alert(t('alert_no_data_export')); return; }
            
            const headers = currentLang === 'ar' 
                ? ['الاسم', 'البريد', 'الدور', 'الحالة', 'تاريخ التسجيل']
                : ['Name', 'Email', 'Role', 'Status', 'Registration Date'];
            
            const csv = [
                headers,
                ...allUsers.map(u => [u.name, u.email, u.role, u.status, u.created_at])
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `users_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
