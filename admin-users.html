<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management - TopCompSports Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           1. CORE THEME & SIDEBAR (From Dashboard)
           ========================================= */
        :root {
            --bg-dark: #0a0e17; 
            --bg-card: #151d2b; 
            --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB; 
            --accent: #f1c40f; 
            --accent-dark: #d4a017;
            --text-main: #ffffff; 
            --text-muted: rgba(255,255,255,0.7);
            --success: #10b981; 
            --warning: #f59e0b; 
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        .sidebar { 
            width: 280px; 
            background: rgba(21, 29, 43, 0.98); 
            border-left: 2px solid var(--primary); 
            position: fixed; 
            top: 0; 
            height: 100vh; 
            overflow-y: auto;
            padding: 20px;
            z-index: 1000;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }
        [dir="rtl"] .sidebar { right: 0; left: auto; border-left: 2px solid var(--primary); border-right: none; }
        [dir="ltr"] .sidebar { left: 0; right: auto; border-left: none; border-right: 2px solid var(--primary); }
        
        .logo { display: flex; align-items: center; gap: 15px; padding: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 30px; flex-shrink: 0; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: var(--bg-dark); }
        .logo-text { font-size: 22px; font-weight: bold; color: var(--text-main); }
        
        .sidebar nav { flex: 1; overflow-y: auto; }
        .nav-item { padding: 15px 20px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), #1d4ed8); }
        .nav-item .icon { font-size: 1.3rem; width: 24px; text-align: center; }
        
        .role-badge { background: var(--accent); color: var(--bg-dark); padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-top: auto; display: block; text-align: center; }

        .main-content { padding: 30px; transition: all 0.3s; }
        [dir="rtl"] .main-content { margin-right: 280px; margin-left: 0; }
        [dir="ltr"] .main-content { margin-left: 280px; margin-right: 0; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 20px; background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-size: 2rem; font-weight: bold; color: var(--text-main); }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #1d4ed8); display: flex; align-items: center; justify-content: center; color: var(--text-main); font-weight: bold; font-size: 1.2rem; }
        .btn-logout { background: var(--danger); color: var(--text-main); padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn-logout:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

        .lang-switcher { display: flex; gap: 8px; background: var(--bg-input); padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .lang-btn { background: transparent; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); transition: all 0.3s; }
        .lang-btn.active { background: var(--primary); color: var(--text-main); }
        .lang-btn:hover:not(.active) { color: var(--text-main); }

        /* =========================================
           2. PAGE SPECIFIC STYLES (Users Page)
           ========================================= */
        .btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: var(--bg-dark); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.4); }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #dc2626); color: #fff; }
        .btn-success { background: linear-gradient(135deg, var(--success), #059669); color: #fff; }
        .btn-warning { background: linear-gradient(135deg, var(--warning), #d97706); color: #fff; }
        .btn-info { background: linear-gradient(135deg, var(--primary), #1d4ed8); color: #fff; }
        .btn-small { padding: 6px 12px; font-size: 12px; }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 32px; font-weight: bold; color: var(--accent); }
        .stat-label { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        .section { background: var(--bg-card); border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .section-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: var(--accent); }

        .filters { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 15px; margin-bottom: 25px; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { color: var(--text-muted); font-size: 14px; }
        .form-input, .form-select { background: var(--bg-input); border: 2px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 14px; width: 100%; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary); }
        
        select.form-select option { background-color: var(--bg-card) !important; color: var(--text-main) !important; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
        th { background: rgba(241, 196, 15, 0.1); color: var(--accent); font-weight: bold; }
        tr:hover { background: rgba(255,255,255,0.03); }
        
        .status-badge, .role-badge-small { padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-suspended { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .role-athlete { background: rgba(37, 99, 235, 0.2); color: #60a5fa; }
        .role-organizer { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .role-coach { background: rgba(168, 85, 247, 0.2); color: #a855f7; }

        .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }

        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .page-btn { padding: 8px 15px; background: var(--bg-input); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .page-btn:hover { background: rgba(255,255,255,0.1); }
        .page-btn.active { background: var(--primary); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-card); border-radius: 16px; padding: 30px; max-width: 500px; width: 90%; border: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 22px; font-weight: bold; color: var(--accent); margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions .btn { flex: 1; justify-content: center; }

        @media (max-width: 1024px) {
            .sidebar { width: 100%; height: auto; position: relative; border-left: none !important; border-right: none !important; border-bottom: 2px solid var(--primary); }
            [dir="rtl"] .main-content, [dir="ltr"] .main-content { margin: 0; padding: 20px; }
            .filters { grid-template-columns: 1fr; }
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr; }
            .action-btns { flex-direction: column; }
            .action-btns .btn { width: 100%; justify-content: center; }
            .header { flex-direction: column; align-items: stretch; }
            .user-info { justify-content: space-between; margin-top: 15px; }
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allUsers = [];
        let currentPage = 1;
        const perPage = 20;
        let editingUser = null;
        let currentLang = localStorage.getItem('adminLang') || 'en';
        let currentAdmin = null;

        // ==========================================
        // 1. Language System (From Dashboard)
        // ==========================================
        window.setLang = function(lang) {
            currentLang = lang;
            localStorage.setItem('adminLang', lang);
            
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            
            document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
            });
            
            document.querySelectorAll('[data-en-placeholder][data-ar-placeholder]').forEach(el => {
                el.placeholder = lang === 'ar' ? el.dataset.arPlaceholder : el.dataset.enPlaceholder;
            });
            
            if (allUsers.length > 0) {
                renderPage();
            }
        };

        // ==========================================
        // 2. Auth Check (From Dashboard)
        // ==========================================
        async function checkAuth() {
            const storedAdmin = localStorage.getItem('currentAdmin');
            if (!storedAdmin) {
                window.location.href = 'admin-login.html';
                return;
            }

            try {
                currentAdmin = JSON.parse(storedAdmin);
                
                const { data: admin } = await supabaseClient
                    .from('admin_profiles')
                    .select('*')
                    .eq('id', currentAdmin.id)
                    .maybeSingle();

                if (!admin) {
                    localStorage.removeItem('currentAdmin');
                    window.location.href = 'admin-login.html';
                    return;
                }

                document.getElementById('userName').textContent = currentAdmin.full_name || 'Admin';
                document.getElementById('userAvatar').textContent = (currentAdmin.full_name || 'A')[0].toUpperCase();
                
                const roleBadge = document.getElementById('adminRole');
                const roleText = currentAdmin.role === 'super_admin' ? 
                    (currentLang === 'ar' ? 'سوبر أدمن' : 'Super Admin') : 
                    currentAdmin.role === 'admin' ? 
                    (currentLang === 'ar' ? 'أدمن' : 'Admin') : 
                    (currentLang === 'ar' ? 'أدمن فرعي' : 'Sub-Admin');
                roleBadge.textContent = roleText;
                
            } catch (error) {
                console.error('Auth error:', error);
                window.location.href = 'admin-login.html';
            }
        }

        // ==========================================
        // 3. Database Logic (Preserved from Users Page)
        // ==========================================
        async function loadUsers() {
            const search = document.getElementById('searchUser').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const roleFilter = document.getElementById('filterRole').value;

            try {
                const [athletesRes, organizersRes, coachesRes] = await Promise.all([
                    supabaseClient.from('athletes').select('*'),
                    supabaseClient.from('organizers').select('*'),
                    supabaseClient.from('coaches').select('*')
                ]);

                let users = [];

                if (athletesRes.data) {
                    athletesRes.data.forEach(a => {
                        users.push({
                            id: a.id,
                            user_id: a.user_id,
                            name: a.full_name || a.name || '-',
                            email: a.email || '-',
                            role: 'athlete',
                            status: a.status || 'active',
                            created_at: a.created_at
                        });
                    });
                }

                if (organizersRes.data) {
                    organizersRes.data.forEach(o => {
                        users.push({
                            id: o.id,
                            user_id: o.user_id,
                            name: o.full_name || o.org_name || '-',
                            email: o.email || '-',
                            role: 'organizer',
                            status: o.status || 'active',
                            created_at: o.created_at
                        });
                    });
                }

                if (coachesRes.data) {
                    coachesRes.data.forEach(c => {
                        users.push({
                            id: c.id,
                            user_id: c.user_id,
                            name: c.full_name || c.name || '-',
                            email: c.email || '-',
                            role: 'coach',
                            status: c.status || 'active',
                            created_at: c.created_at
                        });
                    });
                }

                if (search) {
                    users = users.filter(u => u.name.toLowerCase().includes(search) || u.email.toLowerCase().includes(search));
                }
                if (statusFilter) users = users.filter(u => u.status === statusFilter);
                if (roleFilter) users = users.filter(u => u.role === roleFilter);

                allUsers = users.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

                document.getElementById('statTotal').textContent = allUsers.length;
                document.getElementById('statAthletes').textContent = allUsers.filter(u => u.role === 'athlete').length;
                document.getElementById('statOrganizers').textContent = allUsers.filter(u => u.role === 'organizer').length;
                document.getElementById('statCoaches').textContent = allUsers.filter(u => u.role === 'coach').length;

                renderPage();

            } catch (error) {
                console.error('Error loading users:', error);
                alert((currentLang === 'ar' ? 'خطأ: ' : 'Error: ') + error.message);
            }
        }

        function renderPage() {
            const totalPages = Math.ceil(allUsers.length / perPage);
            const start = (currentPage - 1) * perPage;
            const pageUsers = allUsers.slice(start, start + perPage);

            const tbody = document.getElementById('usersTable');
            
            if (pageUsers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center;">${currentLang === 'ar' ? 'لا يوجد مستخدمون' : 'No users found'}</td></tr>`;
            } else {
                tbody.innerHTML = pageUsers.map((u, i) => {
                    const statusClass = u.status === 'active' ? 'status-active' : (u.status === 'suspended' ? 'status-suspended' : 'status-pending');
                    const statusText = u.status === 'active' ? (currentLang === 'ar' ? 'نشط' : 'Active') : (u.status === 'suspended' ? (currentLang === 'ar' ? 'موقوف' : 'Suspended') : (currentLang === 'ar' ? 'قيد الانتظار' : 'Pending'));
                    const roleClass = `role-${u.role}`;
                    const roleText = u.role === 'athlete' ? (currentLang === 'ar' ? 'لاعب' : 'Athlete') : (u.role === 'organizer' ? (currentLang === 'ar' ? 'منظم' : 'Organizer') : (currentLang === 'ar' ? 'مدرب' : 'Coach'));
                    const dateLocale = currentLang === 'ar' ? 'ar-SA' : 'en-US';
                    const formattedDate = u.created_at ? new Date(u.created_at).toLocaleDateString(dateLocale) : '-';

                    const btnEdit = currentLang === 'ar' ? 'تعديل' : 'Edit';
                    const btnSuspend = currentLang === 'ar' ? 'إيقاف' : 'Suspend';
                    const btnActivate = currentLang === 'ar' ? 'تفعيل' : 'Activate';
                    const btnDelete = currentLang === 'ar' ? 'حذف' : 'Delete';

                    return `
                        <tr>
                            <td>${start + i + 1}</td>
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td><span class="role-badge-small ${roleClass}">${roleText}</span></td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>${formattedDate}</td>
                            <td>
                                <div class="action-btns">
                                    <button class="btn btn-info btn-small" onclick="editUser('${u.id}', '${u.role}')">
                                        <i class="fas fa-edit"></i> ${btnEdit}
                                    </button>
                                    <button class="btn btn-warning btn-small" onclick="toggleStatus('${u.id}', '${u.role}', '${u.status}')">
                                        ${u.status === 'suspended' ? `<i class="fas fa-check"></i> ${btnActivate}` : `<i class="fas fa-pause"></i> ${btnSuspend}`}
                                    </button>
                                    <button class="btn btn-danger btn-small" onclick="deleteUser('${u.id}', '${u.role}')">
                                        <i class="fas fa-trash"></i> ${btnDelete}
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            const pagination = document.getElementById('pagination');
            if (totalPages > 1) {
                pagination.innerHTML = Array.from({length: totalPages}, (_, i) => 
                    `<button class="page-btn ${i + 1 === currentPage ? 'active' : ''}" onclick="goToPage(${i + 1})">${i + 1}</button>`
                ).join('');
            } else {
                pagination.innerHTML = '';
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderPage();
        }

        function showCreateModal() {
            editingUser = null;
            document.getElementById('modalTitle').setAttribute('data-en', 'Create New Account');
            document.getElementById('modalTitle').setAttribute('data-ar', 'إنشاء حساب جديد');
            document.getElementById('modalUserName').value = '';
            document.getElementById('modalUserEmail').value = '';
            document.getElementById('modalUserPassword').value = '';
            document.getElementById('modalUserRole').value = 'athlete';
            document.getElementById('passwordGroup').style.display = 'block';
            window.setLang(currentLang); // Refresh modal text
            document.getElementById('userModal').classList.add('active');
        }

        function editUser(id, role) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;

            editingUser = { id, role };
            document.getElementById('modalTitle').setAttribute('data-en', 'Edit User');
            document.getElementById('modalTitle').setAttribute('data-ar', 'تعديل مستخدم');
            document.getElementById('modalUserName').value = user.name;
            document.getElementById('modalUserEmail').value = user.email;
            document.getElementById('modalUserRole').value = role;
            document.getElementById('modalUserPassword').value = '';
            document.getElementById('passwordGroup').style.display = 'none';
            window.setLang(currentLang); // Refresh modal text
            document.getElementById('userModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
            editingUser = null;
        }

        async function saveUser() {
            const name = document.getElementById('modalUserName').value;
            const email = document.getElementById('modalUserEmail').value;
            const password = document.getElementById('modalUserPassword').value;
            const role = document.getElementById('modalUserRole').value;

            if (!name || !email) {
                alert(currentLang === 'ar' ? 'الرجاء ملء الحقول المطلوبة' : 'Please fill in the required fields');
                return;
            }

            if (!editingUser && !password) {
                alert(currentLang === 'ar' ? 'الرجاء إدخال كلمة المرور' : 'Please enter a password');
                return;
            }

            try {
                if (editingUser) {
                    const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
                    const updateData = {
                        full_name: name,
                        email: email,
                        updated_at: new Date().toISOString()
                    };
                    if (role === 'organizer') updateData.org_name = name;

                    const { error } = await supabaseClient.from(table).update(updateData).eq('id', editingUser.id);
                    if (error) throw error;

                    alert(currentLang === 'ar' ? 'تم تعديل المستخدم بنجاح' : 'User updated successfully');
                } else {
                    const { data: userData, error: authError } = await supabaseClient.auth.admin.createUser({
                        email: email,
                        password: password,
                        email_confirm: true
                    });

                    if (authError) throw authError;

                    const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
                    const insertData = {
                        user_id: userData.user.id,
                        email: email,
                        full_name: name,
                        status: 'active',
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };

                    if (role === 'organizer') {
                        insertData.org_name = name;
                        insertData.verification_status = 'pending';
                    }

                    const { error: insertError } = await supabaseClient.from(table).insert(insertData);
                    if (insertError) throw insertError;

                    alert(currentLang === 'ar' ? 'تم إنشاء الحساب بنجاح!' : 'Account created successfully!');
                }

                closeModal();
                loadUsers();

            } catch (error) {
                alert((currentLang === 'ar' ? 'خطأ: ' : 'Error: ') + error.message);
            }
        }

        async function toggleStatus(id, role, currentStatus) {
            const newStatus = currentStatus === 'suspended' ? 'active' : 'suspended';
            const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
            
            const { error } = await supabaseClient.from(table).update({ status: newStatus }).eq('id', id);
            if (error) { 
                alert((currentLang === 'ar' ? 'خطأ: ' : 'Error: ') + error.message); 
                return; 
            }
            
            alert(newStatus === 'suspended' ? (currentLang === 'ar' ? 'تم إيقاف المستخدم' : 'User suspended') : (currentLang === 'ar' ? 'تم تفعيل المستخدم' : 'User activated'));
            loadUsers();
        }

        async function deleteUser(id, role) {
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد من حذف هذا المستخدم؟' : 'Are you sure you want to delete this user?')) return;
            const table = role === 'athlete' ? 'athletes' : role === 'organizer' ? 'organizers' : 'coaches';
            
            const { error } = await supabaseClient.from(table).delete().eq('id', id);
            if (error) { 
                alert((currentLang === 'ar' ? 'خطأ: ' : 'Error: ') + error.message); 
                return; 
            }
            
            alert(currentLang === 'ar' ? 'تم الحذف بنجاح' : 'Deleted successfully');
            loadUsers();
        }

        function exportUsers() {
            if (allUsers.length === 0) { 
                alert(currentLang === 'ar' ? 'لا توجد بيانات للتصدير' : 'No data to export'); 
                return; 
            }
            
            const headers = currentLang === 'ar' 
                ? ['الاسم', 'البريد', 'الدور', 'الحالة', 'تاريخ التسجيل']
                : ['Name', 'Email', 'Role', 'Status', 'Registration Date'];
            
            const csv = [
                headers,
                ...allUsers.map(u => [u.name, u.email, u.role, u.status, u.created_at])
            ].map(row => row.join(',')).join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `users_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        async function handleLogout() {
            if (confirm(currentLang === 'ar' ? 'هل أنت متأكد من تسجيل الخروج؟' : 'Are you sure you want to logout?')) {
                try {
                    await supabaseClient.auth.signOut();
                } catch (e) {
                    console.error('Logout error:', e);
                }
                localStorage.removeItem('currentAdmin');
                window.location.href = 'admin-login.html';
            }
        }

        // ==========================================
        // 4. Initialization
        // ==========================================
        window.onload = async function() {
            window.setLang(currentLang);
            await checkAuth();
            await loadUsers();
        };

        // Close modal on outside click
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
