<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Profile - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --white: #FFFFFF;
            --light-bg: #F5F7FA;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-bg); color: var(--black); min-height: 100vh; }
        
        .header { background: var(--black); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; color: var(--white); }
        .logo-icon { width: 40px; height: 40px; background: var(--gradient-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-yellow); }
        .nav { display: flex; gap: 30px; }
        .nav a { color: var(--white); text-decoration: none; font-weight: 500; transition: color 0.3s; }
        .nav a:hover { color: var(--accent-yellow); }
        .btn-back { background: transparent; border: 2px solid var(--white); color: var(--white); padding: 8px 20px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s; }
        .btn-back:hover { background: var(--white); color: var(--black); }
        
        .team-hero { background: var(--gradient-blue); padding: 80px 50px; position: relative; overflow: hidden; }
        .team-hero::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.2); }
        .hero-content { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
        .team-logo-large { width: 150px; height: 150px; border-radius: 50%; border: 5px solid var(--accent-yellow); object-fit: cover; background: var(--white); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .team-logo-placeholder { width: 150px; height: 150px; border-radius: 50%; background: var(--white); display: flex; align-items: center; justify-content: center; font-size: 60px; color: var(--primary-blue); border: 5px solid var(--accent-yellow); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .team-hero-info { flex: 1; color: var(--white); }
        .team-hero-info h1 { font-size: 42px; font-weight: 900; margin-bottom: 15px; }
        .team-hero-info p { font-size: 18px; opacity: 0.9; margin-bottom: 20px; }
        .team-badges { display: flex; gap: 15px; flex-wrap: wrap; }
        .badge { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .badge-active { background: var(--accent-yellow); color: var(--black); }
        .badge-sport { background: rgba(255,255,255,0.2); color: var(--white); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 50px 50px; }
        .content-grid { display: grid; grid-template-columns: 1fr 350px; gap: 30px; }
        
        .main-content { background: var(--white); border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .section { margin-bottom: 40px; }
        .section:last-child { margin-bottom: 0; }
        .section-title { font-size: 24px; font-weight: bold; color: var(--dark-blue); margin-bottom: 25px; padding-bottom: 15px; border-bottom: 3px solid var(--primary-blue); display: flex; align-items: center; gap: 10px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .info-card { background: var(--light-bg); padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary-blue); transition: all 0.3s; }
        .info-card:hover { transform: translateX(5px); box-shadow: 0 4px 15px rgba(0,102,204,0.15); }
        .info-label { color: #64748B; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .info-label i { color: var(--primary-blue); }
        .info-value { font-weight: 600; color: var(--black); font-size: 15px; word-break: break-word; }
        .info-value a { color: var(--primary-blue); text-decoration: none; }
        .info-value a:hover { text-decoration: underline; }
        
        .about-text { background: var(--light-bg); padding: 25px; border-radius: 12px; line-height: 1.8; color: var(--dark-gray); border-left: 4px solid var(--primary-blue); }
        
        .sports-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .sport-tag { background: rgba(0,102,204,0.1); color: var(--primary-blue); padding: 10px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
        .sport-tag i { font-size: 12px; }
        
        .sidebar { display: flex; flex-direction: column; gap: 25px; }
        .sidebar-card { background: var(--white); border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .coach-card { text-align: center; }
        .coach-photo-large { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px; border: 4px solid var(--accent-yellow); object-fit: cover; background: var(--gradient-blue); display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 48px; overflow: hidden; }
        .coach-photo-large img { width: 100%; height: 100%; object-fit: cover; }
        .coach-name-large { font-size: 22px; font-weight: bold; color: var(--dark-blue); margin-bottom: 5px; }
        .coach-role { color: var(--primary-blue); font-size: 14px; margin-bottom: 25px; font-weight: 600; }
        .coach-contact { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .coach-contact-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--light-bg); border-radius: 8px; font-size: 14px; }
        .coach-contact-item i { color: var(--primary-blue); width: 20px; text-align: center; }
        
        .join-card { text-align: center; }
        .join-card h3 { font-size: 20px; margin-bottom: 15px; color: var(--dark-blue); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .join-card p { color: #64748B; margin-bottom: 25px; font-size: 14px; line-height: 1.6; }
        .btn-join { width: 100%; padding: 16px; background: var(--gradient-blue); color: var(--white); border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-join:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-join:disabled { background: #94A3B8; cursor: not-allowed; transform: none; }
        .status-message { padding: 15px; border-radius: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-pending { background: rgba(255,184,0,0.15); color: #B45309; border: 1px solid rgba(255,184,0,0.3); }
        .status-member { background: rgba(16,185,129,0.15); color: #047857; border: 1px solid rgba(16,185,129,0.3); }
        .status-login { background: rgba(0,102,204,0.1); color: var(--primary-blue); border: 1px solid rgba(0,102,204,0.3); }
        
        .loading { text-align: center; padding: 60px 20px; }
        .loading i { font-size: 48px; color: var(--primary-blue); animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .empty-state { text-align: center; padding: 40px; color: #64748B; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; opacity: 0.5; }
        
        .error-message {
            background: #FEE2E2;
            border: 1px solid #EF4444;
            color: #DC2626;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        
        @media (max-width: 1024px) {
            .content-grid { grid-template-columns: 1fr; }
            .sidebar { order: -1; }
            .header { padding: 15px 30px; }
            .container { padding: 30px 20px; }
            .team-hero { padding: 60px 30px; }
            .hero-content { flex-direction: column; text-align: center; }
            .team-hero-info h1 { font-size: 32px; }
        }
        
        @media (max-width: 768px) {
            .header { padding: 12px 20px; flex-direction: column; gap: 15px; }
            .nav { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .team-hero { padding: 50px 20px; }
            .team-hero-info h1 { font-size: 28px; }
            .container { padding: 20px 15px; }
            .main-content, .sidebar-card { padding: 25px 20px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">T</div>
            <div style="font-size: 20px; font-weight: bold;">TopCompSports</div>
        </a>
        <nav class="nav">
            <a href="index.html" data-i18n="nav_home">Home</a>
            <a href="tournaments.html" data-i18n="nav_tournaments">Tournaments</a>
            <a href="teams-directory.html" data-i18n="nav_teams">Teams</a>
        </nav>
        <a href="teams-directory.html" class="btn-back"><i class="fas fa-arrow-left"></i> <span data-i18n="back_teams">Back to Teams</span></a>
    </header>

    <div class="team-hero">
        <div class="hero-content">
            <div class="team-logo-placeholder" id="teamLogo">
                <i class="fas fa-shield-alt"></i>
            </div>
            <div class="team-hero-info">
                <h1 id="teamName">Loading...</h1>
                <p id="teamDescription">Loading team information...</p>
                <div class="team-badges">
                    <span class="badge badge-active" id="teamStatus"><i class="fas fa-check-circle"></i> <span data-i18n="active">Active</span></span>
                    <span class="badge badge-sport" id="teamSport"><i class="fas fa-fist-raised"></i> <span>-</span></span>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="content-grid">
            <div class="main-content">
                <div id="errorMessage" style="display: none;"></div>
                
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-info-circle"></i> <span data-i18n="team_info">Team Information</span></h2>
                    <div class="info-grid" id="teamInfo">
                        <div class="loading"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-align-left"></i> <span data-i18n="about_team">About Team</span></h2>
                    <div class="about-text" id="teamAbout">
                        <div class="loading"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
                
                <div class="section">
                    <h2 class="section-title"><i class="fas fa-fist-raised"></i> <span data-i18n="sports">Sports</span></h2>
                    <div class="sports-list" id="teamSportsList">
                        <div class="loading"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="sidebar-card coach-card">
                    <div class="coach-photo-large" id="coachPhoto">
                        <i class="fas fa-user"></i>
                    </div>
                    <h3 class="coach-name-large" id="coachName">-</h3>
                    <p class="coach-role" data-i18n="head_coach">Head Coach</p>
                    <div class="coach-contact" id="coachContact">
                        <div class="loading" style="font-size: 20px;"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </div>
                
                <div class="sidebar-card join-card" id="joinCard">
                    <h3><i class="fas fa-user-plus"></i> <span data-i18n="join_title">Join This Team</span></h3>
                    <p data-i18n="join_desc">Send a request to join this team. The coach will review your request.</p>
                    <button class="btn-join" id="btnJoin" onclick="requestJoin()">
                        <i class="fas fa-paper-plane"></i> <span data-i18n="request_join">Request to Join</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                nav_home: 'Home', nav_tournaments: 'Tournaments', nav_teams: 'Teams', back_teams: 'Back to Teams',
                active: 'Active', team_info: 'Team Information', about_team: 'About Team', sports: 'Sports',
                head_coach: 'Head Coach', join_title: 'Join This Team', join_desc: 'Send a request to join this team. The coach will review your request.',
                request_join: 'Request to Join', login_required: 'Login to Request Join', profile_required: 'Complete Your Profile',
                already_member: 'You are a Member', member_desc: 'You are already a member of this team.',
                request_pending: 'Request Pending', pending_desc: 'Your request is waiting for coach approval.',
                location: 'Location', email: 'Email', phone: 'Phone', person_charge: 'Person in Charge',
                website: 'Website', founded: 'Founded', no_description: 'No description available.',
                no_sports: 'No sports listed', loading: 'Loading...', error_load: 'Error loading team data'
            },
            ar: {
                nav_home: 'الرئيسية', nav_tournaments: 'البطولات', nav_teams: 'الفرق', back_teams: 'العودة للفرق',
                active: 'نشط', team_info: 'معلومات الفريق', about_team: 'عن الفريق', sports: 'الرياضات',
                head_coach: 'المدرب الرئيسي', join_title: 'انضم لهذا الفريق', join_desc: 'أرسل طلب للانضمام للفريق. المدرب سيراجع طلبك.',
                request_join: 'طلب الانضمام', login_required: 'سجل دخول لطلب الانضمام', profile_required: 'أكمل ملفك الشخصي',
                already_member: 'أنت عضو في الفريق', member_desc: 'أنت بالفعل عضو في هذا الفريق.',
                request_pending: 'الطلب قيد المراجعة', pending_desc: 'طلبك في انتظار موافقة المدرب.',
                location: 'الموقع', email: 'البريد الإلكتروني', phone: 'الهاتف', person_charge: 'المسؤول',
                website: 'الموقع الإلكتروني', founded: 'سنة التأسيس', no_description: 'لا يوجد وصف متاح.',
                no_sports: 'لا توجد رياضات مدرجة', loading: 'جاري التحميل...', error_load: 'خطأ في تحميل بيانات الفريق'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'en';
        
        function updateLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
            });
        }

        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        // ✅ تم تغيير الاسم من supabase إلى supabaseClient لتجنب التعارض
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentTeam = null;
        let currentUser = null;
        let currentAthlete = null;

        const urlParams = new URLSearchParams(window.location.search);
        const teamId = urlParams.get('id');

        if (!teamId) { 
            showError('Team ID not found');
            setTimeout(() => window.location.href = 'teams-directory.html', 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'block';
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> <strong>Error:</strong> ${message}`;
            
            document.querySelectorAll('.loading').forEach(el => {
                el.innerHTML = `<i class="fas fa-exclamation-circle" style="color: #EF4444;"></i>`;
            });
        }

        async function loadTeam() {
            try {
                console.log('🔍 Loading team with ID:', teamId);
                
                const { data: team, error } = await supabaseClient
                    .from('teams')
                    .select('*')
                    .eq('id', teamId)
                    .single();
                
                if (error) {
                    console.error('❌ Error fetching team:', error);
                    throw new Error(`Failed to load team: ${error.message}`);
                }
                
                if (!team) {
                    throw new Error('Team not found');
                }
                
                console.log('✅ Team loaded successfully:', team);
                currentTeam = team;
                
                updateTeamUI(team);
                
                if (team.coach_id) {
                    loadCoachData(team.coach_id).catch(err => console.warn('⚠️ Coach load failed:', err));
                }
                
                await checkMembership();
                
            } catch (error) {
                console.error('❌ Error in loadTeam:', error);
                showError(error.message || translations[currentLang].error_load);
            }
        }

        async function loadCoachData(coachId) {
            const { data: coach, error } = await supabaseClient
                .from('coaches')
                .select('id, full_name, email, phone, profile_photo_url')
                .eq('id', coachId)
                .single();
            
            if (error || !coach) {
                document.getElementById('coachName').textContent = '-';
                document.getElementById('coachContact').innerHTML = '<div style="color: #64748B;">No coach info</div>';
                return;
            }
            
            if (coach.profile_photo_url) {
                document.getElementById('coachPhoto').innerHTML = `<img src="${coach.profile_photo_url}" alt="${coach.full_name}">`;
            }
            document.getElementById('coachName').textContent = coach.full_name || '-';
            document.getElementById('coachContact').innerHTML = `
                <div class="coach-contact-item"><i class="fas fa-envelope"></i><span>${coach.email || '-'}</span></div>
                <div class="coach-contact-item"><i class="fas fa-phone"></i><span>${coach.phone || '-'}</span></div>
            `;
        }

        function updateTeamUI(team) {
            try {
                document.getElementById('teamName').textContent = team.name || 'Unnamed Team';
                document.getElementById('teamDescription').textContent = team.description || translations[currentLang].no_description;
                
                if (team.logo_url) {
                    document.getElementById('teamLogo').innerHTML = `<img src="${team.logo_url}" alt="${team.name}" class="team-logo-large">`;
                }
                
                const isActive = team.is_active !== false;
                document.getElementById('teamStatus').innerHTML = `<i class="fas fa-${isActive ? 'check' : 'pause'}-circle"></i> <span>${isActive ? translations[currentLang].active : 'Suspended'}</span>`;
                
                if (team.sports && team.sports.length > 0) {
                    document.getElementById('teamSport').innerHTML = `<i class="fas fa-fist-raised"></i> <span>${Array.isArray(team.sports) ? team.sports[0] : team.sports}</span>`;
                }
                
                const infoHTML = `
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-map-marker-alt"></i> ${translations[currentLang].location}</div>
                        <div class="info-value">${team.address || 'N/A'}${team.city ? ', ' + team.city : ''}${team.country ? ', ' + team.country : ''}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-envelope"></i> ${translations[currentLang].email}</div>
                        <div class="info-value">${team.email || 'N/A'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-phone"></i> ${translations[currentLang].phone}</div>
                        <div class="info-value">${team.phone || 'N/A'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-user-tie"></i> ${translations[currentLang].person_charge}</div>
                        <div class="info-value">${team.person_in_charge || 'N/A'}</div>
                    </div>
                    ${team.website ? `
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-globe"></i> ${translations[currentLang].website}</div>
                        <div class="info-value"><a href="${team.website}" target="_blank">${team.website}</a></div>
                    </div>
                    ` : ''}
                    <div class="info-card">
                        <div class="info-label"><i class="fas fa-calendar"></i> ${translations[currentLang].founded}</div>
                        <div class="info-value">${team.founded_year || 'Not specified'}</div>
                    </div>
                `;
                document.getElementById('teamInfo').innerHTML = infoHTML;
                document.getElementById('teamAbout').textContent = team.description || translations[currentLang].no_description;
                
                const sportsDiv = document.getElementById('teamSportsList');
                if (team.sports && Array.isArray(team.sports) && team.sports.length > 0) {
                    sportsDiv.innerHTML = team.sports.map(s => `<span class="sport-tag"><i class="fas fa-fist-raised"></i> ${s}</span>`).join('');
                } else {
                    sportsDiv.innerHTML = `<div class="empty-state"><i class="fas fa-fist-raised"></i><p>${translations[currentLang].no_sports}</p></div>`;
                }
                
            } catch (error) {
                console.error('Error updating UI:', error);
            }
        }

        async function checkMembership() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                
                if (!user) {
                    updateJoinCard('login');
                    return;
                }
                
                currentUser = user;
                
                const { data: athlete } = await supabaseClient
                    .from('athletes')
                    .select('id')
                    .eq('user_id', user.id)
                    .single();
                
                if (!athlete) {
                    updateJoinCard('profile');
                    return;
                }
                
                currentAthlete = athlete;
                
                const { data: member } = await supabaseClient
                    .from('team_members')
                    .select('id, status')
                    .eq('team_id', teamId)
                    .eq('athlete_id', athlete.id)
                    .eq('status', 'approved')
                    .single();
                
                if (member) {
                    updateJoinCard('member');
                    return;
                }
                
                const { data: request } = await supabaseClient
                    .from('team_join_requests')
                    .select('id, status')
                    .eq('team_id', teamId)
                    .eq('athlete_id', athlete.id)
                    .eq('status', 'pending')
                    .single();
                
                if (request) {
                    updateJoinCard('pending');
                    return;
                }
                
                updateJoinCard('join');
                
            } catch (error) {
                console.error('Error checking membership:', error);
                updateJoinCard('join');
            }
        }

        function updateJoinCard(status) {
            const card = document.getElementById('joinCard');
            const t = translations[currentLang];
            
            switch(status) {
                case 'login':
                    card.innerHTML = `
                        <h3><i class="fas fa-sign-in-alt"></i> ${t.login_required}</h3>
                        <p>${t.join_desc}</p>
                        <button class="btn-join" onclick="window.location.href='login.html?redirect=' + encodeURIComponent(window.location.href)">
                            <i class="fas fa-sign-in-alt"></i> ${t.login_required}
                        </button>
                    `;
                    break;
                case 'profile':
                    card.innerHTML = `
                        <h3><i class="fas fa-exclamation-triangle"></i> ${t.profile_required}</h3>
                        <p>${t.join_desc}</p>
                        <a href="my-profile.html" class="btn-join" style="text-decoration:none;">
                            <i class="fas fa-user-edit"></i> ${t.profile_required}
                        </a>
                    `;
                    break;
                case 'member':
                    card.innerHTML = `
                        <h3 style="color: #10B981;"><i class="fas fa-check-circle"></i> ${t.already_member}</h3>
                        <p style="color: #64748B; margin: 15px 0;">${t.member_desc}</p>
                        <div class="status-message status-member">
                            <i class="fas fa-check-circle"></i> ${t.already_member}
                        </div>
                    `;
                    break;
                case 'pending':
                    card.innerHTML = `
                        <h3 style="color: var(--accent-yellow);"><i class="fas fa-clock"></i> ${t.request_pending}</h3>
                        <p style="color: #64748B; margin: 15px 0;">${t.pending_desc}</p>
                        <div class="status-message status-pending">
                            <i class="fas fa-clock"></i> ${t.request_pending}
                        </div>
                    `;
                    break;
                case 'join':
                default:
                    card.innerHTML = `
                        <h3><i class="fas fa-user-plus"></i> ${t.join_title}</h3>
                        <p>${t.join_desc}</p>
                        <button class="btn-join" id="btnJoin" onclick="requestJoin()">
                            <i class="fas fa-paper-plane"></i> ${t.request_join}
                        </button>
                    `;
            }
        }

        async function requestJoin() {
            if (!currentUser || !currentAthlete) {
                alert('Please login first');
                window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }
            
            const message = prompt(currentLang === 'ar' ? 'اكتب رسالة للمدرب (اختياري):' : 'Write a message to the coach (optional):');
            if (message === null) return;
            
            try {
                const { error } = await supabaseClient
                    .from('team_join_requests')
                    .insert([{
                        team_id: teamId,
                        athlete_id: currentAthlete.id,
                        message: message || null,
                        status: 'pending',
                        created_at: new Date().toISOString()
                    }]);
                
                if (error) throw error;
                
                alert(currentLang === 'ar' ? '✅ تم إرسال الطلب بنجاح!' : '✅ Request sent successfully!');
                updateJoinCard('pending');
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateLanguage();
            loadTeam();
        });
    </script>
</body>
</html>
