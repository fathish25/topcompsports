<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0066CC 0%, #003366 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-container {
            background: #1A1A1A;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border: 2px solid #2A2A2A;
        }

        .logo-icon { 
            width: 80px; 
            height: 80px; 
            background: linear-gradient(135deg, #0066CC, #003366);
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px; 
            font-weight: bold; 
            color: #FFB800;
            margin: 0 auto 20px;
            border: 3px solid #FFB800;
        }

        h1 { font-size: 2rem; margin-bottom: 15px; }
        p { color: rgba(255,255,255,0.7); margin-bottom: 30px; line-height: 1.6; }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #0066CC;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-icon {
            font-size: 80px;
            margin: 20px 0;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0066CC, #003366);
            color: #fff;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }

        @media (max-width: 480px) {
            .confirm-container { padding: 30px 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="confirm-container">
        <div class="logo-icon">T</div>
        
        <div id="loading">
            <h1>Confirming Your Email</h1>
            <p>Please wait while we verify your email address...</p>
            <div class="spinner"></div>
        </div>

        <div id="success" style="display: none;">
            <div class="success-icon">✅</div>
            <h1>Email Confirmed!</h1>
            <p>Your email has been successfully confirmed. You can now sign in to your account.</p>
            <a href="login.html" class="btn">Sign In →</a>
        </div>

        <div id="error" style="display: none;">
            <h1>Confirmation Failed</h1>
            <p id="errorMessage">There was an error confirming your email.</p>
            <a href="signup.html" class="btn">Try Again</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async function() {
            try {
                // Get the access token from URL
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const accessToken = hashParams.get('access_token');
                
                if (!accessToken) {
                    throw new Error('No access token found');
                }

                // Set the session
                const { data: sessionData, error: sessionError } = await supabase.auth.setSession({
                    access_token: accessToken,
                    refresh_token: hashParams.get('refresh_token') || ''
                });

                if (sessionError) throw sessionError;

                // Get user data
                const { data: { user }, error: userError } = await supabase.auth.getUser();
                
                if (userError) throw userError;
                if (!user) throw new Error('No user found');

                // Update user profile to mark email as confirmed
                const { error: updateError } = await supabase
                    .from('users')
                    .update({ 
                        email_confirmed: true,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', user.id);

                if (updateError) {
                    console.error('Update error:', updateError);
                    // Continue anyway as email is confirmed in auth
                }

                // Show success
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'block';

                // Auto redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html?email=' + encodeURIComponent(user.email) + '&confirmed=true';
                }, 3000);

            } catch (error) {
                console.error('Confirmation error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('errorMessage').textContent = error.message || 'An unexpected error occurred';
            }
        };
    </script>
</body>
</html>
