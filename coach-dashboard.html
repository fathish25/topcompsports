<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Dashboard - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --white: #FFFFFF;
            --light-bg: #F8FAFC;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-bg); color: var(--black); min-height: 100vh; }

        .header { background: var(--black); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--primary-blue); }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; margin-left: 10px; }
        .nav a:hover { color: var(--accent-yellow); }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .page-header { background: var(--gradient-blue); color: var(--white); padding: 30px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .page-header h1 { font-size: 2rem; }
        .page-header p { opacity: 0.9; margin-top: 5px; }

        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--accent-yellow); color: var(--black); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,184,0,0.4); }
        .btn-secondary { background: var(--white); color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .btn-secondary:hover { background: var(--primary-blue); color: var(--white); }
        .btn-danger { background: #EF4444; color: var(--white); }
        .btn-danger:hover { background: #DC2626; }
        .btn-edit { background: var(--primary-blue); color: var(--white); }
        .btn-edit:hover { background: var(--dark-blue); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--white); border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-left: 4px solid var(--primary-blue); }
        .stat-card h3 { color: var(--dark-gray); font-size: 0.9rem; margin-bottom: 10px; text-transform: uppercase; }
        .stat-card .stat-value { font-size: 2.5rem; font-weight: bold; color: var(--primary-blue); }
        .stat-card .stat-label { color: #64748B; font-size: 0.85rem; margin-top: 5px; }

        .teams-section { background: var(--white); border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .teams-section h2 { color: var(--dark-blue); margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #E5E7EB; }

        .team-card { background: var(--light-bg); border-radius: 10px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; transition: all 0.3s; border: 2px solid transparent; }
        .team-card:hover { border-color: var(--primary-blue); transform: translateX(5px); }
        .team-info { flex: 1; min-width: 200px; }
        .team-info h3 { color: var(--dark-blue); font-size: 1.3rem; margin-bottom: 8px; }
        .team-info p { color: #64748B; font-size: 0.9rem; margin-bottom: 4px; }
        .team-info p i { color: var(--primary-blue); margin-right: 5px; }
        .team-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-inactive { background: #FEE2E2; color: #991B1B; }

        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }

        .empty-state { text-align: center; padding: 60px 20px; color: #64748B; }
        .empty-state i { font-size: 4rem; color: var(--primary-blue); margin-bottom: 20px; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 10px; }

        .loading { text-align: center; padding: 40px; }
        .loading i { font-size: 3rem; color: var(--primary-blue); animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .nav { display: none; }
            .container { margin: 20px auto; }
            .page-header { flex-direction: column; text-align: center; }
            .team-card { flex-direction: column; align-items: flex-start; }
            .team-actions { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-text">TopCompSports</div>
        </a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="my-profile.html">Profile</a>
            <a href="create-team.html">Create Team</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1><i class="fas fa-tachometer-alt"></i> Coach Dashboard</h1>
                <p>Manage your teams and view statistics</p>
            </div>
            <a href="create-team.html" class="btn btn-primary">
                <i class="fas fa-plus"></i> Create New Team
            </a>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Statistics -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>Total Teams</h3>
                <div class="stat-value" id="totalTeams">0</div>
                <div class="stat-label">Active teams</div>
            </div>
            <div class="stat-card">
                <h3>Active Teams</h3>
                <div class="stat-value" id="activeTeams">0</div>
                <div class="stat-label">Currently active</div>
            </div>
            <div class="stat-card">
                <h3>Countries</h3>
                <div class="stat-value" id="totalCountries">0</div>
                <div class="stat-label">Team locations</div>
            </div>
        </div>

        <!-- Teams List -->
        <div class="teams-section">
            <h2><i class="fas fa-shield-alt"></i> My Teams</h2>
            <div id="teamsList">
                <div class="loading">
                    <i class="fas fa-spinner"></i>
                    <p>Loading teams...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        async function loadDashboard() {
            try {
                // 1. التحقق من تسجيل الدخول
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                
                if (authError || !user) {
                    showAlert('Please login first', 'error');
                    window.location.href = 'login.html';
                    return;
                }

                console.log('User ID:', user.id);

                // 2. البحث عن coach_id
                const { data: coachData } = await supabaseClient
                    .from('coaches')
                    .select('id')
                    .eq('user_id', user.id)
                    .maybeSingle();

                if (!coachData) {
                    document.getElementById('teamsList').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-user-slash"></i>
                            <h3>No Coach Profile</h3>
                            <p>Please contact admin to set up your coach profile.</p>
                        </div>
                    `;
                    return;
                }

                const coachId = coachData.id;
                console.log('Coach ID:', coachId);

                // 3. جلب جميع الفرق
                const { data: teams, error: teamsError } = await supabaseClient
                    .from('teams')
                    .select('*')
                    .eq('coach_id', coachId)
                    .order('created_at', { ascending: false });

                if (teamsError) throw teamsError;

                console.log('Teams found:', teams);

                // 4. تحديث الإحصائيات
                const totalTeams = teams?.length || 0;
                const activeTeams = teams?.filter(t => t.is_active).length || 0;
                const uniqueCountries = new Set(teams?.map(t => t.country).filter(Boolean)).size;

                document.getElementById('totalTeams').textContent = totalTeams;
                document.getElementById('activeTeams').textContent = activeTeams;
                document.getElementById('totalCountries').textContent = uniqueCountries;

                // 5. عرض الفرق
                if (!teams || teams.length === 0) {
                    document.getElementById('teamsList').innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-shield-alt"></i>
                            <h3>No Teams Yet</h3>
                            <p>Create your first team to get started!</p>
                            <a href="create-team.html" class="btn btn-primary" style="margin-top: 20px;">
                                <i class="fas fa-plus"></i> Create Team
                            </a>
                        </div>
                    `;
                    return;
                }

                const teamsHTML = teams.map(team => `
                    <div class="team-card">
                        <div class="team-info">
                            <h3>${team.name || 'Unnamed Team'}</h3>
                            <p><i class="fas fa-map-marker-alt"></i> ${team.city || 'N/A'}, ${team.country || 'N/A'}</p>
                            <p><i class="fas fa-envelope"></i> ${team.email || 'No email'}</p>
                            <p><i class="fas fa-phone"></i> ${team.phone || 'No phone'}</p>
                            ${team.sports && team.sports.length > 0 ? `<p><i class="fas fa-fist-raised"></i> ${team.sports.join(', ')}</p>` : ''}
                            <span class="badge ${team.is_active ? 'badge-active' : 'badge-inactive'}">
                                ${team.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                        <div class="team-actions">
                            <button class="btn btn-edit" onclick="editTeam('${team.id}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn btn-danger" onclick="deleteTeam('${team.id}', '${team.name}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                `).join('');

                document.getElementById('teamsList').innerHTML = teamsHTML;

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error loading dashboard: ' + error.message, 'error');
            }
        }

        async function editTeam(teamId) {
            // يمكن تطويرها لاحقاً لفتح صفحة تعديل
            showAlert('Edit feature coming soon!', 'success');
            // window.location.href = `edit-team.html?id=${teamId}`;
        }

        async function deleteTeam(teamId, teamName) {
            if (!confirm(`Are you sure you want to delete "${teamName}"?`)) {
                return;
            }

            try {
                const { error } = await supabaseClient
                    .from('teams')
                    .delete()
                    .eq('id', teamId);

                if (error) throw error;

                showAlert('✅ Team deleted successfully!', 'success');
                setTimeout(() => loadDashboard(), 1000);

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error deleting team: ' + error.message, 'error');
            }
        }

        // تحميل الداشبورد عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
