<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0066CC 0%, #003366 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #1A1A1A;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #2A2A2A;
        }

        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { 
            width: 70px; 
            height: 70px; 
            background: #FFB800;
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 36px; 
            font-weight: bold; 
            color: #0A0A0A;
            margin: 0 auto 15px;
        }
        .logo-text { font-size: 24px; font-weight: bold; color: #FFB800; }

        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 2rem; margin-bottom: 10px; color: #FFB800; }
        .login-header p { color: rgba(255,255,255,0.6); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .form-input {
            width: 100%;
            background: #0A0A0A;
            border: 2px solid #2A2A2A;
            color: #fff;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-input:focus { outline: none; border-color: #0066CC; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .btn-primary { background: #0066CC; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-info { background: rgba(14,165,233,0.2); border: 1px solid #0ea5e9; color: #0ea5e9; }

        .signup-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .signup-link a { color: #FFB800; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .login-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>

        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to your TopCompSports account</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" required placeholder="your.email@example.com" autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" required placeholder="Enter your password" autocomplete="off">
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">Sign In →</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-' + type + ' show';
            alert.textContent = message;
            setTimeout(function() { alert.classList.remove('show'); }, 6000);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const result = await dbClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (result.error) {
                    if (result.error.message.includes('Email not confirmed')) {
                        showAlert('info', '📧 Please check your email and confirm your account.');
                    } else if (result.error.message.includes('Invalid login credentials')) {
                        showAlert('error', '❌ Invalid email or password.');
                    } else {
                        showAlert('error', '❌ ' + result.error.message);
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In →';
                    return;
                }

                console.log('✅ Login successful! User ID:', result.data.user.id);

                let userProfile = null;
                
                try {
                    const profileResult = await dbClient
                        .from('users')
                        .select('*')
                        .eq('id', result.data.user.id)
                        .maybeSingle();

                    if (profileResult.data) {
                        userProfile = profileResult.data;
                    }
                } catch (profileErr) {
                    console.warn('Profile lookup failed:', profileErr.message);
                }

                if (!userProfile) {
                    console.log('⚠️ Profile not found, creating one...');
                    
                    try {
                        const createResult = await dbClient
                            .from('users')
                            .insert([{
                                id: result.data.user.id,
                                email: email,
                                full_name: result.data.user.user_metadata?.full_name || email.split('@')[0],
                                user_type: result.data.user.user_metadata?.user_type || 'athlete',
                                email_confirmed: result.data.user.email_confirmed_at ? true : false,
                                created_at: new Date().toISOString()
                            }])
                            .select()
                            .single();

                        if (createResult.data) {
                            userProfile = createResult.data;
                        } else {
                            userProfile = {
                                id: result.data.user.id,
                                email: email,
                                full_name: email.split('@')[0],
                                user_type: 'athlete'
                            };
                        }
                    } catch (createErr) {
                        console.error('Create error:', createErr);
                        userProfile = {
                            id: result.data.user.id,
                            email: email,
                            full_name: email.split('@')[0],
                            user_type: 'athlete'
                        };
                    }
                }

                const userData = {
                    id: result.data.user.id,
                    email: result.data.user.email,
                    full_name: userProfile.full_name,
                    user_type: userProfile.user_type || 'athlete',
                    profile_picture_url: userProfile.profile_picture_url
                };

                localStorage.setItem('currentUser', JSON.stringify(userData));

                const isProfileComplete = userProfile.full_name && 
                                       userProfile.date_of_birth && 
                                       userProfile.gender;

                console.log('Profile complete:', isProfileComplete);

                showAlert('success', '✅ Login successful! Redirecting...');

                setTimeout(function() {
                    if (!isProfileComplete) {
                        console.log('Redirecting to profile.html (incomplete profile)');
                        window.location.href = 'profile.html';
                    } else {
                        console.log('Redirecting to index.html (home page)');
                        window.location.href = 'index.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                showAlert('error', '❌ Error: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In →';
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('needsConfirmation') === 'true') {
                showAlert('info', '📧 Account created! Please check your email.');
            }
            
            if (urlParams.get('confirmed') === 'true') {
                showAlert('success', '✅ Email confirmed! You can now sign in.');
            }

            if (urlParams.get('email')) {
                document.getElementById('email').value = urlParams.get('email');
            }
        };
    </script>
</body>
</html>
