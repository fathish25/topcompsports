<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopCompSports - Player Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #151d2b; border-radius: 16px; padding: 40px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #0a0e17; margin: 0 auto 15px; }
        .title { font-size: 28px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; }
        .form-input, .form-select { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 14px; border-radius: 8px; font-size: 15px; }
        .form-select option { background-color: #1a1f2e; color: #fff; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #f1c40f; }
        .btn { width: 100%; background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(241, 196, 15, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .tournament-info { background: rgba(241, 196, 15, 0.1); border: 1px solid #f1c40f; border-radius: 12px; padding: 20px; margin-bottom: 30px; text-align: center; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-icon">T</div>
            <h1 class="title">Tournament Registration</h1>
            <p style="color: rgba(255,255,255,0.7);">Fill in your details to register for the tournament</p>
        </div>

        <div id="alert" class="alert"></div>
        <div id="tournamentInfo" class="tournament-info">Loading tournament details...</div>

        <form id="regForm" onsubmit="handleRegister(event)">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="pName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Team / Academy</label>
                    <input type="text" class="form-input" id="pTeam" placeholder="Your team name" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Age Group</label>
                    <select class="form-select" id="pAge" required>
                        <option value="">Select Age Group</option>
                        <option value="Kids 1 (4-5 yrs)">Kids 1 (4-5 yrs)</option>
                        <option value="Kids 2 (6-7 yrs)">Kids 2 (6-7 yrs)</option>
                        <option value="Kids 3 (8-9 yrs)">Kids 3 (8-9 yrs)</option>
                        <option value="Infant (10-11 yrs)">Infant (10-11 yrs)</option>
                        <option value="Junior (12-13 yrs)">Junior (12-13 yrs)</option>
                        <option value="Teen (14-15 yrs)">Teen (14-15 yrs)</option>
                        <option value="Youth (16-17 yrs)">Youth (16-17 yrs)</option>
                        <option value="Adult (18-29 yrs)">Adult (18-29 yrs)</option>
                        <option value="Master 1 (30-35 yrs)">Master 1 (30-35 yrs)</option>
                        <option value="Master 2 (36-40 yrs)">Master 2 (36-40 yrs)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="pGender" required>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Weight (kg)</label>
                    <select class="form-select" id="pWeight" required>
                        <option value="">Select Weight</option>
                        <option value="16">16 kg</option><option value="20">20 kg</option><option value="25">25 kg</option>
                        <option value="30">30 kg</option><option value="35">35 kg</option><option value="40">40 kg</option>
                        <option value="45">45 kg</option><option value="50">50 kg</option><option value="55">55 kg</option>
                        <option value="60">60 kg</option><option value="65">65 kg</option><option value="70">70 kg</option>
                        <option value="75">75 kg</option><option value="80">80 kg</option><option value="85">85 kg</option>
                        <option value="90">90 kg</option><option value="95">95 kg</option><option value="100">100 kg</option>
                        <option value="100+">100+ kg</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Belt Level</label>
                    <select class="form-select" id="pBelt" required>
                        <option value="">Select Belt</option>
                        <option value="White">White</option><option value="Grey">Grey</option><option value="Yellow">Yellow</option>
                        <option value="Orange">Orange</option><option value="Green">Green</option><option value="Blue">Blue</option>
                        <option value="Purple">Purple</option><option value="Brown">Brown</option><option value="Black">Black</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Ranking (Optional)</label>
                <input type="number" class="form-input" id="pRank" value="0" min="0">
                <small style="color: rgba(241, 196, 15, 0.8); font-size: 12px;">0 = Unranked | 1-10 = Local | 1-100 = International</small>
            </div>
            <button type="submit" class="btn" id="submitBtn">✅ Confirm Registration</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let tournamentId = null;

        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            tournamentId = params.get('tournament_id');
            if (!tournamentId) {
                showAlert('error', 'Invalid registration link.');
                document.getElementById('regForm').style.display = 'none';
                return;
            }

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = `login.html?redirect=player-register.html?tournament_id=${tournamentId}`;
                return;
            }

            const { data: t } = await supabase.from('tournaments').select('name, event_date, location').eq('id', tournamentId).single();
            if (t) {
                document.getElementById('tournamentInfo').innerHTML = `<h3 style="color:#f1c40f; margin-bottom:10px;">${t.name}</h3><p>📅 ${t.event_date} • 📍 ${t.location}</p>`;
                document.getElementById('pName').value = user.email.split('@')[0]; // Auto-fill name
            }
        };

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Registering...';

            const { data: { user } } = await supabase.auth.getUser();

            try {
                const { error } = await supabase.rpc('self_register_tournament', {
                    p_tournament_id: tournamentId,
                    p_user_id: user.id,
                    p_player_name: document.getElementById('pName').value,
                    p_team: document.getElementById('pTeam').value,
                    p_age_group: document.getElementById('pAge').value,
                    p_gender: document.getElementById('pGender').value,
                    p_weight: parseFloat(document.getElementById('pWeight').value),
                    p_belt_level: document.getElementById('pBelt').value,
                    p_ranking: parseInt(document.getElementById('pRank').value) || 0
                });

                if (error) throw error;

                showAlert('success', '🎉 Registration successful! The organizer will see you in the bracket.');
                document.getElementById('regForm').style.display = 'none';
            } catch (err) {
                showAlert('error', '❌ ' + (err.message || 'Registration failed'));
                btn.disabled = false;
                btn.textContent = '✅ Confirm Registration';
            }
        }

        function showAlert(type, msg) {
            const a = document.getElementById('alert');
            a.className = `alert alert-${type} show`;
            a.textContent = msg;
        }
    </script>
</body>
</html>
