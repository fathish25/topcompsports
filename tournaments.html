<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #151d2b;
            --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB;
            --primary-light: #3b82f6;
            --accent: #f1c40f;
            --accent-dark: #d4a017;
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
            --border: rgba(255,255,255,0.1);
            --border-light: rgba(255,255,255,0.2);
            --shadow-glow: 0 0 20px rgba(37, 99, 235, 0.3);
            --shadow-card: 0 4px 20px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh;
            line-height: 1.6;
        }

        /* خلفية متدرجة خفيفة لإضافة عمق */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 10% 20%, rgba(37,99,235,0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(241,196,15,0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: -1;
        }
        
        img { max-width: 100%; height: auto; }

        /* Header */
        .header { 
            background: rgba(21, 29, 43, 0.95); 
            backdrop-filter: blur(10px);
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--border);
            position: sticky; 
            top: 0; 
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; transition: transform 0.3s; }
        .logo:hover { transform: scale(1.05); }
        .logo-svg { width: 50px; height: 50px; }
        .logo-text { font-size: 28px; font-weight: bold; background: linear-gradient(135deg, var(--primary-light), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        .nav { display: flex; gap: 30px; align-items: center; }
        .nav a { 
            color: var(--text-muted); 
            text-decoration: none; 
            padding: 8px 15px; 
            border-radius: 8px; 
            transition: all 0.3s; 
            font-weight: 600;
            position: relative;
        }
        .nav a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 0; height: 2px;
            background: var(--accent);
            transition: width 0.3s;
        }
        .nav a:hover { color: var(--accent); background: rgba(241,196,15,0.1); }
        .nav a:hover::after { width: 80%; }
        .nav a[style*="accent-yellow"] { color: var(--accent) !important; }

        .user-section { display: flex; align-items: center; gap: 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 8px; transition: background 0.3s; }
        .user-info:hover { background: rgba(255,255,255,0.05); }
        .user-avatar { 
            width: 40px; height: 40px; border-radius: 50%; overflow: hidden; 
            border: 2px solid var(--accent); background: var(--bg-card); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 20px; box-shadow: 0 0 10px rgba(241,196,15,0.3);
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-weight: 600; color: var(--accent); }
        
        .btn { 
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; transition: all 0.3s; font-size: 0.95rem; 
            text-decoration: none; display: inline-block; position: relative; overflow: hidden;
        }
        .btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%); transition: width 0.6s, height 0.6s;
        }
        .btn:hover::before { width: 300px; height: 300px; }

        .btn-logout { background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); z-index: 1; }
        .btn-logout:hover { background: var(--text-main); color: var(--bg-dark); border-color: var(--text-main); }
        
        .btn-login { 
            background: linear-gradient(135deg, var(--primary), #1d4ed8); 
            color: var(--text-main); 
            box-shadow: 0 4px 15px rgba(37,99,235,0.3);
            z-index: 1;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        
        .btn-register { 
            background: linear-gradient(135deg, var(--primary), #1d4ed8); 
            color: var(--text-main); 
            padding: 10px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(37,99,235,0.3);
            z-index: 1;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(37,99,235,0.4); }

        .lang-switcher { display: flex; gap: 5px; background: var(--bg-input); padding: 5px; border-radius: 8px; border: 1px solid var(--border); }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 6px; font-weight: bold; transition: all 0.3s; }
        .lang-btn.active { background: var(--primary); color: var(--text-main); box-shadow: 0 2px 8px rgba(37,99,235,0.3); }
        .lang-btn:hover:not(.active) { color: var(--text-main); background: rgba(255,255,255,0.05); }

        /* Hero Section */
        .hero { 
            background: linear-gradient(135deg, rgba(37,99,235,0.15) 0%, rgba(10,14,23,0.9) 100%);
            padding: 100px 50px; 
            text-align: center; 
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '🏆';
            position: absolute;
            font-size: 15rem;
            opacity: 0.03;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .hero h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 15px; position: relative; z-index: 1; animation: fadeInUp 0.8s ease; }
        .hero p { font-size: 1.3rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; position: relative; z-index: 1; animation: fadeInUp 0.8s ease 0.2s both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Container */
        .container { max-width: 1200px; margin: 0 auto; padding: 60px 50px; }

        /* Tournaments Grid */
        .tournaments-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        
        .tournament-card { 
            background: var(--bg-card); 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; 
            position: relative;
        }
        .tournament-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(37,99,235,0.1) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1;
        }
        .tournament-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary);
            box-shadow: var(--shadow-glow), 0 15px 30px rgba(0,0,0,0.5); 
        }
        .tournament-card:hover::before { opacity: 1; }
        
        .tournament-banner { 
            height: 200px; 
            background: linear-gradient(135deg, var(--primary), var(--bg-dark)); 
            display: flex; align-items: center; justify-content: center; 
            position: relative; overflow: hidden;
            background-size: cover; background-position: center;
        }
        .tournament-banner::before { 
            content: '🏆'; font-size: 5rem; opacity: 0.2; 
            transition: transform 0.5s;
        }
        .tournament-card:hover .tournament-banner::before { transform: scale(1.1) rotate(5deg); }
        
        .tournament-banner::after {
            content: '';
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to top, var(--bg-card), transparent);
        }

        .tournament-badge { 
            position: absolute; top: 15px; right: 15px; 
            background: linear-gradient(135deg, var(--accent), var(--accent-dark)); 
            color: var(--bg-dark); 
            padding: 6px 14px; border-radius: 20px; 
            font-size: 0.75rem; font-weight: 800; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 2;
        }
        
        .tournament-content { padding: 25px; position: relative; z-index: 2; }
        .tournament-content h3 { font-size: 1.4rem; font-weight: 800; color: var(--text-main); margin-bottom: 15px; line-height: 1.3; }
        .tournament-meta { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .tournament-meta-item { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 0.95rem; }
        .tournament-meta-item span:first-child { color: var(--accent); font-size: 1.1rem; }
        
        .tournament-footer { 
            display: flex; justify-content: space-between; align-items: center; 
            padding-top: 15px; border-top: 1px solid var(--border); 
        }
        .tournament-players { font-size: 0.9rem; color: var(--primary-light); font-weight: 600; }
        .tournament-link { 
            color: var(--accent); font-weight: bold; font-size: 0.95rem; 
            text-decoration: none; transition: all 0.3s; display: inline-flex; align-items: center; gap: 5px;
        }
        .tournament-link:hover { text-decoration: none; color: var(--accent-dark); transform: translateX(5px); }

        .loading, .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); grid-column: 1 / -1; }
        .empty .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.3; }
        .loading { font-size: 1.2rem; }
        .loading i { font-size: 3rem; color: var(--primary); animation: spin 1s linear infinite; display: block; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Footer */
        .footer { 
            background: var(--bg-card); 
            padding: 30px 50px; 
            color: var(--text-muted); 
            text-align: center; 
            border-top: 1px solid var(--border); 
            margin-top: 60px; 
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .header { padding: 15px 30px; }
            .hero { padding: 80px 30px; }
            .hero h1 { font-size: 2.8rem; }
            .container { padding: 50px 30px; }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 20px; flex-direction: column; gap: 15px; }
            .nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .nav a { padding: 6px 10px; font-size: 0.9rem; }
            .hero { padding: 60px 20px; }
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1.1rem; }
            .container { padding: 40px 20px; }
            .tournaments-grid { grid-template-columns: 1fr; }
            .tournament-footer { flex-direction: column; gap: 15px; align-items: flex-start; }
            .tournament-footer > div { width: 100%; display: flex; justify-content: space-between; }
        }

        @media (max-width: 480px) {
            .header { padding: 10px 15px; }
            .logo-text { font-size: 22px; }
            .hero { padding: 40px 15px; }
            .hero h1 { font-size: 1.8rem; }
            .container { padding: 30px 15px; }
            .btn-register { width: 100%; text-align: center; justify-content: center; }
        }

        @media (hover: none) and (pointer: coarse) {
            .btn:active, .tournament-card:active { transform: scale(0.98); }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="url(#logoGrad)" stroke="#FFB800" stroke-width="3"/>
                <text x="50" y="65" font-family="Arial Black, sans-serif" font-size="45" font-weight="900" fill="#FFB800" text-anchor="middle">T</text>
                <path d="M 20 75 Q 50 85 80 75" stroke="#FFB800" stroke-width="2" fill="none"/>
            </svg>
            <div class="logo-text">TopCompSports</div>
        </div>
        
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="tournaments.html" style="color: var(--accent);">Tournaments</a>
            
            <div id="userSection" class="user-section" style="display: none;">
                <a href="my-profile.html" style="color: var(--accent); text-decoration: none;">My Profile</a>
                <div class="user-info" onclick="window.location.href='my-profile.html'">
                    <div class="user-avatar" id="userAvatar"><span>👤</span></div>
                    <span class="user-name" id="userName">User</span>
                </div>
                <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
            </div>
            
            <a href="login.html" id="loginBtn" class="btn btn-login">Login</a>
            
            <div class="lang-switcher">
                <button class="lang-btn" onclick="changeLanguage('ar')" id="btn-ar">عربي</button>
                <button class="lang-btn active" onclick="changeLanguage('en')" id="btn-en">English</button>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>🏆 All Tournaments</h1>
        <p>Browse and register for upcoming competitions</p>
    </section>

    <div class="container">
        <div id="tournamentsGrid" class="tournaments-grid">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                Loading tournaments...
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 TopCompSports - All rights reserved</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('lang') || 'en';

        window.onload = async function() {
            checkUserStatus();
            await loadTournaments();
        };

        function checkUserStatus() {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    const userData = JSON.parse(storedUser);
                    document.getElementById('userSection').style.display = 'flex';
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('userName').textContent = userData.full_name || 'User';
                    if (userData.profile_picture_url) {
                        document.getElementById('userAvatar').innerHTML = `<img src="${userData.profile_picture_url}" alt="Profile">`;
                    }
                } catch (e) {
                    showLoginButton();
                }
            } else {
                showLoginButton();
            }
        }

        function showLoginButton() {
            document.getElementById('userSection').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'inline-block';
        }

        function changeLanguage(lang) {
            localStorage.setItem('lang', lang);
            currentLang = lang;
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            loadTournaments();
        }

        async function loadTournaments() {
            const grid = document.getElementById('tournamentsGrid');
            
            try {
                // جلب جميع البطولات المنشورة أو القادمة
                const { data: tournaments, error } = await dbClient
                    .from('tournaments')
                    .select('*')
                    .in('status', ['upcoming', 'published'])
                    .order('event_start_date', { ascending: true, nullsFirst: false });
                
                if (error) {
                    console.error('Error loading tournaments:', error);
                    throw error;
                }
                
                if (!tournaments || tournaments.length === 0) {
                    const msg = currentLang === 'ar' ? 'لا توجد بطولات حالياً' : 'No tournaments available yet';
                    grid.innerHTML = `
                        <div class="empty">
                            <div class="icon">🏆</div>
                            <p>${msg}</p>
                        </div>
                    `;
                    return;
                }
                
                // جلب عدد اللاعبين لكل بطولة
                const tournamentsWithStats = await Promise.all(
                    tournaments.map(async (t) => {
                        try {
                            const { count, error: countError } = await dbClient
                                .from('tournament_participants')
                                .select('*', { count: 'exact', head: true })
                                .eq('tournament_id', t.id);
                            
                            if (countError) {
                                console.error(`Error getting count for tournament ${t.id}:`, countError);
                                return { ...t, playerCount: 0 };
                            }
                            
                            return { ...t, playerCount: count || 0 };
                        } catch (e) {
                            console.error(`Error in count query for ${t.id}:`, e);
                            return { ...t, playerCount: 0 };
                        }
                    })
                );
                
                // عرض البطولات
                grid.innerHTML = tournamentsWithStats.map(t => {
                    const date = t.event_start_date || t.event_date || t.tournament_date;
                    const endDate = t.event_end_date;
                    
                    let formattedDate;
                    if (date) {
                        const dateObj = new Date(date);
                        if (!isNaN(dateObj.getTime())) {
                            const lang = currentLang === 'ar' ? 'ar-SA' : 'en-US';
                            const options = { year: 'numeric', month: 'long', day: 'numeric' };
                            
                            if (endDate && endDate !== date) {
                                const endObj = new Date(endDate);
                                if (!isNaN(endObj.getTime())) {
                                    formattedDate = `${dateObj.toLocaleDateString(lang, options)} - ${endObj.toLocaleDateString(lang, options)}`;
                                } else {
                                    formattedDate = dateObj.toLocaleDateString(lang, options);
                                }
                            } else {
                                formattedDate = dateObj.toLocaleDateString(lang, options);
                            }
                        } else {
                            formattedDate = currentLang === 'ar' ? 'تاريخ غير محدد' : 'Date TBD';
                        }
                    } else {
                        formattedDate = currentLang === 'ar' ? 'تاريخ غير محدد' : 'Date TBD';
                    }
                    
                    const location = t.location || (currentLang === 'ar' ? 'سيتم الإعلان عنه' : 'To be announced');
                    const playerText = t.playerCount === 1 
                        ? (currentLang === 'ar' ? 'لاعب واحد مسجل' : '1 player registered')
                        : `${t.playerCount} ${currentLang === 'ar' ? 'لاعبين مسجلين' : 'players registered'}`;
                    
                    const badgeText = currentLang === 'ar' ? 'قادم' : 'UPCOMING';
                    const registerText = currentLang === 'ar' ? 'سجل الآن' : 'Register Now';
                    const detailsText = currentLang === 'ar' ? 'التفاصيل' : 'View Details';
                    
                    // صورة البانر
                    const bannerImage = t.image_url || '';
                    const bannerStyle = bannerImage 
                        ? `background-image: url('${bannerImage}'); background-size: cover; background-position: center;`
                        : '';
                    
                    return `
                        <div class="tournament-card" onclick="window.location.href='tournament-details.html?tournament_id=${t.id}'">
                            <div class="tournament-banner" style="${bannerStyle}">
                                <span class="tournament-badge">${badgeText}</span>
                            </div>
                            <div class="tournament-content">
                                <h3>${t.name || (currentLang === 'ar' ? 'بطولة بدون اسم' : 'Unnamed Tournament')}</h3>
                                <div class="tournament-meta">
                                    <div class="tournament-meta-item">
                                        <span>📅</span>
                                        <span>${formattedDate}</span>
                                    </div>
                                    <div class="tournament-meta-item">
                                        <span>📍</span>
                                        <span>${location}</span>
                                    </div>
                                    ${t.registration_fee > 0 ? `
                                    <div class="tournament-meta-item">
                                        <span>💰</span>
                                        <span>${t.registration_fee} ${currentLang === 'ar' ? 'دولار' : 'USD'}</span>
                                    </div>
                                    ` : ''}
                                </div>
                                <div class="tournament-footer">
                                    <span class="tournament-players">${playerText}</span>
                                    <div style="display: flex; gap: 10px; width: 100%; justify-content: flex-end;">
                                        <a href="tournament-details.html?tournament_id=${t.id}" class="tournament-link" onclick="event.stopPropagation();">${detailsText} →</a>
                                        <button class="btn btn-register" onclick="event.stopPropagation(); window.location.href='tournament-details.html?tournament_id=${t.id}'">${registerText}</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('Error in loadTournaments:', error);
                const errorMsg = currentLang === 'ar' ? 'خطأ في تحميل البطولات' : 'Error loading tournaments';
                grid.innerHTML = `
                    <div class="empty">
                        <div class="icon">❌</div>
                        <p>${errorMsg}</p>
                    </div>
                `;
            }
        }

        async function handleLogout() {
            await dbClient.auth.signOut();
            localStorage.removeItem('currentUser');
            showLoginButton();
            window.location.reload();
        }
    </script>
</body>
</html>
