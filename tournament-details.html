<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #151d2b;
            --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB;
            --accent: #f1c40f;
            --accent-dark: #d4a017;
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        img { max-width: 100%; height: auto; }

        /* Header */
        .header { 
            background: var(--bg-card); 
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--primary); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-svg { width: 50px; height: 50px; }
        .logo-text { font-size: 28px; font-weight: bold; color: var(--primary); }
        .nav { display: flex; gap: 30px; align-items: center; }
        .nav a { color: var(--text-muted); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; font-weight: 600; }
        .nav a:hover { color: var(--accent); }

        .user-section { display: flex; align-items: center; gap: 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 2px solid var(--accent); 
            background: var(--bg-input); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-weight: 600; color: var(--accent); }
        
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 0.95rem; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-logout { 
            background: transparent; 
            border: 2px solid var(--text-main); 
            color: var(--text-main); 
        }
        .btn-logout:hover { 
            background: var(--text-main); 
            color: var(--bg-dark); 
        }
        .btn-login { 
            background: var(--primary); 
            color: var(--text-main); 
        }
        .btn-login:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(37,99,235,0.4); 
        }
        .btn-register { 
            background: var(--accent); 
            color: var(--bg-dark); 
            padding: 12px 30px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 1rem; 
        }
        .btn-register:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 20px rgba(241,196,15,0.4); 
        }
        .btn-secondary { 
            background: transparent; 
            color: var(--text-main); 
            border: 2px solid var(--text-main); 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s; 
        }
        .btn-secondary:hover { 
            background: var(--text-main); 
            color: var(--bg-dark); 
        }

        .lang-switcher { 
            display: flex; 
            gap: 5px; 
            background: var(--bg-input); 
            padding: 5px; 
            border-radius: 8px; 
        }
        .lang-btn { 
            padding: 8px 15px; 
            border: none; 
            background: transparent; 
            color: var(--text-muted); 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
        }
        .lang-btn.active { 
            background: var(--primary); 
            color: var(--text-main); 
        }

        /* Tournament Header */
        .tournament-header { 
            background: var(--bg-card); 
            padding: 30px 50px; 
            border-bottom: 3px solid var(--primary); 
        }
        .tournament-header-content { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        .tournament-title-section { 
            display: flex; 
            align-items: center; 
            gap: 20px; 
        }
        .tournament-logo { 
            width: 80px; 
            height: 80px; 
            border-radius: 12px; 
            overflow: hidden; 
            background: var(--bg-input); 
        }
        .tournament-logo img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .tournament-title h1 { 
            color: var(--text-main); 
            font-size: 2rem; 
            font-weight: 900; 
            margin-bottom: 5px; 
        }
        .tournament-title p { 
            color: var(--text-muted); 
            font-size: 1rem; 
        }
        .tournament-actions { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
        }

        /* Tabs */
        .tabs-container { 
            background: var(--bg-card); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            position: sticky; 
            top: 73px; 
            z-index: 999; 
        }
        .tabs { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            gap: 5px; 
            padding: 0 50px; 
            overflow-x: auto; 
        }
        .tab { 
            padding: 15px 25px; 
            color: var(--text-muted); 
            font-weight: 600; 
            border-bottom: 3px solid transparent; 
            transition: all 0.3s; 
            white-space: nowrap; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            background: transparent;
            border: none;
            font-size: 1rem;
        }
        .tab:hover { 
            color: var(--text-main); 
        }
        .tab.active { 
            color: var(--accent); 
            border-bottom-color: var(--accent); 
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Banner */
        .banner { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 50px; 
        }
        .banner-image { 
            width: 100%; 
            height: 400px; 
            border-radius: 15px; 
            overflow: hidden; 
            background: linear-gradient(135deg, var(--primary), var(--bg-card)); 
            position: relative; 
        }
        .banner-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Main Content */
        .main-content { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 50px 60px; 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 40px; 
        }

        /* Info Section */
        .info-section { 
            background: var(--bg-card); 
            border-radius: 15px; 
            padding: 40px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .info-section h2 { 
            font-size: 1.8rem; 
            font-weight: 900; 
            color: var(--accent); 
            margin-bottom: 20px; 
            padding-bottom: 15px; 
            border-bottom: 2px solid rgba(255,255,255,0.1); 
        }
        .info-section h3 { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin: 25px 0 15px; 
        }
        .info-section p { 
            color: var(--text-muted); 
            line-height: 1.8; 
            margin-bottom: 15px; 
        }
        .info-meta { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin: 20px 0; 
        }
        .info-meta-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            color: var(--text-muted); 
            font-size: 1rem; 
        }
        .info-meta-item strong { 
            color: var(--text-main); 
        }

        /* Sidebar */
        .sidebar { 
            display: flex; 
            flex-direction: column; 
            gap: 25px; 
        }
        .sidebar-card { 
            background: var(--bg-card); 
            border-radius: 15px; 
            padding: 25px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .sidebar-card h3 { 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin-bottom: 20px; 
            padding-bottom: 12px; 
            border-bottom: 2px solid rgba(255,255,255,0.1); 
        }

        /* Entries List */
        .entries-list { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .entry-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px; 
            background: var(--bg-input); 
            border-radius: 10px; 
            transition: all 0.3s; 
            border-left: 4px solid var(--primary); 
        }
        .entry-item:hover { 
            transform: translateX(5px); 
            box-shadow: 0 4px 12px rgba(37,99,235,0.2); 
        }
        .entry-item.disabled { 
            opacity: 0.5; 
            border-left-color: #666; 
        }
        .entry-info { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }
        .entry-name { 
            font-weight: 700; 
            color: var(--text-main); 
            font-size: 1rem; 
        }
        .entry-details { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
        }
        .entry-price { 
            color: var(--primary); 
            font-weight: 700; 
            font-size: 1.1rem; 
            white-space: nowrap; 
        }
        .entry-price.free { 
            color: var(--success); 
        }

        /* Registration Dates */
        .registration-dates { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .reg-date-item { 
            padding: 15px; 
            background: var(--bg-input); 
            border-radius: 10px; 
            border-left: 4px solid var(--primary); 
        }
        .reg-date-item.late { 
            border-left-color: var(--accent); 
        }
        .reg-date-item h4 { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            margin-bottom: 5px; 
        }
        .reg-date-item p { 
            font-size: 1rem; 
            color: var(--text-main); 
            font-weight: 700; 
        }

        /* Location */
        .location-card { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .location-address { 
            color: var(--text-muted); 
            line-height: 1.6; 
        }
        .location-map { 
            width: 100%; 
            height: 200px; 
            background: var(--bg-input); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            cursor: pointer; 
            transition: all 0.3s; 
            border: 2px solid rgba(255,255,255,0.1);
        }
        .location-map:hover { 
            background: var(--primary); 
            color: var(--text-main); 
        }

        /* Organizer */
        .organizer-card { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .organizer-name { 
            font-weight: 700; 
            color: var(--text-main); 
            font-size: 1.1rem; 
        }
        .organizer-info { 
            color: var(--text-muted); 
            font-size: 0.9rem; 
        }
        .contact-links { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: 15px; 
        }
        .contact-link { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            color: var(--primary); 
            text-decoration: none; 
            padding: 10px; 
            background: var(--bg-input); 
            border-radius: 8px; 
            transition: all 0.3s; 
        }
        .contact-link:hover { 
            background: var(--primary); 
            color: var(--bg-dark); 
        }

        /* Payment Badge */
        .payment-badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 600; 
        }
        .payment-badge.cash { 
            background: rgba(241,196,15,0.2); 
            color: var(--accent); 
        }
        .payment-badge.online { 
            background: rgba(16,185,129,0.2); 
            color: var(--success); 
        }
        .payment-badge.disabled { 
            background: rgba(239,68,68,0.2); 
            color: var(--danger); 
        }

        /* Athletes List */
        .athletes-list {
            display: grid;
            gap: 15px;
        }
        .athlete-card {
            background: var(--bg-input);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .athlete-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid var(--accent);
        }
        .athlete-info {
            flex: 1;
        }
        .athlete-name {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.1rem;
        }
        .athlete-details {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Brackets */
        .brackets-container {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 400px;
        }
        .bracket-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .bracket-message .icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Matches */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .match-card {
            background: var(--bg-input);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .match-time {
            color: var(--accent);
            font-weight: 600;
        }
        .match-competitors {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }
        .competitor {
            flex: 1;
            text-align: center;
            padding: 15px;
            background: var(--bg-card);
            border-radius: 8px;
        }
        .competitor-name {
            font-weight: 700;
            color: var(--text-main);
        }
        .vs {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Schedule */
        .schedule-timeline {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .schedule-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: var(--bg-input);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }
        .schedule-time {
            min-width: 120px;
            font-weight: 700;
            color: var(--accent);
        }
        .schedule-content {
            flex: 1;
        }
        .schedule-title {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        .schedule-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Results */
        .results-grid {
            display: grid;
            gap: 20px;
        }
        .result-card {
            background: var(--bg-input);
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid var(--success);
        }
        .result-division {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 15px;
        }
        .result-podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-top: 20px;
        }
        .podium-place {
            text-align: center;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 8px;
            min-width: 150px;
        }
        .podium-place.first {
            order: 2;
            border-top: 4px solid var(--accent);
            transform: translateY(-20px);
        }
        .podium-place.second {
            order: 1;
            border-top: 4px solid #94a3b8;
        }
        .podium-place.third {
            order: 3;
            border-top: 4px solid #b45309;
        }
        .podium-name {
            font-weight: 700;
            color: var(--text-main);
            margin-top: 10px;
        }
        .podium-rank {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
        }

        /* Loading & Empty */
        .loading { 
            text-align: center; 
            padding: 60px 20px; 
            color: var(--text-muted); 
            font-size: 1.2rem; 
        }
        .empty-state { 
            text-align: center; 
            padding: 60px 20px; 
            color: var(--text-muted); 
        }
        .empty-state .icon { 
            font-size: 5rem; 
            margin-bottom: 20px; 
            opacity: 0.5; 
        }

        /* Footer */
        .footer { 
            background: var(--bg-card); 
            padding: 30px 50px; 
            color: var(--text-muted); 
            text-align: center; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            margin-top: 60px; 
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .header { padding: 15px 30px; }
            .tournament-header { padding: 30px 30px; }
            .tabs { padding: 0 30px; }
            .banner { padding: 0 30px; }
            .main-content { padding: 0 30px 60px; grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 20px; flex-direction: column; gap: 15px; }
            .nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .tournament-header { padding: 20px; }
            .tournament-title-section { flex-direction: column; align-items: flex-start; }
            .tournament-title h1 { font-size: 1.5rem; }
            .tabs { padding: 0 20px; overflow-x: auto; }
            .banner { padding: 0 20px; }
            .banner-image { height: 250px; }
            .main-content { padding: 0 20px 40px; }
            .info-section { padding: 25px; }
            .match-competitors { flex-direction: column; }
            .result-podium { flex-direction: column; align-items: center; }
            .podium-place.first { order: 1; transform: none; }
            .podium-place.second { order: 2; }
            .podium-place.third { order: 3; }
        }

        @media (max-width: 480px) {
            .header { padding: 10px 15px; }
            .logo-text { font-size: 22px; }
            .tournament-header { padding: 15px; }
            .tournament-title h1 { font-size: 1.3rem; }
            .tournament-actions { flex-direction: column; width: 100%; }
            .tournament-actions .btn { width: 100%; text-align: center; }
            .tabs { padding: 0 15px; }
            .banner { padding: 0 15px; }
            .main-content { padding: 0 15px 30px; }
            .info-section { padding: 20px; }
            .sidebar-card { padding: 20px; }
            .entry-item { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>

            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>

            </svg>
            <div class="logo-text">TopCompSports</div>
        </div>
        
        <nav class="nav">
            <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a>
            <a href="tournaments.html" data-en="Tournaments" data-ar="البطولات">Tournaments</a>
            
            <div id="userSection" class="user-section" style="display: none;">

            <a href="login.html" id="loginBtn" class="btn btn-login" data-en="Login" data-ar="تسجيل الدخول">Login</a>

    </header>

        function formatDate(dateStr) {
            if (!dateStr) return currentLang === 'ar' ? 'غير محدد' : 'TBD';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return currentLang === 'ar' ? 'غير محدد' : 'TBD';
            return date.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', { 
                year: 'numeric', month: 'long', day: 'numeric' 
            });
        }

        function formatTime(timeStr) {
            if (!timeStr) return '--:--';
            const date = new Date(timeStr);
            return date.toLocaleTimeString(currentLang === 'ar' ? 'ar-SA' : 'en-US', {

            // Update active content
            document.querySelectorAll('.tab-content').forEach(content => {

                // 2. Get participant count
                const { count: participantCount } = await dbClient
                    .from('tournament_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('tournament_id', tournamentId);

                // 3. Get active and visible divisions
                const { data: divisions } = await dbClient
                    .from('tournament_divisions')
                    .select('*')

                    .eq('is_active', true)

                // 4. Get payment settings
                const { data: paymentSettings } = await dbClient
                    .from('tournament_payment_settings')

                        .from('organizers')

        async function loadAthletes() {

                const { data: participants, error } = await dbClient
                    .from('tournament_participants')
                    .select(`
                        *,
                        athletes (
                            id,
                            full_name,
                            date_of_birth,
                            gender,
                            country,
                            city,
                            belt_level,
                            profile_photo_url
                        )
                    `)
                    .eq('tournament_id', tournamentId);

                const athletesList = document.getElementById('athletesList');
                
                if (error || !participants || participants.length === 0) {
                    athletesList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"></div>
                            <p data-en="No athletes registered yet" data-ar="لا يوجد لاعبين مسجلين بعد">No athletes registered yet</p>
                        </div>
                    `;
                    return;
                }

                athletesList.innerHTML = participants.map(p => {
                    const athlete = p.athletes;
                    const name = athlete?.full_name || (currentLang === 'ar' ? 'غير معروف' : 'Unknown');
                    const belt = athlete?.belt_level || '-';
                    const country = athlete?.country || '-';
                    const avatar = athlete?.profile_photo_url 
                        ? `<img src="${athlete.profile_photo_url}" alt="${name}">`
                        : '👤';

                    return `
                        <div class="athlete-card">

                                <div class="athlete-details">

                                    ${country ? `<span> • 📍 ${country}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading athletes:', error);
                document.getElementById('athletesList').innerHTML = `

        }

                            ${currentLang === 'ar' ? `عدد المجموعات: ${brackets.length}` : `Total Brackets: ${brackets.length}`}
                        </p>
                        <div style="display: grid; gap: 20px; margin-top: 30px;">
                            ${brackets.map(b => `
                                <div style="background: var(--bg-input); padding: 20px; border-radius: 10px;">
                                    <strong style="color: var(--accent);">${b.division_name || b.bracket_name || '-'}</strong>
                                    <p style="color: var(--text-muted); margin-top: 10px;">
                                        ${currentLang === 'ar' ? 'الحالة: ' : 'Status: '} 
                                        <span style="color: var(--success);">${b.status || 'Active'}</span>
                                    </p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading brackets:', error);
                document.getElementById('bracketsContent').innerHTML = `
                    <div class="bracket-message">
                        <p data-en="Error loading brackets" data-ar="خطأ في تحميل المجموعات">Error loading brackets</p>
                    </div>
                `;
            }
        }

        // Load Matches
        async function loadMatches() {
            try {
                const { data: matches, error } = await dbClient
                    .from('tournament_matches')
                    .select(`
                        *,
                        competitor1:competitor1_id (
                            athlete_id,
                            athletes (full_name, country)
                        ),
                        competitor2:competitor2_id (
                            athlete_id,
                            athletes (full_name, country)
                        )
                    `)
                    .eq('tournament_id', tournamentId)
                    .order('scheduled_time', { ascending: true });

                const matchesList = document.getElementById('matchesList');
                
                if (error || !matches || matches.length === 0) {
                    matchesList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚔️</div>
                            <p data-en="No matches scheduled yet" data-ar="لا توجد مباريات مجدولة بعد">No matches scheduled yet</p>
                        </div>
                    `;
                    return;
                }

                matchesList.innerHTML = matches.map(match => {
                    const comp1 = match.competitor1?.athletes?.full_name || (currentLang === 'ar' ? 'منافس 1' : 'Competitor 1');
                    const comp2 = match.competitor2?.athletes?.full_name || (currentLang === 'ar' ? 'منافس 2' : 'Competitor 2');
                    const time = formatTime(match.scheduled_time);
                    const division = match.division_name || '-';

                    return `
                        <div class="match-card">
                            <div class="match-header">
                                <span style="color: var(--text-muted);">${division}</span>
                                <span class="match-time">🕐 ${time}</span>
                            </div>
                            <div class="match-competitors">
                                <div class="competitor">
                                    <div class="competitor-name">${comp1}</div>
                                </div>
                                <div class="vs">VS</div>
                                <div class="competitor">
                                    <div class="competitor-name">${comp2}</div>
                                </div>
                            </div>
                            ${match.winner_id ? `
                                <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
                                    <span style="color: var(--success); font-weight: 700;">
                                        ${currentLang === 'ar' ? 'الفائز: ' : 'Winner: '} ${match.winner_id === match.competitor1_id ? comp1 : comp2}
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading matches:', error);
                document.getElementById('matchesList').innerHTML = `
                    <div class="empty-state">
                        <p data-en="Error loading matches" data-ar="خطأ في تحميل المباريات">Error loading matches</p>
                    </div>
                `;
            }
        }

        // Load Schedule
        async function loadSchedule() {
            try {
                const { data: schedule, error } = await dbClient
                    .from('tournament_schedule')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .order('start_time', { ascending: true });

                const scheduleList = document.getElementById('scheduleList');
                
                if (error || !schedule || schedule.length === 0) {
                    // Fallback: Use matches as schedule
                    const { data: matches } = await dbClient
                        .from('tournament_matches')
                        .select('division_name, scheduled_time')
                        .eq('tournament_id', tournamentId)
                        .order('scheduled_time', { ascending: true });

                    if (matches && matches.length > 0) {
                        scheduleList.innerHTML = matches.map((item, index) => `
                            <div class="schedule-item">
                                <div class="schedule-time">${formatTime(item.scheduled_time)}</div>
                                <div class="schedule-content">
                                    <div class="schedule-title">${item.division_name || (currentLang === 'ar' ? 'مباراة' : 'Match')} ${index + 1}</div>
                                    <div class="schedule-desc">${currentLang === 'ar' ? 'مباراة بطولة' : 'Tournament Match'}</div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        scheduleList.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">📅</div>
                                <p data-en="No schedule available yet" data-ar="لا يوجد جدول متاح بعد">No schedule available yet</p>
                            </div>
                        `;
                    }
                    return;
                }

                scheduleList.innerHTML = schedule.map(item => `
                    <div class="schedule-item">
                        <div class="schedule-time">${formatTime(item.start_time)}</div>
                        <div class="schedule-content">
                            <div class="schedule-title">${item.title || item.event_name || '-'}</div>
                            <div class="schedule-desc">${item.description || ''}</div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('scheduleList').innerHTML = `
                    <div class="empty-state">
                        <p data-en="Error loading schedule" data-ar="خطأ في تحميل الجدول">Error loading schedule</p>
                    </div>
                `;
            }
        }

        // Load Results
        async function loadResults() {
            try {
                const { data: results, error } = await dbClient
                    .from('tournament_results')
                    .select(`
                        *,
                        winner:winner_id (
                            athlete_id,
                            athletes (full_name, country)
                        )
                    `)
                    .eq('tournament_id', tournamentId);

                const resultsList = document.getElementById('resultsList');
                
                if (error || !results || results.length === 0) {
                    resultsList.innerHTML = `
                        <div class="bracket-message">
                            <div class="icon"></div>
                            <h3 data-en="Results Not Available Yet" data-ar="النتائج غير متاحة بعد">Results Not Available Yet</h3>
                            <p data-en="Results will be posted after the tournament ends." data-ar="سيتم نشر النتائج بعد انتهاء البطولة.">Results will be posted after the tournament ends.</p>
                        </div>
                    `;
                    return;
                }

                // Group by division
                const byDivision = {};
                results.forEach(r => {
                    const div = r.division_name || (currentLang === 'ar' ? 'قسم' : 'Division');
                    if (!byDivision[div]) byDivision[div] = [];
                    byDivision[div].push(r);
                });

                resultsList.innerHTML = Object.keys(byDivision).map(div => `
                    <div class="result-card">
                        <div class="result-division">${div}</div>
                        <div class="result-podium">
                            ${byDivision[div].slice(0, 3).map((r, index) => {
                                const ranks = ['2', '1', '3'];
                                const classes = ['second', 'first', 'third'];
                                const athlete = r.winner?.athletes?.full_name || (currentLang === 'ar' ? 'غير معروف' : 'Unknown');
                                
                                return `
                                    <div class="podium-place ${classes[index]}">
                                        <div class="podium-rank">${ranks[index]}</div>
                                        <div class="podium-name">${athlete}</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading results:', error);
                document.getElementById('resultsList').innerHTML = `
                    <div class="bracket-message">
                        <p data-en="Error loading results" data-ar="خطأ في تحميل النتائج">Error loading results</p>
                    </div>
                `;
            }
        }

        async function handleLogout() {
            await dbClient.auth.signOut();
            localStorage.removeItem('currentUser');
            showLoginButton();
            window.location.reload();
        }
    </script>
</body>
</html>
