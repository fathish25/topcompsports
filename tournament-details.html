<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: #151d2b;
            --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB;
            --accent: #f1c40f;
            --accent-dark: #d4a017;
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Header */
        .header { 
            background: var(--bg-card); 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--primary); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; text-decoration: none; color: var(--text-main); }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: var(--bg-dark); }
        .logo-text { font-size: 22px; font-weight: bold; }
        
        .nav { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .nav a { color: var(--text-muted); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; font-weight: 600; }
        .nav a:hover { color: var(--accent); }

        .lang-switcher { display: flex; gap: 8px; background: var(--bg-input); padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .lang-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: var(--text-main);
        }

        /* Tournament Banner */
        .tournament-banner {
            position: relative;
            width: 100%;
            height: 350px;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-card), var(--primary));
        }
        .tournament-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .tournament-banner-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10,14,23,0.95), transparent);
            padding: 40px;
        }
        .tournament-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: var(--bg-card);
            padding: 0 30px;
            display: flex;
            gap: 0;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            overflow-x: auto;
            position: sticky;
            top: 73px;
            z-index: 999;
        }
        .nav-tab {
            padding: 15px 25px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            background: transparent;
            border: none;
            font-size: 1rem;
        }
        .nav-tab:hover { color: var(--text-main); }
        .nav-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .tab-badge {
            background: var(--accent);
            color: var(--bg-dark);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 30px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        /* Main Content */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .content-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Info Grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .info-card {
            background: var(--bg-input);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }

        .info-icon {
            width: 45px;
            height: 45px;
            background: rgba(37,99,235,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .info-content {
            flex: 1;
        }

        .info-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Description Sections */
        .description-section {
            background: var(--bg-input);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .description-section h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-main);
            font-weight: 600;
        }

        .description-section p, .description-section ul {
            color: var(--text-muted);
            line-height: 1.8;
        }

        .description-section ul {
            padding-left: 20px;
        }

        .description-section li {
            margin-bottom: 8px;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-main);
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .btn {
            padding: 14px 25px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: var(--text-main);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(37,99,235,0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            color: var(--text-main);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16,185,129,0.4);
        }

        .registration-info {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 8px;
        }

        .spots-available {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .spots-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .location-info {
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .organizer-info {
            color: var(--text-muted);
        }

        /* Payment Badge */
        .payment-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: rgba(241, 196, 15, 0.2);
            color: var(--accent);
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Divisions Table */
        .divisions-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .divisions-table th,
        .divisions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .divisions-table th {
            background: rgba(241, 196, 15, 0.1);
            color: var(--accent);
            font-weight: 600;
        }

        .divisions-table tr:hover {
            background: rgba(255,255,255,0.03);
        }

        /* Loading & Error */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
            color: var(--primary);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
                padding: 20px 15px;
            }
            .sidebar {
                order: 2;
            }
            .tournament-banner {
                height: 250px;
            }
            .tournament-title {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .logo-text {
                font-size: 18px;
            }
            .nav {
                display: none;
            }
            .tournament-banner {
                height: 200px;
            }
            .tournament-banner-overlay {
                padding: 20px;
            }
            .tournament-title {
                font-size: 1.5rem;
            }
            .nav-tabs {
                padding: 0 15px;
                top: 65px;
            }
            .nav-tab {
                padding: 12px 15px;
                font-size: 0.9rem;
            }
            .content-section {
                padding: 20px;
            }
            .info-grid {
                grid-template-columns: 1fr;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .divisions-table {
                font-size: 0.9rem;
            }
            .divisions-table th,
            .divisions-table td {
                padding: 8px;
            }
        }

        @media (max-width: 480px) {
            .tournament-banner {
                height: 180px;
            }
            .tournament-title {
                font-size: 1.3rem;
            }
            .info-card {
                padding: 15px;
            }
            .info-icon {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </a>
        <nav class="nav">
            <a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a>
            <a href="tournaments.html" data-en="Tournaments" data-ar="البطولات">Tournaments</a>
            <a href="athlete-dashboard.html" data-en="My Profile" data-ar="ملفي">My Profile</a>
            <a href="#" onclick="logout()" data-en="Logout" data-ar="تسجيل الخروج">Logout</a>
        </nav>
        <div class="lang-switcher">
            <button class="lang-btn active" id="btnEn" onclick="setLang('en')">English</button>
            <button class="lang-btn" id="btnAr" onclick="setLang('ar')">عربي</button>
        </div>
    </header>

    <div class="tournament-banner" id="tournamentBanner">
        <img src="" alt="Tournament" id="bannerImage" style="display: none;">
        <div class="tournament-banner-overlay">
            <h1 class="tournament-title" id="tournamentName">Loading...</h1>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('information')">
            <i class="fas fa-clipboard-list"></i>
            <span data-en="Information" data-ar="المعلومات">Information</span>
        </button>
        <button class="nav-tab" onclick="switchTab('divisions')">
            <i class="fas fa-trophy"></i>
            <span data-en="Divisions" data-ar="الأقسام">Divisions</span>
        </button>
        <button class="nav-tab" onclick="switchTab('schedule')">
            <i class="fas fa-calendar-alt"></i>
            <span data-en="Schedule" data-ar="الجدول">Schedule</span>
        </button>
    </div>

    <div class="container">
        <div class="main-content" id="tabContent">
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p data-en="Loading tournament details..." data-ar="جاري تحميل تفاصيل البطولة...">Loading tournament details...</p>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-card">
                <h3 class="sidebar-title" data-en="Registration" data-ar="التسجيل">Registration</h3>
                <button class="btn btn-success" id="registerBtn" onclick="registerForTournament()" style="margin-bottom: 15px;">
                    <i class="fas fa-user-plus"></i>
                    <span data-en="Register Now" data-ar="سجل الآن">Register Now</span>
                </button>
                <div class="registration-info">
                    <div class="spots-available" data-en="Spots available:" data-ar="الأماكن المتاحة:">Spots available:</div>
                    <div class="spots-number" id="availableSpots">-</div>
                </div>
            </div>

            <div class="sidebar-card">
                <h3 class="sidebar-title" data-en="Location" data-ar="الموقع">Location</h3>
                <div class="location-info" id="locationText">-</div>
                <button class="btn btn-primary" onclick="viewMap()">
                    <i class="fas fa-map-marker-alt"></i>
                    <span data-en="View on Map" data-ar="عرض على الخريطة">View on Map</span>
                </button>
            </div>

            <div class="sidebar-card">
                <h3 class="sidebar-title" data-en="Organizer" data-ar="المنظم">Organizer</h3>
                <div class="organizer-info" id="organizerInfo">
                    <p data-en="Loading..." data-ar="جاري التحميل...">Loading...</p>
                </div>
            </div>

            <div class="sidebar-card">
                <h3 class="sidebar-title" data-en="Important Dates" data-ar="التواريخ المهمة">Important Dates</h3>
                <div id="importantDates">
                    <p data-en="Loading..." data-ar="جاري التحميل...">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('lang') || 'en';
        let tournamentId = null;
        let tournamentData = null;
        let divisionsData = [];
        let paymentData = null;

        // Language System
        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            
            document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
            });
            
            if (tournamentData) {
                renderTournamentDetails();
            }
        }

        window.onload = async () => {
            setLang(currentLang);
            
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                showError('Tournament ID not found');
                return;
            }
            
            await loadTournamentDetails();
        };

        async function loadTournamentDetails() {
            try {
                // Load tournament data
                const { data: tournament, error: tournamentError } = await dbClient
                    .from('tournaments')
                    .select('*')
                    .eq('id', tournamentId)
                    .single();

                if (tournamentError || !tournament) {
                    showError(currentLang === 'ar' ? 'البطولة غير موجودة' : 'Tournament not found');
                    return;
                }

                tournamentData = tournament;

                // Load divisions
                const { data: divisions, error: divisionsError } = await dbClient
                    .from('tournament_divisions')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .order('sort_order');

                if (!divisionsError && divisions) {
                    divisionsData = divisions;
                }

                // Load payment settings
                const { data: payment, error: paymentError } = await dbClient
                    .from('tournament_payment_settings')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .single();

                if (!paymentError && payment) {
                    paymentData = payment;
                }

                // Load organizer info
                await loadOrganizerInfo();

                renderTournamentDetails();

            } catch (error) {
                console.error('Error loading tournament:', error);
                showError(currentLang === 'ar' ? 'خطأ في تحميل البيانات' : 'Error loading data');
            }
        }

        async function loadOrganizerInfo() {
            if (!tournamentData || !tournamentData.organizer_id) return;

            try {
                const { data: organizer } = await dbClient
                    .from('organizers')
                    .select('full_name, email, organization_name')
                    .eq('id', tournamentData.organizer_id)
                    .single();

                if (organizer) {
                    const organizerHtml = `
                        <div style="margin-bottom: 10px;">
                            <div style="font-weight: 600; color: var(--text-main); margin-bottom: 5px;">
                                ${organizer.full_name || organizer.organization_name || 'Unknown'}
                            </div>
                            <div style="font-size: 0.9rem; color: var(--text-muted);">
                                ${organizer.email || ''}
                            </div>
                        </div>
                        <button class="btn btn-primary" onclick="contactOrganizer()" style="margin-top: 10px;">
                            <i class="fas fa-envelope"></i>
                            <span data-en="Contact" data-ar="تواصل">Contact</span>
                        </button>
                    `;
                    document.getElementById('organizerInfo').innerHTML = organizerHtml;
                }
            } catch (error) {
                console.error('Error loading organizer:', error);
            }
        }

        function renderTournamentDetails() {
            if (!tournamentData) return;

            // Update banner
            document.getElementById('tournamentName').textContent = tournamentData.name || 'Tournament';
            
            if (tournamentData.image_url) {
                const bannerImg = document.getElementById('bannerImage');
                bannerImg.src = tournamentData.image_url;
                bannerImg.style.display = 'block';
            }

            // Format dates
            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                try {
                    return new Date(dateStr).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                } catch {
                    return dateStr;
                }
            };

            const dateStr = formatDate(tournamentData.event_start_date || tournamentData.event_date);
            const locationText = tournamentData.location || '-';
            const participants = `${tournamentData.current_participants || 0} / ${tournamentData.max_participants || '∞'}`;
            const availableSpots = tournamentData.max_participants ? 
                tournamentData.max_participants - (tournamentData.current_participants || 0) : 'Unlimited';

            // Render information tab content
            const content = document.getElementById('tabContent');
            content.innerHTML = `
                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-info-circle"></i>
                        <span data-en="Tournament Information" data-ar="معلومات البطولة">Tournament Information</span>
                    </h2>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <div class="info-icon">
                                <i class="fas fa-calendar"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label" data-en="Date" data-ar="التاريخ">Date</div>
                                <div class="info-value">${dateStr}</div>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label" data-en="Location" data-ar="الموقع">Location</div>
                                <div class="info-value">${locationText}</div>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i class="fas fa-users"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label" data-en="Participants" data-ar="المشاركون">Participants</div>
                                <div class="info-value">${participants}</div>
                            </div>
                        </div>
                        <div class="info-card">
                            <div class="info-icon">
                                <i class="fas fa-credit-card"></i>
                            </div>
                            <div class="info-content">
                                <div class="info-label" data-en="Payment" data-ar="الدفع">Payment</div>
                                <div class="info-value">
                                    <span class="payment-badge">
                                        <i class="fas fa-money-bill-wave"></i>
                                        ${currentLang === 'ar' ? 'نقدي فقط' : 'Cash Payment Only'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-align-left"></i>
                        <span data-en="About This Tournament" data-ar="عن هذه البطولة">About This Tournament</span>
                    </h2>
                    <div class="description-section">
                        <p>${tournamentData.description || (currentLang === 'ar' ? 'لا يوجد وصف' : 'No description available')}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-clipboard-list"></i>
                        <span data-en="Registration Information" data-ar="معلومات التسجيل">Registration Information</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'هذا التسجيل مسبق فقط. لا نقبل التسجيلات بعد الموعد النهائي أو في يوم البطولة!' : 
                            'This tournament is pre-registration only. We do not take registrations after the deadline or registrations at the event!'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-book"></i>
                        <span data-en="Rules and Policies" data-ar="القواعد والسياسات">Rules and Policies</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'بالتسجيل في هذه البطولة، أنت تؤكد أنك قد راجعت معلومات الحدث بدقة وأنك توافق على الالتزام بجميع القواعد والسياسات.' : 
                            'By registering for this tournament, you confirm that you have thoroughly reviewed the event information and that you agree to comply with all rules and policies.'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-trophy"></i>
                        <span data-en="Format" data-ar="النظام">Format</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'تقدم البطولة لكل منافس مباريات متعددة لكل قسم بغض النظر عن الفوز والخسارة. يمكن للمتنافسين الحصول على ما يصل إلى 4 إلى 6 مباريات لكل قسم!' : 
                            'The tournament offers every competitor multiple matches per division regardless of wins and losses. Competitors can get as many as 4 to 6 matches per division!'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-weight"></i>
                        <span data-en="Weigh-Ins" data-ar="الوزن">Weigh-Ins</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'يمكن للمتنافسين أن يزنوا حالما تفتح أبواب الحدث في اليوم الذي يتنافسون فيه حتى 60 دقيقة قبل وقت بدء قسمهم.' : 
                            'Competitors can weigh in as soon as the event doors open on the day they are competing up until 60 minutes prior to their division start time.'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-calendar-check"></i>
                        <span data-en="Brackets and Schedule" data-ar="المباريات والجدول">Brackets and Schedule</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'ستُنشر مبارايات البطولة والجدول قبل 48 ساعة من الحدث.' : 
                            'The tournament\'s brackets and schedule will be posted 48 hours prior to the event.'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-users-cog"></i>
                        <span data-en="Capacity" data-ar="السعة">Capacity</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'كل بطولة لها حد سعة محدد وسينتهي التسجيل مبكراً إذا تم الوصول إلى السعة.' : 
                            'Each tournament has a set capacity limit and registration will close early if capacity is reached.'}</p>
                    </div>
                </div>

                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-undo"></i>
                        <span data-en="Refund Policy" data-ar="سياسة الاسترداد">Refund Policy</span>
                    </h2>
                    <div class="description-section">
                        <p>${currentLang === 'ar' ? 
                            'استرداد كامل متاح حتى موعد التسجيل العادي. بعد هذا التاريخ، يتم استرداد رصيد قسيمة كامل فقط.' : 
                            'A full refund is available until the Normal Registration deadline. After this date, only a full coupon credit is offered.'}</p>
                    </div>
                </div>
            `;

            // Update sidebar
            document.getElementById('availableSpots').textContent = availableSpots;
            document.getElementById('locationText').textContent = locationText;
            
            // Update important dates in sidebar
            const datesHtml = `
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;" data-en="Event Date" data-ar="تاريخ البطولة">Event Date</div>
                    <div style="font-weight: 600; color: var(--text-main);">${dateStr}</div>
                </div>
                ${tournamentData.reg_regular_start ? `
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;" data-en="Regular Registration" data-ar="التسجيل العادي">Regular Registration</div>
                    <div style="font-size: 0.9rem; color: var(--text-main);">${formatDate(tournamentData.reg_regular_start)} - ${formatDate(tournamentData.reg_regular_end)}</div>
                </div>
                ` : ''}
                ${tournamentData.reg_late_start ? `
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px;" data-en="Late Registration" data-ar="التسجيل المتأخر">Late Registration</div>
                    <div style="font-size: 0.9rem; color: var(--text-main);">${formatDate(tournamentData.reg_late_start)} - ${formatDate(tournamentData.reg_late_end)}</div>
                </div>
                ` : ''}
            `;
            document.getElementById('importantDates').innerHTML = datesHtml;

            // Check if registration is open
            const registerBtn = document.getElementById('registerBtn');
            if (tournamentData.status === 'upcoming' && (availableSpots > 0 || availableSpots === 'Unlimited')) {
                registerBtn.style.display = 'inline-flex';
            } else {
                registerBtn.style.display = 'none';
            }
        }

        function showError(message) {
            const content = document.getElementById('tabContent');
            content.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 15px;"></i>
                    <h2>${message}</h2>
                    <button class="btn btn-primary" onclick="window.location.href='tournaments.html'" style="margin-top: 20px;">
                        ${currentLang === 'ar' ? 'العودة للبطولات' : 'Back to Tournaments'}
                    </button>
                </div>
            `;
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            event.target.closest('.nav-tab').classList.add('active');

            if (tab === 'information') {
                renderTournamentDetails();
            } else if (tab === 'divisions') {
                renderDivisionsTab();
            } else if (tab === 'schedule') {
                renderScheduleTab();
            }
        }

        function renderDivisionsTab() {
            const content = document.getElementById('tabContent');
            
            if (divisionsData.length === 0) {
                content.innerHTML = `
                    <div class="content-section" style="text-align: center; padding: 60px 20px;">
                        <i class="fas fa-trophy" style="font-size: 3rem; margin-bottom: 15px; color: var(--primary);"></i>
                        <h2 style="margin-bottom: 10px;">${currentLang === 'ar' ? 'لا توجد أقسام' : 'No Divisions'}</h2>
                        <p style="color: var(--text-muted);">${currentLang === 'ar' ? 'لم يتم إضافة أقسام بعد' : 'No divisions have been added yet'}</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="content-section">
                    <h2 class="section-title">
                        <i class="fas fa-trophy"></i>
                        <span data-en="Tournament Divisions" data-ar="أقسام البطولة">Tournament Divisions</span>
                    </h2>
                    <div style="overflow-x: auto;">
                        <table class="divisions-table">
                            <thead>
                                <tr>
                                    <th data-en="Division" data-ar="القسم">Division</th>
                                    <th data-en="Type" data-ar="النوع">Type</th>
                                    <th data-en="Age Group" data-ar="الفئة العمرية">Age Group</th>
                                    <th data-en="Price" data-ar="السعر">Price</th>
                                    <th data-en="Status" data-ar="الحالة">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${divisionsData.map(div => `
                                    <tr>
                                        <td>${div.division_name || '-'}</td>
                                        <td>${div.gi_type || '-'}</td>
                                        <td>${div.age_group || '-'}</td>
                                        <td>$${div.price || 0}</td>
                                        <td>
                                            <span style="padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; background: ${div.is_active ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)'}; color: ${div.is_active ? 'var(--success)' : 'var(--danger)'};">
                                                ${div.is_active ? (currentLang === 'ar' ? 'نشط' : 'Active') : (currentLang === 'ar' ? 'غير نشط' : 'Inactive')}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderScheduleTab() {
            const content = document.getElementById('tabContent');
            content.innerHTML = `
                <div class="content-section" style="text-align: center; padding: 60px 20px;">
                    <i class="fas fa-calendar-alt" style="font-size: 3rem; margin-bottom: 15px; color: var(--primary);"></i>
                    <h2 style="margin-bottom: 10px;">${currentLang === 'ar' ? 'الجدول الزمني' : 'Event Schedule'}</h2>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">
                        ${currentLang === 'ar' ? 'سيتم نشر الجدول قبل 48 ساعة من الحدث' : 'Schedule will be posted 48 hours before the event'}
                    </p>
                    <div style="background: var(--bg-input); padding: 20px; border-radius: 10px; margin-top: 20px;">
                        <h3 style="margin-bottom: 15px; color: var(--text-main);">${currentLang === 'ar' ? 'معلومات عامة' : 'General Information'}</h3>
                        <ul style="list-style: none; padding: 0; text-align: left; display: inline-block;">
                            <li style="margin-bottom: 10px;"><i class="fas fa-check" style="color: var(--success); margin-right: 8px;"></i> ${currentLang === 'ar' ? 'الباب يفتح: 09:00' : 'Doors Open: 09:00'}</li>
                            <li style="margin-bottom: 10px;"><i class="fas fa-check" style="color: var(--success); margin-right: 8px;"></i> ${currentLang === 'ar' ? 'بداية المنافسة: 10:00' : 'Competition Starts: 10:00'}</li>
                            <li style="margin-bottom: 10px;"><i class="fas fa-check" style="color: var(--success); margin-right: 8px;"></i> ${currentLang === 'ar' ? 'التسجيل قبل 60 دقيقة من البدء' : 'Check-in 60 minutes before start'}</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function registerForTournament() {
            if (!tournamentData) return;
            
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                alert(currentLang === 'ar' ? 'الرجاء تسجيل الدخول أولاً' : 'Please login first');
                window.location.href = 'login.html';
                return;
            }

            window.location.href = `tournament-registration.html?tournament_id=${tournamentId}`;
        }

        function viewMap() {
            if (!tournamentData || !tournamentData.location) {
                alert(currentLang === 'ar' ? 'لا يوجد موقع محدد' : 'No location specified');
                return;
            }
            
            const query = encodeURIComponent(tournamentData.location);
            window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
        }

        function contactOrganizer() {
            if (!tournamentData || !tournamentData.organizer_id) return;
            
            dbClient.from('organizers').select('email').eq('id', tournamentData.organizer_id).single().then(({ data }) => {
                if (data && data.email) {
                    window.location.href = `mailto:${data.email}`;
                }
            });
        }

        async function logout() {
            await dbClient.auth.signOut();
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
