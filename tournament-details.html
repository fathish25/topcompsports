<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC; --dark-blue: #003366; --accent-yellow: #FFB800;
            --black: #0A0A0A; --dark-gray: #1A1A1A; --medium-gray: #2A2A2A; --white: #FFFFFF;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        
        .header { background: rgba(10,10,10,0.98); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--accent-yellow); }
        .nav { display: flex; gap: 20px; align-items: center; }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; }
        .nav a:hover { color: var(--primary-blue); }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-primary { background: var(--primary-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }
        .btn-secondary { background: transparent; color: var(--white); border: 2px solid var(--white); }
        .btn-secondary:hover { background: var(--white); color: var(--black); }

        .hero { padding: 60px 50px; background: var(--gradient-blue); }
        .hero-content { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; align-items: center; }
        .hero-text h1 { font-size: 3rem; margin-bottom: 15px; }
        .hero-text p { font-size: 1.1rem; color: rgba(255,255,255,0.9); margin-bottom: 10px; }
        .hero-card { background: rgba(0,0,0,0.3); padding: 30px; border-radius: 15px; border: 2px solid var(--accent-yellow); text-align: center; }
        .hero-card h3 { color: var(--accent-yellow); margin-bottom: 15px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 50px; }
        .section { background: var(--dark-gray); border-radius: 15px; padding: 30px; margin-bottom: 30px; border: 1px solid var(--medium-gray); }
        .section-title { font-size: 1.5rem; color: var(--accent-yellow); margin-bottom: 20px; border-bottom: 2px solid var(--medium-gray); padding-bottom: 10px; }

        .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
        .empty-state { text-align: center; padding: 40px 20px; color: rgba(255,255,255,0.6); }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .hero-content { grid-template-columns: 1fr; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <div class="logo-text">TopCompSports</div>
        </div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="index.html#tournaments">Tournaments</a>
            <a href="login.html" id="navLogin">Login</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1 id="tournamentName">Loading...</h1>
                <p id="tournamentDesc"></p>
                <p>📍 <span id="tournamentLocation">-</span></p>
                <p>📅 <span id="tournamentDate">-</span></p>
            </div>
            <div class="hero-card">
                <h3>Registration</h3>
                <p style="margin-bottom: 20px; color: rgba(255,255,255,0.8);">Secure your spot in this tournament</p>
                <!-- هنا سيتم وضع زر التسجيل أو زر تسجيل الدخول ديناميكياً -->
                <div id="registerAction"></div>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="section">
            <div class="section-title">📋 Tournament Information</div>
            <p id="tournamentFullDesc" style="color: rgba(255,255,255,0.8); line-height: 1.8;">Loading details...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let tournamentId = null;

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                document.getElementById('tournamentName').textContent = 'Tournament not found';
                return;
            }

            // 1. التحقق من حالة تسجيل الدخول لعرض الزر المناسب
            const storedUser = localStorage.getItem('currentUser');
            const registerActionDiv = document.getElementById('registerAction');
            const navLogin = document.getElementById('navLogin');

            if (storedUser) {
                const userData = JSON.parse(storedUser);
                // المستخدم مسجل دخول: إظهار زر التسجيل
                registerActionDiv.innerHTML = `<a href="player-registration.html?tournament_id=${tournamentId}" class="btn btn-primary" style="width: 100%; text-align: center;">📝 Register Now</a>`;
                navLogin.textContent = userData.full_name || 'My Profile';
                navLogin.href = 'my-profile.html';
            } else {
                // المستخدم غير مسجل: إظهار زر يطلب منه تسجيل الدخول
                const redirectUrl = encodeURIComponent(`tournament-details.html?tournament_id=${tournamentId}`);
                registerActionDiv.innerHTML = `<a href="login.html?redirect=${redirectUrl}" class="btn btn-secondary" style="width: 100%; text-align: center;">🔒 Please Login to Register</a>`;
            }

            // 2. تحميل بيانات البطولة
            try {
                const { data: tournament, error } = await dbClient.from('tournaments').select('*').eq('id', tournamentId).single();
                if (error || !tournament) {
                    document.getElementById('tournamentName').textContent = 'Tournament not found';
                    return;
                }

                document.getElementById('tournamentName').textContent = tournament.name;
                document.getElementById('tournamentDesc').textContent = tournament.description || 'No description available.';
                document.getElementById('tournamentFullDesc').textContent = tournament.description || 'No description available.';
                document.getElementById('tournamentLocation').textContent = tournament.location || 'To be announced';
                
                const date = new Date(tournament.date);
                document.getElementById('tournamentDate').textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

            } catch (error) {
                console.error('Error loading tournament:', error);
                document.getElementById('tournamentName').textContent = 'Error loading details';
            }
        };
    </script>
</body>
</html>
