<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللاعبون - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #fff; min-height: 100vh; }
        .navbar { background: #151d2b; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1c40f; }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
        .navbar-menu { display: flex; gap: 20px; align-items: center; }
        .navbar-menu a { color: #fff; text-decoration: none; padding: 8px 16px; border-radius: 6px; transition: all 0.3s; }
        .navbar-menu a:hover { background: rgba(241,196,15,0.2); color: #f1c40f; }
        .navbar-menu a.active { background: #f1c40f; color: #0a0e17; }
        .btn-logout { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .btn-logout:hover { background: #ef4444; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        .tournament-header { background: #151d2b; padding: 25px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .tournament-info { display: flex; gap: 20px; align-items: center; }
        .tournament-logo { width: 80px; height: 80px; border-radius: 50%; background: #2a3548; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .tournament-name { font-size: 1.8rem; font-weight: bold; color: #f1c40f; }
        .tournament-date { color: rgba(255,255,255,0.6); margin-top: 5px; }
        .btn-register { background: #f1c40f; color: #0a0e17; padding: 12px 30px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: all 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; }
        .tab { padding: 12px 24px; background: rgba(255,255,255,0.05); border-radius: 8px 8px 0 0; cursor: pointer; transition: all 0.3s; text-decoration: none; color: #fff; }
        .tab:hover { background: rgba(241,196,15,0.1); }
        .tab.active { background: #f1c40f; color: #0a0e17; font-weight: bold; }
        .athletes-section { background: #151d2b; padding: 25px; border-radius: 12px; }
        .section-title { font-size: 2rem; font-weight: bold; margin-bottom: 20px; color: #f1c40f; }
        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .filter-btn:hover { background: rgba(241,196,15,0.2); border-color: #f1c40f; }
        .filter-btn.active { background: #f1c40f; color: #0a0e17; border-color: #f1c40f; }
        .search-box { width: 100%; padding: 12px; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; margin-bottom: 20px; font-size: 1rem; }
        .search-box:focus { outline: none; border-color: #f1c40f; }
        .athlete-card { background: #1a1f2e; padding: 20px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .athlete-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .athlete-name { font-size: 1.2rem; font-weight: bold; color: #f1c40f; }
        .athlete-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .detail-item { padding: 10px; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .detail-label { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 5px; }
        .detail-value { color: #fff; font-weight: bold; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-edit { background: rgba(59,130,246,0.2); border: 1px solid #3b82f6; color: #3b82f6; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .btn-edit:hover { background: #3b82f6; color: #fff; }
        .btn-delete { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .btn-delete:hover { background: #ef4444; color: #fff; }
        .btn-edit-profile { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.3s; }
        .btn-edit-profile:hover { background: #10b981; color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: #151d2b; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; border: 2px solid #f1c40f; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #2a3548; }
        .modal-title { font-size: 1.5rem; color: #f1c40f; }
        .modal-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        .form-group select { width: 100%; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        .form-group select:focus { outline: none; border-color: #f1c40f; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; padding: 14px 28px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; transition: all 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; padding: 14px 28px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 10px; transition: all 0.3s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .no-athletes { text-align: center; padding: 40px; color: rgba(255,255,255,0.6); }
        .my-participant-badge { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; margin-right: 10px; }
        @media (max-width: 768px) {
            .tournament-header { flex-direction: column; gap: 20px; text-align: center; }
            .form-row { grid-template-columns: 1fr; }
            .athlete-details { grid-template-columns: 1fr; }
            .athlete-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <div style="width: 40px; height: 40px; background: #f1c40f; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #0a0e17;">T</div>
            TopCompSports
        </div>
        <div class="navbar-menu">
            <a href="index.html">Home</a>
            <a href="tournaments.html">Tournaments</a>
            <a href="profile.html">My Profile</a>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div id="alert" class="alert"></div>

        <div class="tournament-header">
            <div class="tournament-info">
                <div class="tournament-logo">🥋</div>
                <div>
                    <div class="tournament-name" id="tournamentName">جاري التحميل...</div>
                    <div class="tournament-date" id="tournamentDate"></div>
                </div>
            </div>
            <a href="player-registration.html?tournament_id=" class="btn-register" id="registerBtn">Register</a>
        </div>

        <div class="tabs">
            <a href="tournament-details.html?tournament_id=" class="tab" id="tabInfo">Information</a>
            <a href="tournament-athletes.html?tournament_id=" class="tab active" id="tabAthletes">Athletes</a>
            <a href="tournament-brackets.html?tournament_id=" class="tab" id="tabBrackets">Brackets</a>
            <a href="tournament-matches.html?tournament_id=" class="tab" id="tabMatches">Matches</a>
            <a href="tournament-schedule.html?tournament_id=" class="tab" id="tabSchedule">Schedule</a>
            <a href="tournament-results.html?tournament_id=" class="tab" id="tabResults">Results</a>
        </div>

        <div class="athletes-section">
            <h2 class="section-title">Athletes</h2>
            
            <div class="filters">
                <button class="filter-btn active" onclick="filterAthletes('all')">All Athletes</button>
                <button class="filter-btn" onclick="filterAthletes('Gi')">Gi</button>
                <button class="filter-btn" onclick="filterAthletes('No-Gi')">No-Gi</button>
            </div>

            <input type="text" class="search-box" id="searchBox" placeholder="Search athlete or division..." oninput="searchAthletes()">

            <div id="athletesList"></div>
        </div>
    </div>

    <!-- Modal للتعديل -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تعديل بيانات المشاركة</h3>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editParticipantId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>الفئة العمرية *</label>
                        <select id="editAgeGroup" required onchange="updateEditWeightOptions()">
                            <option value="">اختر الفئة...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الوزن (كجم) *</label>
                        <select id="editWeight" required>
                            <option value="">اختر الوزن...</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>الحزام *</label>
                        <select id="editBelt" required>
                            <option value="">اختر الحزام...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>نوع المشاركة *</label>
                        <select id="editGiType" required>
                            <option value="Gi">بدلة (Gi)</option>
                            <option value="No-Gi">بدون بدلة (No-Gi)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary">✅ حفظ التعديلات</button>
                <button type="button" class="btn-secondary" onclick="closeEditModal()">إلغاء</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let tournamentId = null;
        let athletes = [];
        let currentFilter = 'all';
        let ageDivisions = [];
        let weightCategories = [];
        let beltLevels = [];
        let currentUserId = null;

        async function loadTournamentData() {
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                showAlert('error', '❌ بيانات غير صحيحة!');
                return;
            }

            // تحديث الروابط
            document.querySelectorAll('a[href*="tournament_id"]').forEach(link => {
                link.href += tournamentId;
            });
            document.getElementById('registerBtn').href += tournamentId;

            // جلب بيانات البطولة
            const { data: tournament, error } = await supabaseClient
                .from('tournaments')
                .select('*')
                .eq('id', tournamentId)
                .single();

            if (error || !tournament) {
                showAlert('error', ' لم يتم العثور على البطولة!');
                return;
            }

            document.getElementById('tournamentName').textContent = tournament.name || 'Test 1';
            document.getElementById('tournamentDate').textContent = tournament.date || 'Oct 10, 2026';

            // التحقق من تسجيل الدخول
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                currentUserId = user.id;
            }

            // جلب البيانات المرجعية
            await Promise.all([
                loadAgeDivisions(),
                loadWeightCategories(),
                loadBeltLevels()
            ]);

            // جلب اللاعبين
            await loadAthletes();
        }

        async function loadAgeDivisions() {
            const { data } = await supabaseClient
                .from('ajp_age_divisions')
                .select('*')
                .order('min_age');
            
            ageDivisions = data || [];
        }

        async function loadWeightCategories() {
            const { data } = await supabaseClient
                .from('ajp_weight_classes')
                .select('*')
                .order('min_weight');
            
            weightCategories = data || [];
        }

        async function loadBeltLevels() {
            const { data } = await supabaseClient
                .from('ajp_belt_levels')
                .select('*')
                .order('sort_order');
            
            beltLevels = data || [];
        }

        async function loadAthletes() {
            const { data, error } = await supabaseClient
                .from('tournament_participants')
                .select(`
                    *,
                    athletes (
                        full_name,
                        email,
                        gender,
                        country
                    )
                `)
                .eq('tournament_id', tournamentId)
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error loading athletes:', error);
                showAlert('error', '❌ خطأ في تحميل البيانات!');
                return;
            }

            athletes = data || [];
            displayAthletes();
        }

        function displayAthletes() {
            const container = document.getElementById('athletesList');
            
            let filteredAthletes = athletes;
            
            if (currentFilter !== 'all') {
                filteredAthletes = athletes.filter(a => a.gi_type === currentFilter);
            }

            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            if (searchTerm) {
                filteredAthletes = filteredAthletes.filter(a => 
                    a.player_name?.toLowerCase().includes(searchTerm) ||
                    a.age_group?.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredAthletes.length === 0) {
                container.innerHTML = '<div class="no-athletes">لا يوجد لاعبون مسجلون</div>';
                return;
            }

            container.innerHTML = filteredAthletes.map(athlete => {
                // ✅ التحقق مما إذا كان اللاعب الحالي هو صاحب الحساب
                const isMyProfile = currentUserId && athlete.user_id === currentUserId;
                
                return `
                    <div class="athlete-card" style="${isMyProfile ? 'border: 2px solid #10b981;' : ''}">
                        <div class="athlete-header">
                            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                                <div class="athlete-name">${athlete.player_name || 'لاعب'}</div>
                                ${isMyProfile ? '<span class="my-participant-badge">✓ مشاركتي</span>' : ''}
                            </div>
                            <div class="action-buttons">
                                ${isMyProfile ? `
                                    <button class="btn-edit-profile" onclick="openEditModal('${athlete.id}')">
                                        ✏️ تعديل بياناتي
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                        <div class="athlete-details">
                            <div class="detail-item">
                                <div class="detail-label">الفئة العمرية</div>
                                <div class="detail-value">${athlete.age_group || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">الوزن</div>
                                <div class="detail-value">${athlete.weight_class || athlete.weight + 'kg' || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">الحزام</div>
                                <div class="detail-value">${athlete.belt_level || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">نوع المشاركة</div>
                                <div class="detail-value">${athlete.gi_type || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">الفريق</div>
                                <div class="detail-value">${athlete.team || '-'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterAthletes(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            displayAthletes();
        }

        function searchAthletes() {
            displayAthletes();
        }

        // ✅ فتح Modal التعديل (فقط للاعب نفسه)
        async function openEditModal(participantId) {
            const athlete = athletes.find(a => a.id === participantId);
            if (!athlete) return;

            // ✅ التحقق الأمني: التأكد من أن اللاعب يعدل بياناته فقط
            if (athlete.user_id !== currentUserId) {
                showAlert('error', '❌ لا يمكنك تعديل بيانات لاعب آخر!');
                return;
            }

            document.getElementById('editParticipantId').value = participantId;
            document.getElementById('editGiType').value = athlete.gi_type || 'Gi';

            // ملء قائمة الفئات
            const ageSelect = document.getElementById('editAgeGroup');
            ageSelect.innerHTML = '<option value="">اختر الفئة...</option>';
            
            const availableDivisionIds = [...new Set(weightCategories.map(w => w.age_division_id))];
            const divisionsWithWeights = ageDivisions.filter(div => availableDivisionIds.includes(div.id));
            
            divisionsWithWeights.forEach(div => {
                const option = document.createElement('option');
                option.value = div.id;
                option.textContent = div.name || `${div.min_age}-${div.max_age} سنة`;
                ageSelect.appendChild(option);
            });

            // ملء قائمة الأحزمة
            const beltSelect = document.getElementById('editBelt');
            beltSelect.innerHTML = '<option value="">اختر الحزام...</option>';
            beltLevels.forEach(belt => {
                const option = document.createElement('option');
                option.value = belt.name;
                option.textContent = belt.name;
                beltSelect.appendChild(option);
            });

            // تعيين القيم الحالية
            const currentDivision = ageDivisions.find(d => d.name === athlete.age_group);
            if (currentDivision) {
                ageSelect.value = currentDivision.id;
                await updateEditWeightOptions();
                
                const weightSelect = document.getElementById('editWeight');
                weightSelect.value = athlete.weight_class || '';
            }

            beltSelect.value = athlete.belt_level || '';

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        // ✅ تحديث خيارات الوزن في Modal التعديل
        async function updateEditWeightOptions() {
            const selectedDivisionId = document.getElementById('editAgeGroup').value;
            const weightSelect = document.getElementById('editWeight');
            
            weightSelect.innerHTML = '<option value="">اختر الوزن...</option>';
            
            if (!selectedDivisionId) return;

            const participantId = document.getElementById('editParticipantId').value;
            const athlete = athletes.find(a => a.id === participantId);
            const targetGender = athlete?.gender === 'Female' ? 'Women' : 'Men';

            const filteredWeights = weightCategories.filter(w => 
                w.age_division_id === selectedDivisionId && w.gender === targetGender
            );

            const weightsToShow = filteredWeights.length > 0 ? filteredWeights : 
                weightCategories.filter(w => w.age_division_id === selectedDivisionId);

            weightsToShow.forEach(w => {
                const option = document.createElement('option');
                option.value = w.name;
                option.textContent = `${w.name} (${w.min_weight}-${w.max_weight} كجم)`;
                option.dataset.weightId = w.id;
                option.dataset.minWeight = w.min_weight;
                weightSelect.appendChild(option);
            });
        }

        // ✅ حفظ التعديلات
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const participantId = document.getElementById('editParticipantId').value;
            
            // ✅ التحقق الأمني مرة أخرى
            const athlete = athletes.find(a => a.id === participantId);
            if (!athlete || athlete.user_id !== currentUserId) {
                showAlert('error', '❌ لا يمكنك تعديل بيانات لاعب آخر!');
                return;
            }

            const weightSelect = document.getElementById('editWeight');
            const selectedWeightOption = weightSelect.options[weightSelect.selectedIndex];
            const ageSelect = document.getElementById('editAgeGroup');
            const selectedDivision = ageDivisions.find(d => d.id === ageSelect.value);

            const formData = {
                age_group: selectedDivision?.name || '',
                weight: parseFloat(selectedWeightOption.dataset.minWeight || 0),
                weight_class: selectedWeightOption.value,
                weight_class_id: selectedWeightOption.dataset.weightId || null,
                belt_level: document.getElementById('editBelt').value,
                gi_type: document.getElementById('editGiType').value
            };

            try {
                const { error } = await supabaseClient
                    .from('tournament_participants')
                    .update(formData)
                    .eq('id', participantId);

                if (error) throw error;

                showAlert('success', '✅ تم تحديث البيانات بنجاح!');
                closeEditModal();
                await loadAthletes();

            } catch (error) {
                console.error('Update error:', error);
                showAlert('error', ' خطأ في التحديث: ' + error.message);
            }
        });

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }

        function logout() {
            supabaseClient.auth.signOut();
