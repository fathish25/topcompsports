<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletes - Tournament Details - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --light-gray: #3A3A3A;
            --white: #FFFFFF;
            --light-bg: #F5F7FA;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        img { max-width: 100%; height: auto; }

        .header { background: var(--black); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); position: sticky; top: 0; z-index: 1000; }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-svg { width: 50px; height: 50px; }
        .logo-text { font-size: 28px; font-weight: bold; color: var(--primary-blue); }
        .nav { display: flex; gap: 30px; align-items: center; }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; font-weight: 600; }
        .nav a:hover { color: var(--accent-yellow); }

        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; text-decoration: none; display: inline-block; }
        .btn-login { background: var(--primary-blue); color: var(--white); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }
        .btn-logout { background: transparent; border: 2px solid var(--white); color: var(--white); }

        .lang-switcher { display: flex; gap: 5px; background: var(--medium-gray); padding: 5px; border-radius: 8px; }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--white); cursor: pointer; border-radius: 6px; font-weight: bold; }
        .lang-btn.active { background: var(--primary-blue); }

        .tournament-header { background: var(--dark-gray); padding: 20px 50px; border-bottom: 1px solid var(--medium-gray); }
        .tournament-header-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .tournament-info { display: flex; align-items: center; gap: 20px; }
        .tournament-logo { width: 60px; height: 60px; border-radius: 10px; overflow: hidden; background: var(--medium-gray); }
        .tournament-logo img { width: 100%; height: 100%; object-fit: cover; }
        .tournament-title h1 { color: var(--white); font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        .tournament-title p { color: rgba(255,255,255,0.6); font-size: 0.9rem; }
        .tournament-actions { display: flex; gap: 15px; align-items: center; }
        .btn-register { background: var(--accent-yellow); color: var(--black); padding: 10px 25px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,184,0,0.4); }

        .tabs-container { background: var(--dark-gray); border-bottom: 1px solid var(--medium-gray); position: sticky; top: 73px; z-index: 999; }
        .tabs { max-width: 1400px; margin: 0 auto; display: flex; gap: 5px; padding: 0 50px; overflow-x: auto; }
        .tab { padding: 15px 25px; color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; transition: all 0.3s; white-space: nowrap; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tab:hover { color: var(--white); }
        .tab.active { color: var(--white); border-bottom-color: var(--accent-yellow); }

        .main-content { max-width: 1400px; margin: 0 auto; padding: 40px 50px; }

        .athletes-header { margin-bottom: 30px; }
        .athletes-header h2 { font-size: 2rem; font-weight: 900; color: var(--white); margin-bottom: 20px; }
        
        .filters { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .filter-btn { padding: 8px 16px; background: var(--medium-gray); color: var(--white); border: 1px solid var(--light-gray); border-radius: 6px; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; }
        .filter-btn:hover { background: var(--light-gray); }
        .filter-btn.active { background: var(--primary-blue); border-color: var(--primary-blue); }

        .search-bar { display: flex; gap: 15px; margin-bottom: 30px; }
        .search-input { flex: 1; padding: 12px 20px; background: var(--medium-gray); border: 1px solid var(--light-gray); border-radius: 8px; color: var(--white); font-size: 1rem; }
        .search-input:focus { outline: none; border-color: var(--primary-blue); }
        .search-input::placeholder { color: rgba(255,255,255,0.4); }

        .division-group { margin-bottom: 40px; }
        .division-title { font-size: 1.3rem; font-weight: 700; color: var(--white); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-blue); }

        .athletes-table { width: 100%; border-collapse: collapse; background: var(--dark-gray); border-radius: 10px; overflow: hidden; }
        .athletes-table thead { background: var(--medium-gray); }
        .athletes-table th { padding: 15px 20px; text-align: left; color: rgba(255,255,255,0.7); font-size: 0.85rem; font-weight: 600; text-transform: uppercase; }
        .athletes-table td { padding: 15px 20px; border-bottom: 1px solid var(--medium-gray); color: var(--white); vertical-align: middle; }
        .athletes-table tr:hover { background: var(--light-gray); }
        .athletes-table tr:last-child td { border-bottom: none; }

        .athlete-info { display: flex; align-items: center; gap: 15px; }
        .athlete-avatar { width: 45px; height: 45px; border-radius: 50%; overflow: hidden; background: var(--medium-gray); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
        .athlete-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .athlete-details { display: flex; flex-direction: column; gap: 3px; }
        .athlete-name { font-weight: 700; color: var(--white); font-size: 1rem; }
        .athlete-country { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; color: rgba(255,255,255,0.6); }

        .academy-link { color: var(--primary-blue); text-decoration: none; font-size: 0.9rem; }
        .academy-link:hover { text-decoration: underline; }

        .gender-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .gender-badge.male { background: rgba(0,102,204,0.2); color: var(--primary-blue); }
        .gender-badge.female { background: rgba(255,105,180,0.2); color: #FF69B4; }

        .approved-count { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-top: 10px; }

        .btn-edit-own { background: var(--accent-yellow); color: var(--black); border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-top: 8px; transition: all 0.3s; display: inline-flex; align-items: center; gap: 5px; }
        .btn-edit-own:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(255,184,0,0.3); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: var(--dark-gray); padding: 30px; border-radius: 12px; max-width: 500px; width: 100%; border: 2px solid var(--primary-blue); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--medium-gray); }
        .modal-header h3 { color: var(--white); font-size: 1.3rem; }
        .modal-close { background: none; border: none; color: var(--white); font-size: 1.8rem; cursor: pointer; line-height: 1; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; color: rgba(255,255,255,0.7); margin-bottom: 5px; font-size: 0.9rem; font-weight: 600; }
        .form-group select { width: 100%; padding: 10px; background: var(--medium-gray); border: 1px solid var(--light-gray); border-radius: 6px; color: var(--white); font-size: 0.95rem; }
        .form-group select:focus { outline: none; border-color: var(--primary-blue); }
        .btn-save { width: 100%; background: var(--primary-blue); color: var(--white); padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.3s; margin-top: 10px; }
        .btn-save:hover { background: var(--dark-blue); }

        .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.5); font-size: 1.2rem; }
        .empty-state { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.5); }
        .empty-state .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }

        .footer { background: var(--black); padding: 30px 50px; color: rgba(255,255,255,0.6); text-align: center; border-top: 1px solid var(--medium-gray); margin-top: 60px; }

        @media (max-width: 1024px) {
            .header { padding: 15px 30px; }
            .tournament-header { padding: 20px 30px; }
            .tabs { padding: 0 30px; }
            .main-content { padding: 30px 30px; }
        }

        @media (max-width: 768px) {
            .header { padding: 12px 20px; flex-direction: column; gap: 15px; }
            .nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .tournament-header { padding: 15px 20px; flex-direction: column; }
            .tournament-info { flex-direction: column; align-items: flex-start; }
            .tournament-title h1 { font-size: 1.2rem; }
            .tabs { padding: 0 20px; overflow-x: auto; }
            .main-content { padding: 20px 20px; }
            .athletes-header h2 { font-size: 1.5rem; }
            .athletes-table { font-size: 0.85rem; }
            .athletes-table th, .athletes-table td { padding: 10px 12px; }
            .athlete-avatar { width: 35px; height: 35px; }
            .form-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 480px) {
            .header { padding: 10px 15px; }
            .logo-text { font-size: 22px; }
            .tournament-header { padding: 15px; }
            .tournament-actions { flex-direction: column; width: 100%; }
            .tournament-actions .btn { width: 100%; text-align: center; }
            .tabs { padding: 0 15px; }
            .main-content { padding: 15px 15px; }
            .athletes-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="url(#logoGrad)" stroke="#FFB800" stroke-width="3"/>
                <text x="50" y="65" font-family="Arial Black, sans-serif" font-size="45" font-weight="900" fill="#FFB800" text-anchor="middle">T</text>
            </svg>
            <div class="logo-text">TopCompSports</div>
        </div>
        
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="tournaments.html">Tournaments</a>
            
            <div id="userSection" class="user-section" style="display: none; gap: 15px; align-items: center;">
                <a href="my-profile.html" style="color: var(--accent-yellow); text-decoration: none;">My Profile</a>
                <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
            </div>
            
            <a href="login.html" id="loginBtn" class="btn btn-login">Login</a>
            
            <div class="lang-switcher">
                <button class="lang-btn" onclick="changeLanguage('ar')" id="btn-ar">عربي</button>
                <button class="lang-btn active" onclick="changeLanguage('en')" id="btn-en">English</button>
            </div>
        </nav>
    </header>

    <div id="tournamentContent">
        <div class="loading">Loading tournament details...</div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit My Registration</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editForm">
                <input type="hidden" id="editParticipantId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Age Division *</label>
                        <select id="editAgeGroup" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Weight Class *</label>
                        <select id="editWeight" required>
                            <option value="">Select Age First</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Belt Level *</label>
                        <select id="editBelt" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gi Type *</label>
                        <select id="editGiType" required>
                            <option value="Gi">Gi</option>
                            <option value="No-Gi">No-Gi</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-save">Save Changes</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 TopCompSports - All rights reserved</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('lang') || 'en';
        let tournamentId = null;
        let allAthletes = [];
        let currentFilter = 'all';
        let currentUser = null;
        let refAgeDivisions = [];
        let refWeightClasses = [];
        let refBeltLevels = [];
        let athletesData = {}; // ✅ تخزين بيانات اللاعبين

        window.onload = async function() {
            await checkUserStatus();
            await loadReferenceData();
            
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                showError('Tournament ID not found');
                return;
            }
            
            await loadTournamentAndAthletes();
        };

        async function checkUserStatus() {
            try {
                const { data: { user } } = await dbClient.auth.getUser();
                if (user) {
                    currentUser = user;
                    document.getElementById('userSection').style.display = 'flex';
                    document.getElementById('loginBtn').style.display = 'none';
                } else {
                    currentUser = null;
                    document.getElementById('userSection').style.display = 'none';
                    document.getElementById('loginBtn').style.display = 'inline-block';
                }
            } catch (error) {
                console.error('Auth error:', error);
                currentUser = null;
            }
        }

        async function loadReferenceData() {
            try {
                const [ages, weights, belts] = await Promise.all([
                    dbClient.from('ajp_age_divisions').select('*').order('min_age'),
                    dbClient.from('ajp_weight_classes').select('*').order('min_weight'),
                    dbClient.from('ajp_belt_levels').select('*').order('sort_order')
                ]);
                refAgeDivisions = ages.data || [];
                refWeightClasses = weights.data || [];
                refBeltLevels = belts.data || [];
            } catch (error) {
                console.error('Error loading reference data:', error);
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('lang', lang);
            currentLang = lang;
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            loadTournamentAndAthletes();
        }

        async function loadTournamentAndAthletes() {
            try {
                const { data: tournament, error: tournamentError } = await dbClient
                    .from('tournaments')
                    .select('*')
                    .eq('id', tournamentId)
                    .single();
                
                if (tournamentError) {
                    showError('Error loading tournament: ' + tournamentError.message);
                    return;
                }

                if (!tournament) {
                    showError('Tournament not found');
                    return;
                }

                // ✅ جلب المشاركين بدون JOIN
                const { data: participants, error: participantsError } = await dbClient
                    .from('tournament_participants')
                    .select('*')
                    .eq('tournament_id', tournamentId);

                if (participantsError) {
                    showError('Error loading athletes: ' + participantsError.message);
                    return;
                }

                // ✅ جلب بيانات اللاعبين من جدول athletes بشكل منفصل
                const userIds = participants.map(p => p.user_id).filter(id => id);
                let athletesMap = {};
                
                if (userIds.length > 0) {
                    const { data: athletes, error: athletesError } = await dbClient
                        .from('athletes')
                        .select('user_id, full_name, country, profile_picture_url')
                        .in('user_id', userIds);
                    
                    if (!athletesError && athletes) {
                        athletesMap = {};
                        athletes.forEach(a => {
                            athletesMap[a.user_id] = a;
                        });
                    }
                }

                // ✅ دمج البيانات
                allAthletes = participants.map(p => ({
                    ...p,
                    athleteData: athletesMap[p.user_id] || {}
                }));

                renderTournament(tournament);
                renderAthletes();
            } catch (error) {
                console.error('Error loading tournament:', error);
                showError('Error loading tournament details');
            }
        }

        function showError(message) {
            document.getElementById('tournamentContent').innerHTML = `
                <div class="empty-state">
                    <div class="icon" style="color: #ef4444;"></div>
                    <p>${message}</p>
                </div>
            `;
        }

        function renderTournament(tournament) {
            const isLoggedIn = !!currentUser;
            const startDate = tournament.event_start_date || tournament.tournament_date || tournament.event_date;
            const bannerImage = tournament.image_url || '';

            const registerButton = isLoggedIn
                ? `<button class="btn-register" onclick="window.location.href='player-registration.html?tournament_id=${tournamentId}'">Register</button>`
                : `<button class="btn btn-login" onclick="window.location.href='login.html?redirect=tournament-athletes.html?tournament_id=${tournamentId}'">Login to Register</button>`;

            document.getElementById('tournamentContent').innerHTML = `
                <div class="tournament-header">
                    <div class="tournament-header-content">
                        <div class="tournament-info">
                            <div class="tournament-logo">
                                ${bannerImage ? `<img src="${bannerImage}" alt="${tournament.name}">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;">🏆</div>'}
                            </div>
                            <div class="tournament-title">
                                <h1>${tournament.name}</h1>
                                <p>📅 ${startDate ? new Date(startDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : 'TBD'}</p>
                            </div>
                        </div>
                        <div class="tournament-actions">
                            ${registerButton}
                        </div>
                    </div>
                </div>

                <div class="tabs-container">
                    <div class="tabs">
                        <a href="tournament-details.html?tournament_id=${tournamentId}" class="tab"><span></span> Information</a>
                        <a href="tournament-athletes.html?tournament_id=${tournamentId}" class="tab active"><span></span> Athletes <span style="background:var(--accent-yellow);color:var(--black);padding:2px 8px;border-radius:10px;font-size:0.8rem;">${allAthletes.length}</span></a>
                        <a href="#" class="tab"><span></span> Brackets</a>
                        <a href="#" class="tab"><span>️</span> Matches</a>
                        <a href="#" class="tab"><span></span> Schedule</a>
                        <a href="#" class="tab"><span>📊</span> Results</a>
                    </div>
                </div>

                <div class="main-content">
                    <div class="athletes-header">
                        <h2>Athletes</h2>
                        <div class="filters">
                            <button class="filter-btn active" onclick="filterAthletes('all')">All Athletes</button>
                            <button class="filter-btn" onclick="filterAthletes('Gi')">Gi</button>
                            <button class="filter-btn" onclick="filterAthletes('No-Gi')">No-Gi</button>
                        </div>
                        <div class="search-bar">
                            <input type="text" class="search-input" id="searchInput" placeholder="Search athlete or division..." oninput="searchAthletes()">
                        </div>
                    </div>
                    <div id="athletesList"></div>
                </div>
            `;
        }

        function getAthleteDisplayData(athlete) {
            // ✅ جلب البيانات من athleteData المخزنة
            const athleteData = athlete.athleteData || {};
            return {
                name: athleteData.full_name || athlete.player_name || 'Unknown',
                country: athleteData.country || athlete.country || '',
                photo: athleteData.profile_picture_url || athlete.profile_photo_url || ''
            };
        }

        function renderAthletes() {
            const athletesList = document.getElementById('athletesList');
            
            if (allAthletes.length === 0) {
                athletesList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👥</div>
                        <p>No athletes registered yet</p>
                    </div>
                `;
                return;
            }

            const groupedAthletes = groupAthletesByDivision(allAthletes);
            renderGroupedAthletes(groupedAthletes);
        }

        function groupAthletesByDivision(athletes) {
            const grouped = {};
            athletes.forEach(athlete => {
                const weightDisplay = athlete.weight_class || `${athlete.weight || 0}kg`;
                const key = `${athlete.age_group || 'Unknown'}|${athlete.gender || 'Unknown'}|${athlete.belt_level || 'Unknown'}|${weightDisplay}`;
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(athlete);
            });
            return grouped;
        }

        function renderGroupedAthletes(groupedAthletes) {
            const athletesList = document.getElementById('athletesList');
            
            if (Object.keys(groupedAthletes).length === 0) {
                athletesList.innerHTML = `
                    <div class="empty-state">
                        <div class="icon"></div>
                        <p>No athletes found</p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const [divisionKey, athletes] of Object.entries(groupedAthletes)) {
                const [ageGroup, gender, belt, weight] = divisionKey.split('|');
                const divisionTitle = `${gender} / ${ageGroup} / ${belt} / ${weight}`;
                
                html += `
                    <div class="division-group">
                        <h3 class="division-title">${divisionTitle}</h3>
                        <table class="athletes-table">
                            <thead>
                                <tr>
                                    <th>Athlete</th>
                                    <th>Academy & Affiliation</th>
                                    <th>Registration</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${athletes.map(athlete => {
                                    const display = getAthleteDisplayData(athlete);
                                    const isMyRecord = currentUser && athlete.user_id === currentUser.id;
                                    const editBtn = isMyRecord ? 
                                        `<button class="btn-edit-own" onclick="openEditModal('${athlete.id}')">✏️ Edit My Data</button>` : '';
                                    
                                    const weightDisplay = athlete.weight_class || `${athlete.weight || 0}kg`;
                                    
                                    return `
                                    <tr>
                                        <td>
                                            <div class="athlete-info">
                                                <div class="athlete-avatar">
                                                    ${display.photo ? `<img src="${display.photo}" alt="${display.name}" onerror="this.style.display='none';this.parentElement.textContent='👤'">` : '👤'}
                                                </div>
                                                <div class="athlete-details">
                                                    <div class="athlete-name">${display.name}</div>
                                                    <div class="athlete-country">
                                                        <span>${display.country || ''}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <a href="#" class="academy-link">${athlete.team || 'Independent'}</a>
                                        </td>
                                        <td>
                                            <span class="gender-badge ${athlete.gender?.toLowerCase() || 'male'}">${athlete.gender || 'Male'}</span>
                                            <div style="margin-top: 5px; font-size: 0.85rem; color: rgba(255,255,255,0.6);">
                                                ${athlete.age_group || 'N/A'} • ${weightDisplay} • ${athlete.belt_level || 'N/A'}
                                            </div>
                                            ${athlete.gi_type ? `<div style="font-size: 0.8rem; color: var(--primary-blue); margin-top: 3px;">${athlete.gi_type}</div>` : ''}
                                            ${editBtn}
                                        </td>
                                    </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                        <div class="approved-count">Total registrations: ${athletes.length}</div>
                    </div>
                `;
            }
            athletesList.innerHTML = html;
        }

        function filterAthletes(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            let filteredAthletes = allAthletes;
            if (filter !== 'all') {
                filteredAthletes = allAthletes.filter(a => a.gi_type === filter);
            }
            renderGroupedAthletes(groupAthletesByDivision(filteredAthletes));
        }

        function searchAthletes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (!searchTerm) {
                renderAthletes();
                return;
            }
            
            const filteredAthletes = allAthletes.filter(athlete => 
                (athlete.athleteData?.full_name || athlete.player_name || '').toLowerCase().includes(searchTerm) ||
                (athlete.team || '').toLowerCase().includes(searchTerm) ||
                (athlete.age_group || '').toLowerCase().includes(searchTerm) ||
                (athlete.belt_level || '').toLowerCase().includes(searchTerm)
            );
            renderGroupedAthletes(groupAthletesByDivision(filteredAthletes));
        }

        function openEditModal(participantId) {
            if (!currentUser) {
                alert('Please login first');
                return;
            }
            const athlete = allAthletes.find(a => a.id === participantId);
            
            if (!athlete || athlete.user_id !== currentUser.id) {
                alert("Security Error: You can only edit your own registration.");
                return;
            }

            document.getElementById('editParticipantId').value = participantId;
            document.getElementById('editGiType').value = athlete.gi_type || 'Gi';

            const ageSelect = document.getElementById('editAgeGroup');
            ageSelect.innerHTML = '<option value="">Select Age Division</option>';
            const availableDivIds = [...new Set(refWeightClasses.map(w => w.age_division_id))];
            const validAges = refAgeDivisions.filter(d => availableDivIds.includes(d.id));
            
            validAges.forEach(div => {
                const opt = document.createElement('option');
                opt.value = div.id;
                opt.textContent = div.name || `${div.min_age}-${div.max_age} yrs`;
                opt.dataset.name = div.name;
                ageSelect.appendChild(opt);
            });

            const beltSelect = document.getElementById('editBelt');
            beltSelect.innerHTML = '<option value="">Select Belt</option>';
            refBeltLevels.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b.name;
                opt.textContent = b.name;
                beltSelect.appendChild(opt);
            });

            const currentDiv = validAges.find(d => d.name === athlete.age_group);
            if (currentDiv) {
                ageSelect.value = currentDiv.id;
                updateEditWeightOptions(currentDiv.id, athlete.gender);
                setTimeout(() => {
                    document.getElementById('editWeight').value = athlete.weight_class || '';
                }, 100);
            }
            beltSelect.value = athlete.belt_level || '';

            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
        }

        function updateEditWeightOptions(divisionId, gender) {
            const weightSelect = document.getElementById('editWeight');
            weightSelect.innerHTML = '<option value="">Select Weight</option>';
            if (!divisionId) return;

            const targetGender = gender === 'Female' ? 'Women' : 'Men';
            const filtered = refWeightClasses.filter(w => w.age_division_id === divisionId && w.gender === targetGender);
            const fallback = filtered.length > 0 ? filtered : refWeightClasses.filter(w => w.age_division_id === divisionId);

            fallback.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.name;
                opt.textContent = `${w.name} (${w.min_weight}-${w.max_weight} kg)`;
                opt.dataset.weightId = w.id;
                opt.dataset.minWeight = w.min_weight;
                weightSelect.appendChild(opt);
            });
        }

        document.getElementById('editAgeGroup').addEventListener('change', function() {
            const athlete = allAthletes.find(a => a.id === document.getElementById('editParticipantId').value);
            updateEditWeightOptions(this.value, athlete?.gender || 'Male');
        });

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const participantId = document.getElementById('editParticipantId').value;
            const athlete = allAthletes.find(a => a.id === participantId);
            
            if (!athlete || athlete.user_id !== currentUser.id) {
                alert("Security Error: You can only edit your own registration.");
                return;
            }

            const ageSelect = document.getElementById('editAgeGroup');
            const selectedAge = ageSelect.options[ageSelect.selectedIndex];
            const weightSelect = document.getElementById('editWeight');
            const selectedWeight = weightSelect.options[weightSelect.selectedIndex];

            const updateData = {
                age_group: selectedAge.dataset.name || selectedAge.textContent,
                weight: parseFloat(selectedWeight.dataset.minWeight || 0),
                weight_class: selectedWeight.value,
                weight_class_id: selectedWeight.dataset.weightId || null,
                belt_level: document.getElementById('editBelt').value,
                gi_type: document.getElementById('editGiType').value
            };

            try {
                const { error } = await dbClient
                    .from('tournament_participants')
                    .update(updateData)
                    .eq('id', participantId);
                
                if (error) throw error;
                
                alert('✅ Registration updated successfully!');
                closeEditModal();
                await loadTournamentAndAthletes();
            } catch (err) {
                console.error(err);
                alert('❌ Error updating: ' + err.message);
            }
        });

        async function handleLogout() {
            await dbClient.auth.signOut();
            currentUser = null;
            document.getElementById('userSection').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'inline-block';
            window.location.reload();
        }
    </script>
</body>
</html>
