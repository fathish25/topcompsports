<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }
        .container { 
            max-width: 500px; 
            width: 100%; 
            background: rgba(21, 29, 43, 0.95); 
            border-radius: 16px; 
            padding: 40px; 
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo-icon { 
            width: 60px; height: 60px; 
            background: linear-gradient(135deg, #f1c40f, #d4a017); 
            border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 32px; font-weight: bold; color: #0a0e17; 
            margin: 0 auto 15px; 
        }
        .title { font-size: 28px; font-weight: bold; color: #f1c40f; margin-bottom: 10px; text-align: center; }
        .subtitle { color: rgba(255,255,255,0.7); text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-input { 
            width: 100%; 
            background: rgba(255,255,255,0.05); 
            border: 2px solid rgba(255,255,255,0.1); 
            color: #fff; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 15px; 
        }
        .form-input:focus { outline: none; border-color: #f1c40f; }
        .btn-primary { 
            width: 100%; 
            background: linear-gradient(135deg, #2563EB, #1d4ed8); 
            color: #fff; 
            border: none; 
            padding: 16px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; }
        .alert.show { display: block; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #f1c40f; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">T</div>
            <h1 class="title">Welcome Back</h1>
            <p class="subtitle">Sign in to your TopCompSports account</p>
        </div>
        
        <div class="alert alert-error" id="alert"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" id="email" required placeholder="your@email.com" value="shark.mma.egypt2@gmail.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Sign In →</button>
        </form>
        
        <div class="links">
            <p style="color: rgba(255,255,255,0.7); margin-top: 20px;">
                Don't have an account? <a href="signup.html">Create one</a>
            </p>
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const alert = document.getElementById('alert');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            btn.disabled = true;
            btn.textContent = 'Signing in...';
            alert.classList.remove('show');
            
            console.log('🔄 Attempting login for:', email);
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    throw error;
                }
                
                console.log('✅ Login successful!', data.user);
                
                // التحقق من المنظم
                const { data: organizer } = await supabase
                    .from('organizers')
                    .select('id')
                    .eq('email', email)
                    .single();
                
                if (organizer) {
                    console.log('🏢 Organizer found, redirecting...');
                    window.location.href = 'organizer-dashboard.html';
                } else {
                    console.log('⚠️ No organizer profile found');
                    alert.textContent = '⚠️ No organizer profile found. Please contact support.';
                    alert.classList.add('show');
                    btn.disabled = false;
                    btn.textContent = 'Sign In →';
                }
                
            } catch (error) {
                console.error('❌ Login error:', error);
                alert.textContent = '❌ ' + error.message;
                alert.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
        });
    </script>
</body>
</html>
