<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(135deg, #0066CC 0%, #003366 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #1A1A1A;
            border-radius: 20px;
            padding: 50px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #2A2A2A;
        }

        .logo { text-align: center; margin-bottom: 30px; }
        .logo-img { 
            width: 80px; 
            height: auto; 
            margin: 0 auto 15px;
            display: block;
        }
        .logo-text { font-size: 24px; font-weight: bold; color: #FFB800; }

        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header h1 { font-size: 2rem; margin-bottom: 10px; color: #FFB800; }
        .login-header p { color: rgba(255,255,255,0.6); }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .form-input {
            width: 100%; background: #0A0A0A; border: 2px solid #2A2A2A; color: #fff;
            padding: 14px 16px; border-radius: 10px; font-size: 1rem; transition: all 0.3s;
        }
        .form-input:focus { outline: none; border-color: #0066CC; }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1.05rem; margin-top: 10px;
        }
        .btn-primary { background: #0066CC; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-info { background: rgba(14,165,233,0.2); border: 1px solid #0ea5e9; color: #0ea5e9; }

        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            color: #0066CC;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .forgot-password a:hover {
            text-decoration: underline;
            color: #3399FF;
        }

        .signup-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .signup-link a { color: #FFB800; text-decoration: none; font-weight: 600; }
        .signup-link a:hover { text-decoration: underline; }

        .lang-switcher { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .lang-btn.active { background: #0066CC; border-color: #0066CC; }

        @media (max-width: 480px) {
            .login-container { padding: 30px 20px; }
            .login-header h1 { font-size: 1.5rem; }
            .lang-switcher { top: 10px; right: 10px; }
            .forgot-password { text-align: left; }
        }
    </style>
</head>
<body>
    <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('ar')">AR</button>
    </div>

    <div class="login-container">
        <div class="logo">
            <img src="logo2.png" alt="TopCompSports Logo" class="logo-img">
            <div class="logo-text">TopCompSports</div>
        </div>

        <div class="login-header">
            <h1 data-en="Welcome Back" data-ar="مرحباً بعودتك">Welcome Back</h1>
            <p data-en="Sign in to your TopCompSports account" data-ar="سجل الدخول إلى حسابك في TopCompSports">Sign in to your TopCompSports account</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" data-en="Email Address" data-ar="البريد الإلكتروني">Email Address</label>
                <input type="email" class="form-input" id="email" required placeholder="your.email@example.com" autocomplete="off" data-en-placeholder="your.email@example.com" data-ar-placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label class="form-label" data-en="Password" data-ar="كلمة المرور">Password</label>
                <input type="password" class="form-input" id="password" required placeholder="Enter your password" autocomplete="off" data-en-placeholder="Enter your password" data-ar-placeholder="أدخل كلمة المرور">
            </div>

            <div class="forgot-password">
                <a href="forgot-password.html" data-en="Forgot Password?" data-ar="نسيت كلمة المرور؟">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn" data-en="Sign In →" data-ar="← تسجيل الدخول">Sign In →</button>
        </form>

        <div class="signup-link">
            <span data-en="Don't have an account?" data-ar="ليس لديك حساب؟">Don't have an account?</span>
            <a href="signup.html" data-en="Create one" data-ar="إنشاء حساب">Create one</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.lang = lang;
            
            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.textContent = text;
            });
            
            document.querySelectorAll('[data-en-placeholder]').forEach(el => {
                const placeholder = el.getAttribute(`data-${lang}-placeholder`);
                if (placeholder) el.placeholder = placeholder;
            });
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = 'alert alert-' + type + ' show';
            alert.textContent = message;
            setTimeout(function() { alert.classList.remove('show'); }, 6000);
        }

        async function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = currentLang === 'ar' ? 'جاري تسجيل الدخول...' : 'Signing in...';

            try {
                const result = await dbClient.auth.signInWithPassword({ email: email, password: password });

                if (result.error) {
                    if (result.error.message.includes('Email not confirmed')) {
                        showAlert('info', currentLang === 'ar' 
                            ? '📧 يرجى التحقق من بريدك الإلكتروني وتأكيد حسابك.' 
                            : '📧 Please check your email and confirm your account.');
                    } else if (result.error.message.includes('Invalid login credentials')) {
                        showAlert('error', currentLang === 'ar' 
                            ? ' البريد الإلكتروني أو كلمة المرور غير صحيحة.' 
                            : '❌ Invalid email or password.');
                    } else {
                        showAlert('error', currentLang === 'ar' 
                            ? '❌ ' + result.error.message 
                            : '❌ ' + result.error.message);
                    }
                    submitBtn.disabled = false;
                    submitBtn.textContent = currentLang === 'ar' ? '← تسجيل الدخول' : 'Sign In →';
                    return;
                }

                console.log('✅ Login successful! User ID:', result.data.user.id);

                let userProfile = null;
                try {
                    const profileResult = await dbClient.from('users').select('*').eq('id', result.data.user.id).maybeSingle();
                    if (profileResult.data) userProfile = profileResult.data;
                } catch (profileErr) {
                    console.warn('Profile lookup failed:', profileErr.message);
                }

                if (!userProfile) {
                    userProfile = {
                        id: result.data.user.id,
                        email: email,
                        full_name: result.data.user.user_metadata?.full_name || email.split('@')[0],
                        user_type: result.data.user.user_metadata?.user_type || 'athlete',
                        profile_picture_url: null
                    };
                }

                const userData = {
                    id: result.data.user.id,
                    email: result.data.user.email,
                    full_name: userProfile.full_name || 'User',
                    user_type: userProfile.user_type || 'athlete',
                    profile_picture_url: userProfile.profile_picture_url,
                    profile_complete: !!(userProfile.full_name && userProfile.date_of_birth && userProfile.gender)
                };

                localStorage.setItem('currentUser', JSON.stringify(userData));

                showAlert('success', currentLang === 'ar' 
                    ? '✅ تم تسجيل الدخول بنجاح! جاري التوجيه...' 
                    : '✅ Login successful! Redirecting to home page...');

                setTimeout(function() {
                    console.log('🚀 Redirecting to index.html');
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Login error:', error);
                showAlert('error', currentLang === 'ar' 
                    ? '❌ خطأ: ' + error.message 
                    : '❌ Error: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = currentLang === 'ar' ? '← تسجيل الدخول' : 'Sign In →';
            }
        }

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('confirmed') === 'true') {
                showAlert('success', currentLang === 'ar' 
                    ? '✅ تم تأكيد البريد الإلكتروني! يمكنك الآن تسجيل الدخول.' 
                    : '✅ Email confirmed! You can now sign in.');
            }
            if (urlParams.get('email')) {
                document.getElementById('email').value = urlParams.get('email');
            }
        };
    </script>
</body>
</html>
