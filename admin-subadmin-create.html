<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sub-Admin - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: rgba(21, 29, 43, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a3548;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #2563EB, #1e40af);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; color: #fff;
        }
        .logo-text { font-size: 22px; font-weight: bold; }
        .user-menu { display: flex; align-items: center; gap: 20px; }
        .user-name { color: rgba(255,255,255,0.9); font-weight: 600; }
        .btn-logout {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-logout:hover { background: #ef4444; color: #fff; }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .page-header {
            background: linear-gradient(135deg, #2563EB 0%, #1e40af 100%);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: center;
        }
        .page-title { font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .page-subtitle { color: rgba(255,255,255,0.9); font-size: 16px; }
        
        .form-card {
            background: #151d2b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #2a3548;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: #1a1f2e;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #2563EB;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .permissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .permission-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .permission-item:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: #2563EB;
        }
        .permission-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #2563EB;
        }
        .permission-icon {
            font-size: 20px;
            color: #2563EB;
        }
        .permission-text {
            flex: 1;
        }
        .permission-title {
            font-weight: 600;
            margin-bottom: 3px;
        }
        .permission-desc {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563EB, #1d4ed8);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-back {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .btn-back:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }
        .alert.show { display: block; }
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }
        .alert-warning {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            border: 1px solid #f1c40f;
        }
        
        .lang-switcher { display: flex; gap: 10px; }
        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .lang-btn.active { background: #2563EB; border-color: #2563EB; }
        
        .role-info {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid #2563EB;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .role-info-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2563EB;
        }
        .role-info-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }
        
        @media (max-width: 768px) {
            .header { padding: 15px 20px; }
            .container { padding: 20px 15px; }
            .form-row { grid-template-columns: 1fr; }
            .permissions-grid { grid-template-columns: 1fr; }
            .page-title { font-size: 22px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='admin-dashboard.html'">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div class="user-menu">
            <div class="lang-switcher">
                <button class="lang-btn active" onclick="window.setLang('en')">EN</button>
                <button class="lang-btn" onclick="window.setLang('ar')">AR</button>
            </div>
            <span class="user-name" id="userName">Loading...</span>
            <button class="btn-logout" onclick="window.handleLogout()" data-en="Logout" data-ar="تسجيل الخروج">Logout</button>
        </div>
    </header>

    <div class="container">
        <a href="admin-dashboard.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> <span data-en="Back to Dashboard" data-ar="العودة للوحة التحكم">Back to Dashboard</span>
        </a>

        <div class="page-header">
            <h1 class="page-title" data-en="Create Sub-Admin" data-ar="إنشاء أدمن فرعي">Create Sub-Admin</h1>
            <p class="page-subtitle" data-en="Create a new admin account with custom permissions" data-ar="إنشاء حساب أدمن جديد بصلاحيات مخصصة">Create a new admin account with custom permissions</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="form-card">
            <h2 class="section-title">
                <i class="fas fa-user-plus"></i>
                <span data-en="Admin Information" data-ar="معلومات الأدمن">Admin Information</span>
            </h2>

            <div class="role-info">
                <div class="role-info-title" data-en="Note:" data-ar="ملاحظة:">Note:</div>
                <div class="role-info-text" data-en="Only Super Admin can create new admin accounts. The new admin will have limited permissions based on your selection." data-ar="فقط السوبر أدمن يمكنه إنشاء حسابات أدمن جديدة. سيكون للأدمن الجديد صلاحيات محدودة بناءً على اختيارك.">Only Super Admin can create new admin accounts. The new admin will have limited permissions based on your selection.</div>
            </div>

            <form id="createAdminForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" data-en="Full Name *" data-ar="الاسم الكامل *">Full Name *</label>
                        <input type="text" class="form-input" id="fullName" required data-placeholder-en="Enter full name" data-placeholder-ar="أدخل الاسم الكامل" placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-en="Email Address *" data-ar="البريد الإلكتروني *">Email Address *</label>
                        <input type="email" class="form-input" id="email" required data-placeholder-en="admin@example.com" data-placeholder-ar="admin@example.com" placeholder="admin@example.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" data-en="Password *" data-ar="كلمة المرور *">Password *</label>
                        <input type="password" class="form-input" id="password" required minlength="8" data-placeholder-en="Minimum 8 characters" data-placeholder-ar="8 أحرف على الأقل" placeholder="Minimum 8 characters">
                    </div>
                    <div class="form-group">
                        <label class="form-label" data-en="Role *" data-ar="الدور *">Role *</label>
                        <select class="form-select" id="role" required>
                            <option value="sub_admin" data-en="Sub-Admin" data-ar="أدمن فرعي">Sub-Admin</option>
                            <option value="admin" data-en="Admin" data-ar="أدمن">Admin</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div class="form-card">
            <h2 class="section-title">
                <i class="fas fa-shield-alt"></i>
                <span data-en="Permissions" data-ar="الصلاحيات">Permissions</span>
            </h2>

            <div class="permissions-grid">
                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_users" checked>
                    <i class="fas fa-users permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Users" data-ar="إدارة المستخدمين">Manage Users</div>
                        <div class="permission-desc" data-en="View, edit, suspend users" data-ar="عرض، تعديل، تعليق المستخدمين">View, edit, suspend users</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_athletes" checked>
                    <i class="fas fa-running permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Athletes" data-ar="إدارة اللاعبين">Manage Athletes</div>
                        <div class="permission-desc" data-en="View, edit, suspend athletes" data-ar="عرض، تعديل، تعليق اللاعبين">View, edit, suspend athletes</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_coaches" checked>
                    <i class="fas fa-chalkboard-teacher permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Coaches" data-ar="إدارة المدربين">Manage Coaches</div>
                        <div class="permission-desc" data-en="View, edit, suspend coaches" data-ar="عرض، تعديل، تعليق المدربين">View, edit, suspend coaches</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_teams" checked>
                    <i class="fas fa-shield-alt permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Teams" data-ar="إدارة الفرق">Manage Teams</div>
                        <div class="permission-desc" data-en="View, edit, suspend teams" data-ar="عرض، تعديل، تعليق الفرق">View, edit, suspend teams</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_organizers" checked>
                    <i class="fas fa-building permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Organizers" data-ar="إدارة المنظمين">Manage Organizers</div>
                        <div class="permission-desc" data-en="View, edit, approve organizers" data-ar="عرض، تعديل، الموافقة على المنظمين">View, edit, approve organizers</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_tournaments" checked>
                    <i class="fas fa-trophy permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Tournaments" data-ar="إدارة البطولات">Manage Tournaments</div>
                        <div class="permission-desc" data-en="View, edit, publish tournaments" data-ar="عرض، تعديل، نشر البطولات">View, edit, publish tournaments</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_view_reports">
                    <i class="fas fa-chart-bar permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="View Reports" data-ar="عرض التقارير">View Reports</div>
                        <div class="permission-desc" data-en="Access analytics and statistics" data-ar="الوصول للتحليلات والإحصائيات">Access analytics and statistics</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_admins">
                    <i class="fas fa-user-shield permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Admins" data-ar="إدارة الأدمن">Manage Admins</div>
                        <div class="permission-desc" data-en="Create and manage admin accounts" data-ar="إنشاء وإدارة حسابات الأدمن">Create and manage admin accounts</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_settings">
                    <i class="fas fa-cog permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Settings" data-ar="إدارة الإعدادات">Manage Settings</div>
                        <div class="permission-desc" data-en="Modify system settings" data-ar="تعديل إعدادات النظام">Modify system settings</div>
                    </div>
                </label>

                <label class="permission-item">
                    <input type="checkbox" id="perm_manage_registrations" checked>
                    <i class="fas fa-clipboard-list permission-icon"></i>
                    <div class="permission-text">
                        <div class="permission-title" data-en="Manage Registrations" data-ar="إدارة التسجيلات">Manage Registrations</div>
                        <div class="permission-desc" data-en="Approve/reject registrations" data-ar="الموافقة/رفض التسجيلات">Approve/reject registrations</div>
                    </div>
                </label>
            </div>
        </div>

        <button type="button" class="btn-submit" onclick="window.createAdmin()" id="submitBtn">
            <i class="fas fa-user-plus"></i> <span data-en="Create Admin Account" data-ar="إنشاء حساب الأدمن">Create Admin Account</span>
        </button>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
            
            const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            let currentAdmin = null;
            let currentLang = localStorage.getItem('selectedLanguage') || 'en';

            window.setLang = function(lang) {
                currentLang = lang;
                localStorage.setItem('selectedLanguage', lang);
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    btn.classList.remove('active');
                    if ((lang === 'en' && btn.textContent.trim() === 'EN') ||
                        (lang === 'ar' && btn.textContent.trim() === 'AR')) {
                        btn.classList.add('active');
                    }
                });
                
                document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                    el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
                });

                document.querySelectorAll('[data-placeholder-en][data-placeholder-ar]').forEach(el => {
                    el.placeholder = lang === 'ar' ? el.dataset.placeholderAr : el.dataset.placeholderEn;
                });
            };

            window.handleLogout = async function() {
                if (confirm(currentLang === 'ar' ? 'هل أنت متأكد من تسجيل الخروج؟' : 'Are you sure you want to logout?')) {
                    await supabaseClient.auth.signOut();
                    localStorage.removeItem('currentAdmin');
                    window.location.href = 'admin-login.html';
                }
            };

            function showAlert(message, type) {
                const alert = document.getElementById('alert');
                alert.className = `alert alert-${type} show`;
                alert.textContent = message;
                setTimeout(() => alert.classList.remove('show'), 5000);
            }

            async function checkAuth() {
                const storedAdmin = localStorage.getItem('currentAdmin');
                if (!storedAdmin) {
                    window.location.href = 'admin-login.html';
                    return;
                }

                try {
                    currentAdmin = JSON.parse(storedAdmin);
                    
                    if (currentAdmin.role !== 'super_admin') {
                        showAlert(currentLang === 'ar' ? 'ليس لديك صلاحيات كافية' : 'You do not have sufficient permissions', 'error');
                        setTimeout(() => window.location.href = 'admin-dashboard.html', 2000);
                        return;
                    }

                    document.getElementById('userName').textContent = currentAdmin.full_name || 'Admin';
                } catch (error) {
                    console.error('Auth error:', error);
                    window.location.href = 'admin-login.html';
                }
            }

            window.createAdmin = async function() {
                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;

                if (!fullName || !email || !password) {
                    showAlert(currentLang === 'ar' ? 'يرجى ملء جميع الحقول المطلوبة' : 'Please fill all required fields', 'error');
                    return;
                }

                if (password.length < 8) {
                    showAlert(currentLang === 'ar' ? 'كلمة المرور يجب أن تكون 8 أحرف على الأقل' : 'Password must be at least 8 characters', 'error');
                    return;
                }

                const permissions = {
                    manage_users: document.getElementById('perm_manage_users').checked,
                    manage_athletes: document.getElementById('perm_manage_athletes').checked,
                    manage_coaches: document.getElementById('perm_manage_coaches').checked,
                    manage_teams: document.getElementById('perm_manage_teams').checked,
                    manage_organizers: document.getElementById('perm_manage_organizers').checked,
                    manage_tournaments: document.getElementById('perm_manage_tournaments').checked,
                    view_reports: document.getElementById('perm_view_reports').checked,
                    manage_admins: document.getElementById('perm_manage_admins').checked,
                    manage_settings: document.getElementById('perm_manage_settings').checked,
                    manage_registrations: document.getElementById('perm_manage_registrations').checked
                };

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (currentLang === 'ar' ? 'جاري الإنشاء...' : 'Creating...');

                try {
                    // 1. Create user in auth.users
                    const { data: authData, error: authError } = await supabaseClient.auth.admin.createUser({
                        email: email,
                        password: password,
                        email_confirm: true,
                        user_metadata: {
                            full_name: fullName,
                            user_type: 'admin'
                        }
                    });

                    if (authError) throw authError;

                    const userId = authData.user.id;

                    // 2. Insert into admin_profiles
                    const { error: profileError } = await supabaseClient
                        .from('admin_profiles')
                        .insert([{
                            id: userId,
                            full_name: fullName,
                            email: email,
                            role: role,
                            permissions: permissions,
                            created_by: currentAdmin.id,
                            created_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        }]);

                    if (profileError) throw profileError;

                    // 3. Log activity
                    await supabaseClient
                        .from('admin_activity_logs')
                        .insert([{
                            admin_id: currentAdmin.id,
                            admin_email: currentAdmin.email,
                            action: 'CREATE_ADMIN',
                            table_name: 'admin_profiles',
                            record_id: userId,
                            new_values: { full_name: fullName, email: email, role: role, permissions: permissions }
                        }]);

                    // 4. Create notification
                    await supabaseClient
                        .from('admin_notifications')
                        .insert([{
                            admin_id: currentAdmin.id,
                            title: currentLang === 'ar' ? 'تم إنشاء أدمن جديد' : 'New Admin Created',
                            message: currentLang === 'ar' ? `تم إنشاء حساب أدمن جديد: ${fullName}` : `New admin account created: ${fullName}`,
                            type: 'success',
                            link: 'admin-subadmins.html'
                        }]);

                    showAlert(currentLang === 'ar' ? '✅ تم إنشاء حساب الأدمن بنجاح!' : '✅ Admin account created successfully!', 'success');

                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 2000);

                } catch (error) {
                    console.error('Error creating admin:', error);
                    showAlert(currentLang === 'ar' ? 'خطأ: ' + error.message : 'Error: ' + error.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> ' + (currentLang === 'ar' ? 'إنشاء حساب الأدمن' : 'Create Admin Account');
                }
            };

            window.addEventListener('DOMContentLoaded', () => {
                checkAuth();
                window.setLang(currentLang);
            });
        })();
    </script>
</body>
</html>
