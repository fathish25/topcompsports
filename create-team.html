<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --white: #FFFFFF;
            --light-bg: #F8FAFC;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--light-bg); color: var(--black); min-height: 100vh; }

        .header { background: var(--black); padding: 15px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-blue); }
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-text { font-size: 24px; font-weight: bold; color: var(--primary-blue); }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; }
        .nav a:hover { color: var(--accent-yellow); }

        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .page-header { background: var(--gradient-blue); color: var(--white); padding: 30px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .page-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .page-header p { opacity: 0.9; }

        .form-card { background: var(--white); border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .form-card h2 { color: var(--dark-blue); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #E5E7EB; font-size: 1.3rem; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--black); }
        .form-label .required { color: #EF4444; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 12px 15px; border: 2px solid #E5E7EB; border-radius: 8px; font-size: 1rem; transition: all 0.3s; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--primary-blue); }
        .form-textarea { min-height: 100px; resize: vertical; }
        .form-hint { font-size: 0.85rem; color: #64748B; margin-top: 5px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .file-upload { border: 2px dashed #E5E7EB; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .file-upload:hover { border-color: var(--primary-blue); background: rgba(0,102,204,0.02); }
        .file-upload i { font-size: 48px; color: var(--primary-blue); margin-bottom: 10px; }
        .file-upload p { color: #64748B; }
        .file-upload input { display: none; }
        .file-preview { margin-top: 15px; }
        .file-preview img { max-width: 200px; max-height: 200px; border-radius: 8px; }

        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .checkbox-group input { width: 20px; height: 20px; accent-color: var(--primary-blue); }

        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--gradient-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.3); }
        .btn-secondary { background: var(--white); color: var(--primary-blue); border: 2px solid var(--primary-blue); }
        .btn-secondary:hover { background: var(--primary-blue); color: var(--white); }

        .form-actions { display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px; }

        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #EF4444; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #10B981; }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .nav { display: none; }
            .container { margin: 20px auto; }
            .form-row { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-text">TopCompSports</div>
        </a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="coach-dashboard.html">Dashboard</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-shield-alt"></i> Create New Team</h1>
            <p>Fill in the information below to create your team</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="createTeamForm">
            <div class="form-card">
                <h2>Basic Information</h2>
                
                <div class="form-group">
                    <label class="form-label">Team Name <span class="required">*</span></label>
                    <input type="text" id="teamName" class="form-input" required placeholder="Enter team name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Country <span class="required">*</span></label>
                        <select id="country" class="form-select" required>
                            <option value="">Select country</option>
                            <option value="Egypt">Egypt - مصر</option>
                            <option value="Saudi Arabia">Saudi Arabia - السعودية</option>
                            <option value="UAE">UAE - الإمارات</option>
                            <option value="Qatar">Qatar - قطر</option>
                            <option value="Kuwait">Kuwait - الكويت</option>
                            <option value="Bahrain">Bahrain - البحرين</option>
                            <option value="Oman">Oman - عمان</option>
                            <option value="Jordan">Jordan - الأردن</option>
                            <option value="Lebanon">Lebanon - لبنان</option>
                            <option value="Morocco">Morocco - المغرب</option>
                            <option value="Tunisia">Tunisia - تونس</option>
                            <option value="Algeria">Algeria - الجزائر</option>
                            <option value="Libya">Libya - ليبيا</option>
                            <option value="Iraq">Iraq - العراق</option>
                            <option value="Palestine">Palestine - فلسطين</option>
                            <option value="Yemen">Yemen - اليمن</option>
                            <option value="Sudan">Sudan - السودان</option>
                            <option value="Somalia">Somalia - الصومال</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Australia">Australia</option>
                            <option value="Germany">Germany</option>
                            <option value="France">France</option>
                            <option value="Spain">Spain</option>
                            <option value="Italy">Italy</option>
                            <option value="Netherlands">Netherlands</option>
                            <option value="Brazil">Brazil</option>
                            <option value="Argentina">Argentina</option>
                            <option value="Other">Other - أخرى</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">City <span class="required">*</span></label>
                        <input type="text" id="city" class="form-input" required placeholder="Enter city">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Address</label>
                    <input type="text" id="address" class="form-input" placeholder="Enter full address">
                </div>
            </div>

            <div class="form-card">
                <h2>Contact Information</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Person in Charge</label>
                        <input type="text" id="personInCharge" class="form-input" placeholder="Name of person in charge">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="teamEmail" class="form-input" placeholder="team@email.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input type="tel" id="teamPhone" class="form-input" placeholder="+1 (234) 567-8900">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Website</label>
                        <input type="url" id="website" class="form-input" placeholder="https://example.com">
                    </div>
                </div>
            </div>

            <div class="form-card">
                <h2>Team Details</h2>
                
                <div class="form-group">
                    <label class="form-label">About Team</label>
                    <textarea id="about" class="form-textarea" placeholder="Tell us about your team..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Sports</label>
                    <select id="sports" class="form-select" multiple size="4">
                        <option value="Jiu-Jitsu">Jiu-Jitsu</option>
                        <option value="MMA">MMA</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="Grappling">Grappling</option>
                        <option value="Wrestling">Wrestling</option>
                        <option value="Boxing">Boxing</option>
                    </select>
                    <div class="form-hint">Hold Ctrl/Cmd to select multiple sports</div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="autoApprove">
                    <label for="autoApprove">Auto-approve member join requests</label>
                </div>
            </div>

            <div class="form-card">
                <h2>Team Branding</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Team Logo</label>
                        <div class="file-upload" onclick="document.getElementById('logoInput').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload logo (PNG, JPG - Max 2MB)</p>
                            <input type="file" id="logoInput" accept="image/*" onchange="handleFileUpload(event, 'logo')">
                        </div>
                        <div class="file-preview" id="logoPreview"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Team Cover Photo</label>
                        <div class="file-upload" onclick="document.getElementById('coverInput').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload cover photo (PNG, JPG - Max 5MB)</p>
                            <input type="file" id="coverInput" accept="image/*" onchange="handleFileUpload(event, 'cover')">
                        </div>
                        <div class="file-preview" id="coverPreview"></div>
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='coach-dashboard.html'">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Create Team
                </button>
            </div>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let logoFile = null;
        let coverFile = null;

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        function handleFileUpload(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            const maxSize = type === 'logo' ? 2 * 1024 * 1024 : 5 * 1024 * 1024;
            if (file.size > maxSize) {
                showAlert(`File size must be less than ${type === 'logo' ? '2MB' : '5MB'}`, 'error');
                return;
            }

            if (!file.type.startsWith('image/')) {
                showAlert('Please select an image file', 'error');
                return;
            }

            if (type === 'logo') {
                logoFile = file;
            } else {
                coverFile = file;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById(`${type}Preview`);
                preview.innerHTML = `<img src="${e.target.result}" alt="${type} preview">`;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('createTeamForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

            try {
                // 1. التحقق من تسجيل الدخول
                const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
                
                if (authError || !user) {
                    showAlert('Please login first', 'error');
                    window.location.href = 'login.html';
                    return;
                }

                console.log('User ID:', user.id);
                console.log('User Email:', user.email);

                // 2. البحث عن coach_id باستخدام email (أكثر موثوقية)
                const { data: coachData, error: coachError } = await supabaseClient
                    .from('coaches')
                    .select('id')
                    .eq('email', user.email)
                    .maybeSingle();

                if (coachError) {
                    console.error('Coach query error:', coachError);
                }

                if (!coachData) {
                    showAlert('⚠️ Coach profile not found. Please contact admin.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-save"></i> Create Team';
                    return;
                }

                const coachId = coachData.id;
                console.log('✅ Coach ID found:', coachId);

                // 3. رفع الشعار (اختياري)
                let logoUrl = null;
                if (logoFile) {
                    const fileExt = logoFile.name.split('.').pop();
                    const fileName = `teams/${Date.now()}-logo.${fileExt}`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('tournament_images')
                        .upload(fileName, logoFile);
                    if (uploadError) throw uploadError;
                    const { data: urlData } = supabaseClient.storage
                        .from('tournament_images')
                        .getPublicUrl(fileName);
                    logoUrl = urlData.publicUrl;
                }

                // 4. رفع صورة الغلاف (اختياري)
                let coverUrl = null;
                if (coverFile) {
                    const fileExt = coverFile.name.split('.').pop();
                    const fileName = `teams/${Date.now()}-cover.${fileExt}`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('tournament_images')
                        .upload(fileName, coverFile);
                    if (uploadError) throw uploadError;
                    const { data: urlData } = supabaseClient.storage
                        .from('tournament_images')
                        .getPublicUrl(fileName);
                    coverUrl = urlData.publicUrl;
                }

                // 5. جمع الرياضات المختارة
                const sportsSelect = document.getElementById('sports');
                const sportsArray = Array.from(sportsSelect.selectedOptions).map(opt => opt.value);

                // 6. تجهيز بيانات الفريق
                const teamData = {
                    name: document.getElementById('teamName').value.trim(),
                    country: document.getElementById('country').value,
                    city: document.getElementById('city').value.trim(),
                    address: document.getElementById('address').value.trim() || null,
                    person_in_charge: document.getElementById('personInCharge').value.trim() || null,
                    email: document.getElementById('teamEmail').value.trim() || null,
                    phone: document.getElementById('teamPhone').value.trim() || null,
                    website: document.getElementById('website').value.trim() || null,
                    description: document.getElementById('about').value.trim() || null,
                    sports: sportsArray.length > 0 ? sportsArray : null,
                    auto_approve_members: document.getElementById('autoApprove').checked,
                    logo_url: logoUrl,
                    cover_url: coverUrl,
                    is_active: true,
                    coach_id: coachId,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                console.log('Creating team with data:', teamData);

                // 7. إرسال البيانات إلى جدول teams
                const { error: insertError } = await supabaseClient
                    .from('teams')
                    .insert([teamData])
                    .select();

                if (insertError) throw insertError;

                showAlert('✅ Team created successfully! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'coach-dashboard.html', 2000);

            } catch (error) {
                console.error('Error:', error);
                showAlert('❌ Error: ' + error.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save"></i> Create Team';
            }
        });
    </script>
</body>
</html>
