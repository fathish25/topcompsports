<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach Management - TopCompSports Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================================
           1. CORE THEME & SIDEBAR (Unified Dark)
           ========================================= */
        :root {
            --bg-dark: #0a0e17; 
            --bg-card: #151d2b; 
            --bg-input: rgba(255,255,255,0.05);
            --primary: #2563EB; 
            --accent: #f1c40f; 
            --accent-dark: #d4a017;
            --text-main: #ffffff; 
            --text-muted: rgba(255,255,255,0.7);
            --success: #10b981; 
            --warning: #f59e0b; 
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }

        .sidebar { 
            width: 280px; 
            background: rgba(21, 29, 43, 0.98); 
            position: fixed; 
            top: 0; 
            height: 100vh; 
            overflow-y: auto;
            padding: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        [dir="rtl"] .sidebar { right: 0; left: auto; border-left: 2px solid var(--primary); }
        [dir="ltr"] .sidebar { left: 0; right: auto; border-right: 2px solid var(--primary); }
        
        .logo { display: flex; align-items: center; gap: 15px; padding: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: var(--bg-dark); }
        .logo-text { font-size: 22px; font-weight: bold; color: var(--text-main); }
        
        .sidebar nav { flex: 1; overflow-y: auto; }
        .nav-item { padding: 15px 20px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-main); }
        .nav-item:hover { background: rgba(255,255,255,0.05); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary), #1d4ed8); }
        .nav-item .icon { font-size: 1.3rem; width: 24px; text-align: center; }
        
        .role-badge { background: var(--accent); color: var(--bg-dark); padding: 8px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-top: auto; text-align: center; }

        .main-content { padding: 30px; }
        [dir="rtl"] .main-content { margin-right: 280px; }
        [dir="ltr"] .main-content { margin-left: 280px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 20px; background: var(--bg-card); border-radius: 15px; flex-wrap: wrap; gap: 15px; }
        .page-title { font-size: 2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #1d4ed8); display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-logout { background: var(--danger); color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .lang-switcher { display: flex; gap: 5px; background: var(--bg-input); padding: 5px; border-radius: 8px; }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 6px; font-weight: 600; }
        .lang-btn.active { background: var(--primary); color: white; }

        /* =========================================
           2. COACH CARDS LAYOUT (Like Documents)
           ========================================= */
        .coaches-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); 
            gap: 25px; 
        }

        .coach-card { 
            background: var(--bg-card); 
            border-radius: 15px; 
            padding: 25px; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-header { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            margin-bottom: 25px; 
            padding-bottom: 20px; 
            border-bottom: 2px solid rgba(255,255,255,0.1); 
        }
        .avatar { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            overflow: hidden; 
            background: linear-gradient(135deg, var(--primary), #1d4ed8); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            font-weight: bold;
            flex-shrink: 0;
            border: 3px solid var(--accent);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .coach-info h3 { font-size: 1.4rem; margin-bottom: 5px; color: var(--text-main); }
        .coach-info p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 3px; }
        
        .status-badge { 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: bold; 
            display: inline-block; 
            margin-top: 5px;
        }
        .status-pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .status-verified { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .status-rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .documents-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .document-section { }
        .document-label { 
            font-weight: 600; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            color: var(--accent);
            font-size: 0.95rem;
        }
        
        .document-preview { 
            border: 2px dashed rgba(255,255,255,0.2); 
            border-radius: 12px; 
            padding: 15px; 
            text-align: center; 
            background: var(--bg-input);
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .document-preview:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.1);
        }
        .document-preview img { 
            max-width: 100%; 
            max-height: 180px; 
            border-radius: 8px; 
            object-fit: contain;
        }
        .document-preview .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .document-preview:hover .overlay { opacity: 1; }
        .document-preview .overlay i { font-size: 2.5rem; color: white; }

        .document-preview .no-doc { color: var(--text-muted); font-size: 3rem; }
        .document-preview .no-doc-text { margin-top: 10px; color: var(--text-muted); font-size: 0.9rem; }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: var(--bg-input);
            border-radius: 10px;
        }
        .info-item { text-align: center; }
        .info-item .label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .info-item .value { font-weight: 700; color: var(--text-main); font-size: 1.1rem; }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn { 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }
        .btn-verify { background: var(--success); color: white; }
        .btn-verify:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.4); }
        .btn-reject { background: var(--danger); color: white; }
        .btn-reject:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(239,68,68,0.4); }
        .btn-secondary { background: var(--bg-input); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

        .alert { padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: var(--success); border: 1px solid var(--success); }

        @media (max-width: 1024px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin: 0; padding: 20px; }
            .coaches-grid { grid-template-columns: 1fr; }
            .documents-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <nav>
            <a href="admin-dashboard.html" class="nav-item"><span class="icon"><i class="fas fa-chart-line"></i></span> <span data-en="Dashboard" data-ar="لوحة التحكم">Dashboard</span></a>
            <a href="admin-users.html" class="nav-item"><span class="icon"><i class="fas fa-users"></i></span> <span data-en="Users" data-ar="المستخدمون">Users</span></a>
            <a href="admin-athletes.html" class="nav-item"><span class="icon"><i class="fas fa-running"></i></span> <span data-en="Athletes" data-ar="اللاعبون">Athletes</span></a>
            <a href="admin-athlete-documents.html" class="nav-item"><span class="icon"><i class="fas fa-id-card"></i></span> <span data-en="Athlete Documents" data-ar="وثائق اللاعبين">Athlete Documents</span></a>
            <a href="admin-coaches.html" class="nav-item active"><span class="icon"><i class="fas fa-chalkboard-teacher"></i></span> <span data-en="Coaches" data-ar="المدربون">Coaches</span></a>
            <a href="admin-teams.html" class="nav-item"><span class="icon"><i class="fas fa-shield-alt"></i></span> <span data-en="Teams" data-ar="الفرق">Teams</span></a>
            <a href="admin-organizations.html" class="nav-item"><span class="icon"><i class="fas fa-building"></i></span> <span data-en="Organizers" data-ar="المنظمون">Organizers</span></a>
            <a href="admin-tournaments.html" class="nav-item"><span class="icon"><i class="fas fa-trophy"></i></span> <span data-en="Tournaments" data-ar="البطولات">Tournaments</span></a>
            <a href="admin-reports.html" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> <span data-en="Reports" data-ar="التقارير">Reports</span></a>
            <a href="admin-settings.html" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> <span data-en="Settings" data-ar="الإعدادات">Settings</span></a>
        </nav>
        <div class="role-badge" data-en="Super Admin" data-ar="سوبر أدمن">Super Admin</div>
    </aside>

    <main class="main-content">
        <div class="header">
            <h1 class="page-title"><i class="fas fa-chalkboard-teacher" style="color: var(--accent);"></i> <span data-en="Coach Management" data-ar="إدارة المدربين">Coach Management</span></h1>
            <div class="user-info">
                <div class="lang-switcher">
                    <button class="lang-btn" id="btnEn" onclick="window.setLang('en')">EN</button>
                    <button class="lang-btn" id="btnAr" onclick="window.setLang('ar')">عربي</button>
                </div>
                <div class="user-avatar" id="userAvatar">A</div>
                <span id="userName">Admin</span>
                <button class="btn-logout" onclick="handleLogout()" data-en="Logout" data-ar="تسجيل الخروج">Logout</button>
            </div>
        </div>

        <div id="alert" class="alert"></div>

        <div class="coaches-grid" id="coachesGrid">
            <div style="text-align: center; padding: 60px; color: var(--text-muted); grid-column: 1 / -1;">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; margin-bottom: 20px; color: var(--primary);"></i>
                <p data-en="Loading coaches..." data-ar="جاري تحميل المدربين...">Loading coaches...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allCoaches = [];
        let currentLang = localStorage.getItem('adminLang') || 'en';

        window.setLang = function(lang) {
            currentLang = lang;
            localStorage.setItem('adminLang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                el.textContent = lang === 'ar' ? el.dataset.ar : el.dataset.en;
            });
        };

        window.onload = async () => {
            window.setLang(currentLang);
            await loadCoaches();
        };

        async function loadCoaches() {
            try {
                const { data: coaches, error } = await supabaseClient
                    .from('coaches')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;

                const grid = document.getElementById('coachesGrid');
                
                if (!coaches || coaches.length === 0) {
                    grid.innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-muted);">No coaches found</div>';
                    return;
                }

                allCoaches = coaches;

                grid.innerHTML = coaches.map(c => {
                    const statusClass = c.verification_status === 'verified' ? 'status-verified' : (c.verification_status === 'rejected' ? 'status-rejected' : 'status-pending');
                    const statusText = c.verification_status === 'verified' ? 
                        (currentLang === 'ar' ? 'موثق' : 'Verified') : 
                        (c.verification_status === 'rejected' ? (currentLang === 'ar' ? 'مرفوض' : 'Rejected') : (currentLang === 'ar' ? 'قيد الانتظار' : 'Pending'));

                    const profileHtml = c.profile_photo_url ? 
                        `<img src="${c.profile_photo_url}" alt="Profile">
                         <div class="overlay"><i class="fas fa-search-plus"></i></div>` :
                        `<div><div class="no-doc"><i class="fas fa-user"></i></div><div class="no-doc-text" data-en="No photo" data-ar="لا توجد صورة">No photo</div></div>`;

                    const idHtml = c.id_document_url ? 
                        `<img src="${c.id_document_url}" alt="ID Document">
                         <div class="overlay"><i class="fas fa-search-plus"></i></div>` :
                        `<div><div class="no-doc"><i class="fas fa-id-card"></i></div><div class="no-doc-text" data-en="No ID" data-ar="لا توجد هوية">No ID</div></div>`;

                    const profileClick = c.profile_photo_url ? `window.open('${c.profile_photo_url}', '_blank')` : '';
                    const idClick = c.id_document_url ? `window.open('${c.id_document_url}', '_blank')` : '';

                    return `
                    <div class="coach-card">
                        <div class="card-header">
                            <div class="avatar">
                                ${c.profile_photo_url ? 
                                    `<img src="${c.profile_photo_url}" alt="${c.full_name}">` :
                                    (c.full_name || 'C').charAt(0).toUpperCase()
                                }
                            </div>
                            <div class="coach-info">
                                <h3>${c.full_name || 'Unknown'}</h3>
                                <p>${c.email || ''}</p>
                                <p>${c.phone || ''}</p>
                                <span class="status-badge ${statusClass}">${statusText}</span>
                            </div>
                        </div>

                        <div class="documents-row">
                            <div class="document-section">
                                <div class="document-label">
                                    <i class="fas fa-user"></i>
                                    <span data-en="Profile Photo" data-ar="صورة البروفايل">Profile Photo</span>
                                </div>
                                <div class="document-preview" onclick="${profileClick}">
                                    ${profileHtml}
                                </div>
                            </div>

                            <div class="document-section">
                                <div class="document-label">
                                    <i class="fas fa-id-card"></i>
                                    <span data-en="ID Document" data-ar="وثيقة الهوية">ID Document</span>
                                </div>
                                <div class="document-preview" onclick="${idClick}">
                                    ${idHtml}
                                </div>
                            </div>
                        </div>

                        <div class="info-row">
                            <div class="info-item">
                                <div class="label" data-en="Date of Birth" data-ar="تاريخ الميلاد">Date of Birth</div>
                                <div class="value">${c.date_of_birth ? new Date(c.date_of_birth).toLocaleDateString('en-GB') : 'N/A'}</div>
                            </div>
                            <div class="info-item">
                                <div class="label" data-en="Age" data-ar="العمر">Age</div>
                                <div class="value">${calculateAge(c.date_of_birth)} years</div>
                            </div>
                        </div>

                        <div class="action-btns">
                            <button class="btn btn-verify" onclick="verifyCoach('${c.id}', '${c.verification_status}')">
                                <i class="fas fa-check"></i> 
                                <span data-en="Verify Coach" data-ar="التحقق من المدرب">Verify Coach</span>
                            </button>
                            <button class="btn btn-reject" onclick="rejectCoach('${c.id}')">
                                <i class="fas fa-times"></i> 
                                <span data-en="Reject" data-ar="رفض">Reject</span>
                            </button>
                        </div>
                    </div>
                `}).join('');

                window.setLang(currentLang);

            } catch (error) {
                console.error('Error:', error);
                showAlert('Error: ' + error.message, 'error');
            }
        }

        function calculateAge(dateOfBirth) {
            if (!dateOfBirth) return 'N/A';
            const today = new Date();
            const birthDate = new Date(dateOfBirth);
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
            return age;
        }

        async function verifyCoach(coachId, currentStatus) {
            const newStatus = currentStatus === 'verified' ? 'pending' : 'verified';
            if (!confirm(currentLang === 'ar' ? 'هل أنت متأكد؟' : 'Are you sure?')) return;

            try {
                const { error } = await supabaseClient.from('coaches').update({ 
                    verification_status: newStatus,
                    updated_at: new Date().toISOString()
                }).eq('id', coachId);

                if (error) throw error;
                showAlert(currentLang === 'ar' ? '✅ تم بنجاح' : '✅ Success!', 'success');
                loadCoaches();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        async function rejectCoach(coachId) {
            if (!confirm(currentLang === 'ar' ? 'هل تريد رفض هذا المدرب؟' : 'Reject this coach?')) return;
            try {
                await supabaseClient.from('coaches').update({ 
                    verification_status: 'rejected',
                    updated_at: new Date().toISOString()
                }).eq('id', coachId);
                showAlert(currentLang === 'ar' ? '✅ تم الرفض' : '✅ Rejected', 'success');
                loadCoaches();
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
            }
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 4000);
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('currentAdmin');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
