<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 TopCompSports Tournament Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   التصميم الأساسي - مطابق للموقع الأصلي
   ============================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  background: #0a0e17; 
  color: #fff; 
  padding: 10px; 
}
.container { max-width: 1600px; margin: 0 auto; }

/* الأزرار */
.btn { 
  padding: 10px 18px; 
  border: none; 
  border-radius: 8px; 
  font-weight: bold; 
  cursor: pointer; 
  margin: 3px; 
  transition: all 0.2s; 
  display: inline-flex; 
  align-items: center; 
  gap: 6px; 
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #27ae60; color: #fff; }
.btn-secondary { background: #34495e; color: #fff; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-warning { background: #f39c12; color: #000; }
.btn-info { background: #2980b9; color: #fff; }
.btn-purple { background: #8e44ad; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }

/* الأقسام */
.section { 
  background: #1a1f2e; 
  border-radius: 12px; 
  padding: 20px; 
  margin-bottom: 15px; 
  border: 1px solid #2a3548; 
}
.section-title { 
  font-size: 1.3rem; 
  font-weight: bold; 
  color: #f1c40f; 
  margin-bottom: 15px; 
  border-bottom: 2px solid #2a3548; 
  padding-bottom: 10px; 
}

/* الهيدر */
.header { 
  background: #151d2b; 
  padding: 15px 25px; 
  border-radius: 12px; 
  margin-bottom: 15px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  flex-wrap: wrap; 
  gap: 10px; 
}
.header h1 { color: #f1c40f; font-size: 1.5rem; }

/* الجداول */
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2a3548; }
th { background: #151d2b; color: #8899aa; font-size: 0.8rem; text-transform: uppercase; }

/* حقول الإدخال */
input, select { 
  background: #0f1724; 
  border: 1px solid #2a3548; 
  color: #fff; 
  padding: 6px 10px; 
  border-radius: 5px; 
  font-size: 0.85rem; 
  width: 100%; 
}
input:focus, select:focus { outline: none; border-color: #f1c40f; }

/* المشاهد (Views) */
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* مؤشر المزامنة */
.sync-indicator { 
  position: fixed; 
  top: 10px; 
  right: 10px; 
  padding: 8px 15px; 
  background: #27ae60; 
  color: #fff; 
  border-radius: 20px; 
  font-size: 0.85rem; 
  font-weight: bold; 
  z-index: 9999; 
  display: none; 
  box-shadow: 0 4px 15px rgba(39,174,96,0.4); 
}
.sync-indicator.active { display: block; animation: syncPulse 1s ease-in-out; }
@keyframes syncPulse { 
  0% { transform: scale(0.8); opacity: 0; } 
  50% { transform: scale(1.1); } 
  100% { transform: scale(1); opacity: 1; } 
}

/* ============================================
   التصميم المتجاوب للموبايل
   ============================================ */
@media (max-width: 900px) {
  .header { 
    flex-direction: column; 
    align-items: stretch; 
  }
  .header > div { 
    margin-bottom: 10px; 
  }
  .header h1 { 
    font-size: 1.2rem; 
  }
  .btn { 
    width: 100%; 
    justify-content: center; 
  }
  table { 
    font-size: 0.85rem; 
  }
  th, td { 
    padding: 6px 4px; 
  }
  .section { 
    padding: 15px; 
  }
}

@media (max-width: 600px) {
  body { padding: 5px; }
  .container { padding: 0; }
  .section-title { font-size: 1.1rem; }
}
</style>
</head>
<body>

<div class="sync-indicator" id="syncIndicator">🔄 Data Synced</div>

<div class="container">
  <!-- الهيدر -->
  <div class="header">
    <div>
      <h1 id="tournamentTitle">🏆 Tournament Manager</h1>
      <div style="color: #8899aa; font-size: 0.85rem;" id="subtitle">Loading...</div>
      <div style="color: #2ecc71; font-size: 0.8rem; margin-top: 5px;" id="dbStatus">● Connecting...</div>
    </div>
    <div>
      <button class="btn btn-info" onclick="showView('players')">👥 Players</button>
      <button class="btn btn-warning" onclick="showView('settings')">⚙️ Settings</button>
      <button class="btn btn-danger" onclick="clearTournamentPlayers()">⚠️ Clear Players</button>
      <button class="btn btn-danger" style="background: #e74c3c;" onclick="deleteTournamentComplete()" id="deleteTournamentBtn">🗑️ Delete Tournament</button>
    </div>
  </div>

  <!-- عرض اللاعبين -->
  <div id="view-players" class="view active">
    <div class="section">
      <div class="section-title">
        👥 Players Registration 
        <span id="playerCount" style="color: #8899aa; font-size: 0.9rem;">0</span>
      </div>
      <div style="margin-bottom: 15px;">
        <button class="btn btn-primary" onclick="addPlayer()">➕ Add Player</button>
        <button class="btn btn-info" onclick="exportCSV()">📤 Export CSV</button>
      </div>
      <div style="max-height: 500px; overflow-y: auto;">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Team</th>
              <th>Age Group</th>
              <th>Gender</th>
              <th>Weight</th>
              <th>Belt</th>
              <th>Rank</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="playersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- عرض الإعدادات -->
  <div id="view-settings" class="view">
    <div class="section">
      <div class="section-title">⚙️ Settings</div>
      <p style="color: #8899aa; margin-bottom: 15px;">Tournament settings and configuration</p>
      <button class="btn btn-secondary" onclick="showView('players')">← Back to Players</button>
    </div>
  </div>
</div>

<script>
// ============================================
// 1. Supabase Configuration
// ============================================
const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================
// 2. Global State
// ============================================
let currentTournamentId = null;
let currentUserRole = null;
let currentUser = null;
let players = [];
let tournamentData = null;

const AGE_GROUPS = {
  'Kids 1': { age: '4-5', time: 2 },
  'Kids 2': { age: '6-7', time: 2 },
  'Kids 3': { age: '8-9', time: 2 },
  'Infant': { age: '10-11', time: 3 },
  'Junior': { age: '12-13', time: 3 },
  'Teen': { age: '14-15', time: 3 },
  'Youth': { age: '16-17', time: 4 },
  'Amateur/Professional': { age: '18-29', time: 5 },
  'Master 1': { age: '30-35', time: 5 },
  'Master 2': { age: '36-40', time: 5 },
  'Master 3': { age: '41-45', time: 5 },
  'Master 4': { age: '46+', time: 5 }
};

// ============================================
// 3. Initialization
// ============================================
window.onload = async function() {
  const urlParams = new URLSearchParams(window.location.search);
  currentTournamentId = urlParams.get('tournament_id');
  
  if (!currentTournamentId) {
    showError('⚠️ No tournament_id in URL. Please open with ?tournament_id=YOUR_ID');
    return;
  }
  
  await initializeApp();
};

async function initializeApp() {
  try {
    // 1. التحقق من المستخدم
    await checkCurrentUser();
    
    // 2. تحميل معلومات البطولة
    await loadTournamentInfo();
    
    // 3. التحقق من الصلاحيات
    await checkUserPermissions();
    
    // 4. تحميل اللاعبين
    await loadPlayers();
    
    // 5. تحديث الواجهة
    updateUI();
    
    document.getElementById('dbStatus').innerHTML = '✅ Connected to Database';
    document.getElementById('dbStatus').style.color = '#2ecc71';
  } catch (error) {
    console.error('Initialization error:', error);
    showError('Error: ' + error.message);
  }
}

async function checkCurrentUser() {
  const { data: { user }, error } = await dbClient.auth.getUser();
  
  if (error || !user) {
    currentUser = null;
    currentUserRole = 'anon';
    console.log('No authenticated user');
    return;
  }
  
  currentUser = user;
  
  // الحصول على دور المستخدم من جدول profiles
  const { data: profile } = await dbClient
    .from('profiles')
    .select('role')
    .eq('id', user.id)
    .single();
  
  currentUserRole = profile?.role || 'authenticated';
  console.log('User role:', currentUserRole);
}

async function loadTournamentInfo() {
  // محاولة الجلب من جدول tournaments
  let { data: tData, error } = await dbClient
    .from('tournaments')
    .select('name, status, organizer_id')
    .eq('id', currentTournamentId)
    .single();
  
  if (error || !tData) {
    // محاولة من جدول events
    const { data: eData } = await dbClient
      .from('events')
      .select('name, status')
      .eq('id', currentTournamentId)
      .single();
    tData = eData;
  }
  
  tournamentData = tData;
  
  if (tData && tData.name) {
    document.getElementById('tournamentTitle').innerText = `🏆 ${tData.name}`;
    document.getElementById('subtitle').innerText = `Tournament ID: ${currentTournamentId} | Status: ${tData.status || 'draft'}`;
  } else {
    document.getElementById('tournamentTitle').innerText = '🏆 Tournament Manager';
    document.getElementById('subtitle').innerText = `ID: ${currentTournamentId}`;
  }
}

async function checkUserPermissions() {
  // التحقق من صلاحيات المستخدم
  const isAdmin = currentUserRole === 'admin' || currentUserRole === 'super_admin';
  const isOrganizer = currentUserRole === 'organizer';
  
  console.log('Permissions:', { isAdmin, isOrganizer });
  
  return { isAdmin, isOrganizer };
}

async function loadPlayers() {
  document.getElementById('dbStatus').innerHTML = '🔄 Loading players...';
  
  const { data, error } = await dbClient
    .from('tournament_participants')
    .select('*')
    .eq('tournament_id', currentTournamentId)
    .order('ranking', { ascending: true });
  
  if (error) {
    console.error('Error loading players:', error);
    throw error;
  }
  
  players = (data || []).map(p => ({
    id: p.id,
    name: p.player_name || '',
    team: p.team || '',
    ageGroup: p.age_group || 'Amateur/Professional',
    gender: p.gender || 'Men',
    weight: p.weight || '',
    belt: p.belt_level || 'White',
    rank: p.ranking || 0
  }));
  
  renderPlayers();
  document.getElementById('dbStatus').innerHTML = `✅ Loaded ${players.length} players`;
}

// ============================================
// 4. Player Management
// ============================================
async function addPlayer() {
  const newPlayer = {
    player_name: 'New Player',
    team: '',
    age_group: 'Amateur/Professional',
    gender: 'Men',
    weight: '',
    belt_level: 'White',
    ranking: players.length + 1,
    tournament_id: currentTournamentId
  };
  
  const { data, error } = await dbClient
    .from('tournament_participants')
    .insert(newPlayer)
    .select()
    .single();
  
  if (error) {
    alert('❌ Error adding player: ' + error.message);
    return;
  }
  
  players.push({
    id: data.id,
    name: data.player_name,
    team: data.team,
    ageGroup: data.age_group,
    gender: data.gender,
    weight: data.weight,
    belt: data.belt_level,
    rank: data.ranking
  });
  
  renderPlayers();
  showSyncIndicator();
}

async function updatePlayer(index, field, value) {
  const player = players[index];
  player[field] = value;
  
  const fieldMap = {
    'name': 'player_name',
    'ageGroup': 'age_group',
    'belt': 'belt_level',
    'rank': 'ranking'
  };
  
  const dbField = fieldMap[field] || field;
  
  const { error } = await dbClient
    .from('tournament_participants')
    .update({ [dbField]: value })
    .eq('id', player.id);
  
  if (error) {
    console.error('Error updating player:', error);
    alert('❌ Error updating: ' + error.message);
    return;
  }
  
  showSyncIndicator();
}

async function deletePlayer(index) {
  if (!confirm('⚠️ Are you sure you want to delete this player?')) return;
  
  const player = players[index];
  
  const { error } = await dbClient
    .from('tournament_participants')
    .delete()
    .eq('id', player.id);
  
  if (error) {
    alert('❌ Error deleting: ' + error.message);
    return;
  }
  
  players.splice(index, 1);
  renderPlayers();
  showSyncIndicator();
}

function renderPlayers() {
  const tbody = document.getElementById('playersTable');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  players.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i + 1}</td>
      <td><input type="text" value="${p.name}" onchange="updatePlayer(${i}, 'name', this.value)" placeholder="Name"></td>
      <td><input type="text" value="${p.team}" onchange="updatePlayer(${i}, 'team', this.value)" placeholder="Team"></td>
      <td>
        <select onchange="updatePlayer(${i}, 'ageGroup', this.value)">
          ${Object.keys(AGE_GROUPS).map(a => `<option ${p.ageGroup===a?'selected':''}>${a}</option>`).join('')}
        </select>
      </td>
      <td>
        <select onchange="updatePlayer(${i}, 'gender', this.value)">
          <option ${p.gender==='Men'?'selected':''}>Men</option>
          <option ${p.gender==='Women'?'selected':''}>Women</option>
        </select>
      </td>
      <td><input type="text" value="${p.weight}" onchange="updatePlayer(${i}, 'weight', this.value)" placeholder="e.g. -77kg"></td>
      <td>
        <select onchange="updatePlayer(${i}, 'belt', this.value)">
          <option ${p.belt==='White'?'selected':''}>White</option>
          <option ${p.belt==='Blue'?'selected':''}>Blue</option>
          <option ${p.belt==='Purple'?'selected':''}>Purple</option>
          <option ${p.belt==='Brown'?'selected':''}>Brown</option>
          <option ${p.belt==='Black'?'selected':''}>Black</option>
        </select>
      </td>
      <td><input type="number" value="${p.rank}" style="width:60px" onchange="updatePlayer(${i}, 'rank', parseInt(this.value))"></td>
      <td><button class="btn btn-danger btn-sm" onclick="deletePlayer(${i})">️</button></td>
    `;
    tbody.appendChild(tr);
  });
  
  document.getElementById('playerCount').innerText = `${players.length} players`;
}

// ============================================
// 5. Tournament Management Functions
// ============================================
async function clearTournamentPlayers() {
  if (players.length === 0) {
    alert('ℹ️ No players to delete!');
    return;
  }
  
  if (!confirm(`⚠️ WARNING: This will DELETE ALL ${players.length} players from this tournament!\n\nThis cannot be undone. Continue?`)) {
    return;
  }
  
  if (!confirm('⚠️ FINAL CONFIRMATION: Delete all players?')) {
    return;
  }
  
  try {
    document.getElementById('dbStatus').innerHTML = '🔄 Clearing players...';
    
    // استدعاء الدالة في قاعدة البيانات
    const { data, error } = await dbClient
      .rpc('fn_clear_tournament_players', { p_tournament_id: currentTournamentId });
    
    if (error) throw error;
    
    players = [];
    renderPlayers();
    
    alert(`✅ Successfully deleted ${data || 0} players!`);
    document.getElementById('dbStatus').innerHTML = '✅ All players cleared';
    showSyncIndicator();
  } catch (error) {
    alert('❌ Error: ' + error.message);
    document.getElementById('dbStatus').innerHTML = '❌ Error clearing players';
  }
}

async function deleteTournamentComplete() {
  if (!confirm('⚠️ CRITICAL WARNING:\n\nThis will DELETE the entire tournament and ALL associated data!\n\nThis CANNOT be undone!\n\nContinue?')) {
    return;
  }
  
  const confirmText = prompt('⚠️ Type "DELETE" to confirm:', '');
  if (confirmText !== 'DELETE') {
    alert('❌ Deletion cancelled!');
    return;
  }
  
  try {
    document.getElementById('dbStatus').innerHTML = '🔄 Deleting tournament...';
    
    const { error } = await dbClient
      .rpc('fn_delete_tournament_full', { p_tournament_id: currentTournamentId });
    
    if (error) throw error;
    
    alert('✅ Tournament deleted successfully!');
    
    // إعادة التوجيه إلى صفحة البطولات
    window.location.href = 'admin-tournaments.html';
  } catch (error) {
    alert('❌ Error: ' + error.message);
    document.getElementById('dbStatus').innerHTML = '❌ Error deleting tournament';
  }
}

// ============================================
// 6. UI Helpers
// ============================================
function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
}

function updateUI() {
  // إظهار/إخفاء الأزرار بناءً على الصلاحيات
  const isAdmin = currentUserRole === 'admin' || currentUserRole === 'super_admin';
  const isOrganizer = currentUserRole === 'organizer';
  
  // زر حذف البطولة الكاملة يظهر للأدمن فقط
  const deleteBtn = document.getElementById('deleteTournamentBtn');
  if (deleteBtn) {
    deleteBtn.style.display = isAdmin ? 'inline-flex' : 'none';
  }
  
  console.log('UI updated. User role:', currentUserRole);
}

function showError(msg) {
  document.getElementById('dbStatus').innerHTML = `❌ ${msg}`;
  document.getElementById('dbStatus').style.color = '#e74c3c';
}

function showSyncIndicator() {
  const indicator = document.getElementById('syncIndicator');
  if (indicator) {
    indicator.classList.add('active');
    setTimeout(() => indicator.classList.remove('active'), 2000);
  }
}

function exportCSV() {
  if (players.length === 0) {
    alert('ℹ️ No players to export!');
    return;
  }
  
  let csv = 'Name,Team,Age Group,Gender,Weight,Belt,Rank\n';
  players.forEach(p => {
    csv += `"${p.name}","${p.team}","${p.ageGroup}","${p.gender}","${p.weight}","${p.belt}",${p.rank}\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `players_${currentTournamentId}.csv`;
  a.click();
  
  alert(`✅ Exported ${players.length} players!`);
}
</script>

</body>
</html>
