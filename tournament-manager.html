<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopCompSports - Tournament Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   GLOBAL STYLES
   ============================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  background: #0a0e17; 
  color: #fff; 
}

/* ============================================
   MAIN HEADER STYLES
   ============================================ */
.main-header {
  background: #0a0e17;
  border-bottom: 2px solid #1e3a8a;
  padding: 15px 0;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo-section {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo-icon {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: bold;
  color: #fbbf24;
  border: 2px solid #fbbf24;
}

.logo-text {
  font-size: 1.8rem;
  font-weight: bold;
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-menu {
  display: flex;
  gap: 30px;
  align-items: center;
}

.nav-link {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 15px;
  border-radius: 5px;
  transition: all 0.3s;
  cursor: pointer;
}

.nav-link:hover {
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
}

.nav-link.active {
  color: #fbbf24;
}

.user-section {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 15px;
  background: rgba(251, 191, 36, 0.1);
  border-radius: 25px;
  border: 1px solid #fbbf24;
}

.user-avatar {
  width: 35px;
  height: 35px;
  background: #1e293b;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fbbf24;
}

.user-name {
  color: #fbbf24;
  font-weight: 600;
}

.btn-logout {
  padding: 8px 20px;
  background: transparent;
  border: 2px solid #fff;
  color: #fff;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-logout:hover {
  background: #fff;
  color: #0a0e17;
}

.language-toggle {
  display: flex;
  background: #1e293b;
  border-radius: 8px;
  padding: 4px;
  gap: 4px;
}

.lang-btn {
  padding: 6px 15px;
  border: none;
  background: transparent;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s;
}

.lang-btn.active {
  background: #3b82f6;
  color: #fff;
}

/* ============================================
   TOURNAMENT MANAGER STYLES
   ============================================ */
.tournament-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.tournament-header {
  background: #151d2b;
  padding: 20px 25px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  border: 1px solid #2a3548;
}

.tournament-title-section h1 {
  color: #fbbf24;
  font-size: 1.8rem;
  margin-bottom: 5px;
}

.tournament-subtitle {
  color: #8899aa;
  font-size: 0.9rem;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(34, 197, 94, 0.2);
  color: #22c55e;
  padding: 5px 12px;
  border-radius: 15px;
  font-size: 0.85rem;
  margin-top: 8px;
}

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
}

.btn:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.btn:active {
  transform: translateY(0);
}

.btn-players { background: #3b82f6; color: #fff; }
.btn-mats { background: #8b5cf6; color: #fff; }
.btn-settings { background: #f59e0b; color: #000; }
.btn-sync { background: #64748b; color: #fff; }
.btn-save { background: #475569; color: #fff; }
.btn-clear-local { background: #dc2626; color: #fff; }
.btn-clear-db { background: #ea580c; color: #fff; }

/* Views */
.view {
  display: none;
}

.view.active {
  display: block;
  animation: fadeIn 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Players Section */
.section {
  background: #1a1f2e;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
  border: 1px solid #2a3548;
}

.section-title {
  font-size: 1.4rem;
  font-weight: bold;
  color: #fbbf24;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.player-count {
  color: #8899aa;
  font-size: 1rem;
}

.button-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn-add { background: #22c55e; color: #fff; }
.btn-add-10 { background: #475569; color: #fff; }
.btn-import { background: #3b82f6; color: #fff; }
.btn-export { background: #0ea5e9; color: #fff; }
.btn-sync-db { background: #f59e0b; color: #000; }

.table-container {
  max-height: 600px;
  overflow-y: auto;
  border-radius: 8px;
  border: 1px solid #2a3548;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  position: sticky;
  top: 0;
  background: #151d2b;
  z-index: 10;
}

th {
  background: #151d2b;
  color: #8899aa;
  padding: 12px;
  text-align: left;
  font-size: 0.85rem;
  text-transform: uppercase;
  border-bottom: 2px solid #2a3548;
}

td {
  padding: 10px;
  border-bottom: 1px solid #2a3548;
}

tr:hover {
  background: rgba(59, 130, 246, 0.05);
}

input, select {
  background: #0f1724;
  border: 1px solid #2a3548;
  color: #fff;
  padding: 8px 10px;
  border-radius: 5px;
  font-size: 0.9rem;
  width: 100%;
}

input:focus, select:focus {
  outline: none;
  border-color: #fbbf24;
}

.btn-delete {
  background: #dc2626;
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.85rem;
}

.btn-delete:hover {
  background: #b91c1c;
}

.btn-proceed {
  width: 100%;
  padding: 15px;
  background: #22c55e;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn-proceed:hover {
  background: #16a34a;
}

/* Mats Section */
.mats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.mat-card {
  background: #151d2b;
  border: 2px solid #2a3548;
  border-radius: 12px;
  padding: 20px;
}

.mat-card h3 {
  color: #fbbf24;
  margin-bottom: 15px;
  font-size: 1.2rem;
}

.mat-info {
  margin-bottom: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
}

.mat-info label {
  display: block;
  color: #8899aa;
  font-size: 0.85rem;
  margin-bottom: 5px;
}

/* Settings Section */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.setting-card {
  background: #151d2b;
  padding: 20px;
  border-radius: 8px;
  border: 1px solid #2a3548;
}

.setting-card h3 {
  color: #fbbf24;
  margin-bottom: 15px;
}

.setting-item {
  margin-bottom: 15px;
}

.setting-item label {
  display: block;
  color: #8899aa;
  margin-bottom: 5px;
  font-size: 0.9rem;
}

/* Responsive */
@media (max-width: 968px) {
  .header-container {
    flex-direction: column;
  }
  
  .nav-menu {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .tournament-header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .action-buttons {
    width: 100%;
  }
  
  .btn {
    flex: 1;
    min-width: 120px;
    justify-content: center;
  }
  
  table {
    font-size: 0.85rem;
  }
  
  th, td {
    padding: 8px 5px;
  }
}

@media (max-width: 640px) {
  .logo-text {
    font-size: 1.3rem;
  }
  
  .nav-menu {
    gap: 15px;
  }
  
  .user-section {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .table-container {
    overflow-x: auto;
  }
  
  table {
    min-width: 800px;
  }
  
  .mats-grid,
  .settings-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<!-- ============================================
     MAIN HEADER
     ============================================ -->
<header class="main-header">
  <div class="header-container">
    <div class="logo-section">
      <div class="logo-icon">T</div>
      <div class="logo-text">TopCompSports</div>
    </div>
    
    <nav class="nav-menu">
      <a href="#" class="nav-link" onclick="navigateTo('home')">Home</a>
      <a href="#" class="nav-link" onclick="navigateTo('tournaments')">Tournaments</a>
      <a href="#" class="nav-link active" onclick="navigateTo('profile')">My Profile</a>
    </nav>
    
    <div class="user-section">
      <div class="user-profile">
        <div class="user-avatar">👤</div>
        <span class="user-name">fffaaaaa</span>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
      <div class="language-toggle">
        <button class="lang-btn" onclick="switchLanguage('ar')">عربي</button>
        <button class="lang-btn active" onclick="switchLanguage('en')">English</button>
      </div>
    </div>
  </div>
</header>

<!-- ============================================
     TOURNAMENT MANAGER CONTENT
     ============================================ -->
<div class="tournament-container">
  <div class="tournament-header">
    <div class="tournament-title-section">
      <h1>🏆 Tournament 2026 OZ</h1>
      <div class="tournament-subtitle">Step 1: Players Registration</div>
      <div class="status-badge">
        <span>✅</span>
        <span id="statusText">Connected to Database</span>
      </div>
    </div>
    
    <div class="action-buttons">
      <button class="btn btn-players" onclick="showView('players')">👥 Players</button>
      <button class="btn btn-mats" onclick="showView('mats')"> Mats</button>
      <button class="btn btn-settings" onclick="showView('settings')">⚙️ Settings</button>
      <button class="btn btn-sync" onclick="syncWithDB()"> Sync</button>
      <button class="btn btn-save" onclick="saveLocalData()">💾 Save Local</button>
      <button class="btn btn-clear-local" onclick="clearLocalData()">️ Clear Local</button>
      <button class="btn btn-clear-db" onclick="clearDBPlayers()">⚠️ Clear DB Players</button>
    </div>
  </div>

  <!-- PLAYERS VIEW -->
  <div id="view-players" class="view active">
    <div class="section">
      <div class="section-title">
        <span> Players Registration</span>
        <span class="player-count"><span id="playerCount">0</span> / 200</span>
      </div>
      
      <div class="button-group">
        <button class="btn btn-add" onclick="addPlayer()">➕ Add Player</button>
        <button class="btn btn-add-10" onclick="addPlayers(10)">➕ Add 10</button>
        <button class="btn btn-import" onclick="document.getElementById('csvInput').click()">📥 Import CSV</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn btn-export" onclick="exportCSV()"> Export CSV</button>
        <button class="btn btn-sync-db" onclick="syncWithDB()"> Sync with DB</button>
      </div>
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Team</th>
              <th>Age Group</th>
              <th>Gender</th>
              <th>Weight</th>
              <th>Belt</th>
              <th>Rank</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="playersTableBody">
            <!-- Players will be loaded here dynamically -->
          </tbody>
        </table>
      </div>
      
      <button class="btn-proceed" onclick="showView('mats')">
        <span></span>
        <span>Proceed to Mats →</span>
      </button>
    </div>
  </div>

  <!-- MATS VIEW -->
  <div id="view-mats" class="view">
    <div class="section">
      <div class="section-title">
        <span> Mats Setup</span>
      </div>
      
      <div class="button-group">
        <button class="btn btn-add" onclick="addMat()"> Add Mat</button>
        <button class="btn btn-sync-db" onclick="saveMatsToDB()">💾 Save Mats</button>
      </div>
      
      <div class="mats-grid" id="matsGrid">
        <!-- Mats will be loaded here -->
      </div>
      
      <button class="btn-proceed" onclick="showView('players')">
        <span>←</span>
        <span>Back to Players</span>
      </button>
    </div>
  </div>

  <!-- SETTINGS VIEW -->
  <div id="view-settings" class="view">
    <div class="section">
      <div class="section-title">
        <span>⚙️ Tournament Settings</span>
      </div>
      
      <div class="settings-grid">
        <div class="setting-card">
          <h3>General Settings</h3>
          <div class="setting-item">
            <label>Tournament Name</label>
            <input type="text" id="tournamentName" value="Tournament 2026 OZ">
          </div>
          <div class="setting-item">
            <label>Max Players</label>
            <input type="number" id="maxPlayers" value="200" min="1" max="500">
          </div>
        </div>
        
        <div class="setting-card">
          <h3>Database Settings</h3>
          <div class="setting-item">
            <label>Auto-Sync</label>
            <select id="autoSync">
              <option value="true">Enabled</option>
              <option value="false">Disabled</option>
            </select>
          </div>
          <button class="btn btn-sync" onclick="syncWithDB()" style="width: 100%; margin-top: 10px;">
            🔄 Sync Now
          </button>
        </div>
      </div>
      
      <button class="btn-proceed" onclick="showView('players')">
        <span>←</span>
        <span>Back to Players</span>
      </button>
    </div>
  </div>
</div>

<script>
// ============================================
// SUPABASE CONFIGURATION
// ============================================
const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ============================================
// GLOBAL STATE
// ============================================
let currentTournamentId = 'db5ffa84-d0a4-4666-bbb2-7de0482a3d92'; // From URL or default
let players = [];
let mats = [];
let currentView = 'players';

// ============================================
// INITIALIZATION
// ============================================
document.addEventListener('DOMContentLoaded', async () => {
  await loadPlayersFromDB();
  await loadMatsFromDB();
  updatePlayerCount();
});

// ============================================
// NAVIGATION FUNCTIONS
// ============================================
function showView(viewName) {
  // Hide all views
  document.querySelectorAll('.view').forEach(view => {
    view.classList.remove('active');
  });
  
  // Show selected view
  const selectedView = document.getElementById(`view-${viewName}`);
  if (selectedView) {
    selectedView.classList.add('active');
    currentView = viewName;
    
    // Refresh data based on view
    if (viewName === 'players') {
      renderPlayers();
    } else if (viewName === 'mats') {
      renderMats();
    }
  }
  
  // Update nav links
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.remove('active');
  });
}

function navigateTo(page) {
  // Navigation to other pages
  console.log('Navigating to:', page);
  // Add your navigation logic here
}

function switchLanguage(lang) {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  console.log('Language switched to:', lang);
}

function handleLogout() {
  if (confirm('Are you sure you want to logout?')) {
    // Add logout logic here
    console.log('User logged out');
  }
}

// ============================================
// PLAYER MANAGEMENT FUNCTIONS
// ============================================
async function loadPlayersFromDB() {
  try {
    const { data, error } = await supabase
      .from('tournament_participants')
      .select('*')
      .eq('tournament_id', currentTournamentId)
      .order('ranking', { ascending: true });
    
    if (error) throw error;
    
    players = data || [];
    renderPlayers();
    updatePlayerCount();
    updateStatus('Connected to Database', 'success');
  } catch (error) {
    console.error('Error loading players:', error);
    updateStatus('Using Local Data', 'warning');
    // Load from localStorage if DB fails
    const saved = localStorage.getItem('tournamentPlayers');
    if (saved) {
      players = JSON.parse(saved);
      renderPlayers();
      updatePlayerCount();
    }
  }
}

function renderPlayers() {
  const tbody = document.getElementById('playersTableBody');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  if (players.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="9" style="text-align: center; padding: 40px; color: #8899aa;">
          No players yet. Click "Add Player" to get started.
        </td>
      </tr>
    `;
    return;
  }
  
  players.forEach((player, index) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${player.ranking || index + 1}</td>
      <td><input type="text" value="${player.player_name || ''}" onchange="updatePlayer(${player.id}, 'player_name', this.value)"></td>
      <td><input type="text" value="${player.team || 'TCS Player'}" onchange="updatePlayer(${player.id}, 'team', this.value)"></td>
      <td>
        <select onchange="updatePlayer(${player.id}, 'age_group', this.value)">
          <option ${player.age_group === 'Master 1' ? 'selected' : ''}>Master 1</option>
          <option ${player.age_group === 'Amateur / Professional' ? 'selected' : ''}>Amateur / Professional</option>
          <option ${player.age_group === 'Kids 1' ? 'selected' : ''}>Kids 1</option>
          <option ${player.age_group === 'Kids 2' ? 'selected' : ''}>Kids 2</option>
          <option ${player.age_group === 'Junior' ? 'selected' : ''}>Junior</option>
        </select>
      </td>
      <td>
        <select onchange="updatePlayer(${player.id}, 'gender', this.value)">
          <option ${player.gender === 'Men' ? 'selected' : ''}>Men</option>
          <option ${player.gender === 'Women' ? 'selected' : ''}>Women</option>
          <option ${player.gender === 'Boys' ? 'selected' : ''}>Boys</option>
          <option ${player.gender === 'Girls' ? 'selected' : ''}>Girls</option>
        </select>
      </td>
      <td>
        <select onchange="updatePlayer(${player.id}, 'weight', this.value)">
          <option ${player.weight === '82kg' ? 'selected' : ''}>82kg</option>
          <option ${player.weight === '56kg' ? 'selected' : ''}>56kg</option>
          <option ${player.weight === '62kg' ? 'selected' : ''}>62kg</option>
          <option ${player.weight === '67kg' ? 'selected' : ''}>67kg</option>
          <option ${player.weight === '77kg' ? 'selected' : ''}>77kg</option>
        </select>
      </td>
      <td>
        <select onchange="updatePlayer(${player.id}, 'belt_level', this.value)">
          <option ${player.belt_level === 'White' ? 'selected' : ''}>White</option>
          <option ${player.belt_level === 'Blue' ? 'selected' : ''}>Blue</option>
          <option ${player.belt_level === 'Purple' ? 'selected' : ''}>Purple</option>
          <option ${player.belt_level === 'Brown' ? 'selected' : ''}>Brown</option>
          <option ${player.belt_level === 'Black' ? 'selected' : ''}>Black</option>
        </select>
      </td>
      <td><input type="number" value="${player.ranking || index + 1}" style="width: 60px;" onchange="updatePlayer(${player.id}, 'ranking', parseInt(this.value))"></td>
      <td><button class="btn-delete" onclick="deletePlayer(${player.id})">✕</button></td>
    `;
    tbody.appendChild(row);
  });
}

async function addPlayer() {
  if (players.length >= 200) {
    alert('Maximum 200 players reached!');
    return;
  }
  
  const newPlayer = {
    tournament_id: currentTournamentId,
    player_name: 'New Player',
    team: 'TCS Player',
    age_group: 'Amateur / Professional',
    gender: 'Men',
    weight: '56kg',
    belt_level: 'White',
    ranking: players.length + 1
  };
  
  try {
    const { data, error } = await supabase
      .from('tournament_participants')
      .insert([newPlayer])
      .select()
      .single();
    
    if (error) throw error;
    
    players.push(data);
    renderPlayers();
    updatePlayerCount();
    updateStatus('Player added successfully', 'success');
  } catch (error) {
    console.error('Error adding player:', error);
    alert('Error adding player: ' + error.message);
  }
}

async function addPlayers(count) {
  const newPlayers = [];
  for (let i = 0; i < count; i++) {
    if (players.length >= 200) break;
    newPlayers.push({
      tournament_id: currentTournamentId,
      player_name: `Player ${players.length + i + 1}`,
      team: 'TCS Player',
      age_group: 'Amateur / Professional',
      gender: 'Men',
      weight: '56kg',
      belt_level: 'White',
      ranking: players.length + i + 1
    });
  }
  
  if (newPlayers.length === 0) {
    alert('Maximum 200 players reached!');
    return;
  }
  
  try {
    const { data, error } = await supabase
      .from('tournament_participants')
      .insert(newPlayers)
      .select();
    
    if (error) throw error;
    
    players = [...players, ...data];
    renderPlayers();
    updatePlayerCount();
    updateStatus(`${newPlayers.length} players added`, 'success');
  } catch (error) {
    console.error('Error adding players:', error);
    alert('Error adding players: ' + error.message);
  }
}

async function updatePlayer(id, field, value) {
  const player = players.find(p => p.id === id);
  if (!player) return;
  
  player[field] = value;
  
  try {
    const { error } = await supabase
      .from('tournament_participants')
      .update({ [field]: value })
      .eq('id', id);
    
    if (error) throw error;
  } catch (error) {
    console.error('Error updating player:', error);
    // Save to localStorage as fallback
    localStorage.setItem('tournamentPlayers', JSON.stringify(players));
  }
}

async function deletePlayer(id) {
  if (!confirm('Are you sure you want to delete this player?')) return;
  
  try {
    const { error } = await supabase
      .from('tournament_participants')
      .delete()
      .eq('id', id);
    
    if (error) throw error;
    
    players = players.filter(p => p.id !== id);
    renderPlayers();
    updatePlayerCount();
    updateStatus('Player deleted', 'success');
  } catch (error) {
    console.error('Error deleting player:', error);
    alert('Error deleting player: ' + error.message);
  }
}

function updatePlayerCount() {
  const countEl = document.getElementById('playerCount');
  if (countEl) {
    countEl.textContent = players.length;
  }
}

// ============================================
// MATS MANAGEMENT
// ============================================
async function loadMatsFromDB() {
  try {
    const { data, error } = await supabase
      .from('mats')
      .select('*')
      .eq('tournament_id', currentTournamentId);
    
    if (error) throw error;
    mats = data || [];
  } catch (error) {
    console.error('Error loading mats:', error);
    mats = [];
  }
}

function renderMats() {
  const grid = document.getElementById('matsGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  
  if (mats.length === 0) {
    grid.innerHTML = '<p style="color: #8899aa; text-align: center; grid-column: 1/-1;">No mats configured. Click "Add Mat" to create one.</p>';
    return;
  }
  
  mats.forEach((mat, index) => {
    const matCard = document.createElement('div');
    matCard.className = 'mat-card';
    matCard.innerHTML = `
      <h3> Mat ${index + 1}</h3>
      <div class="mat-info">
        <label>Status</label>
        <select>
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
      <div class="mat-info">
        <label>Assigned Categories</label>
        <input type="text" placeholder="e.g., Kids 1, Boys, 32kg" readonly value="No categories assigned">
      </div>
      <button class="btn btn-delete" onclick="deleteMat(${mat.id})" style="width: 100%; margin-top: 10px;">
        ️ Delete Mat
      </button>
    `;
    grid.appendChild(matCard);
  });
}

function addMat() {
  const newMat = {
    tournament_id: currentTournamentId,
    mat_number: mats.length + 1,
    status: 'active'
  };
  
  mats.push(newMat);
  renderMats();
  updateStatus('Mat added', 'success');
}

function deleteMat(id) {
  if (!confirm('Delete this mat?')) return;
  mats = mats.filter(m => m.id !== id);
  renderMats();
  updateStatus('Mat deleted', 'success');
}

async function saveMatsToDB() {
  try {
    // Clear existing mats
    await supabase.from('mats').delete().eq('tournament_id', currentTournamentId);
    
    // Insert new mats
    const { error } = await supabase.from('mats').insert(mats);
    if (error) throw error;
    
    updateStatus('Mats saved to database', 'success');
  } catch (error) {
    console.error('Error saving mats:', error);
    alert('Error saving mats: ' + error.message);
  }
}

// ============================================
// UTILITY FUNCTIONS
// ============================================
function syncWithDB() {
  loadPlayersFromDB();
  loadMatsFromDB();
  updateStatus('Synced with database', 'success');
}

function saveLocalData() {
  localStorage.setItem('tournamentPlayers', JSON.stringify(players));
  localStorage.setItem('tournamentMats', JSON.stringify(mats));
  updateStatus('Data saved locally', 'success');
}

function clearLocalData() {
  if (!confirm('Clear all local data?')) return;
  localStorage.removeItem('tournamentPlayers');
  localStorage.removeItem('tournamentMats');
  players = [];
  mats = [];
  renderPlayers();
  renderMats();
  updatePlayerCount();
  updateStatus('Local data cleared', 'success');
}

async function clearDBPlayers() {
  if (!confirm('⚠️ WARNING: This will delete ALL players from the database!\n\nAre you sure?')) return;
  if (!confirm('FINAL CONFIRMATION: Delete all players?')) return;
  
  try {
    const { error } = await supabase
      .from('tournament_participants')
      .delete()
      .neq('id', 0); // Delete all
    
    if (error) throw error;
    
    players = [];
    renderPlayers();
    updatePlayerCount();
    updateStatus('All players deleted from database', 'success');
  } catch (error) {
    console.error('Error clearing database:', error);
    alert('Error: ' + error.message);
  }
}

function exportCSV() {
  if (players.length === 0) {
    alert('No players to export!');
    return;
  }
  
  let csv = 'Name,Team,Age Group,Gender,Weight,Belt,Rank\n';
  players.forEach(p => {
    csv += `"${p.player_name}","${p.team}","${p.age_group}","${p.gender}","${p.weight}","${p.belt_level}",${p.ranking}\n`;
  });
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `players_${currentTournamentId}.csv`;
  a.click();
  window.URL.revokeObjectURL(url);
  
  updateStatus('CSV exported', 'success');
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split('\n');
    const newPlayers = [];
    
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      
      const cols = line.split(',').map(c => c.replace(/"/g, '').trim());
      if (cols.length >= 6) {
        newPlayers.push({
          tournament_id: currentTournamentId,
          player_name: cols[0],
          team: cols[1],
          age_group: cols[2],
          gender: cols[3],
          weight: cols[4],
          belt_level: cols[5],
          ranking: parseInt(cols[6]) || players.length + newPlayers.length + 1
        });
      }
    }
    
    if (newPlayers.length > 0) {
      supabase.from('tournament_participants').insert(newPlayers).then(({ error }) => {
        if (error) {
          console.error('Error importing:', error);
          alert('Error importing CSV');
        } else {
          loadPlayersFromDB();
          updateStatus(`${newPlayers.length} players imported`, 'success');
        }
      });
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function updateStatus(message, type) {
  const statusEl = document.getElementById('statusText');
  if (statusEl) {
    statusEl.textContent = message;
    statusEl.style.color = type === 'success' ? '#22c55e' : type === 'warning' ? '#f59e0b' : '#fff';
  }
}

// Auto-save on page unload
window.addEventListener('beforeunload', () => {
  localStorage.setItem('tournamentPlayers', JSON.stringify(players));
  localStorage.setItem('tournamentMats', JSON.stringify(mats));
});
</script>
