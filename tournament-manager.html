<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TopCompSports - Tournament Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; }
        .header { background: rgba(21, 29, 43, 0.95); padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2a3548; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 45px; height: 45px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; color: #0a0e17; }
        .logo-text { font-size: 22px; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; margin: 5px; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
        .btn-info { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .step-indicator { display: flex; gap: 10px; margin-bottom: 40px; justify-content: center; flex-wrap: wrap; }
        .step { background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); opacity: 0.5; cursor: pointer; font-size: 0.9rem; }
        .step.active { background: rgba(241, 196, 15, 0.2); border-color: #f1c40f; opacity: 1; }
        .section { background: #151d2b; border-radius: 16px; padding: 30px; margin-bottom: 30px; border: 1px solid #2a3548; }
        .section-title { font-size: 1.5rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label { color: rgba(255,255,255,0.8); font-size: 0.85rem; font-weight: 600; }
        .form-input, .form-select { background: #1a1f2e !important; border: 2px solid rgba(255,255,255,0.1); color: #fff !important; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .form-select option { background-color: #1a1f2e !important; color: #fff !important; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        th { background: rgba(241, 196, 15, 0.1); color: #f1c40f; font-weight: bold; }
        .hidden { display: none !important; }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; position: fixed; top: 20px; right: 20px; z-index: 1000; }
        .alert.show { display: block; }
        .alert-success { background: rgba(16,185,129,0.9); color: #fff; }
        .alert-error { background: rgba(239,68,68,0.9); color: #fff; }
        
        /* Mat Dashboard */
        .mat-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .mat-tab { background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); cursor: pointer; }
        .mat-tab.active { background: rgba(241,196,15,0.2); border-color: #f1c40f; }
        .match-card { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .match-players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; margin-top: 15px; align-items: center; }
        .player-box { padding: 15px; border-radius: 8px; text-align: center; }
        .player-box.red { background: rgba(239,68,68,0.15); border: 1px solid #ef4444; }
        .player-box.blue { background: rgba(37,99,235,0.15); border: 1px solid #2563EB; }
        
        @media (max-width: 768px) { 
            .form-row { grid-template-columns: 1fr; } 
            .container { padding: 20px; } 
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .match-players { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div class="logo-text">TopCompSports</div>
        </div>
        <div>
            <span id="userEmail" style="margin-right: 15px; color: rgba(255,255,255,0.7);"></span>
            <button class="btn btn-secondary btn-sm" onclick="handleLogout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div id="alert" class="alert"></div>

        <div class="step-indicator">
            <div class="step active" id="step1" onclick="showStep('players')">Players</div>
            <div class="step" id="step2" onclick="showStep('mats')">Mats</div>
            <div class="step" id="step3" onclick="showStep('overview')">Brackets</div>
            <div class="step" id="step4" onclick="showStep('matDashboard')">Mat Dashboard</div>
        </div>

        <!-- Players Section -->
        <div id="playersSection" class="section">
            <div class="section-title">Players Registration</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Player Name</label>
                    <input type="text" class="form-input" id="playerName" placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label class="form-label">Team</label>
                    <input type="text" class="form-input" id="playerTeam" placeholder="Team name">
                </div>
                <div class="form-group">
                    <label class="form-label">Age Group</label>
                    <select class="form-select" id="playerAge">
                        <option value="">Select Age</option>
                        <option value="Kids 1 (4-5 yrs)">Kids 1 (4-5 yrs)</option>
                        <option value="Amateur / Professional">Amateur / Professional</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select class="form-select" id="playerGender">
                        <option value="">Select Gender</option>
                        <option value="Boys">Boys</option>
                        <option value="Girls">Girls</option>
                        <option value="Men">Men</option>
                        <option value="Women">Women</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" class="form-input" id="playerWeight" placeholder="Weight">
                </div>
                <div class="form-group">
                    <label class="form-label">Belt</label>
                    <select class="form-select" id="playerBelt">
                        <option value="">Select Belt</option>
                        <option value="White">White</option>
                        <option value="Blue">Blue</option>
                        <option value="Purple">Purple</option>
                        <option value="Brown">Brown</option>
                        <option value="Black">Black</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Gi Type</label>
                    <select class="form-select" id="playerGiType">
                        <option value="Gi">Gi</option>
                        <option value="No-Gi">No-Gi</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" onclick="addPlayer()" style="width: 100%;">Add Player</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr><th>#</th><th>Name</th><th>Team</th><th>Age</th><th>Gender</th><th>Weight</th><th>Belt</th><th>Action</th></tr>
                </thead>
                <tbody id="playersTable"></tbody>
            </table>
            <button class="btn btn-success" onclick="showStep('mats')" style="margin-top: 20px; width: 100%; padding: 15px;">Proceed to Mats →</button>
        </div>

        <!-- Mats Section -->
        <div id="matsSection" class="section hidden">
            <div class="section-title">Mats Setup</div>
            <div class="form-group">
                <label class="form-label">Number of Mats</label>
                <select class="form-select" id="numberOfMats" onchange="createMats()">
                    <option value="1">1 Mat</option>
                    <option value="2">2 Mats</option>
                    <option value="3">3 Mats</option>
                    <option value="4">4 Mats</option>
                    <option value="5">5 Mats</option>
                </select>
            </div>
            <div id="matsGrid" style="margin-top: 20px;"></div>
            <button class="btn btn-primary" onclick="showStep('overview')" style="margin-top: 20px;">View Brackets →</button>
        </div>

        <!-- Brackets Section -->
        <div id="overviewSection" class="section hidden">
            <div class="section-title">Brackets & Matches</div>
            <button class="btn btn-success" onclick="createAllBrackets()">Create All Brackets</button>
            <button class="btn btn-info" onclick="loadMatches()">Refresh</button>
            <div id="categoriesList" style="margin-top: 20px;"></div>
            <h3 style="color: #f1c40f; margin: 30px 0 20px;">All Matches</h3>
            <div id="matchesList"></div>
        </div>

        <!-- Mat Dashboard Section -->
        <div id="matDashboardSection" class="section hidden">
            <div class="section-title">Mat Dashboard</div>
            <div class="mat-tabs" id="matTabs"></div>
            <div id="matDashboardContent"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let tournamentId = null;
        let players = [];
        let matches = [];
        let matsConfig = [];
        let currentMatId = 1;

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                showAlert('error', 'No tournament selected!');
                return;
            }
            
            await checkAuth();
            await loadPlayers();
            await loadMatches();
        };

        async function checkAuth() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session && session.user) {
                    document.getElementById('userEmail').textContent = session.user.email;
                } else {
                    showAlert('error', 'Please sign in first');
                }
            } catch (err) {
                console.error('Auth error:', err);
            }
        }

        async function handleLogout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        function showStep(step) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            
            if (step === 'players') {
                document.getElementById('playersSection').classList.remove('hidden');
                document.getElementById('step1').classList.add('active');
            } else if (step === 'mats') {
                document.getElementById('matsSection').classList.remove('hidden');
                document.getElementById('step2').classList.add('active');
                createMats();
            } else if (step === 'overview') {
                document.getElementById('overviewSection').classList.remove('hidden');
                document.getElementById('step3').classList.add('active');
                loadMatches();
            } else if (step === 'matDashboard') {
                document.getElementById('matDashboardSection').classList.remove('hidden');
                document.getElementById('step4').classList.add('active');
                loadMatDashboard();
            }
        }

        async function loadPlayers() {
            try {
                const { data, error } = await supabase
                    .from('tournament_participants')
                    .select('*')
                    .eq('tournament_id', tournamentId);
                
                if (error) {
                    console.error('Error:', error);
                    showAlert('error', 'Error loading players');
                    return;
                }
                
                players = data || [];
                updatePlayersTable();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function updatePlayersTable() {
            const tbody = document.getElementById('playersTable');
            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px;">No players yet</td></tr>';
                return;
            }
            tbody.innerHTML = players.map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>${p.player_name}</td>
                    <td>${p.team || '-'}</td>
                    <td>${p.age_group || '-'}</td>
                    <td>${p.gender || '-'}</td>
                    <td>${p.weight || '-'}</td>
                    <td>${p.belt_level || '-'}</td>
                    <td><button class="btn btn-danger btn-sm" onclick="deletePlayer('${p.id}')">Delete</button></td>
                </tr>
            `).join('');
        }

        async function addPlayer() {
            const name = document.getElementById('playerName').value;
            const team = document.getElementById('playerTeam').value;
            const age = document.getElementById('playerAge').value;
            const gender = document.getElementById('playerGender').value;
            const weight = document.getElementById('playerWeight').value;
            const belt = document.getElementById('playerBelt').value;
            const giType = document.getElementById('playerGiType').value;
            
            if (!name || !age || !gender) {
                showAlert('error', 'Please fill required fields');
                return;
            }
            
            try {
                const { error } = await supabase.from('tournament_participants').insert({
                    tournament_id: tournamentId,
                    player_name: name,
                    team: team,
                    age_group: age,
                    gender: gender,
                    weight: parseFloat(weight) || null,
                    belt_level: belt,
                    gi_type: giType
                });
                
                if (error) throw error;
                showAlert('success', 'Player added!');
                document.getElementById('playerName').value = '';
                document.getElementById('playerWeight').value = '';
                await loadPlayers();
            } catch (err) {
                showAlert('error', err.message);
            }
        }

        async function deletePlayer(id) {
            if (!confirm('Delete this player?')) return;
            try {
                const { error } = await supabase.from('tournament_participants').delete().eq('id', id);
                if (error) throw error;
                showAlert('success', 'Player deleted');
                await loadPlayers();
            } catch (err) {
                showAlert('error', err.message);
            }
        }

        function createMats() {
            const num = parseInt(document.getElementById('numberOfMats').value);
            const grid = document.getElementById('matsGrid');
            grid.innerHTML = '';
            matsConfig = [];
            
            for (let i = 1; i <= num; i++) {
                matsConfig.push({ id: i, ageGroups: [], genders: [], weights: [], belts: [] });
                const card = document.createElement('div');
                card.className = 'match-card';
                card.innerHTML = `
                    <h3 style="color: #f1c40f; margin-bottom: 15px;">Mat ${i}</h3>
                    <div style="margin-bottom: 10px;">
                        <label class="form-label">Age Groups</label>
                        <select class="form-select" id="mat${i}-age" multiple>
                            <option value="Kids 1 (4-5 yrs)">Kids 1</option>
                            <option value="Amateur / Professional">Amateur/Pro</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label class="form-label">Genders</label>
                        <select class="form-select" id="mat${i}-gender" multiple>
                            <option value="Boys">Boys</option>
                            <option value="Girls">Girls</option>
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                        </select>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        async function createAllBrackets() {
            if (players.length < 2) {
                showAlert('error', 'Need at least 2 players');
                return;
            }
            
            const categories = {};
            players.forEach(p => {
                const key = `${p.age_group} / ${p.gender} / ${p.belt_level}`;
                if (!categories[key]) categories[key] = [];
                categories[key].push(p);
            });
            
            let matchNum = 1;
            const matchesToInsert = [];
            
            for (const [category, catPlayers] of Object.entries(categories)) {
                const weightGroups = {};
                catPlayers.forEach(p => {
                    if (!weightGroups[p.weight]) weightGroups[p.weight] = [];
                    weightGroups[p.weight].push(p);
                });
                
                for (const [weight, weightPlayers] of Object.entries(weightGroups)) {
                    if (weightPlayers.length < 2) continue;
                    
                    for (let i = 0; i < weightPlayers.length; i += 2) {
                        const p1 = weightPlayers[i];
                        const p2 = weightPlayers[i + 1];
                        
                        if (p2) {
                            matchesToInsert.push({
                                tournament_id: tournamentId,
                                round_number: 1,
                                match_number: matchNum++,
                                division: category + ` / ${weight}kg`,
                                red_player_id: p1.id,
                                blue_player_id: p2.id,
                                red_player_name: p1.player_name,
                                blue_player_name: p2.player_name,
                                red_score: 0,
                                blue_score: 0,
                                status: 'scheduled'
                            });
                        }
                    }
                }
            }
            
            if (matchesToInsert.length === 0) {
                showAlert('error', 'No matches could be created');
                return;
            }
            
            try {
                const { error } = await supabase.from('matches').insert(matchesToInsert);
                if (error) throw error;
                showAlert('success', `Created ${matchesToInsert.length} matches!`);
                await loadMatches();
            } catch (err) {
                showAlert('error', err.message);
            }
        }

        async function loadMatches() {
            try {
                const { data, error } = await supabase
                    .from('matches')
                    .select('*')
                    .eq('tournament_id', tournamentId);
                
                if (error) {
                    console.error('Error:', error);
                    return;
                }
                
                matches = data || [];
                displayMatches();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function displayMatches() {
            const container = document.getElementById('matchesList');
            if (matches.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px;">No matches yet</div>';
                return;
            }
            
            const divisions = {};
            matches.forEach(m => {
                if (!divisions[m.division]) divisions[m.division] = [];
                divisions[m.division].push(m);
            });
            
            let html = '';
            for (const [division, divMatches] of Object.entries(divisions)) {
                html += `<div class="match-card" style="margin-bottom: 20px;">
                    <h3 style="color: #f1c40f; margin-bottom: 15px;">${division}</h3>`;
                
                divMatches.forEach(m => {
                    html += `<div style="padding: 10px; background: rgba(255,255,255,0.03); margin-bottom: 10px; border-radius: 8px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <span>Match #${m.match_number}</span>
                            <span style="color: ${m.status === 'scheduled' ? '#f1c40f' : '#10b981'}">${m.status}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="flex: 1; text-align: center; padding: 10px; background: rgba(239,68,68,0.2); border-radius: 8px;">
                                <div style="font-size: 0.8rem; color: #ef4444;">RED</div>
                                <div style="font-weight: bold;">${m.red_player_name}</div>
                            </div>
                            <div style="padding: 0 20px; font-weight: bold;">VS</div>
                            <div style="flex: 1; text-align: center; padding: 10px; background: rgba(37,99,235,0.2); border-radius: 8px;">
                                <div style="font-size: 0.8rem; color: #2563EB;">BLUE</div>
                                <div style="font-weight: bold;">${m.blue_player_name}</div>
                            </div>
                        </div>
                    </div>`;
                });
                
                html += '</div>';
            }
            
            container.innerHTML = html;
        }

        function loadMatDashboard() {
            const tabsContainer = document.getElementById('matTabs');
            tabsContainer.innerHTML = '';
            
            if (matsConfig.length === 0) {
                document.getElementById('matDashboardContent').innerHTML = '<div style="text-align: center; padding: 40px;">No mats configured</div>';
                return;
            }
            
            matsConfig.forEach(mat => {
                const tab = document.createElement('div');
                tab.className = `mat-tab ${mat.id === currentMatId ? 'active' : ''}`;
                tab.textContent = `Mat ${mat.id}`;
                tab.onclick = () => {
                    currentMatId = mat.id;
                    loadMatDashboard();
                };
                tabsContainer.appendChild(tab);
            });
            
            const mat = matsConfig.find(m => m.id === currentMatId);
            const content = document.getElementById('matDashboardContent');
            
            const filteredPlayers = players.filter(p => {
                const matchAge = mat.ageGroups.length === 0 || mat.ageGroups.includes(p.age_group);
                const matchGender = mat.genders.length === 0 || mat.genders.includes(p.gender);
                return matchAge && matchGender;
            });
            
            const categories = {};
            filteredPlayers.forEach(p => {
                const key = `${p.gender} | ${p.age_group} | ${p.belt_level}`;
                if (!categories[key]) categories[key] = [];
                categories[key].push(p);
            });
            
            let html = `<h3 style="color: #f1c40f; margin-bottom: 20px;">Categories - Mat ${currentMatId}</h3>`;
            
            if (Object.keys(categories).length === 0) {
                html += '<div style="text-align: center; padding: 40px;">No players match this mat</div>';
            } else {
                for (const [cat, catPlayers] of Object.entries(categories)) {
                    html += `<div class="match-card" style="margin-bottom: 15px;">
                        <div style="font-weight: bold; color: #f1c40f; margin-bottom: 10px;">${cat}</div>
                        <div style="color: rgba(255,255,255,0.7);">${catPlayers.length} Players</div>
                        <div style="margin-top: 10px;">${catPlayers.map(p => p.player_name).join(', ')}</div>
                    </div>`;
                }
            }
            
            content.innerHTML = html;
        }

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
