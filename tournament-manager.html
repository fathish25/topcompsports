<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --light-gray: #3A3A3A;
            --white: #FFFFFF;
            
            --bg-dark: #0a0e17;
            --bg-card: #151d2b;
            --bg-input: rgba(255,255,255,0.05);
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.7);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        img { max-width: 100%; height: auto; }

        /* Header */
        .header { 
            background: var(--black); 
            padding: 15px 50px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--primary-blue); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }
        .logo { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .logo-svg { width: 50px; height: 50px; }
        .logo-text { font-size: 28px; font-weight: bold; color: var(--primary-blue); }
        .nav { display: flex; gap: 30px; align-items: center; }
        .nav a { color: var(--white); text-decoration: none; padding: 8px 15px; border-radius: 6px; transition: all 0.3s; font-weight: 600; }
        .nav a:hover { color: var(--accent-yellow); }

        .user-section { display: flex; align-items: center; gap: 15px; }
        .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-avatar { 
            width: 40px; height: 40px; border-radius: 50%; overflow: hidden; 
            border: 2px solid var(--accent-yellow); background: var(--medium-gray); 
            display: flex; align-items: center; justify-content: center; font-size: 20px; 
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-weight: 600; color: var(--accent-yellow); }
        
        .btn { 
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; 
            cursor: pointer; transition: all 0.3s; font-size: 0.95rem; text-decoration: none; display: inline-block; 
        }
        .btn-logout { background: transparent; border: 2px solid var(--white); color: var(--white); }
        .btn-logout:hover { background: var(--white); color: var(--black); }
        .btn-login { background: var(--primary-blue); color: var(--white); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }
        .btn-register { 
            background: var(--accent-yellow); color: var(--black); padding: 12px 30px; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; font-size: 1rem; 
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,184,0,0.4); }
        .btn-secondary { 
            background: transparent; color: var(--white); border: 2px solid var(--white); 
            padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.3s; 
        }
        .btn-secondary:hover { background: var(--white); color: var(--black); }

        .lang-switcher { display: flex; gap: 5px; background: var(--medium-gray); padding: 5px; border-radius: 8px; }
        .lang-btn { padding: 8px 15px; border: none; background: transparent; color: var(--white); cursor: pointer; border-radius: 6px; font-weight: bold; }
        .lang-btn.active { background: var(--primary-blue); }

        /* Tournament Header */
        .tournament-header { background: var(--black); padding: 30px 50px; border-bottom: 3px solid var(--primary-blue); }
        .tournament-header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .tournament-title-section { display: flex; align-items: center; gap: 20px; }
        .tournament-logo { width: 80px; height: 80px; border-radius: 12px; overflow: hidden; background: var(--medium-gray); }
        .tournament-logo img { width: 100%; height: 100%; object-fit: cover; }
        .tournament-title h1 { color: var(--white); font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
        .tournament-title p { color: rgba(255,255,255,0.7); font-size: 1rem; }
        .tournament-actions { display: flex; gap: 15px; align-items: center; }

        /* Tabs - Original Styling Restored */
        .tabs-container { 
            background: var(--dark-gray); 
            border-bottom: 1px solid var(--medium-gray); 
            position: sticky; 
            top: 73px; 
            z-index: 999; 
        }
        .tabs { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            gap: 5px; 
            padding: 0 50px; 
            overflow-x: auto; 
        }
        .tab { 
            padding: 15px 25px; 
            color: rgba(255,255,255,0.7); 
            font-weight: 600; 
            border-bottom: 3px solid transparent; 
            transition: all 0.3s; 
            white-space: nowrap; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            background: transparent;
            border: none;
            font-size: 1rem;
            font-family: inherit;
        }
        .tab:hover { color: var(--white); }
        .tab.active { color: var(--white); border-bottom-color: var(--accent-yellow); }

        /* Tab Content */
        .tab-content { display: none; animation: fadeIn 0.3s ease-in; }
        .tab-content.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Banner */
        .banner { max-width: 1200px; margin: 40px auto; padding: 0 50px; }
        .banner-image { width: 100%; height: 400px; border-radius: 15px; overflow: hidden; background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue)); }
        .banner-image img { width: 100%; height: 100%; object-fit: cover; }

        /* Main Content */
        .main-content { max-width: 1200px; margin: 0 auto; padding: 0 50px 60px; display: grid; grid-template-columns: 2fr 1fr; gap: 40px; }

        /* Info Section */
        .info-section { background: var(--bg-card); border-radius: 15px; padding: 40px; border: 1px solid rgba(255,255,255,0.1); }
        .info-section h2 { font-size: 1.8rem; font-weight: 900; color: var(--accent-yellow); margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .info-section h3 { font-size: 1.3rem; font-weight: 700; color: var(--text-main); margin: 25px 0 15px; }
        .info-section p { color: var(--text-muted); line-height: 1.8; margin-bottom: 15px; }
        .info-meta { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
        .info-meta-item { display: flex; align-items: center; gap: 12px; color: var(--text-muted); font-size: 1rem; }
        .info-meta-item strong { color: var(--text-main); }

        /* Sidebar */
        .sidebar { display: flex; flex-direction: column; gap: 25px; }
        .sidebar-card { background: var(--bg-card); border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .sidebar-card h3 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid rgba(255,255,255,0.1); }

        /* Entries List */
        .entries-list { display: flex; flex-direction: column; gap: 12px; }
        .entry-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--bg-input); border-radius: 10px; transition: all 0.3s; border-left: 4px solid var(--primary-blue); }
        .entry-item:hover { transform: translateX(5px); box-shadow: 0 4px 12px rgba(0,102,204,0.2); }
        .entry-info { display: flex; flex-direction: column; gap: 4px; }
        .entry-name { font-weight: 700; color: var(--text-main); font-size: 1rem; }
        .entry-details { font-size: 0.85rem; color: var(--text-muted); }
        .entry-price { color: var(--primary-blue); font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
        .entry-price.free { color: var(--success); }

        /* Registration Dates */
        .registration-dates { display: flex; flex-direction: column; gap: 15px; }
        .reg-date-item { padding: 15px; background: var(--bg-input); border-radius: 10px; border-left: 4px solid var(--primary-blue); }
        .reg-date-item.late { border-left-color: var(--accent-yellow); }
        .reg-date-item h4 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
        .reg-date-item p { font-size: 1rem; color: var(--text-main); font-weight: 700; }

        /* Location */
        .location-card { display: flex; flex-direction: column; gap: 10px; }
        .location-address { color: var(--text-muted); line-height: 1.6; }
        .location-map { width: 100%; height: 200px; background: var(--bg-input); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); cursor: pointer; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.1); }
        .location-map:hover { background: var(--primary-blue); color: var(--white); }

        /* Organizer */
        .organizer-card { display: flex; flex-direction: column; gap: 12px; }
        .organizer-name { font-weight: 700; color: var(--text-main); font-size: 1.1rem; }
        .organizer-info { color: var(--text-muted); font-size: 0.9rem; }
        .contact-links { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .contact-link { display: flex; align-items: center; gap: 10px; color: var(--primary-blue); text-decoration: none; padding: 10px; background: var(--bg-input); border-radius: 8px; transition: all 0.3s; }
        .contact-link:hover { background: var(--primary-blue); color: var(--white); }

        /* Payment Badge */
        .payment-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
        .payment-badge.cash { background: rgba(255,184,0,0.2); color: var(--accent-yellow); }
        .payment-badge.online { background: rgba(16,185,129,0.2); color: var(--success); }

        /* ✅ Brackets & Athletes Styles */
        .athletes-list, .brackets-container { padding: 10px 0; }
        .division-group { margin-bottom: 30px; }
        .division-title { 
            font-size: 1.3rem; font-weight: 900; color: var(--text-main); 
            margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-blue); 
        }
        .bracket-table { width: 100%; background: var(--bg-input); border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .bracket-table-header { 
            display: grid; grid-template-columns: 2fr 2fr 2fr; background: var(--medium-gray); 
            padding: 15px; font-weight: 700; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; 
        }
        .bracket-table-row { 
            display: grid; grid-template-columns: 2fr 2fr 2fr; padding: 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; 
        }
        .bracket-table-row:last-child { border-bottom: none; }
        .athlete-cell { display: flex; align-items: center; gap: 12px; }
        .athlete-avatar, .athlete-avatar-small { 
            width: 50px; height: 50px; border-radius: 50%; background: var(--primary-blue); 
            display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; flex-shrink: 0;
        }
        .athlete-avatar-small { width: 40px; height: 40px; font-size: 1rem; }
        .athlete-name-cell { font-weight: 700; color: var(--text-main); }
        .academy-cell { color: var(--primary-blue); }
        .registration-cell { font-size: 0.9rem; color: var(--text-muted); }
        .gender-badge { 
            display: inline-block; padding: 4px 10px; background: var(--primary-blue); 
            color: var(--white); border-radius: 4px; font-size: 0.8rem; margin-bottom: 5px; 
        }
        .total-registrations { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }

        /* Coming Soon Message */
        .coming-soon { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .coming-soon .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }
        .coming-soon h3 { color: var(--text-main); margin-bottom: 10px; }

        /* Loading & Empty */
        .loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 1.2rem; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 5rem; margin-bottom: 20px; opacity: 0.5; }

        /* Footer */
        .footer { background: var(--black); padding: 30px 50px; color: rgba(255,255,255,0.6); text-align: center; border-top: 1px solid var(--medium-gray); margin-top: 60px; }

        /* Responsive */
        @media (max-width: 1024px) {
            .header { padding: 15px 30px; }
            .tournament-header { padding: 30px 30px; }
            .tabs { padding: 0 30px; }
            .banner { padding: 0 30px; }
            .main-content { padding: 0 30px 60px; grid-template-columns: 1fr; }
        }
        @media (max-width: 768px) {
            .header { padding: 12px 20px; flex-direction: column; gap: 15px; }
            .nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .tournament-header { padding: 20px; }
            .tournament-title-section { flex-direction: column; align-items: flex-start; }
            .tournament-title h1 { font-size: 1.5rem; }
            .tabs { padding: 0 20px; overflow-x: auto; }
            .banner { padding: 0 20px; }
            .banner-image { height: 250px; }
            .main-content { padding: 0 20px 40px; }
            .info-section { padding: 25px; }
            .bracket-table-header, .bracket-table-row { grid-template-columns: 1fr; gap: 10px; }
        }
        @media (max-width: 480px) {
            .header { padding: 10px 15px; }
            .logo-text { font-size: 22px; }
            .tournament-header { padding: 15px; }
            .tournament-title h1 { font-size: 1.3rem; }
            .tournament-actions { flex-direction: column; width: 100%; }
            .tournament-actions .btn { width: 100%; text-align: center; }
            .tabs { padding: 0 15px; }
            .banner { padding: 0 15px; }
            .main-content { padding: 0 15px 30px; }
            .info-section { padding: 20px; }
            .sidebar-card { padding: 20px; }
            .entry-item { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo" onclick="window.location.href='index.html'">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066CC;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="45" fill="url(#logoGrad)" stroke="#FFB800" stroke-width="3"/>
                <text x="50" y="65" font-family="Arial Black, sans-serif" font-size="45" font-weight="900" fill="#FFB800" text-anchor="middle">T</text>
            </svg>
            <div class="logo-text">TopCompSports</div>
        </div>
        
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="tournaments.html">Tournaments</a>
            
            <div id="userSection" class="user-section" style="display: none;">
                <a href="my-profile.html" style="color: var(--accent-yellow); text-decoration: none;">My Profile</a>
                <div class="user-info" onclick="window.location.href='my-profile.html'">
                    <div class="user-avatar" id="userAvatar"><span>👤</span></div>
                    <span class="user-name" id="userName">User</span>
                </div>
                <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
            </div>
            
            <a href="login.html" id="loginBtn" class="btn btn-login">Login</a>
            
            <div class="lang-switcher">
                <button class="lang-btn" onclick="changeLanguage('ar')" id="btn-ar">عربي</button>
                <button class="lang-btn active" onclick="changeLanguage('en')" id="btn-en">English</button>
            </div>
        </nav>
    </header>

    <div id="tournamentContent">
        <div class="loading">Loading tournament details...</div>
    </div>

    <footer class="footer">
        <p>© 2026 TopCompSports - All rights reserved</p>
    </footer>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLang = localStorage.getItem('lang') || 'en';
        let tournamentId = null;
        let currentTab = 'information';

        window.onload = async function() {
            checkUserStatus();
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            if (!tournamentId) {
                document.getElementById('tournamentContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>Tournament not found</p>
                    </div>
                `;
                return;
            }
            
            await loadTournamentDetails();
        };

        function checkUserStatus() {
            const storedUser = localStorage.getItem('currentUser');
            if (storedUser) {
                try {
                    const userData = JSON.parse(storedUser);
                    document.getElementById('userSection').style.display = 'flex';
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('userName').textContent = userData.full_name || 'User';
                    if (userData.profile_picture_url) {
                        document.getElementById('userAvatar').innerHTML = `<img src="${userData.profile_picture_url}" alt="Profile">`;
                    }
                } catch (e) {
                    showLoginButton();
                }
            } else {
                showLoginButton();
            }
        }

        function showLoginButton() {
            document.getElementById('userSection').style.display = 'none';
            document.getElementById('loginBtn').style.display = 'inline-block';
        }

        function changeLanguage(lang) {
            localStorage.setItem('lang', lang);
            currentLang = lang;
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            loadTournamentDetails();
        }

        function formatDate(dateStr) {
            if (!dateStr) return currentLang === 'ar' ? 'غير محدد' : 'TBD';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return currentLang === 'ar' ? 'غير محدد' : 'TBD';
            return date.toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US', { 
                year: 'numeric', month: 'long', day: 'numeric' 
            });
        }

        // ✅ FIXED: Tab Switching Function
        function switchTab(tabName) {
            currentTab = tabName;
            
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            if (event && event.target) {
                const clickedTab = event.target.closest('.tab');
                if (clickedTab) clickedTab.classList.add('active');
            }
            
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            const activeContent = document.getElementById(`${tabName}Tab`);
            if (activeContent) {
                activeContent.classList.add('active');
                
                // ✅ Load data dynamically when tab is opened
                if (tabName === 'athletes') {
                    loadAthletes();
                } else if (tabName === 'brackets') {
                    loadBrackets();
                }
            }
        }

        // ✅ NEW: Load Athletes Data
        async function loadAthletes() {
            const athletesList = document.getElementById('athletesList');
            if (!athletesList) return;
            
            athletesList.innerHTML = '<div class="loading">Loading athletes...</div>';
            
            try {
                const { data: participants, error } = await dbClient
                    .from('tournament_participants')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .order('ranking', { ascending: true });

                if (error) throw error;

                if (!participants || participants.length === 0) {
                    athletesList.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"></div>
                            <p>No athletes registered yet</p>
                        </div>
                    `;
                    return;
                }

                // Group by division for better display
                const divisions = {};
                participants.forEach(p => {
                    const gender = p.gender || 'Unknown';
                    const ageGroup = p.age_group || p.age || 'All Ages';
                    const belt = p.belt_level || p.belt || 'All Belts';
                    const weightClass = p.weight_class || p.weight_class_name || p.division || 'All Weights';
                    
                    const divisionKey = `${gender} / ${ageGroup} / ${belt} / ${weightClass}`;
                    
                    if (!divisions[divisionKey]) {
                        divisions[divisionKey] = [];
                    }
                    divisions[divisionKey].push(p);
                });

                let html = '';
                Object.keys(divisions).forEach(divisionName => {
                    const athletes = divisions[divisionName];
                    
                    html += `
                        <div style="margin-bottom: 30px;">
                            <h3 style="color: var(--accent-yellow); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid rgba(255,255,255,0.1);">
                                ${divisionName}
                            </h3>
                            <div style="display: grid; gap: 10px;">
                                ${athletes.map((athlete, idx) => {
                                    const name = athlete.full_name || athlete.player_name || athlete.name || 'Unknown';
                                    const team = athlete.team_name || athlete.team || 'Free Agent';
                                    const initial = name.charAt(0).toUpperCase();
                                    
                                    return `
                                        <div class="athlete-card" style="background: var(--bg-input); padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary-blue); display: flex; align-items: center; gap: 15px;">
                                            <div class="athlete-avatar">${initial}</div>
                                            <div class="athlete-info" style="flex: 1;">
                                                <div class="athlete-name" style="font-weight: 700; color: var(--text-main); font-size: 1.1rem;">${name}</div>
                                                <div class="athlete-details" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">
                                                    ${team ? `<span>🏆 ${team}</span>` : ''}
                                                    ${athlete.weight_class || athlete.weight_class_name ? `<span> • ⚖️ ${athlete.weight_class || athlete.weight_class_name}</span>` : ''}
                                                    ${athlete.is_suspended ? '<span style="color: var(--danger);"> • ⚠️ Suspended</span>' : ''}
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <div style="color: var(--text-muted); margin-top: 10px; font-size: 0.9rem;">
                                Total registrations in this division: ${athletes.length}
                            </div>
                        </div>
                    `;
                });
                
                athletesList.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading athletes:', error);
                athletesList.innerHTML = `
                    <div class="empty-state">
                        <p>Error loading athletes: ${error.message}</p>
                    </div>
                `;
            }
        }

        // ✅ NEW: Load Brackets Data
        async function loadBrackets() {
            const bracketsContent = document.getElementById('bracketsContent');
            if (!bracketsContent) return;
            
            bracketsContent.innerHTML = '<div class="loading">Loading brackets...</div>';
            
            try {
                const { data: participants, error } = await dbClient
                    .from('tournament_participants')
                    .select('*')
                    .eq('tournament_id', tournamentId);

                if (error) throw error;

                if (!participants || participants.length === 0) {
                    bracketsContent.innerHTML = `
                        <div class="empty-state">
                            <div class="icon"></div>
                            <h3>${currentLang === 'ar' ? 'لا يوجد مشاركين' : 'No Participants Yet'}</h3>
                            <p>${currentLang === 'ar' ? 'لم يتم تسجيل أي لاعب حتى الآن' : 'No athletes have registered yet'}</p>
                        </div>
                    `;
                    return;
                }

                // Group participants by division
                const divisions = {};
                participants.forEach(p => {
                    const gender = p.gender || 'Unknown';
                    const ageGroup = p.age_group || p.age || 'All Ages';
                    const belt = p.belt_level || p.belt || 'All Belts';
                    const weightClass = p.weight_class || p.weight_class_name || p.division || 'All Weights';
                    const giType = p.gi_type || 'Gi';
                    
                    const divisionKey = `${gender} / ${ageGroup} / ${belt} / ${weightClass} / ${giType}`;
                    
                    if (!divisions[divisionKey]) {
                        divisions[divisionKey] = [];
                    }
                    divisions[divisionKey].push(p);
                });

                let html = '<div class="brackets-container">';
                
                Object.keys(divisions).forEach(divisionName => {
                    const athletes = divisions[divisionName];
                    
                    html += `
                        <div class="division-group">
                            <h3 class="division-title">${divisionName}</h3>
                            <div class="bracket-table">
                                <div class="bracket-table-header">
                                    <div>Athlete</div>
                                    <div>Academy & Affiliation</div>
                                    <div>Registration Details</div>
                                </div>
                    `;
                    
                    athletes.forEach(athlete => {
                        const name = athlete.full_name || athlete.player_name || athlete.name || 'Unknown';
                        const team = athlete.team_name || athlete.team || 'Free Agent';
                        const initial = name.charAt(0).toUpperCase();
                        
                        html += `
                            <div class="bracket-table-row">
                                <div class="athlete-cell">
                                    <div class="athlete-avatar-small">${initial}</div>
                                    <div class="athlete-name-cell">${name}</div>
                                </div>
                                <div class="academy-cell">${team}</div>
                                <div class="registration-cell">
                                    <span class="gender-badge">${athlete.gender || 'N/A'}</span>
                                    <div>${athlete.age_group || athlete.age || 'All Ages'} / ${athlete.belt_level || athlete.belt || 'All Belts'} • ${athlete.weight_class || athlete.weight_class_name || 'All Weights'} • ${athlete.gi_type || 'Gi'}</div>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += `
                            </div>
                            <div class="total-registrations">Total registrations: ${athletes.length}</div>
                        </div>
                    `;
                });
                
                html += '</div>';
                bracketsContent.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading brackets:', error);
                bracketsContent.innerHTML = `
                    <div class="empty-state">
                        <p>Error loading brackets: ${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadTournamentDetails() {
            try {
                const { data: tournament, error: tournamentError } = await dbClient
                    .from('tournaments')
                    .select('*')
                    .eq('id', tournamentId)
                    .single();
                
                if (tournamentError || !tournament) {
                    document.getElementById('tournamentContent').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">❌</div>
                            <p>Tournament not found</p>
                        </div>
                    `;
                    return;
                }

                const { count: participantCount } = await dbClient
                    .from('tournament_participants')
                    .select('*', { count: 'exact', head: true })
                    .eq('tournament_id', tournamentId);

                const { data: divisions } = await dbClient
                    .from('tournament_divisions')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .eq('is_active', true)
                    .eq('is_visible', true)
                    .order('sort_order', { ascending: true });

                const { data: paymentSettings } = await dbClient
                    .from('tournament_payment_settings')
                    .select('*')
                    .eq('tournament_id', tournamentId)
                    .single();

                let organizer = null;
                if (tournament.organizer_id) {
                    const { data: orgData } = await dbClient
                        .from('organizers')
                        .select('*')
                        .eq('user_id', tournament.organizer_id)
                        .single();
                    organizer = orgData;
                }

                renderTournament(tournament, organizer, participantCount || 0, divisions || [], paymentSettings);
            } catch (error) {
                console.error('Error loading tournament:', error);
                document.getElementById('tournamentContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">❌</div>
                        <p>Error loading tournament details</p>
                    </div>
                `;
            }
        }

        function renderTournament(tournament, organizer, participantCount, divisions, paymentSettings) {
            const storedUser = localStorage.getItem('currentUser');
            const isLoggedIn = !!storedUser;
            
            const startDate = tournament.event_start_date || tournament.tournament_date || tournament.event_date;
            const endDate = tournament.event_end_date;
            const location = tournament.location || (currentLang === 'ar' ? 'سيتم الإعلان عنه' : 'To be announced');
            
            let dateDisplay = formatDate(startDate);
            if (endDate && endDate !== startDate) {
                dateDisplay = `${formatDate(startDate)} - ${formatDate(endDate)}`;
            }

            const bannerImage = tournament.image_url || '';
            const bannerHtml = bannerImage ? `<img src="${bannerImage}" alt="${tournament.name}">` : '';

            const registerButton = isLoggedIn
                ? `<button class="btn-register" onclick="window.location.href='player-registration.html?tournament_id=${tournamentId}'">Register Now</button>`
                : `<button class="btn-secondary" onclick="window.location.href='login.html?redirect=tournament-details.html?tournament_id=${tournamentId}'">Login to Register</button>`;

            const entriesHtml = divisions.length > 0
                ? divisions.map(div => {
                    const price = div.price || 0;
                    const priceText = price > 0 ? `$${price} USD` : 'Free';
                    const details = [];
                    if (div.age_group) details.push(div.age_group);
                    if (div.belt_level) details.push(div.belt_level);
                    if (div.weight_class) details.push(div.weight_class);
                    if (div.gender) details.push(div.gender);
                    
                    return `
                        <div class="entry-item">
                            <div class="entry-info">
                                <div class="entry-name">${div.division_name || div.gi_type}</div>
                                ${details.length > 0 ? `<div class="entry-details">${details.join(' • ')}</div>` : ''}
                            </div>
                            <div class="entry-price ${price === 0 ? 'free' : ''}">${priceText}</div>
                        </div>
                    `;
                }).join('')
                : `<div style="text-align: center; padding: 30px; color: var(--text-muted);">
                     <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
                     <p>Divisions will be announced soon</p>
                   </div>`;

            const paymentEnabled = paymentSettings?.payment_enabled || false;
            const paymentBadge = paymentEnabled 
                ? `<span class="payment-badge online">💳 Online Payment Enabled</span>`
                : `<span class="payment-badge cash">💵 Cash Payment Only</span>`;

            document.getElementById('tournamentContent').innerHTML = `
                <!-- Tournament Header -->
                <div class="tournament-header">
                    <div class="tournament-header-content">
                        <div class="tournament-title-section">
                            <div class="tournament-logo">
                                ${bannerImage ? `<img src="${bannerImage}" alt="${tournament.name}">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem;">🏆</div>'}
                            </div>
                            <div class="tournament-title">
                                <h1>${tournament.name}</h1>
                                <p>📅 ${dateDisplay}</p>
                            </div>
                        </div>
                        <div class="tournament-actions">
                            ${registerButton}
                        </div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="tabs-container">
                    <div class="tabs">
                        <button class="tab active" onclick="switchTab('information')">
                            <span>📋</span> Information
                        </button>
                        <button class="tab" onclick="switchTab('athletes')">
                            <span>👥</span> Athletes 
                            <span style="background:var(--accent-yellow);color:var(--black);padding:2px 8px;border-radius:10px;font-size:0.8rem;">${participantCount}</span>
                        </button>
                        <button class="tab" onclick="switchTab('brackets')">
                            <span>🏆</span> Brackets
                        </button>
                        <button class="tab" onclick="switchTab('matches')">
                            <span>⚔️</span> Matches
                        </button>
                        <button class="tab" onclick="switchTab('schedule')">
                            <span>📅</span> Schedule
                        </button>
                        <button class="tab" onclick="switchTab('results')">
                            <span>🏅</span> Results
                        </button>
                    </div>
                </div>

                <!-- Banner -->
                ${bannerImage ? `<div class="banner"><div class="banner-image">${bannerHtml}</div></div>` : ''}

                <!-- Tab Contents -->
                <div class="main-content">
                    <!-- Information Tab -->
                    <div id="informationTab" class="tab-content active" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Tournament Information</h2>
                            <div class="info-meta">
                                <div class="info-meta-item"><span>📅</span><strong>Date:</strong><span>${dateDisplay}</span></div>
                                <div class="info-meta-item"><span>📍</span><strong>Location:</strong><span>${location}</span></div>
                                <div class="info-meta-item"><span>👥</span><strong>Participants:</strong><span>${participantCount} / ${tournament.max_participants || 'Unlimited'}</span></div>
                                ${tournament.registration_fee > 0 ? `<div class="info-meta-item"><span>💰</span><strong>Base Fee:</strong><span>$${tournament.registration_fee} USD</span></div>` : ''}
                                <div class="info-meta-item"><span>💳</span><strong>Payment:</strong>${paymentBadge}</div>
                                ${tournament.sport_type ? `<div class="info-meta-item"><span>🏅</span><strong>Sport:</strong><span>${tournament.sport_type}</span></div>` : ''}
                            </div>
                            <h3>About This Tournament</h3>
                            <p>${tournament.description || 'No description available.'}</p>
                            <h3>Registration Information</h3>
                            <p>This tournament is pre-registration only. We do not take registrations after the deadline or registrations at the event!</p>
                            <ul style="margin: 15px 0; padding-left: 25px; color: var(--text-muted);">
                                ${tournament.reg_regular_end ? `<li><strong>Normal Registration:</strong> Register before ${formatDate(tournament.reg_regular_end)}</li>` : ''}
                                ${tournament.reg_late_end ? `<li><strong>Late Registration:</strong> Register before ${formatDate(tournament.reg_late_end)}</li>` : ''}
                            </ul>
                            <h3>Rules and Policies</h3>
                            <p>By registering for this tournament, you confirm that you have thoroughly reviewed the event information and that you agree to comply with all rules and policies.</p>
                            <h3>Format</h3>
                            <p>The tournament offers every competitor multiple matches per division regardless of wins and losses. Competitors can get as many as 4 to 6 matches per division!</p>
                            <h3>Weigh-Ins</h3>
                            <p>Competitors can weigh in as soon as the event doors open on the day they are competing up until 60 minutes prior to their division start time.</p>
                            <h3>Brackets and Schedule</h3>
                            <p>The tournament's brackets and schedule will be posted 48 hours prior to the event.</p>
                            <h3>Capacity</h3>
                            <p>Each tournament has a set capacity limit and registration will close early if capacity is reached.</p>
                            <h3>Refund Policy</h3>
                            <p>${paymentSettings?.refund_policy || 'A full refund is available until the Normal Registration deadline. After this date, only a full coupon credit is offered.'}</p>
                        </div>
                    </div>

                    <!-- Athletes Tab -->
                    <div id="athletesTab" class="tab-content" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Registered Athletes</h2>
                            <div id="athletesList" class="athletes-list">
                                <div class="loading">Loading athletes...</div>
                            </div>
                        </div>
                    </div>

                    <!-- Brackets Tab -->
                    <div id="bracketsTab" class="tab-content" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Brackets</h2>
                            <div id="bracketsContent">
                                <div class="coming-soon">
                                    <div class="icon">🏆</div>
                                    <h3>Coming Soon</h3>
                                    <p>Brackets will be posted 48 hours before the tournament starts</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Matches Tab -->
                    <div id="matchesTab" class="tab-content" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Matches</h2>
                            <div class="coming-soon">
                                <div class="icon">⚔️</div>
                                <h3>${currentLang === 'ar' ? 'قريباً' : 'Coming Soon'}</h3>
                                <p>${currentLang === 'ar' ? 'سيتم نشر جدول المباريات قريباً' : 'Match schedule will be announced soon'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Schedule Tab -->
                    <div id="scheduleTab" class="tab-content" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Schedule</h2>
                            <div class="coming-soon">
                                <div class="icon">📅</div>
                                <h3>${currentLang === 'ar' ? 'قريباً' : 'Coming Soon'}</h3>
                                <p>${currentLang === 'ar' ? 'سيتم نشر الجدول الكامل قبل 48 ساعة من الحدث' : 'The full schedule will be posted 48 hours prior to the event'}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Results Tab -->
                    <div id="resultsTab" class="tab-content" style="grid-column: 1 / -1;">
                        <div class="info-section">
                            <h2>Results</h2>
                            <div class="coming-soon">
                                <div class="icon">🏅</div>
                                <h3>${currentLang === 'ar' ? 'قريباً' : 'Coming Soon'}</h3>
                                <p>${currentLang === 'ar' ? 'سيتم نشر النتائج بعد انتهاء البطولة' : 'Results will be posted after the tournament ends'}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleLogout() {
            await dbClient.auth.signOut();
            localStorage.removeItem('currentUser');
            showLoginButton();
            window.location.reload();
        }
    </script>
</body>
</html>
