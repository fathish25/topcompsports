<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 TopCompSports Tournament System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  background: #0a0e17; 
  color: #fff; 
  padding: 10px; 
}
.container { max-width: 1600px; margin: 0 auto; }

.btn { 
  padding: 10px 18px; 
  border: none; 
  border-radius: 8px; 
  font-weight: bold; 
  cursor: pointer; 
  margin: 3px; 
  transition: all 0.2s; 
  display: inline-flex; 
  align-items: center; 
  gap: 6px; 
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #27ae60; color: #fff; }
.btn-secondary { background: #34495e; color: #fff; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-warning { background: #f39c12; color: #000; }
.btn-info { background: #2980b9; color: #fff; }
.btn-purple { background: #8e44ad; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }

.section { 
  background: #1a1f2e; 
  border-radius: 12px; 
  padding: 20px; 
  margin-bottom: 15px; 
  border: 1px solid #2a3548; 
}
.section-title { 
  font-size: 1.3rem; 
  font-weight: bold; 
  color: #f1c40f; 
  margin-bottom: 15px; 
  border-bottom: 2px solid #2a3548; 
  padding-bottom: 10px; 
}

.header { 
  background: #151d2b; 
  padding: 15px 25px; 
  border-radius: 12px; 
  margin-bottom: 15px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
  flex-wrap: wrap; 
  gap: 10px; 
}
.header h1 { color: #f1c40f; font-size: 1.5rem; }

.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2a3548; }
th { background: #151d2b; color: #8899aa; font-size: 0.8rem; text-transform: uppercase; }

input, select { 
  background: #0f1724; 
  border: 1px solid #2a3548; 
  color: #fff; 
  padding: 6px 10px; 
  border-radius: 5px; 
  font-size: 0.85rem; 
  width: 100%; 
}
input:focus, select:focus { outline: none; border-color: #f1c40f; }

.tabs { 
  display: flex; 
  gap: 5px; 
  margin-bottom: 15px; 
  background: rgba(0,0,0,0.2); 
  padding: 5px; 
  border-radius: 10px; 
  flex-wrap: wrap; 
}
.tab { 
  padding: 10px 18px; 
  border: none; 
  background: transparent; 
  color: #8899aa; 
  cursor: pointer; 
  font-weight: bold; 
  border-radius: 8px; 
}
.tab.active { background: #f1c40f; color: #000; }
.tab-content { display: none; }
.tab-content.active { display: block; }

.sync-indicator { 
  position: fixed; 
  top: 10px; 
  right: 10px; 
  padding: 8px 15px; 
  background: #27ae60; 
  color: #fff; 
  border-radius: 20px; 
  font-size: 0.85rem; 
  font-weight: bold; 
  z-index: 9999; 
  display: none; 
  box-shadow: 0 4px 15px rgba(39,174,96,0.4); 
}
.sync-indicator.active { display: block; animation: syncPulse 1s ease-in-out; }
@keyframes syncPulse { 
  0% { transform: scale(0.8); opacity: 0; } 
  50% { transform: scale(1.1); } 
  100% { transform: scale(1); opacity: 1; } 
}

.tag { 
  background: rgba(241,196,15,0.2); 
  padding: 4px 10px; 
  border-radius: 12px; 
  font-size: 0.8rem; 
  margin: 3px; 
  display: inline-flex; 
  align-items: center; 
  gap: 5px; 
}
.tag-remove { cursor: pointer; color: #e74c3c; font-weight: bold; }

/* === Scoreboard Styles === */
.scoreboard-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.scoreboard-header {
  text-align: center;
  padding: 20px;
  background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
  border-radius: 12px;
  margin-bottom: 20px;
  border: 2px solid #f1c40f;
}
.scoreboard-title {
  color: #f1c40f;
  font-size: 1.5rem;
  margin-bottom: 10px;
}
.scoreboard-subtitle {
  color: #8899aa;
  font-size: 0.9rem;
}
.scoreboard-players {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: center;
  margin-bottom: 30px;
}
.scoreboard-player {
  background: #1a1f2e;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  border: 2px solid #2a3548;
}
.scoreboard-player.active {
  border-color: #f1c40f;
  box-shadow: 0 0 20px rgba(241,196,15,0.3);
}
.scoreboard-player.winner {
  border-color: #27ae60;
  background: rgba(39,174,96,0.2);
}
.player-name {
  font-size: 1.5rem;
  font-weight: bold;
  color: #fff;
  margin-bottom: 5px;
}
.player-team {
  color: #8899aa;
  font-size: 0.9rem;
  margin-bottom: 15px;
}
.player-score {
  font-size: 4rem;
  font-weight: bold;
  color: #f1c40f;
  margin: 15px 0;
}
.score-controls {
  display: flex;
  gap: 5px;
  justify-content: center;
  flex-wrap: wrap;
}
.score-btn {
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  font-size: 0.9rem;
}
.score-btn-1 { background: #27ae60; color: #fff; }
.score-btn-2 { background: #2980b9; color: #fff; }
.score-btn-3 { background: #8e44ad; color: #fff; }
.score-btn-win { background: #f1c40f; color: #000; width: 100%; margin-top: 10px; padding: 12px; }
.score-btn:hover { transform: translateY(-2px); }

.vs-divider {
  font-size: 2rem;
  font-weight: bold;
  color: #f1c40f;
  text-align: center;
}
.scoreboard-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}
.match-timer {
  text-align: center;
  font-size: 2rem;
  color: #f1c40f;
  margin: 15px 0;
  font-weight: bold;
}

/* === Match Queue Styles === */
.match-queue-item {
  background: #1a1f2e;
  border: 1px solid #2a3548;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
.match-queue-item.current {
  border-color: #f1c40f;
  background: rgba(241,196,15,0.1);
}
.match-queue-item.next {
  border-color: #2980b9;
  background: rgba(41,128,185,0.1);
}
.match-queue-item.upcoming {
  border-color: #2a3548;
}
.match-players {
  flex: 1;
  min-width: 200px;
}
.match-status {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: bold;
}
.status-current { background: #f1c40f; color: #000; }
.status-next { background: #2980b9; color: #fff; }
.status-upcoming { background: #34495e; color: #fff; }
.status-completed { background: #27ae60; color: #fff; }

/* === Bracket Styles === */
.bracket-container {
  overflow-x: auto;
  padding: 20px;
  background: #0d1117;
  border-radius: 10px;
  margin-top: 20px;
}
.bracket-rounds {
  display: flex;
  gap: 30px;
  min-width: max-content;
}
.bracket-round {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  min-width: 250px;
}
.round-title {
  text-align: center;
  color: #f1c40f;
  margin-bottom: 20px;
  padding: 10px;
  background: rgba(241,196,15,0.1);
  border-radius: 8px;
  font-weight: bold;
}
.bracket-match {
  background: #1a1f2e;
  border: 2px solid #2a3548;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 15px;
  min-width: 220px;
  transition: all 0.3s;
}
.bracket-match.completed { border-color: #27ae60; }
.bracket-match.pending:hover { border-color: #f1c40f; }
.match-player {
  padding: 8px;
  margin-bottom: 5px;
  background: rgba(241,196,15,0.1);
  border-radius: 4px;
  border-left: 3px solid #f1c40f;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.match-player.winner {
  background: rgba(39,174,96,0.3);
  border-left-color: #27ae60;
  color: #2ecc71;
  font-weight: bold;
}

@media (max-width: 768px) {
  .header { flex-direction: column; text-align: center; }
  .btn { margin: 2px; padding: 8px 12px; font-size: 0.85rem; }
  table { font-size: 0.75rem; }
  th, td { padding: 4px; }
  .bracket-rounds { gap: 15px; }
  .bracket-round { min-width: 200px; }
  .scoreboard-players { grid-template-columns: 1fr; }
  .vs-divider { margin: 10px 0; }
  .player-score { font-size: 3rem; }
}
</style>
</head>
<body>

<div class="sync-indicator" id="syncIndicator">🔄 Syncing...</div>

<div class="container">
  <div class="header">
    <div>
      <h1>🏆 TopCompSports Tournament System</h1>
      <div style="color: #8899aa; font-size: 0.85rem;" id="subtitle">Step 1: Players Registration</div>
      <div id="dbStatus" style="color: #2ecc71; font-size: 0.75rem; margin-top: 5px;">● Connected to Database</div>
    </div>
    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
      <button class="btn btn-info" id="btnPlayers"> Players</button>
      <button class="btn btn-purple" id="btnMats"> Mats</button>
      <button class="btn btn-warning" id="btnSettings">⚙️ Settings</button>
      <button class="btn btn-secondary" id="btnSync">🔄 Sync</button>
      <button class="btn btn-secondary" id="btnSaveLocal">💾 Save Local</button>
      <button class="btn btn-danger" id="btnClear">🗑️ Clear</button>
    </div>
  </div>

  <div id="view-players" class="view active">
    <div class="section">
      <div class="section-title">👥 Players Registration <span id="playerCount" style="color: #8899aa;">0 / 200</span></div>
      <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" id="btnAddPlayer">➕ Add Player</button>
        <button class="btn btn-secondary" id="btnAdd10">➕ Add 10</button>
        <button class="btn btn-info" id="btnAdd50">➕ Add 50</button>
        <button class="btn btn-info" id="btnImportCSV">📥 Import CSV</button>
        <input type="file" id="csvImport" accept=".csv" style="display:none">
        <button class="btn btn-info" id="btnExportCSV">📤 Export CSV</button>
        <button class="btn btn-warning" id="btnSyncDB">🔄 Sync with DB</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Team</th><th>Age Group</th><th>Gender</th><th>Weight</th><th>Belt</th><th>Rank</th><th>Action</th></tr></thead>
          <tbody id="playersTable"></tbody>
        </table>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;" id="btnProceedMats">🥋 Proceed to Mats →</button>
    </div>
  </div>

  <div id="view-mats" class="view">
    <div class="section">
      <div class="section-title">🥋 Mats Setup</div>
      <div style="margin-bottom: 15px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px;">
        <label style="font-weight: bold; color: #f1c40f;">Number of Mats: </label>
        <select id="matsCount" style="width: auto; display: inline-block;">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
        </select>
        <button class="btn btn-info btn-sm" style="margin-left: 15px;" id="btnOpenAllMats"> Open All Mats</button>
      </div>
      <div id="matsGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;"></div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 15px; padding: 12px;" id="btnOpenDashboard">🏆 Open Mat Dashboard →</button>
    </div>
  </div>

  <div id="view-settings" class="view">
    <div class="section">
      <div class="section-title">⚙️ Fight Time Settings</div>
      <div id="settingsContent">Loading settings...</div>
      <button class="btn btn-primary" style="margin-top: 15px;" id="btnBackPlayers">← Back to Players</button>
    </div>
  </div>

  <div id="view-dashboard" class="view">
    <div class="section">
      <div class="section-title">📊 Mat Dashboard</div>
      <div class="tabs">
        <button class="tab active" id="tabCategories"> Categories</button>
        <button class="tab" id="tabQueue">⏳ Queue</button>
        <button class="tab" id="tabCallup">📢 Call-Up</button>
        <button class="tab" id="tabStandings">🏆 Standings</button>
      </div>
      <div id="tab-categories" class="tab-content active"></div>
      <div id="tab-queue" class="tab-content"></div>
      <div id="tab-callup" class="tab-content"></div>
      <div id="tab-standings" class="tab-content"></div>
    </div>
  </div>

  <div id="view-bracket" class="view">
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h2 class="section-title" id="bracketTitle" style="margin: 0; border: none; padding: 0;">🏆 Tournament Bracket</h2>
        <button class="btn btn-secondary" id="btnBackToDash">← Back to Dashboard</button>
      </div>
      <div id="bracketContent" class="bracket-container"></div>
    </div>
  </div>

  <!-- Scoreboard View -->
  <div id="view-scoreboard" class="view">
    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
        <h2 class="section-title" id="scoreboardTitle" style="margin: 0; border: none; padding: 0;">🥊 Match Scoreboard</h2>
        <button class="btn btn-secondary" id="btnBackToBracket">← Back to Bracket</button>
      </div>
      <div id="scoreboardContent" class="scoreboard-container"></div>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let players = [];
  let mats = [{ id: 1, weights: [], ageGroups: [], belts: [], genders: [] }];
  let categories = {};
  let currentMat = 1;
  let tournamentId = null;
  let ageGroupsData = [];
  let beltLevelsData = [];
  let weightClassesData = [];
  let currentMatch = null; // For scoreboard
  let currentBracketKey = null;

  // Tournament-specific storage key
  function getStorageKey() {
    return 'tournament_' + (tournamentId || 'default');
  }

  async function loadDropdownData() {
    try {
      const ageResult = await supabase.from('age_groups').select('*').order('min_age');
      if (!ageResult.error && ageResult.data) {
        ageGroupsData = ageResult.data;
        console.log('✅ Loaded age groups:', ageGroupsData.length);
      }
      
      const beltResult = await supabase.from('belt_levels').select('*').order('sort_order');
      if (!beltResult.error && beltResult.data) {
        beltLevelsData = beltResult.data;
        console.log('✅ Loaded belt levels:', beltLevelsData.length);
      }
      
      const weightResult = await supabase.from('weight_classes').select('*').order('max_weight');
      if (!weightResult.error && weightResult.data) {
        weightClassesData = weightResult.data;
        console.log('✅ Loaded weight classes:', weightClassesData.length);
      }
    } catch (err) {
      console.error('❌ Error loading dropdown data:', err);
    }
  }

  function showView(view) {
    const views = document.querySelectorAll('.view');
    views.forEach(v => v.classList.remove('active'));
    
    const viewEl = document.getElementById('view-' + view);
    if (viewEl) {
      viewEl.classList.add('active');
    }
    
    const subtitles = {
      'players': 'Step 1: Players Registration',
      'mats': 'Step 2: Mats Setup',
      'settings': 'Step 3: Settings',
      'dashboard': 'Mat Dashboard',
      'bracket': 'Tournament Bracket',
      'scoreboard': 'Match Scoreboard'
    };
    
    const subtitleEl = document.getElementById('subtitle');
    if (subtitleEl) {
      subtitleEl.innerText = subtitles[view] || '';
    }
    
    if (view === 'mats') renderMats();
    if (view === 'settings') renderSettings();
    if (view === 'dashboard') {
      renderCategories();
      renderQueue();
      renderCallUp();
      renderStandings();
    }
    
    console.log('✅ Switched to view:', view);
  }

  function switchTab(tab) {
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => t.classList.remove('active'));
    
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(c => c.classList.remove('active'));
    
    const tabEl = document.getElementById('tab-' + tab);
    if (tabEl) {
      tabEl.classList.add('active');
      const tabButton = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (tabButton) tabButton.classList.add('active');
    }
    
    if (tab === 'categories') renderCategories();
    if (tab === 'queue') renderQueue();
    if (tab === 'callup') renderCallUp();
    if (tab === 'standings') renderStandings();
  }

  function addPlayer() {
    if (players.length >= 200) {
      alert('Maximum 200 players reached!');
      return;
    }
    
    players.push({
      id: Date.now() + Math.random(),
      name: '',
      team: '',
      ageGroup: 'Amateur/Professional',
      gender: 'Men',
      weight: '',
      belt: 'White',
      rank: players.length + 1
    });
    
    renderPlayers();
    saveData();
    console.log('✅ Player added. Total:', players.length);
  }

  function addPlayers(count) {
    for (let i = 0; i < count && players.length < 200; i++) {
      addPlayer();
    }
  }

  function renderPlayers() {
    const tbody = document.getElementById('playersTable');
    if (!tbody) {
      console.error('❌ playersTable not found!');
      return;
    }
    
    tbody.innerHTML = '';
    
    players.forEach((p, index) => {
      const tr = document.createElement('tr');
      
      let ageOptions = '<option value="">Select Age</option>';
      if (ageGroupsData.length > 0) {
        ageGroupsData.forEach(ag => {
          const selected = p.ageGroup === ag.name ? 'selected' : '';
          ageOptions += `<option value="${ag.name}" ${selected}>${ag.name} (${ag.min_age}-${ag.max_age})</option>`;
        });
      } else {
        ageOptions += '<option ' + (p.ageGroup === 'Amateur/Professional' ? 'selected' : '') + '>Amateur/Professional</option>';
      }
      
      let beltOptions = '<option value="">Select Belt</option>';
      if (beltLevelsData.length > 0) {
        beltLevelsData.forEach(bl => {
          const selected = p.belt === bl.name ? 'selected' : '';
          beltOptions += `<option value="${bl.name}" ${selected}>${bl.name}</option>`;
        });
      } else {
        beltOptions += '<option ' + (p.belt === 'White' ? 'selected' : '') + '>White</option>';
      }
      
      const genderOptions = `
        <option ${p.gender === 'Men' ? 'selected' : ''}>Men</option>
        <option ${p.gender === 'Women' ? 'selected' : ''}>Women</option>
        <option ${p.gender === 'Boys' ? 'selected' : ''}>Boys</option>
        <option ${p.gender === 'Girls' ? 'selected' : ''}>Girls</option>
      `;
      
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><input type="text" value="${p.name}" data-index="${index}" data-field="name" class="player-input" placeholder="Name"></td>
        <td><input type="text" value="${p.team}" data-index="${index}" data-field="team" class="player-input" placeholder="Team"></td>
        <td><select data-index="${index}" data-field="ageGroup" class="player-select">${ageOptions}</select></td>
        <td><select data-index="${index}" data-field="gender" class="player-select">${genderOptions}</select></td>
        <td><input type="text" value="${p.weight}" data-index="${index}" data-field="weight" class="player-input" placeholder="Weight"></td>
        <td><select data-index="${index}" data-field="belt" class="player-select">${beltOptions}</select></td>
        <td><input type="number" value="${p.rank}" data-index="${index}" data-field="rank" class="player-input" style="width: 60px;"></td>
        <td><button class="btn btn-danger btn-sm delete-player" data-index="${index}">✕</button></td>
      `;
      
      tbody.appendChild(tr);
    });
    
    document.querySelectorAll('.player-input').forEach(input => {
      input.addEventListener('change', function() {
        const index = parseInt(this.dataset.index);
        const field = this.dataset.field;
        const value = this.type === 'number' ? parseInt(this.value) || 0 : this.value;
        players[index][field] = value;
        saveData();
      });
    });
    
    document.querySelectorAll('.player-select').forEach(select => {
      select.addEventListener('change', function() {
        const index = parseInt(this.dataset.index);
        const field = this.dataset.field;
        players[index][field] = this.value;
        saveData();
      });
    });
    
    document.querySelectorAll('.delete-player').forEach(btn => {
      btn.addEventListener('click', function() {
        const index = parseInt(this.dataset.index);
        if (confirm('Delete this player?')) {
          players.splice(index, 1);
          renderPlayers();
          saveData();
        }
      });

  function importCSV(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split('\n').filter(l => l.trim());
      for (let i = 1; i < lines.length && players.length < 200; i++) {
        const vals = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
        if (vals.length >= 3) {
          players.push({
            id: Date.now() + i + Math.random(),
            name: vals[0] || '',
            team: vals[1] || '',
            ageGroup: vals[2] || 'Amateur/Professional',
            gender: 'Men',
            weight: vals[4] || '',
            belt: vals[5] || 'White',
            rank: parseInt(vals[6]) || players.length + 1
          });
        }
      }
      renderPlayers();
      saveData();
      alert('✅ Imported ' + (lines.length - 1) + ' players!');
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function createBracket(categoryKey) {
    const parts = categoryKey.split('|');
    const category = {
      ageGroup: parts[0],
      gender: parts[1],
      weight: parts[2],
      belt: parts[3]
    };
    
    const categoryPlayers = players.filter(p => 
      p.ageGroup === category.ageGroup &&
      p.gender === category.gender &&
      p.weight === category.weight &&
      p.belt === category.belt
    ).sort((a, b) => a.rank - b.rank);
    
    if (categoryPlayers.length < 2) {
      alert('⚠️ Need at least 2 players to create a bracket!');
      return;
    }
    
    const bracket = generateBracket(categoryPlayers);
    
    categories[categoryKey] = {
      ...category,
      players: categoryPlayers,
      bracket: bracket,
      createdAt: new Date().toISOString()
    };
    
    renderBracketView(categoryKey);
    showView('bracket');
    
    saveData();
    console.log('✅ Bracket created for:', categoryKey);
  }

  function generateBracket(players) {
    const numPlayers = players.length;
    
    let bracketSize = 1;
    while (bracketSize < numPlayers) {
      bracketSize *= 2;
    }
    
    const rounds = [];
    const firstRound = [];
    
    for (let i = 0; i < bracketSize / 2; i++) {
      const player1 = players[i] || null;
      const player2 = players[bracketSize - 1 - i] || null;
      
      let status = 'pending';
      let winner = null;
      
      if (!player2 && player1) {
        status = 'completed';
        winner = player1.id;
      } else if (!player1 && player2) {
        status = 'completed';
        winner = player2.id;
      }
      
      firstRound.push({
        id: `R1-M${i + 1}`,
        round: 1,
        player1: player1,
        player2: player2,
        winner: winner,
        status: status,
        score1: 0,
        score2: 0,
        current: false
      });
    }
    
    rounds.push(firstRound);
    
    let matchesInRound = firstRound.length;
    let roundNum = 2;
    
    while (matchesInRound > 1) {
      const nextRound = [];
      for (let i = 0; i < matchesInRound / 2; i++) {
        nextRound.push({
          id: `R${roundNum}-M${i + 1}`,
          round: roundNum,
          player1: null,
          player2: null,
          winner: null,
          status: 'pending',
          score1: 0,
          score2: 0,
          current: false
        });
      }
      rounds.push(nextRound);
      matchesInRound = nextRound.length;
      roundNum++;
    }
    
    return {
      rounds: rounds,
      createdAt: new Date().toISOString()
    };
  }

        } else if (match.status === 'completed') {

        } else if (!match.player1 || !match.player2) {

  // Score functions - made global
  window.addScore = function(playerNum, points) {
    if (!currentMatch) return;
    
    const match = currentMatch.match;
    if (match.status === 'completed') {
      alert('Match already completed!');
      return;
    }
    
    if (playerNum === 1) {
      match.score1 += points;
    } else {
      match.score2 += points;
    }
    
    renderScoreboard();
    saveData();
  };

  window.declareWinner = function(playerNum) {
    if (!currentMatch) return;
    
    const match = currentMatch.match;
    const data = categories[currentMatch.categoryKey];
    
    if (playerNum === 1) {
      match.winner = match.player1.id;
      match.score1 = Math.max(match.score1, match.score2 + 1);
    } else {
      match.winner = match.player2.id;
      match.score2 = Math.max(match.score2, match.score1 + 1);
    }
    
    match.status = 'completed';
    match.current = false;
    
    // Update next round
    if (currentMatch.roundIndex < data.bracket.rounds.length - 1) {
      const winnerPlayer = match.winner === match.player1.id ? match.player1 : match.player2;
      const nextRoundIndex = currentMatch.roundIndex + 1;
      const nextMatchIndex = Math.floor(currentMatch.matchIndex / 2);
      const isPlayer1Slot = currentMatch.matchIndex % 2 === 0;
      
      const nextMatch = data.bracket.rounds[nextRoundIndex][nextMatchIndex];
      if (isPlayer1Slot) {
        nextMatch.player1 = winnerPlayer;
      } else {
        nextMatch.player2 = winnerPlayer;
      }
      
      // Mark next match as current if both players are ready
      if (nextMatch.player1 && nextMatch.player2) {
        // Clear other current flags in next round
        data.bracket.rounds[nextRoundIndex].forEach(m => m.current = false);
        nextMatch.current = true;
      }
    }
    
    alert(`🏆 Winner: ${playerNum === 1 ? match.player1.name : match.player2.name}!`);
    
    renderBracketView(currentMatch.categoryKey);
    showView('bracket');
    saveData();
    
    currentMatch = null;
  };

  window.resetScores = function() {
    if (!currentMatch) return;
    const match = currentMatch.match;
    match.score1 = 0;
    match.score2 = 0;
    renderScoreboard();
    saveData();
  };

  window.undoLastScore = function() {
    if (!currentMatch) return;
    const match = currentMatch.match;
    if (match.score1 > 0) match.score1 = Math.max(0, match.score1 - 1);
    else if (match.score2 > 0) match.score2 = Math.max(0, match.score2 - 1);
    renderScoreboard();
    saveData();
  };

  // Timer
  window.timerRunning = false;
  let timerInterval = null;
  let timerSeconds = 0;

  window.toggleTimer = function() {
    if (window.timerRunning) {
      clearInterval(timerInterval);
      window.timerRunning = false;
    } else {
      window.timerRunning = true;
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
        const secs = (timerSeconds % 60).toString().padStart(2, '0');
        const timerEl = document.getElementById('matchTimer');
        if (timerEl) timerEl.innerText = `${mins}:${secs}`;
      }, 1000);
    }
    renderScoreboard();
  };

  function renderQueue() {
    const container = document.getElementById('tab-queue');
    if (!container) return;
    
    let html = '<h3 style="color: #f1c40f; margin-bottom: 15px;">⏳ Match Queue</h3>';
    
    // Collect all matches from all brackets
    const allMatches = [];
    Object.keys(categories).forEach(key => {
      const cat = categories[key];
      if (cat.bracket) {
        cat.bracket.rounds.forEach((round, rIdx) => {
          round.forEach((match, mIdx) => {
            if (match.player1 && match.player2) {
              allMatches.push({
                categoryKey: key,
                category: cat,
                roundIndex: rIdx,
                matchIndex: mIdx,
                match: match
              });
            }
          });
        });
      }
    });
    
    if (allMatches.length === 0) {
      html += '<p style="color: #8899aa;">No matches scheduled yet. Create brackets first.</p>';
    } else {
      // Sort: current first, then by round
      allMatches.sort((a, b) => {
        if (a.match.current && !b.match.current) return -1;
        if (!a.match.current && b.match.current) return 1;
        if (a.match.status === 'completed' && b.match.status !== 'completed') return 1;
        if (a.match.status !== 'completed' && b.match.status === 'completed') return -1;
        return a.match.round - b.match.round;
      });
      
      allMatches.forEach(item => {
        let statusClass = 'upcoming';
        let statusText = 'Upcoming';
        let itemClass = 'match-queue-item upcoming';
        
        if (item.match.current) {
          statusClass = 'current';
          statusText = '🔴 LIVE';
          itemClass = 'match-queue-item current';
        } else if (item.match.status === 'completed') {
          statusClass = 'completed';
          statusText = '✅ Completed';
          itemClass = 'match-queue-item';
        } else if (item.match.round === 1) {
          statusClass = 'next';
          statusText = '️ Next';
          itemClass = 'match-queue-item next';
        }
        
        const p1Name = item.match.player1 ? item.match.player1.name : 'TBD';
        const p2Name = item.match.player2 ? item.match.player2.name : 'TBD';
        const winner = item.match.winner ? 
          (item.match.winner === item.match.player1?.id ? item.match.player1.name : item.match.player2.name) : '-';
        
        html += `<div class="${itemClass}">`;
        html += `<div class="match-players">`;
        html += `<div style="font-weight: bold; color: #f1c40f; margin-bottom: 5px;">${p1Name} vs ${p2Name}</div>`;
        html += `<div style="color: #8899aa; font-size: 0.85rem;">${item.category.ageGroup} | ${item.category.gender} | ${item.category.weight}kg | ${item.category.belt}</div>`;
        html += `<div style="color: #8899aa; font-size: 0.8rem;">Score: ${item.match.score1} - ${item.match.score2} | Winner: ${winner}</div>`;
        html += `</div>`;
        html += `<span class="match-status status-${statusClass}">${statusText}</span>`;
        
        if (item.match.status === 'pending' && item.match.player1 && item.match.player2) {
          html += `<button class="btn btn-sm btn-primary" onclick="window.openQueueMatch('${item.categoryKey}', ${item.roundIndex}, ${item.matchIndex})">▶ Open</button>`;
        }
        
        html += `</div>`;
      });
    }
    
    container.innerHTML = html;
  }

  window.openQueueMatch = function(categoryKey, roundIndex, matchIndex) {
    openScoreboard(categoryKey, roundIndex, matchIndex);
  };

  function renderCallUp() {
    const container = document.getElementById('tab-callup');
    if (!container) return;
    
    let html = '<h3 style="color: #f1c40f; margin-bottom: 15px;">📢 Call-Up System</h3>';
    
    // Find current and next matches
    const currentMatches = [];
    const nextMatches = [];
    
    Object.keys(categories).forEach(key => {
      const cat = categories[key];
      if (cat.bracket) {
        cat.bracket.rounds.forEach((round, rIdx) => {
          round.forEach((match, mIdx) => {
            if (match.current && match.status === 'pending' && match.player1 && match.player2) {
              currentMatches.push({ categoryKey: key, category: cat, roundIndex: rIdx, matchIndex: mIdx, match: match });
            } else if (match.status === 'pending' && match.player1 && match.player2 && !match.current) {
              nextMatches.push({ categoryKey: key, category: cat, roundIndex: rIdx, matchIndex: mIdx, match: match });
            }
          });
        });
      }
    });
    
    if (currentMatches.length > 0) {
      html += '<div style="margin-bottom: 20px; padding: 15px; background: rgba(241,196,15,0.1); border-radius: 8px; border: 2px solid #f1c40f;">';
      html += '<h4 style="color: #f1c40f; margin-bottom: 10px;">🔴 CURRENTLY FIGHTING</h4>';
      currentMatches.forEach(item => {
        html += `<div style="padding: 10px; background: #1a1f2e; border-radius: 6px; margin-bottom: 10px;">`;
        html += `<div style="font-size: 1.2rem; font-weight: bold; color: #fff;">${item.match.player1.name} vs ${item.match.player2.name}</div>`;
        html += `<div style="color: #8899aa;">${item.category.ageGroup} | ${item.category.gender} | ${item.category.weight}kg</div>`;
        html += `<button class="btn btn-sm btn-primary" style="margin-top: 10px;" onclick="window.openQueueMatch('${item.categoryKey}', ${item.roundIndex}, ${item.matchIndex})">📋 Open Scoreboard</button>`;
        html += `</div>`;
      });
      html += '</div>';
    }
    
    if (nextMatches.length > 0) {
      html += '<div style="padding: 15px; background: rgba(41,128,185,0.1); border-radius: 8px; border: 2px solid #2980b9;">';
      html += '<h4 style="color: #2980b9; margin-bottom: 10px;">⏭️ ON DECK (Next Up)</h4>';
      nextMatches.slice(0, 5).forEach(item => {
        html += `<div style="padding: 10px; background: #1a1f2e; border-radius: 6px; margin-bottom: 10px;">`;
        html += `<div style="font-weight: bold; color: #fff;">${item.match.player1.name} vs ${item.match.player2.name}</div>`;
        html += `<div style="color: #8899aa; font-size: 0.85rem;">${item.category.ageGroup} | ${item.category.gender}</div>`;
        html += `</div>`;
      });
      html += '</div>';
    }
    
    if (currentMatches.length === 0 && nextMatches.length === 0) {
      html += '<p style="color: #8899aa;">No matches to call. Create brackets first.</p>';
    }
    
    container.innerHTML = html;
  }

  function renderStandings() {
    const container = document.getElementById('tab-standings');
    if (!container) return;
    
    let html = '<h3 style="color: #f1c40f; margin-bottom: 15px;"> Standings</h3>';
    
    const completedMatches = [];
    Object.keys(categories).forEach(key => {
      const cat = categories[key];
      if (cat.bracket) {
        cat.bracket.rounds.forEach((round, rIdx) => {
          round.forEach((match, mIdx) => {
            if (match.status === 'completed' && match.winner) {
              completedMatches.push({
                categoryKey: key,
                category: cat,
                match: match
              });
            }
          });
        });
      }
    });
    
    if (completedMatches.length === 0) {
      html += '<p style="color: #8899aa;">No results yet. Complete some matches first.</p>';
    } else {
      html += '<div style="display: grid; gap: 10px;">';
      completedMatches.forEach(item => {
        const winner = item.match.winner === item.match.player1?.id ? item.match.player1 : item.match.player2;
        html += `<div style="background: #1a1f2e; padding: 12px; border-radius: 8px; border-left: 4px solid #27ae60;">`;
        html += `<div style="color: #27ae60; font-weight: bold;">🏆 ${winner.name}</div>`;
        html += `<div style="color: #8899aa; font-size: 0.85rem;">${item.category.ageGroup} | ${item.category.gender} | ${item.category.weight}kg | ${item.category.belt}</div>`;
        html += `<div style="color: #8899aa; font-size: 0.8rem;">Score: ${item.match.score1} - ${item.match.score2}</div>`;
        html += `</div>`;
      });
      html += '</div>';
    }
    
    container.innerHTML = html;
  }

  function clearMatFilters() {
    mats.forEach(mat => {
      mat.ageGroups = [];
      mat.genders = [];
      mat.weights = [];
      mat.belts = [];
    });
    renderMats();
    renderCategories();
    saveData();
  }

  window.openMatInNewTab = function(matId) {
    // Save current state first
    saveData();
    
    const baseUrl = window.location.href.split('?')[0];
    const urlParams = new URLSearchParams(window.location.search);
    const currentTournamentId = urlParams.get('tournament_id');
    
    let newUrl = baseUrl + '?mat=' + matId;
    if (currentTournamentId) {
      newUrl += '&tournament_id=' + currentTournamentId;
    }
    
    console.log('🪟 Opening new tab:', newUrl);
    window.open(newUrl, '_blank');
  };

  function openAllMatsInTabs() {
    mats.forEach((mat, i) => {
      setTimeout(() => {
        openMatInNewTab(mat.id);
      }, i * 500);
    });
  }

  async function syncWithDatabase() {
    const indicator = document.getElementById('syncIndicator');
    if (indicator) {
      indicator.classList.add('active');
      setTimeout(() => indicator.classList.remove('active'), 2000);
    }
    
    try {
      const urlParams = new URLSearchParams(window.location.search);
      tournamentId = urlParams.get('tournament_id');
      
      if (!tournamentId) {
        const tResult = await supabase
          .from('tournaments')
          .insert({ name: 'Tournament ' + new Date().toLocaleDateString() })
          .select()
          .single();
        
        if (tResult.error) throw tResult.error;
        tournamentId = tResult.data.id;
        
        // Update URL
        const newUrl = window.location.pathname + '?tournament_id=' + tournamentId;
        window.history.replaceState({}, '', newUrl);
      }
      
      const playersToSync = players.map(p => ({
        id: p.id,
        tournament_id: tournamentId,
        player_name: p.name,
        team: p.team,
        age_group: p.ageGroup,
        gender: p.gender,
        weight: parseFloat(p.weight) || null,
        belt_level: p.belt,
        ranking: p.rank
      }));
      
      if (playersToSync.length > 0) {
        const result = await supabase
          .from('tournament_participants')
          .upsert(playersToSync, { onConflict: 'id' });
        
        if (result.error) throw result.error;
        alert('✅ Synced ' + players.length + ' players to database!');
      } else {
        alert('No players to sync');
      }
      
      console.log('✅ Sync complete');
    } catch (err) {
      console.error('❌ Sync error:', err);
      alert('⚠️ Sync failed: ' + err.message);
    }
  }

  function saveData() {
    const key = getStorageKey();
    localStorage.setItem(key, JSON.stringify({
      players: players,
      mats: mats,
      categories: categories,
      currentMat: currentMat,
      savedAt: new Date().toISOString()
    }));
    console.log('✅ Data saved to localStorage with key:', key);
  }

  function clearAll() {
    if (confirm('⚠️ Clear all data?')) {
      players = [];
      mats = [{ id: 1, weights: [], ageGroups: [], belts: [], genders: [] }];
      categories = {};
      const key = getStorageKey();
      localStorage.removeItem(key);
      renderPlayers();
      alert('🗑️ All data cleared!');
    }
  }

  function renderSettings() {
    const content = document.getElementById('settingsContent');
    if (!content) return;
    content.innerHTML = '<p style="color: #8899aa;">Fight time settings would be loaded from database here.</p>';
  }

  function setupEventListeners() {
    document.getElementById('btnPlayers').addEventListener('click', function() { showView('players'); });
    document.getElementById('btnMats').addEventListener('click', function() { showView('mats'); });
    document.getElementById('btnSettings').addEventListener('click', function() { showView('settings'); });
    document.getElementById('btnSync').addEventListener('click', syncWithDatabase);
    document.getElementById('btnSaveLocal').addEventListener('click', saveData);
    document.getElementById('btnClear').addEventListener('click', clearAll);
    
    document.getElementById('btnAddPlayer').addEventListener('click', addPlayer);
    document.getElementById('btnAdd10').addEventListener('click', function() { addPlayers(10); });
    document.getElementById('btnAdd50').addEventListener('click', function() { addPlayers(50); });
    
    document.getElementById('btnImportCSV').addEventListener('click', function() {
      document.getElementById('csvImport').click();
    });
    
    document.getElementById('csvImport').addEventListener('change', importCSV);
    document.getElementById('btnExportCSV').addEventListener('click', exportCSV);
    document.getElementById('btnSyncDB').addEventListener('click', syncWithDatabase);
    document.getElementById('btnProceedMats').addEventListener('click', function() { showView('mats'); });
    
    document.getElementById('matsCount').addEventListener('change', updateMats);
    document.getElementById('btnOpenAllMats').addEventListener('click', openAllMatsInTabs);
    document.getElementById('btnOpenDashboard').addEventListener('click', function() { showView('dashboard'); });
    
    document.getElementById('btnBackPlayers').addEventListener('click', function() { showView('players'); });
    document.getElementById('btnBackToDash').addEventListener('click', function() { showView('dashboard'); });
    document.getElementById('btnBackToBracket').addEventListener('click', function() { 
      if (currentBracketKey) {
        renderBracketView(currentBracketKey);
        showView('bracket');
      } else {
        showView('dashboard');
      }
    });
    
    document.getElementById('tabCategories').addEventListener('click', function() { switchTab('categories'); });
    document.getElementById('tabQueue').addEventListener('click', function() { switchTab('queue'); });
    document.getElementById('tabCallup').addEventListener('click', function() { switchTab('callup'); });
    document.getElementById('tabStandings').addEventListener('click', function() { switchTab('standings'); });
  }

  async function init() {
    console.log(' Page loaded successfully!');
    
    setupEventListeners();
    
    const urlParams = new URLSearchParams(window.location.search);
    tournamentId = urlParams.get('tournament_id');
    const matParam = urlParams.get('mat');
    
    if (matParam) {
      currentMat = parseInt(matParam);
      console.log('✅ Opening mat:', currentMat);
    }
    
    await loadDropdownData();
    
    // Load tournament-specific data
    const key = getStorageKey();
    const saved = localStorage.getItem(key);
    if (saved) {
      try {
        const data = JSON.parse(saved);
        players = data.players || [];
        mats = data.mats || [{ id: 1, weights: [], ageGroups: [], belts: [], genders: [] }];
        categories = data.categories || {};
        currentMat = data.currentMat || currentMat;
        console.log('✅ Loaded', players.length, 'players from storage');
      } catch(e) {
        console.error(' Error loading data:', e);
      }
    }
    
    renderPlayers();
    
    if (matParam) {
      setTimeout(() => {
        showView('dashboard');
      }, 500);
    }
    
    console.log(' System ready!');
    console.log('- Tournament ID:', tournamentId || 'default');
    console.log('- Players loaded:', players.length);
    console.log('- Mats configured:', mats.length);
    console.log('- Age groups:', ageGroupsData.length);
    console.log('- Belt levels:', beltLevelsData.length);
    
    setInterval(saveData, 30000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  
})();
</script>

</body>
</html>
