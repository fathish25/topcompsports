<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TopCompSports - Tournament Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   GLOBAL STYLES
   ============================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  background: #0a0e17; 
  color: #fff; 
}

/* ============================================
   MAIN HEADER STYLES
   ============================================ */
.main-header {
  background: #0a0e17;
  border-bottom: 2px solid #1e3a8a;
  padding: 15px 0;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.header-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo-section {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo-icon {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  font-weight: bold;
  color: #fbbf24;
  border: 2px solid #fbbf24;
}

.logo-text {
  font-size: 1.8rem;
  font-weight: bold;
  background: linear-gradient(135deg, #3b82f6, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-menu {
  display: flex;
  gap: 30px;
  align-items: center;
}

.nav-link {
  color: #fff;
  text-decoration: none;
  font-weight: 500;
  padding: 8px 15px;
  border-radius: 5px;
  transition: all 0.3s;
}

.nav-link:hover {
  background: rgba(59, 130, 246, 0.2);
  color: #60a5fa;
}

.nav-link.active {
  color: #fbbf24;
}

.user-section {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 15px;
  background: rgba(251, 191, 36, 0.1);
  border-radius: 25px;
  border: 1px solid #fbbf24;
}

.user-avatar {
  width: 35px;
  height: 35px;
  background: #1e293b;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #fbbf24;
}

.user-name {
  color: #fbbf24;
  font-weight: 600;
}

.btn-logout {
  padding: 8px 20px;
  background: transparent;
  border: 2px solid #fff;
  color: #fff;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-logout:hover {
  background: #fff;
  color: #0a0e17;
}

.language-toggle {
  display: flex;
  background: #1e293b;
  border-radius: 8px;
  padding: 4px;
  gap: 4px;
}

.lang-btn {
  padding: 6px 15px;
  border: none;
  background: transparent;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.3s;
}

.lang-btn.active {
  background: #3b82f6;
  color: #fff;
}

/* ============================================
   TOURNAMENT MANAGER STYLES
   ============================================ */
.tournament-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
}

.tournament-header {
  background: #151d2b;
  padding: 20px 25px;
  border-radius: 12px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  border: 1px solid #2a3548;
}

.tournament-title-section h1 {
  color: #fbbf24;
  font-size: 1.8rem;
  margin-bottom: 5px;
}

.tournament-subtitle {
  color: #8899aa;
  font-size: 0.9rem;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(34, 197, 94, 0.2);
  color: #22c55e;
  padding: 5px 12px;
  border-radius: 15px;
  font-size: 0.85rem;
  margin-top: 8px;
}

.action-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9rem;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-players { background: #3b82f6; color: #fff; }
.btn-mats { background: #8b5cf6; color: #fff; }
.btn-settings { background: #f59e0b; color: #000; }
.btn-sync { background: #64748b; color: #fff; }
.btn-save { background: #475569; color: #fff; }
.btn-clear-local { background: #dc2626; color: #fff; }
.btn-clear-db { background: #ea580c; color: #fff; }

/* Players Section */
.section {
  background: #1a1f2e;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 20px;
  border: 1px solid #2a3548;
}

.section-title {
  font-size: 1.4rem;
  font-weight: bold;
  color: #fbbf24;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.player-count {
  color: #8899aa;
  font-size: 1rem;
}

.button-group {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.btn-add { background: #22c55e; color: #fff; }
.btn-add-10 { background: #475569; color: #fff; }
.btn-import { background: #3b82f6; color: #fff; }
.btn-export { background: #0ea5e9; color: #fff; }
.btn-sync-db { background: #f59e0b; color: #000; }

.table-container {
  max-height: 600px;
  overflow-y: auto;
  border-radius: 8px;
  border: 1px solid #2a3548;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  position: sticky;
  top: 0;
  background: #151d2b;
  z-index: 10;
}

th {
  background: #151d2b;
  color: #8899aa;
  padding: 12px;
  text-align: left;
  font-size: 0.85rem;
  text-transform: uppercase;
  border-bottom: 2px solid #2a3548;
}

td {
  padding: 10px;
  border-bottom: 1px solid #2a3548;
}

tr:hover {
  background: rgba(59, 130, 246, 0.05);
}

input, select {
  background: #0f1724;
  border: 1px solid #2a3548;
  color: #fff;
  padding: 8px 10px;
  border-radius: 5px;
  font-size: 0.9rem;
  width: 100%;
}

input:focus, select:focus {
  outline: none;
  border-color: #fbbf24;
}

.btn-delete {
  background: #dc2626;
  color: #fff;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 0.85rem;
}

.btn-delete:hover {
  background: #b91c1c;
}

.btn-proceed {
  width: 100%;
  padding: 15px;
  background: #22c55e;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
  font-size: 1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.btn-proceed:hover {
  background: #16a34a;
}

/* Responsive */
@media (max-width: 968px) {
  .header-container {
    flex-direction: column;
  }
  
  .nav-menu {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .tournament-header {
    flex-direction: column;
    align-items: flex-start;
  }
  
  .action-buttons {
    width: 100%;
  }
  
  .btn {
    flex: 1;
    min-width: 120px;
    justify-content: center;
  }
  
  table {
    font-size: 0.85rem;
  }
  
  th, td {
    padding: 8px 5px;
  }
}

@media (max-width: 640px) {
  .logo-text {
    font-size: 1.3rem;
  }
  
  .nav-menu {
    gap: 15px;
  }
  
  .user-section {
    flex-wrap: wrap;
    justify-content: center;
  }
  
  .table-container {
    overflow-x: auto;
  }
  
  table {
    min-width: 800px;
  }
}
</style>
</head>

<script>
// Simple view toggle
function showView(viewName) {
  // Remove active class from all views
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  
  // Add active class to selected view
  const selectedView = document.getElementById('view-' + viewName);
  if (selectedView) {
    selectedView.classList.add('active');
  }
  
  // Update nav links
  document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
  event.target.classList.add('active');
}
</script>
