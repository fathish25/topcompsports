<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> TopCompSports Tournament System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #fff; padding: 10px; }
.container { max-width: 1600px; margin: 0 auto; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 3px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #27ae60; color: #fff; }
.btn-secondary { background: #34495e; color: #fff; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-warning { background: #f39c12; color: #000; }
.btn-info { background: #2980b9; color: #fff; }
.btn-purple { background: #8e44ad; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }
.section { background: #1a1f2e; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a3548; }
.section-title { font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin-bottom: 15px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; }
.header { background: #151d2b; padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header h1 { color: #f1c40f; font-size: 1.5rem; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2a3548; }
th { background: #151d2b; color: #8899aa; font-size: 0.8rem; text-transform: uppercase; }
input, select { background: #0f1724; border: 1px solid #2a3548; color: #fff; padding: 6px 10px; border-radius: 5px; font-size: 0.85rem; width: 100%; }
input:focus, select:focus { outline: none; border-color: #f1c40f; }
.sync-indicator { position: fixed; top: 10px; right: 10px; padding: 8px 15px; background: #27ae60; color: #fff; border-radius: 20px; font-size: 0.85rem; font-weight: bold; z-index: 9999; display: none; }
.sync-indicator.active { display: block; animation: syncPulse 1s ease-in-out; }
@keyframes syncPulse { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
@media (max-width: 768px) {
  .header { flex-direction: column; text-align: center; }
  .btn { margin: 2px; padding: 8px 12px; font-size: 0.85rem; }
  table { font-size: 0.8rem; }
  th, td { padding: 5px; }
}
</style>
</head>
<body>

<div class="sync-indicator" id="syncIndicator">🔄 Syncing...</div>

<div class="container">
  <div class="header">
    <div>
      <h1>🏆 TopCompSports Tournament System</h1>
      <div style="color: #8899aa; font-size: 0.85rem;" id="subtitle">Step 1: Players Registration</div>
      <div id="dbStatus" style="color: #2ecc71; font-size: 0.75rem; margin-top: 5px;">● Connected to Database</div>
    </div>
    <div>
      <button class="btn btn-info" onclick="showView('players')">👥 Players</button>
      <button class="btn btn-secondary" onclick="syncWithDatabase()">🔄 Sync</button>
      <button class="btn btn-secondary" onclick="saveData()">💾 Save</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
    </div>
  </div>

  <div id="view-players" class="view active">
    <div class="section">
      <div class="section-title">👥 Players Registration <span id="playerCount" style="color: #8899aa; font-size: 0.9rem;">0 / 50</span></div>
      <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="addPlayer()">➕ Add Player</button>
        <button class="btn btn-secondary" onclick="addPlayers(10)">➕ Add 10</button>
        <button class="btn btn-info" onclick="document.getElementById('csvImport').click()">📥 Import CSV</button>
        <input type="file" id="csvImport" accept=".csv" style="display:none" onchange="importCSV(event)">
        <button class="btn btn-warning" onclick="syncWithDatabase()">🔄 Sync with DB</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Team</th><th>Age Group</th><th>Gender</th><th>Weight</th><th>Belt</th><th>Rank</th><th>Action</th></tr></thead>
          <tbody id="playersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// ==========================================
// 1. SUPABASE INITIALIZATION
// ==========================================
const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ==========================================
// 2. DATA & STATE
// ==========================================
let players = [];
let tournamentId = null;

// ==========================================
// 3. SUPABASE FUNCTIONS
// ==========================================
async function syncWithDatabase() {
  showSyncIndicator();
  try {
    const { data: dbPlayers, error } = await supabase
      .from('tournament_participants')
      .select('*')
      .eq('tournament_id', tournamentId || 'default');
    
    if (error) throw error;
    
    if (dbPlayers && dbPlayers.length > 0) {
      players = dbPlayers.map(p => ({
        id: p.id,
        name: p.player_name || '',
        team: p.team || '',
        ageGroup: p.age_group || 'Amateur/Professional',
        gender: p.gender || 'Men',
        weight: p.weight ? p.weight + 'kg' : '',
        belt: p.belt_level || 'White',
        rank: p.ranking || 999
      }));
      
      saveData();
      renderPlayers();
      alert('✅ Synced ' + players.length + ' players from database!');
    }
  } catch (err) {
    console.error('Sync error:', err);
    alert('⚠️ Sync failed: ' + err.message);
  }
}

async function saveToDatabase() {
  try {
    if (!tournamentId) {
      const { data: tournament, error: tError } = await supabase
        .from('tournaments')
        .insert({ name: 'Tournament ' + new Date().toLocaleDateString() })
        .select()
        .single();
      
      if (tError) throw tError;
      tournamentId = tournament.id;
    }
    
    const playersToInsert = players.map(p => ({
      tournament_id: tournamentId,
      player_name: p.name,
      team: p.team,
      age_group: p.ageGroup,
      gender: p.gender,
      weight: parseFloat(p.weight) || null,
      belt_level: p.belt,
      ranking: p.rank
    }));
    
    const { error } = await supabase
      .from('tournament_participants')
      .upsert(playersToInsert, { onConflict: 'id' });
    
    if (error) throw error;
    console.log('✅ Saved to database');
  } catch (err) {
    console.error('Save error:', err);
  }
}

// ==========================================
// 4. NAVIGATION
// ==========================================
function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const viewEl = document.getElementById('view-' + view);
  if (viewEl) viewEl.classList.add('active');
}

// ==========================================
// 5. PLAYERS MANAGEMENT
// ==========================================
function addPlayer() {
  if (players.length >= 50) { 
    alert('Maximum 50 players reached!'); 
    return; 
  }
  players.push({ 
    id: Date.now(), 
    name: '', 
    team: '', 
    ageGroup: 'Amateur/Professional', 
    gender: 'Men', 
    weight: '', 
    belt: 'White', 
    rank: players.length + 1 
  });
  renderPlayers();
  saveData();
}

function addPlayers(count) {
  for (let i = 0; i < count && players.length < 50; i++) {
    addPlayer();
  }
}

function renderPlayers() {
  const tbody = document.getElementById('playersTable');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  
  players.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + (i + 1) + '</td>' +
      '<td><input type="text" value="' + p.name + '" onchange="updatePlayer(' + i + ', \'name\', this.value)" placeholder="Name"></td>' +
      '<td><input type="text" value="' + p.team + '" onchange="updatePlayer(' + i + ', \'team\', this.value)" placeholder="Team"></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'ageGroup\', this.value)">' +
        '<option ' + (p.ageGroup === 'Kids 1' ? 'selected' : '') + '>Kids 1</option>' +
        '<option ' + (p.ageGroup === 'Kids 2' ? 'selected' : '') + '>Kids 2</option>' +
        '<option ' + (p.ageGroup === 'Kids 3' ? 'selected' : '') + '>Kids 3</option>' +
        '<option ' + (p.ageGroup === 'Infant' ? 'selected' : '') + '>Infant</option>' +
        '<option ' + (p.ageGroup === 'Junior' ? 'selected' : '') + '>Junior</option>' +
        '<option ' + (p.ageGroup === 'Teen' ? 'selected' : '') + '>Teen</option>' +
        '<option ' + (p.ageGroup === 'Youth' ? 'selected' : '') + '>Youth</option>' +
        '<option ' + (p.ageGroup === 'Amateur/Professional' ? 'selected' : '') + '>Amateur/Professional</option>' +
        '<option ' + (p.ageGroup === 'Master 1' ? 'selected' : '') + '>Master 1</option>' +
        '<option ' + (p.ageGroup === 'Master 2' ? 'selected' : '') + '>Master 2</option>' +
        '<option ' + (p.ageGroup === 'Master 3' ? 'selected' : '') + '>Master 3</option>' +
        '<option ' + (p.ageGroup === 'Master 4' ? 'selected' : '') + '>Master 4</option>' +
      '</select></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'gender\', this.value)">' +
        '<option ' + (p.gender === 'Boys' ? 'selected' : '') + '>Boys</option>' +
        '<option ' + (p.gender === 'Girls' ? 'selected' : '') + '>Girls</option>' +
        '<option ' + (p.gender === 'Men' ? 'selected' : '') + '>Men</option>' +
        '<option ' + (p.gender === 'Women' ? 'selected' : '') + '>Women</option>' +
      '</select></td>' +
      '<td><input type="text" value="' + p.weight + '" onchange="updatePlayer(' + i + ', \'weight\', this.value)" placeholder="Weight"></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'belt\', this.value)">' +
        '<option ' + (p.belt === 'White' ? 'selected' : '') + '>White</option>' +
        '<option ' + (p.belt === 'Blue' ? 'selected' : '') + '>Blue</option>' +
        '<option ' + (p.belt === 'Purple' ? 'selected' : '') + '>Purple</option>' +
        '<option ' + (p.belt === 'Brown' ? 'selected' : '') + '>Brown</option>' +
        '<option ' + (p.belt === 'Black' ? 'selected' : '') + '>Black</option>' +
      '</select></td>' +
      '<td><input type="number" value="' + p.rank + '" onchange="updatePlayer(' + i + ', \'rank\', this.value)" style="width: 60px;"></td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="deletePlayer(' + i + ')">✕</button></td>';
    tbody.appendChild(tr);
  });
  
  const countEl = document.getElementById('playerCount');
  if (countEl) countEl.innerText = players.length + ' / 50';
}

function updatePlayer(index, field, value) {
  players[index][field] = value;
  saveData();
}

function deletePlayer(index) {
  if (confirm('Delete this player?')) {
    players.splice(index, 1);
    renderPlayers();
    saveData();
  }
}

function importCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').filter(l => l.trim());
    for (let i = 1; i < lines.length && players.length < 50; i++) {
      const vals = lines[i].split(',').map(v => v.trim().replace(/"/g, ''));
      if (vals.length >= 3) {
        players.push({ 
          id: Date.now() + i, 
          name: vals[0] || '', 
          team: vals[1] || '', 
          ageGroup: vals[2] || 'Amateur/Professional', 
          gender: 'Men', 
          weight: vals[4] || '', 
          belt: vals[5] || 'White', 
          rank: parseInt(vals[6]) || players.length + 1 
        });
      }
    }
    renderPlayers();
    saveData();
    saveToDatabase();
    alert('✅ Imported ' + (lines.length - 1) + ' players!');
  };
  reader.readAsText(file);
}

function exportCSV() {
  let csv = 'Name,Team,Age Group,Gender,Weight,Belt,Rank\n';
  players.forEach(p => { 
    csv += '"' + p.name + '","' + p.team + '","' + p.ageGroup + '","' + p.gender + '","' + p.weight + '","' + p.belt + '",' + p.rank + '\n'; 
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'players.csv';
  a.click();
}

// ==========================================
// 6. DATA PERSISTENCE
// ==========================================
function saveData() {
  const data = { players, savedAt: new Date().toISOString() };
  localStorage.setItem('tournamentData', JSON.stringify(data));
  saveToDatabase();
}

function clearAll() {
  if (confirm('⚠️ Clear all data?')) {
    players = [];
    localStorage.removeItem('tournamentData');
    renderPlayers();
    alert('🗑️ All data cleared!');
  }
}

function showSyncIndicator() {
  const indicator = document.getElementById('syncIndicator');
  if (indicator) {
    indicator.classList.add('active');
    setTimeout(() => indicator.classList.remove('active'), 2000);
  }
}

// ==========================================
// 7. INITIALIZATION
// ==========================================
window.onload = function() {
  console.log('Page loaded. Initializing...');
  
  const urlParams = new URLSearchParams(window.location.search);
  tournamentId = urlParams.get('tournament_id');
  
  // Load from localStorage
  const saved = localStorage.getItem('tournamentData');
  if (saved) {
    try {
      const data = JSON.parse(saved);
      players = data.players || [];
      console.log('Data loaded from localStorage. Players:', players.length);
    } catch(e) { 
      console.error('Load error:', e); 
    }
  }
  
  renderPlayers();
  console.log('Initial render complete');
};
</script>

</body>
</html>
