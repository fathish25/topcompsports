<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 TopCompSports Tournament System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #fff; padding: 10px; }
.container { max-width: 1600px; margin: 0 auto; }
.btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 3px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: #27ae60; color: #fff; }
.btn-secondary { background: #34495e; color: #fff; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-warning { background: #f39c12; color: #000; }
.btn-info { background: #2980b9; color: #fff; }
.btn-purple { background: #8e44ad; color: #fff; }
.btn-sm { padding: 6px 12px; font-size: 0.85rem; }
.section { background: #1a1f2e; border-radius: 12px; padding: 20px; margin-bottom: 15px; border: 1px solid #2a3548; }
.section-title { font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin-bottom: 15px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; }
.header { background: #151d2b; padding: 15px 25px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.header h1 { color: #f1c40f; font-size: 1.5rem; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #2a3548; }
th { background: #151d2b; color: #8899aa; font-size: 0.8rem; text-transform: uppercase; }
input, select { background: #0f1724; border: 1px solid #2a3548; color: #fff; padding: 6px 10px; border-radius: 5px; font-size: 0.85rem; width: 100%; }
input:focus, select:focus { outline: none; border-color: #f1c40f; }
.tabs { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px; flex-wrap: wrap; }
.tab { padding: 10px 18px; border: none; background: transparent; color: #8899aa; cursor: pointer; font-weight: bold; border-radius: 8px; }
.tab.active { background: #f1c40f; color: #000; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.sync-indicator { position: fixed; top: 10px; right: 10px; padding: 8px 15px; background: #27ae60; color: #fff; border-radius: 20px; font-size: 0.85rem; font-weight: bold; z-index: 9999; display: none; }
.sync-indicator.active { display: block; }
@media (max-width: 768px) {
  .header { flex-direction: column; text-align: center; }
  .btn { margin: 2px; padding: 8px 12px; font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="sync-indicator" id="syncIndicator">🔄 Syncing...</div>

<div class="container">
  <div class="header">
    <div>
      <h1>🏆 TopCompSports</h1>
      <div style="color: #8899aa; font-size: 0.85rem;" id="subtitle">Players Registration</div>
    </div>
    <div>
      <button class="btn btn-info" onclick="showView('players')">👥 Players</button>
      <button class="btn btn-secondary" onclick="syncWithDatabase()">🔄 Sync</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear</button>
    </div>
  </div>

  <div id="view-players" class="view active">
    <div class="section">
      <div class="section-title">👥 Players Registration <span id="playerCount" style="color: #8899aa;">0 / 200</span></div>
      <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-primary" onclick="addPlayer()">➕ Add Player</button>
        <button class="btn btn-secondary" onclick="addPlayers(10)">➕ Add 10</button>
        <button class="btn btn-info" onclick="addPlayers(50)">➕ Add 50</button>
        <button class="btn btn-warning" onclick="syncWithDatabase()">🔄 Sync DB</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Team</th><th>Age</th><th>Gender</th><th>Weight</th><th>Belt</th><th>Rank</th><th>Action</th></tr></thead>
          <tbody id="playersTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// Global Variables
var players = [];
var tournamentId = null;
var SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Make functions globally accessible
window.addPlayer = function() {
  if (players.length >= 200) { alert('Maximum 200 players!'); return; }
  players.push({ 
    id: Date.now(), 
    name: '', 
    team: '', 
    ageGroup: 'Amateur/Professional', 
    gender: 'Men', 
    weight: '', 
    belt: 'White', 
    rank: players.length + 1 
  });
  renderPlayers();
  saveData();
  console.log('Player added. Total:', players.length);
};

window.addPlayers = function(count) {
  for (var i = 0; i < count && players.length < 200; i++) {
    window.addPlayer();
  }
};

window.showView = function(view) {
  var views = document.querySelectorAll('.view');
  for (var i = 0; i < views.length; i++) {
    views[i].classList.remove('active');
  }
  var viewEl = document.getElementById('view-' + view);
  if (viewEl) {
    viewEl.classList.add('active');
  }
  console.log('Switched to view:', view);
};

window.syncWithDatabase = function() {
  var indicator = document.getElementById('syncIndicator');
  if (indicator) {
    indicator.classList.add('active');
    setTimeout(function() {
      indicator.classList.remove('active');
    }, 2000);
  }
  alert('Syncing with database... (Feature requires backend setup)');
  console.log('Syncing...');
};

window.saveData = function() {
  localStorage.setItem('tournamentData', JSON.stringify({
    players: players,
    savedAt: new Date().toISOString()
  }));
  console.log('Data saved to localStorage');
};

window.clearAll = function() {
  if (confirm('Clear all data?')) {
    players = [];
    localStorage.removeItem('tournamentData');
    renderPlayers();
    alert('All data cleared!');
  }
};

window.renderPlayers = function() {
  var tbody = document.getElementById('playersTable');
  if (!tbody) {
    console.error('playersTable not found!');
    return;
  }
  
  tbody.innerHTML = '';
  
  for (var i = 0; i < players.length; i++) {
    var p = players[i];
    var tr = document.createElement('tr');
    
    tr.innerHTML = '<td>' + (i + 1) + '</td>' +
      '<td><input type="text" value="' + p.name + '" onchange="updatePlayer(' + i + ', \'name\', this.value)" placeholder="Name"></td>' +
      '<td><input type="text" value="' + p.team + '" onchange="updatePlayer(' + i + ', \'team\', this.value)" placeholder="Team"></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'ageGroup\', this.value)">' +
        '<option ' + (p.ageGroup === 'Kids 1' ? 'selected' : '') + '>Kids 1</option>' +
        '<option ' + (p.ageGroup === 'Amateur/Professional' ? 'selected' : '') + '>Amateur/Professional</option>' +
      '</select></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'gender\', this.value)">' +
        '<option ' + (p.gender === 'Men' ? 'selected' : '') + '>Men</option>' +
        '<option ' + (p.gender === 'Women' ? 'selected' : '') + '>Women</option>' +
      '</select></td>' +
      '<td><input type="text" value="' + p.weight + '" onchange="updatePlayer(' + i + ', \'weight\', this.value)" placeholder="Weight"></td>' +
      '<td><select onchange="updatePlayer(' + i + ', \'belt\', this.value)">' +
        '<option ' + (p.belt === 'White' ? 'selected' : '') + '>White</option>' +
        '<option ' + (p.belt === 'Blue' ? 'selected' : '') + '>Blue</option>' +
      '</select></td>' +
      '<td><input type="number" value="' + p.rank + '" onchange="updatePlayer(' + i + ', \'rank\', this.value)" style="width: 60px;"></td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="deletePlayer(' + i + ')">✕</button></td>';
    
    tbody.appendChild(tr);
  }
  
  var countEl = document.getElementById('playerCount');
  if (countEl) {
    countEl.innerText = players.length + ' / 200';
  }
};

window.updatePlayer = function(index, field, value) {
  players[index][field] = value;
  saveData();
};

window.deletePlayer = function(index) {
  if (confirm('Delete this player?')) {
    players.splice(index, 1);
    renderPlayers();
    saveData();
  }
};

// Initialize on page load
window.onload = function() {
  console.log('Page loaded successfully!');
  
  // Load saved data
  var saved = localStorage.getItem('tournamentData');
  if (saved) {
    try {
      var data = JSON.parse(saved);
      players = data.players || [];
      console.log('Loaded', players.length, 'players from storage');
    } catch(e) {
      console.error('Error loading data:', e);
    }
  }
  
  renderPlayers();
  
  // Test that functions are accessible
  console.log('addPlayer function:', typeof window.addPlayer);
  console.log('addPlayers function:', typeof window.addPlayers);
  console.log('showView function:', typeof window.showView);
};
</script>

</body>
</html>
