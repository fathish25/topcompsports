<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0e17; color: #fff; min-height: 100vh; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; padding: 20px; background: #151d2b; border-radius: 16px; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #f1c40f, #d4a017); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #0a0e17; }
        .title { font-size: 36px; font-weight: bold; color: #f1c40f; }
        .live-badge { display: inline-block; background: #ef4444; color: #fff; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; animation: pulse 2s infinite; margin-top: 10px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .matches-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .match-card { background: #151d2b; border-radius: 16px; padding: 25px; border: 2px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .match-card:hover { border-color: #f1c40f; transform: translateY(-5px); }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .match-title { font-size: 18px; font-weight: bold; color: #f1c40f; }
        .match-status { padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .status-live { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-pending { background: rgba(107, 114, 128, 0.2); color: #6b7280; }
        .status-completed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 10px; border-radius: 8px; }
        .red-player { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; }
        .blue-player { background: rgba(37, 99, 235, 0.15); border: 1px solid #2563EB; }
        .player-name { font-size: 18px; font-weight: bold; }
        .player-score { font-size: 32px; font-weight: bold; }
        .empty-state { text-align: center; padding: 60px; color: rgba(255,255,255,0.5); grid-column: 1 / -1; }
        .refresh-info { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.5); font-size: 13px; }
        .btn-back { display: inline-block; background: #f1c40f; color: #0a0e17; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 30px; }
        .footer { text-align: center; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">T</div>
            <div style="font-size: 28px; font-weight: bold;">TopCompSports</div>
        </div>
        <h1 class="title">Live Scoreboard</h1>
        <span class="live-badge">● LIVE</span>
    </div>
    
    <div class="matches-grid" id="matchesGrid">
        <div class="empty-state">Loading live matches...</div>
    </div>

    <div class="refresh-info">
        Auto-refreshes every 5 seconds • Last update: <span id="lastUpdate">-</span>
    </div>

    <div class="footer">
        <a href="events.html" class="btn-back">← Back to Events</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadLiveMatches() {
            const { data: matches, error } = await supabase
                .from('matches')
                .select('*')
                .order('created_at', { ascending: false });
            
            const grid = document.getElementById('matchesGrid');
            
            if (error) {
                console.error('Error:', error);
                grid.innerHTML = '<div class="empty-state">Error loading matches</div>';
                return;
            }
            
            if (!matches || matches.length === 0) {
                grid.innerHTML = '<div class="empty-state">No matches at the moment</div>';
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                return;
            }
            
            grid.innerHTML = matches.map(m => {
                const statusClass = m.status === 'live' ? 'status-live' : 
                                   m.status === 'completed' ? 'status-completed' : 'status-pending';
                const statusText = m.status || 'pending';
                
                return `
                    <div class="match-card">
                        <div class="match-header">
                            <div class="match-title">${m.division || m.pool_letter || 'Match'}</div>
                            <span class="match-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="player-row red-player">
                            <div class="player-name"> ${m.red_player_name || 'TBD'}</div>
                            <div class="player-score">${m.red_score || 0}</div>
                        </div>
                        <div class="player-row blue-player">
                            <div class="player-name">🔵 ${m.blue_player_name || 'TBD'}</div>
                            <div class="player-score">${m.blue_score || 0}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
        }

        // تحميل فوري + تحديث كل 5 ثواني
        loadLiveMatches();
        setInterval(loadLiveMatches, 5000);
    </script>
</body>
</html>
