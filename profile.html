<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--gradient-blue);
            color: var(--white); 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--dark-gray);
            border-radius: 20px;
            padding: 50px;
            border: 2px solid var(--medium-gray);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent-yellow); }
        .header p { color: rgba(255,255,255,0.7); }

        .user-info {
            background: var(--black);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .user-info h3 { color: var(--accent-yellow); margin-bottom: 5px; }
        .user-info p { color: rgba(255,255,255,0.6); font-size: 0.9rem; }

        .upload-section {
            background: var(--black);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent-yellow);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .profile-pic-section {
            text-align: center;
            padding: 30px;
            background: var(--dark-gray);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .profile-pic-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent-yellow);
            background: var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-container .placeholder {
            font-size: 60px;
            color: rgba(255,255,255,0.3);
        }

        .upload-btn {
            background: var(--primary-blue);
            color: var(--white);
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }

        .document-upload {
            background: var(--dark-gray);
            border: 2px dashed var(--medium-gray);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
        }

        .document-upload:hover { border-color: var(--primary-blue); }
        .document-upload.has-file { border-color: #10b981; background: rgba(16,185,129,0.05); }

        .document-upload input[type="file"] { display: none; }
        .upload-label { cursor: pointer; display: block; }
        .upload-icon { font-size: 50px; margin-bottom: 15px; }
        .file-name { color: var(--accent-yellow); font-weight: 600; margin-top: 10px; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05rem;
            margin-top: 20px;
        }

        .btn-primary { background: var(--gradient-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-skip { background: transparent; border: 2px solid var(--white); color: var(--white); }
        .btn-skip:hover { background: var(--white); color: var(--black); }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }

        .optional-badge {
            display: inline-block;
            padding: 3px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Complete Your Profile</h1>
            <p>Add your photo and documents to get started</p>
        </div>

        <div class="user-info">
            <h3 id="userName">Welcome!</h3>
            <p id="userEmail"></p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Profile Picture -->
        <div class="upload-section">
            <div class="section-title">📷 Profile Picture <span class="optional-badge">Optional</span></div>
            <div class="profile-pic-section">
                <div class="profile-pic-container" id="profilePicContainer">
                    <div class="placeholder">👤</div>
                </div>
                <button type="button" class="upload-btn" onclick="document.getElementById('profilePic').click()">
                     Upload Photo
                </button>
                <input type="file" id="profilePic" accept="image/*" onchange="handleProfilePicUpload(event)" style="display: none;">
                <p style="margin-top: 10px; font-size: 0.85rem; color: rgba(255,255,255,0.5);">Max 5MB (JPG, PNG)</p>
            </div>
        </div>

        <!-- Documents -->
        <div class="upload-section">
            <div class="section-title">📄 Identity Document <span class="optional-badge">Optional</span></div>
            <div class="document-upload" id="idCardUpload">
                <label for="idCard" class="upload-label">
                    <div class="upload-icon"></div>
                    <div style="font-weight: 600; margin-bottom: 5px;">Upload ID Card / Passport / Birth Certificate</div>
                    <div style="font-size: 0.9rem; color: rgba(255,255,255,0.6);">For verification purposes</div>
                    <div class="file-name" id="idCardFileName">No file chosen</div>
                </label>
                <input type="file" id="idCard" accept="image/*,.pdf" onchange="handleDocumentUpload(event)">
            </div>
            <p style="margin-top: 15px; font-size: 0.85rem; color: rgba(255,255,255,0.5);">Max 10MB (JPG, PNG, PDF)</p>
        </div>

        <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveAndContinue()">
            ✅ Save & Continue to Dashboard
        </button>
        <button type="button" class="btn btn-skip" onclick="skipAndContinue()">
            ⏭️ Skip - Go to Dashboard
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let profilePictureFile = null;
        let documentFile = null;

        // ===== Check Auth on Load =====
        window.onload = async function() {
            const { data: { user }, error } = await dbClient.auth.getUser();
            
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;
            
            // Display user info
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userName').textContent = user.user_metadata?.full_name || 'Welcome!';

            // Load existing profile data
            await loadExistingProfile();
        };

        // ===== Load Existing Profile =====
        async function loadExistingProfile() {
            try {
                const { data: profile } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (profile) {
                    // Load profile picture if exists
                    if (profile.profile_picture_url) {
                        loadProfilePicture(profile.profile_picture_url);
                    }

                    // Show if document exists
                    if (profile.id_document_url) {
                        document.getElementById('idCardFileName').textContent = 'Document already uploaded ✓';
                        document.getElementById('idCardUpload').classList.add('has-file');
                    }
                }
            } catch (error) {
                console.error('Load error:', error);
            }
        }

        // ===== Handle Profile Picture Upload =====
        async function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 5MB');
                return;
            }

            profilePictureFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                loadProfilePicture(e.target.result);
            };
            reader.readAsDataURL(file);

            showAlert('success', '✅ Photo selected successfully');
        }

        // ===== Load Profile Picture =====
        function loadProfilePicture(url) {
            const container = document.getElementById('profilePicContainer');
            container.innerHTML = `<img src="${url}" alt="Profile Picture">`;
        }

        // ===== Handle Document Upload =====
        function handleDocumentUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 10MB');
                return;
            }

            documentFile = file;
            const fileNameElement = document.getElementById('idCardFileName');
            fileNameElement.textContent = file.name + ' ✓';
            event.target.closest('.document-upload').classList.add('has-file');
        }

        // ===== Save and Continue =====
        async function saveAndContinue() {
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const profileData = {
                    id: currentUser.id,
                    email: currentUser.email,
                    updated_at: new Date().toISOString()
                };

                // Upload profile picture if selected
                if (profilePictureFile) {
                    try {
                        const fileExt = profilePictureFile.name.split('.').pop();
                        const fileName = `${currentUser.id}-profile.${fileExt}`;
                        
                        const { error: uploadError } = await dbClient.storage
                            .from('profiles')
                            .upload(fileName, profilePictureFile, { upsert: true });

                        if (!uploadError) {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('profiles')
                                .getPublicUrl(fileName);
                            profileData.profile_picture_url = publicUrl;
                        }
                    } catch (picError) {
                        console.error('Profile pic error:', picError);
                    }
                }

                // Upload document if selected
                if (documentFile) {
                    try {
                        const fileExt = documentFile.name.split('.').pop();
                        const fileName = `${currentUser.id}-id-doc.${fileExt}`;
                        
                        const { error: docError } = await dbClient.storage
                            .from('documents')
                            .upload(fileName, documentFile, { upsert: true });

                        if (!docError) {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('documents')
                                .getPublicUrl(fileName);
                            profileData.id_document_url = publicUrl;
                        }
                    } catch (docError) {
                        console.error('Document error:', docError);
                    }
                }

                // Update profile
                const { error: upsertError } = await dbClient
                    .from('users')
                    .upsert(profileData, { onConflict: 'id' });

                if (upsertError) throw upsertError;

                showAlert('success', '✅ Profile saved! Redirecting...');
                
                // Update localStorage
                const currentUserData = JSON.parse(localStorage.getItem('currentUser') || '{}');
                currentUserData.profile_complete = true;
                localStorage.setItem('currentUser', JSON.stringify(currentUserData));

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('Save error:', error);
                showAlert('error', '❌ Error: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.textContent = '✅ Save & Continue to Dashboard';
            }
        }

        // ===== Skip and Continue =====
        function skipAndContinue() {
            // Update localStorage
            const currentUserData = JSON.parse(localStorage.getItem('currentUser') || '{}');
            currentUserData.profile_complete = true;
            localStorage.setItem('currentUser', JSON.stringify(currentUserData));
            
            window.location.href = 'index.html';
        }

        // ===== Show Alert =====
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
