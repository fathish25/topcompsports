<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --success: #10b981;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--gradient-blue);
            color: var(--white); 
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--dark-gray);
            border-radius: 20px;
            padding: 40px;
            border: 2px solid var(--medium-gray);
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; margin-bottom: 10px; color: var(--accent-yellow); }
        .header p { color: rgba(255,255,255,0.7); }

        .user-info {
            background: var(--black);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            text-align: center;
        }

        .user-info h3 { color: var(--accent-yellow); margin-bottom: 5px; }
        .user-info p { color: rgba(255,255,255,0.6); font-size: 0.9rem; word-break: break-all; }

        .upload-section {
            background: var(--black);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--accent-yellow);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .optional-badge {
            background: rgba(255,255,255,0.1);
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
        }

        .profile-pic-section {
            text-align: center;
            padding: 25px;
            background: var(--dark-gray);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .profile-pic-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--accent-yellow);
            background: var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-container .placeholder {
            font-size: 50px;
            color: rgba(255,255,255,0.3);
        }

        .upload-btn {
            background: var(--primary-blue);
            color: var(--white);
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }

        .document-upload {
            background: var(--dark-gray);
            border: 2px dashed var(--medium-gray);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }

        .document-upload:hover { border-color: var(--primary-blue); }
        .document-upload.has-file { border-color: var(--success); background: rgba(16,185,129,0.05); }

        .document-upload input[type="file"] { display: none; }
        .upload-label { cursor: pointer; display: block; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .file-name { color: var(--accent-yellow); font-weight: 600; margin-top: 10px; font-size: 0.9rem; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            margin-top: 15px;
        }

        .btn-primary { 
            background: var(--success); 
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-skip { 
            background: transparent; 
            border: 2px solid var(--white); 
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-skip:hover { background: var(--white); color: var(--black); }

        .alert { 
            padding: 12px 15px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            display: none; 
            font-weight: 600;
            font-size: 0.9rem;
        }
        .alert.show { display: block; animation: slideIn 0.3s ease; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-warning { background: rgba(245,158,11,0.2); border: 1px solid #f59e0b; color: #f59e0b; }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.show { display: flex; }
        .loading-spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--accent-yellow);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container { padding: 25px 15px; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>Complete Your Profile</h1>
            <p>Add your photo and documents to get started</p>
        </div>

        <div class="user-info">
            <h3 id="userName">Welcome!</h3>
            <p id="userEmail"></p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Profile Picture -->
        <div class="upload-section">
            <div class="section-title">📷 Profile Picture <span class="optional-badge">Optional</span></div>
            <div class="profile-pic-section">
                <div class="profile-pic-container" id="profilePicContainer">
                    <div class="placeholder"></div>
                </div>
                <button type="button" class="upload-btn" onclick="document.getElementById('profilePic').click()">
                    📷 Upload Photo
                </button>
                <input type="file" id="profilePic" accept="image/*" onchange="handleProfilePicUpload(event)" style="display: none;">
                <p style="margin-top: 10px; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Max 5MB (JPG, PNG)</p>
            </div>
        </div>

        <!-- Documents -->
        <div class="upload-section">
            <div class="section-title">📄 Identity Document <span class="optional-badge">Optional</span></div>
            <div class="document-upload" id="idCardUpload">
                <label for="idCard" class="upload-label">
                    <div class="upload-icon"></div>
                    <div style="font-weight: 600; margin-bottom: 5px;">Upload ID Card / Passport / Birth Certificate</div>
                    <div style="font-size: 0.85rem; color: rgba(255,255,255,0.6);">For verification purposes</div>
                    <div class="file-name" id="idCardFileName">No file chosen</div>
                </label>
                <input type="file" id="idCard" accept="image/*,.pdf" onchange="handleDocumentUpload(event)">
            </div>
            <p style="margin-top: 10px; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Max 10MB (JPG, PNG, PDF)</p>
        </div>

        <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveAndContinue()">
            ✅ Save & Continue to Dashboard
        </button>
        <button type="button" class="btn btn-skip" onclick="skipAndContinue()">
            ⏭️ Skip - Go to Dashboard
        </button>
    </div>

    <script>
        // ===== Supabase Setup =====
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let profilePictureFile = null;
        let documentFile = null;

        // ===== Check Auth on Load =====
        window.onload = async function() {
            console.log('Page loaded, checking auth...');
            
            try {
                const { data: { user }, error } = await dbClient.auth.getUser();
                
                if (error || !user) {
                    console.error('Auth error:', error);
                    showAlert('error', '❌ You must be logged in. Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                    return;
                }

                currentUser = user;
                console.log('✅ User authenticated:', user.email);
                
                // Display user info
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userName').textContent = user.user_metadata?.full_name || 'Welcome!';

                // Load existing profile data
                await loadExistingProfile();
            } catch (err) {
                console.error('Initialization error:', err);
                showAlert('error', '❌ Error loading page: ' + err.message);
            }
        };

        // ===== Load Existing Profile =====
        async function loadExistingProfile() {
            try {
                console.log('Loading profile for:', currentUser.id);
                const { data: profile, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) {
                    console.error('Load profile error:', error);
                    return;
                }

                if (profile) {
                    console.log('Profile loaded:', profile);
                    
                    // Load profile picture if exists
                    if (profile.profile_picture_url) {
                        loadProfilePicture(profile.profile_picture_url);
                    }

                    // Show if document exists
                    if (profile.id_document_url) {
                        document.getElementById('idCardFileName').textContent = 'Document already uploaded ✓';
                        document.getElementById('idCardUpload').classList.add('has-file');
                    }
                }
            } catch (err) {
                console.error('Load error:', err);
            }
        }

        // ===== Handle Profile Picture Upload =====
        async function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 5MB');
                return;
            }

            profilePictureFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                loadProfilePicture(e.target.result);
            };
            reader.readAsDataURL(file);

            showAlert('success', '✅ Photo selected successfully');
        }

        // ===== Load Profile Picture =====
        function loadProfilePicture(url) {
            const container = document.getElementById('profilePicContainer');
            container.innerHTML = `<img src="${url}" alt="Profile Picture">`;
        }

        // ===== Handle Document Upload =====
        function handleDocumentUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 10MB');
                return;
            }

            documentFile = file;
            const fileNameElement = document.getElementById('idCardFileName');
            fileNameElement.textContent = file.name + ' ✓';
            event.target.closest('.document-upload').classList.add('has-file');
        }

        // ===== Save and Continue =====
        async function saveAndContinue() {
            const saveBtn = document.getElementById('saveBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            loadingOverlay.classList.add('show');

            try {
                console.log('Starting save process...');
                
                const profileData = {
                    id: currentUser.id,
                    email: currentUser.email,
                    updated_at: new Date().toISOString()
                };

                // Upload profile picture if selected (optional - won't fail if error)
                if (profilePictureFile) {
                    try {
                        console.log('Uploading profile picture...');
                        const fileExt = profilePictureFile.name.split('.').pop();
                        const fileName = `${currentUser.id}-profile.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await dbClient.storage
                            .from('profiles')
                            .upload(fileName, profilePictureFile, { upsert: true });

                        if (uploadError) {
                            console.warn('️ Upload failed, continuing without picture:', uploadError.message);
                            showAlert('warning', '️ Could not upload photo, but you can continue.');
                        } else {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('profiles')
                                .getPublicUrl(fileName);
                            profileData.profile_picture_url = publicUrl;
                            console.log('✅ Profile picture uploaded');
                        }
                    } catch (picError) {
                        console.warn('️ Profile picture upload failed, continuing:', picError.message);
                    }
                }

                // Upload document if selected (optional - won't fail if error)
                if (documentFile) {
                    try {
                        console.log('Uploading document...');
                        const fileExt = documentFile.name.split('.').pop();
                        const fileName = `${currentUser.id}-id-doc.${fileExt}`;
                        
                        const { error: docError } = await dbClient.storage
                            .from('documents')
                            .upload(fileName, documentFile, { upsert: true });

                        if (docError) {
                            console.warn('⚠️ Document upload failed, continuing:', docError.message);
                            showAlert('warning', '⚠️ Could not upload document, but you can continue.');
                        } else {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('documents')
                                .getPublicUrl(fileName);
                            profileData.id_document_url = publicUrl;
                            console.log('✅ Document uploaded');
                        }
                    } catch (docError) {
                        console.warn('⚠️ Document upload failed, continuing:', docError.message);
                    }
                }

                // Update profile in database
                console.log('Updating profile in database...');
                const { data: upsertData, error: upsertError } = await dbClient
                    .from('users')
                    .upsert(profileData, { onConflict: 'id' });

                if (upsertError) {
                    console.error(' Database update failed:', upsertError);
                    showAlert('warning', '⚠️ Could not save to database, but you can continue.');
                } else {
                    console.log('✅ Profile saved successfully');
                }

                // Update localStorage with user data
                const userData = {
                    id: currentUser.id,
                    email: currentUser.email,
                    full_name: currentUser.user_metadata?.full_name || 'User',
                    user_type: currentUser.user_metadata?.user_type || 'athlete',
                    profile_complete: true,
                    profile_picture_url: profileData.profile_picture_url || null
                };

                localStorage.setItem('currentUser', JSON.stringify(userData));
                console.log('✅ User data saved to localStorage');

                showAlert('success', '✅ Ready! Redirecting to dashboard...');
                
                // ALWAYS redirect, even if there were errors
                setTimeout(() => {
                    console.log(' Redirecting to index.html...');
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Unexpected error:', error);
                // Still redirect even on error
                showAlert('warning', '⚠️ Some operations failed, but you can continue.');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } finally {
                loadingOverlay.classList.remove('show');
            }
        }

        // ===== Skip and Continue =====
        function skipAndContinue() {
            console.log('⏭️ Skipping profile completion...');
            
            // Update localStorage
            const userData = {
                id: currentUser.id,
                email: currentUser.email,
                full_name: currentUser.user_metadata?.full_name || 'User',
                user_type: currentUser.user_metadata?.user_type || 'athlete',
                profile_complete: true
            };

            localStorage.setItem('currentUser', JSON.stringify(userData));
            console.log('✅ User data saved to localStorage');
            
            // Show loading
            document.getElementById('loadingOverlay').classList.add('show');
            
            // Redirect immediately
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }

        // ===== Show Alert =====
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
