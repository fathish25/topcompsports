<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --white: #FFFFFF;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: var(--gradient-blue);
            color: var(--white); 
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--dark-gray);
            border-radius: 20px;
            padding: 50px;
            border: 2px solid var(--medium-gray);
        }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--accent-yellow); }
        .header p { color: rgba(255,255,255,0.7); }

        .profile-pic-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: var(--black);
            border-radius: 15px;
        }

        .profile-pic-container {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid var(--accent-yellow);
            background: var(--medium-gray);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pic-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-pic-container .placeholder {
            font-size: 60px;
            color: rgba(255,255,255,0.3);
        }

        .upload-btn {
            background: var(--primary-blue);
            color: var(--white);
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .upload-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,102,204,0.4); }
        .upload-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .form-section {
            background: var(--black);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--accent-yellow);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--medium-gray);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .form-input, .form-select {
            width: 100%;
            background: var(--dark-gray);
            border: 2px solid var(--medium-gray);
            color: var(--white);
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary-blue); }
        .form-input:read-only { background: var(--medium-gray); cursor: not-allowed; }

        .document-upload {
            background: var(--dark-gray);
            border: 2px dashed var(--medium-gray);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .document-upload:hover { border-color: var(--primary-blue); }
        .document-upload.has-file { border-color: var(--accent-yellow); background: rgba(255,184,0,0.05); }

        .document-upload input[type="file"] { display: none; }

        .upload-label { cursor: pointer; display: block; }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .file-name { color: var(--accent-yellow); font-weight: 600; margin-top: 10px; font-size: 0.9rem; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .btn-primary { background: var(--gradient-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-secondary { background: transparent; border: 2px solid var(--white); color: var(--white); margin-top: 10px; }
        .btn-secondary:hover { background: var(--white); color: var(--black); }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-warning { background: rgba(245,158,11,0.2); border: 1px solid #f59e0b; color: #f59e0b; }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            .form-row { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Complete Your Profile</h1>
            <p>Please fill in your information and upload required documents</p>
        </div>

        <div id="alert" class="alert"></div>

        <!-- Profile Picture -->
        <div class="profile-pic-section">
            <div class="profile-pic-container" id="profilePicContainer">
                <div class="placeholder">👤</div>
            </div>
            <button type="button" class="upload-btn" id="uploadPicBtn" onclick="document.getElementById('profilePic').click()">
                 Upload Profile Picture
            </button>
            <input type="file" id="profilePic" accept="image/*" onchange="handleProfilePicUpload(event)" style="display: none;">
            <p style="margin-top: 10px; font-size: 0.85rem; color: rgba(255,255,255,0.5);">Optional - Max 5MB</p>
        </div>

        <form id="profileForm" onsubmit="handleProfileSubmit(event)">
            <!-- Personal Information -->
            <div class="form-section">
                <div class="section-title">👤 Personal Information</div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-input" id="fullName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-input" id="email" readonly>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Date of Birth *</label>
                        <input type="date" class="form-input" id="dateOfBirth" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender *</label>
                        <select class="form-select" id="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-input" id="country" placeholder="Your country">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-input" id="phone" placeholder="+1 (234) 567-8900">
                    </div>
                </div>
            </div>

            <!-- Documents -->
            <div class="form-section">
                <div class="section-title">📄 Required Documents (Optional)</div>
                <p style="color: rgba(255,255,255,0.6); margin-bottom: 20px;">Upload ID Card / Passport / Birth Certificate for verification</p>

                <div class="document-upload" id="idCardUpload">
                    <label for="idCard" class="upload-label">
                        <div class="upload-icon"></div>
                        <div>Click to upload document</div>
                        <div class="file-name" id="idCardFileName">No file chosen</div>
                    </label>
                    <input type="file" id="idCard" accept="image/*,.pdf" onchange="handleDocumentUpload(event, 'idCard')">
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">💾 Save Profile & Continue</button>
            <button type="button" class="btn btn-secondary" onclick="skipProfile()">️ Skip for now</button>
        </form>
    </div>

    <script>
        // ===== Supabase Setup =====
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let uploadedDocuments = {};
        let profilePictureFile = null;

        // ===== Check Auth on Load =====
        window.onload = async function() {
            const { data: { user }, error } = await dbClient.auth.getUser();
            
            if (error || !user) {
                console.error('Auth error:', error);
                showAlert('error', '❌ You must be logged in to access this page.');
                setTimeout(() => window.location.href = 'login.html', 2000);
                return;
            }

            currentUser = user;
            document.getElementById('email').value = user.email;

            // Load existing profile
            await loadUserProfile();
        };

        // ===== Load User Profile =====
        async function loadUserProfile() {
            try {
                console.log('Loading profile for user:', currentUser.id);
                
                const { data: profile, error } = await dbClient
                    .from('users')
                    .select('*')
                    .eq('id', currentUser.id)
                    .maybeSingle();

                if (error) {
                    console.error('Load profile error:', error);
                    showAlert('warning', '⚠️ Could not load existing profile. Please fill in your information.');
                    return;
                }

                if (profile) {
                    console.log('Profile loaded:', profile);
                    
                    // Fill in the form
                    document.getElementById('fullName').value = profile.full_name || '';
                    document.getElementById('dateOfBirth').value = profile.date_of_birth || '';
                    document.getElementById('gender').value = profile.gender || '';
                    document.getElementById('country').value = profile.country || '';
                    document.getElementById('phone').value = profile.phone || '';

                    // Load profile picture if exists
                    if (profile.profile_picture_url) {
                        loadProfilePicture(profile.profile_picture_url);
                    }

                    // Check if document exists
                    if (profile.id_document_url) {
                        document.getElementById('idCardFileName').textContent = 'Document already uploaded ✓';
                        document.getElementById('idCardUpload').classList.add('has-file');
                    }
                } else {
                    console.log('No existing profile found');
                }
            } catch (error) {
                console.error('Load profile error:', error);
                showAlert('warning', '⚠️ Could not load existing profile.');
            }
        }

        // ===== Handle Profile Picture Upload =====
        async function handleProfilePicUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 5MB');
                return;
            }

            profilePictureFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                loadProfilePicture(e.target.result);
            };
            reader.readAsDataURL(file);

            showAlert('success', '✅ Profile picture selected. It will be saved with your profile.');
        }

        // ===== Load Profile Picture =====
        function loadProfilePicture(url) {
            const container = document.getElementById('profilePicContainer');
            container.innerHTML = `<img src="${url}" alt="Profile Picture">`;
        }

        // ===== Handle Document Upload =====
        function handleDocumentUpload(event, docType) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                showAlert('error', '❌ File size must be less than 10MB');
                return;
            }

            uploadedDocuments[docType] = file;
            const fileNameElement = document.getElementById(docType + 'FileName');
            fileNameElement.textContent = file.name + ' ✓';
            event.target.closest('.document-upload').classList.add('has-file');
        }

        // ===== Handle Profile Submit =====
        async function handleProfileSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';

            try {
                const profileData = {
                    id: currentUser.id,
                    email: currentUser.email,
                    full_name: document.getElementById('fullName').value.trim(),
                    date_of_birth: document.getElementById('dateOfBirth').value || null,
                    gender: document.getElementById('gender').value || null,
                    country: document.getElementById('country').value.trim() || null,
                    phone: document.getElementById('phone').value.trim() || null,
                    email_confirmed: currentUser.email_confirmed_at ? true : false,
                    updated_at: new Date().toISOString()
                };

                // Upload profile picture if selected
                if (profilePictureFile) {
                    try {
                        const fileExt = profilePictureFile.name.split('.').pop();
                        const fileName = `${currentUser.id}-profile.${fileExt}`;
                        
                        const { error: uploadError } = await dbClient.storage
                            .from('profiles')
                            .upload(fileName, profilePictureFile, { upsert: true });

                        if (uploadError) {
                            console.error('Profile pic upload error:', uploadError);
                            // Continue anyway
                        } else {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('profiles')
                                .getPublicUrl(fileName);
                            
                            profileData.profile_picture_url = publicUrl;
                        }
                    } catch (picError) {
                        console.error('Profile picture error:', picError);
                        // Continue without picture
                    }
                }

                // Upload documents if any
                if (uploadedDocuments.idCard) {
                    try {
                        const fileExt = uploadedDocuments.idCard.name.split('.').pop();
                        const fileName = `${currentUser.id}-id-doc.${fileExt}`;
                        
                        const { error: docError } = await dbClient.storage
                            .from('documents')
                            .upload(fileName, uploadedDocuments.idCard, { upsert: true });

                        if (docError) {
                            console.error('Document upload error:', docError);
                            // Continue anyway
                        } else {
                            const { data: { publicUrl } } = dbClient.storage
                                .from('documents')
                                .getPublicUrl(fileName);
                            
                            profileData.id_document_url = publicUrl;
                        }
                    } catch (docError) {
                        console.error('Document error:', docError);
                        // Continue without document
                    }
                }

                // Upsert profile (insert or update)
                const { error: upsertError } = await dbClient
                    .from('users')
                    .upsert(profileData, { onConflict: 'id' });

                if (upsertError) throw upsertError;

                showAlert('success', '✅ Profile saved successfully! Redirecting...');
                
                // Update localStorage
                localStorage.setItem('currentUser', JSON.stringify({
                    id: currentUser.id,
                    email: currentUser.email,
                    full_name: profileData.full_name,
                    user_type: 'athlete',
                    profile_complete: true
                }));

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (error) {
                console.error('Save error:', error);
                showAlert('error', '❌ Error saving profile: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 Save Profile & Continue';
            }
        }

        // ===== Skip Profile =====
        function skipProfile() {
            if (confirm('Are you sure you want to skip? You can complete your profile later from your account settings.')) {
                // Save minimal data
                localStorage.setItem('currentUser', JSON.stringify({
                    id: currentUser.id,
                    email: currentUser.email,
                    profile_complete: false
                }));
                window.location.href = 'index.html';
            }
        }

        // ===== Show Alert =====
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 6000);
        }
    </script>
</body>
</html>
