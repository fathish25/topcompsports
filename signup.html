<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0066CC;
            --dark-blue: #003366;
            --accent-yellow: #FFB800;
            --black: #0A0A0A;
            --dark-gray: #1A1A1A;
            --medium-gray: #2A2A2A;
            --light-gray: #F5F5F5;
            --white: #FFFFFF;
            --gradient-blue: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }

        .signup-container { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
        
        /* Left Side - Blue */
        .signup-left {
            background: var(--gradient-blue);
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .signup-left::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .signup-left-content { position: relative; z-index: 1; }
        .logo { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; }
        .logo-icon { width: 50px; height: 50px; background: var(--white); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: var(--primary-blue); }
        .logo-text { font-size: 28px; font-weight: bold; color: var(--white); }
        
        .signup-left h1 { font-size: 3.5rem; font-weight: 900; line-height: 1.2; margin-bottom: 20px; color: var(--white); }
        .signup-left p { font-size: 1.2rem; color: rgba(255,255,255,0.9); line-height: 1.8; max-width: 500px; }

        /* Right Side - Dark */
        .signup-right {
            background: var(--dark-gray);
            padding: 60px;
            overflow-y: auto;
        }

        .signup-header { margin-bottom: 40px; }
        .signup-header h2 { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; }
        .signup-header p { color: rgba(255,255,255,0.6); }

        /* User Type Selection */
        .user-type-section { margin-bottom: 30px; }
        .user-type-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; }
        
        .user-type-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        
        .user-type-option {
            background: var(--medium-gray);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-type-option:hover { border-color: var(--primary-blue); transform: translateY(-2px); }
        .user-type-option.active { border-color: var(--primary-blue); background: rgba(0,102,204,0.1); }
        
        .user-type-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .user-type-name { font-weight: 600; font-size: 0.95rem; }

        /* Form */
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.8); }
        .form-input, .form-select {
            width: 100%;
            background: var(--black);
            border: 2px solid var(--medium-gray);
            color: var(--white);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary-blue); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.05rem;
            margin-top: 10px;
        }

        .btn-primary { background: var(--gradient-blue); color: var(--white); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,102,204,0.4); }
        .btn-secondary { background: transparent; color: var(--white); border: 2px solid var(--white); margin-top: 15px; }
        .btn-secondary:hover { background: var(--white); color: var(--black); }

        .alert { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .alert.show { display: block; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-info { background: rgba(14,165,233,0.2); border: 1px solid #0ea5e9; color: #0ea5e9; }

        .login-link { text-align: center; margin-top: 20px; color: rgba(255,255,255,0.6); }
        .login-link a { color: var(--primary-blue); text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 968px) {
            .signup-container { grid-template-columns: 1fr; }
            .signup-left { display: none; }
            .signup-right { padding: 40px 20px; }
            .user-type-options { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .signup-left h1 { font-size: 2.5rem; }
            .signup-header h2 { font-size: 2rem; }
        }

        @media (max-width: 480px) {
            .signup-right { padding: 30px 15px; }
            .signup-header h2 { font-size: 1.8rem; }
            .btn { padding: 14px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <!-- Left Side -->
        <div class="signup-left">
            <div class="signup-left-content">
                <div class="logo">
                    <div class="logo-icon">T</div>
                    <div class="logo-text">TopCompSports</div>
                </div>
                <h1>Start your journey today.</h1>
                <p>Join thousands of athletes, coaches, and organizers building the future of competition.</p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="signup-right">
            <div class="signup-header">
                <h2>Make your mark.</h2>
                <p>Create your account to get started</p>
            </div>

            <div id="alert" class="alert"></div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <!-- User Type Selection -->
                <div class="user-type-section">
                    <div class="user-type-label">I am joining as</div>
                    <div class="user-type-options">
                        <div class="user-type-option" onclick="selectUserType('athlete')" id="type-athlete">
                            <div class="user-type-icon">🥋</div>
                            <div class="user-type-name">Athlete</div>
                        </div>
                        <div class="user-type-option" onclick="selectUserType('coach')" id="type-coach">
                            <div class="user-type-icon">👨🏫</div>
                            <div class="user-type-name">Coach</div>
                        </div>
                        <div class="user-type-option" onclick="selectUserType('organizer')" id="type-organizer">
                            <div class="user-type-name">Organizer</div>
                        </div>
                    </div>
                    <input type="hidden" id="userType" required>
                </div>

                <!-- Personal Info -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-input" id="fullName" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email Address *</label>
                        <input type="email" class="form-input" id="email" required placeholder="your.email@example.com" autocomplete="off">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input type="password" class="form-input" id="password" required placeholder="Create a password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password *</label>
                        <input type="password" class="form-input" id="confirmPassword" required placeholder="Confirm your password">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-input" id="dateOfBirth">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender</label>
                        <select class="form-select" id="gender">
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Country</label>
                        <input type="text" class="form-input" id="country" placeholder="Your country">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-input" id="phone" placeholder="+1 (234) 567-8900">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Create Account →</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // ===== Supabase Setup =====
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== User Type Selection =====
        function selectUserType(type) {
            // Remove active class from all options
            document.querySelectorAll('.user-type-option').forEach(opt => opt.classList.remove('active'));
            
            // Add active class to selected option
            document.getElementById(`type-${type}`).classList.add('active');
            
            // Set hidden input value
            document.getElementById('userType').value = type;
        }

        // ===== Show Alert =====
        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }

        // ===== Check if Email Exists =====
        async function checkEmailExists(email) {
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('email')
                    .eq('email', email)
                    .single();
                
                if (error && error.code !== 'PGRST116') throw error;
                return data !== null;
            } catch (error) {
                console.error('Error checking email:', error);
                return false;
            }
        }

        // ===== Handle Signup =====
        async function handleSignup(e) {
            e.preventDefault();

            const userType = document.getElementById('userType').value;
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const dateOfBirth = document.getElementById('dateOfBirth').value;
            const gender = document.getElementById('gender').value;
            const country = document.getElementById('country').value.trim();
            const phone = document.getElementById('phone').value.trim();

            // Validation
            if (!userType) {
                showAlert('error', 'Please select your user type (Athlete, Coach, or Organizer)');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('error', 'Passwords do not match');
                return;
            }

            if (password.length < 6) {
                showAlert('error', 'Password must be at least 6 characters');
                return;
            }

            // Check if email already exists
            const emailExists = await checkEmailExists(email);
            if (emailExists) {
                showAlert('error', 'This email address is already registered. Please use a different email or sign in.');
                return;
            }

            try {
                // Sign up with Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            user_type: userType
                        }
                    }
                });

                if (authError) throw authError;

                // Create user profile in database
                const { error: profileError } = await supabase
                    .from('users')
                    .insert([{
                        id: authData.user.id,
                        email: email,
                        full_name: fullName,
                        user_type: userType,
                        date_of_birth: dateOfBirth || null,
                        gender: gender || null,
                        country: country || null,
                        phone: phone || null,
                        email_confirmed: false,
                        created_at: new Date().toISOString()
                    }]);

                if (profileError) throw profileError;

                // Success message
                showAlert('success', '✅ Account created successfully! Please check your email to confirm your account.');
                
                // Clear form
                document.getElementById('signupForm').reset();
                document.querySelectorAll('.user-type-option').forEach(opt => opt.classList.remove('active'));
                document.getElementById('userType').value = '';

                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'login.html?emailConfirmed=please_check_email';
                }, 3000);

            } catch (error) {
                console.error('Signup error:', error);
                showAlert('error', 'Error: ' + error.message);
            }
        }

        // ===== Check URL Parameters on Load =====
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('email')) {
                document.getElementById('email').value = urlParams.get('email');
            }
        };
    </script>
</body>
</html>
