<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل في البطولة - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Language Switcher */
        .lang-switcher {
            position: fixed;
            top: 20px;
            left: 20px; /* Will flip in RTL via JS/CSS logic if needed, but fixed is fine */
            z-index: 1000;
            background: rgba(21, 29, 43, 0.95);
            padding: 8px;
            border-radius: 8px;
            border: 2px solid #f1c40f;
            display: flex;
            gap: 5px;
        }
        html[dir="rtl"] .lang-switcher { left: auto; right: 20px; }
        
        .lang-btn {
            padding: 6px 14px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .lang-btn.active { background: #f1c40f; color: #0a0e17; }
        .lang-btn:hover:not(.active) { background: rgba(255,255,255,0.2); }

        .header { background: rgba(21, 29, 43, 0.95); padding: 30px; border-radius: 16px; margin-bottom: 30px; text-align: center; border: 2px solid #f1c40f; }
        .header h1 { color: #f1c40f; font-size: 2rem; margin-bottom: 10px; }
        .section { background: #151d2b; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #2a3548; }
        .section-title { font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #f1c40f; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 14px 28px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.3s; width: 100%; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; margin-top: 10px; }
        .btn-delete { background: rgba(239,68,68,0.2); color: #ef4444; padding: 8px 16px; font-size: 0.85rem; width: auto; }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .player-info { background: rgba(241,196,15,0.1); padding: 20px; border-radius: 8px; border: 1px solid rgba(241,196,15,0.3); margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .info-label { color: rgba(255,255,255,0.6); }
        .info-value { color: #fff; font-weight: bold; }
        .loading { text-align: center; padding: 20px; color: rgba(255,255,255,0.6); }
        
        .existing-registrations { margin-top: 20px; }
        .registration-card { background: rgba(241,196,15,0.05); border: 1px solid rgba(241,196,15,0.2); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .registration-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .registration-card-title { font-weight: bold; color: #f1c40f; }
        .registration-card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; font-size: 0.9rem; }
        .registration-card-item { color: rgba(255,255,255,0.8); }
        .registration-card-item span { color: #fff; font-weight: 600; }
        
        @media (max-width: 600px) { 
            .form-row { grid-template-columns: 1fr; }
            .registration-card-details { grid-template-columns: 1fr; }
            .lang-switcher { position: relative; top: 0; left: 0; right: 0; margin-bottom: 20px; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="lang-switcher">
        <button class="lang-btn" id="btnAr" onclick="changeLanguage('ar')">عربي</button>
        <button class="lang-btn" id="btnEn" onclick="changeLanguage('en')">English</button>
    </div>

    <div class="container">
        <div class="header">
            <h1 id="pageTitle">🏆 التسجيل في البطولة</h1>
            <p id="pageSubtitle" style="color: rgba(255,255,255,0.7);">قم بتسجيل مشاركتك في البطولة - يمكنك التسجيل أكثر من مرة لفئات مختلفة</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="section">
            <div class="section-title" id="personalInfoTitle">👤 بياناتك الشخصية (من الحساب)</div>
            <div id="playerInfo" class="player-info">
                <div class="loading" id="loadingText">جاري تحميل البيانات...</div>
            </div>
        </div>

        <!-- التسجيلات الحالية -->
        <div class="section" id="existingRegistrationsSection" style="display: none;">
            <div class="section-title">
                <span id="currentRegistrationsTitle">📋 تسجيلاتك الحالية في البطولة</span>
                <span id="registrationsCount" style="background: rgba(241,196,15,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;"></span>
            </div>
            <div id="existingRegistrations" class="existing-registrations"></div>
        </div>

        <div class="section">
            <div class="section-title" id="participationDataTitle">📝 بيانات المشاركة في البطولة (قابل للتعديل)</div>
            <form id="tournamentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label id="ageGroupLabel">الفئة العمرية *</label>
                        <select id="ageGroup" required onchange="updateWeightOptions()">
                            <option value="">جاري تحميل الفئات...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="weightLabel">الوزن (كجم) *</label>
                        <select id="weight" required disabled>
                            <option value="">اختر الفئة العمرية أولاً</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label id="beltLabel">الحزام *</label>
                        <select id="belt" required>
                            <option value="">جاري تحميل الأحزمة...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="giTypeLabel">نوع المشاركة *</label>
                        <select id="giType" required>
                            <option value="">اختر...</option>
                            <option value="Gi">بدلة (Gi)</option>
                            <option value="No-Gi">بدون بدلة (No-Gi)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label id="teamLabel">اسم الفريق / الأكاديمية *</label>
                    <select id="teamSelect" required>
                        <option value="">جاري تحميل الفرق...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label id="rankingLabel">التصنيف (Ranking) - اختياري</label>
                    <input type="number" id="ranking" placeholder="0 = غير مصنف | 1-10 = محلي | 1-100 = دولي" min="0" value="0">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">✅ إضافة تسجيل جديد</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'" id="backBtn">← العودة للصفحة الرئيسية</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentPlayer = null;
        let tournamentId = null;
        let weightCategories = [];
        let teamsList = [];
        let ageDivisions = [];
        let beltLevels = [];
        let availableDivisionIds = [];
        let existingRegistrations = [];
        let currentUserId = null;
        let currentLang = localStorage.getItem('lang') || 'ar';

        // Translations Dictionary
        const translations = {
            ar: {
                pageTitle: '🏆 التسجيل في البطولة',

                participationDataTitle: '📝 بيانات المشاركة في البطولة (قابل للتعديل)',

                rankingPlaceholder: '0 = غير مصنف | 1-10 = محلي | 1-100 = دولي',
                submitBtn: '✅ إضافة تسجيل جديد',

                registrationDeleted: '✅ تم حذف التسجيل بنجاح!',
                errorDeleting: '❌ خطأ في الحذف: ',
                errorRegistering: '❌ خطأ في التسجيل: ',
                confirmDelete: 'هل أنت متأكد من حذف هذا التسجيل؟',
                loginRequired: '❌ يرجى تسجيل الدخول أولاً!',
                invalidData: '❌ بيانات غير صحيحة!',
                email: 'البريد الإلكتروني',
                gender: 'الجنس',
                country: 'الدولة',
                male: 'ذكر',
                female: 'أنثى',
                unspecified: 'غير محدد',
                category: 'الفئة',
                weight: 'الوزن',
                belt: 'الحزام',
                type: 'النوع',
                team: 'الفريق',
                delete: '🗑️ حذف',

            },
            en: {
                pageTitle: '🏆 Tournament Registration',
                pageSubtitle: 'Register for the tournament - You can register multiple times for different categories',
                personalInfoTitle: '👤 Personal Information (From Account)',
                loadingText: 'Loading data...',
                currentRegistrationsTitle: '📋 Your Current Registrations',
                participationDataTitle: '📝 Tournament Participation Data (Editable)',
                ageGroupLabel: 'Age Group *',
                weightLabel: 'Weight (kg) *',
                beltLabel: 'Belt *',
                giTypeLabel: 'Participation Type *',
                teamLabel: 'Team / Academy Name *',
                rankingLabel: 'Ranking - Optional',
                rankingPlaceholder: '0 = Unranked | 1-10 = Local | 1-100 = International',
                submitBtn: '✅ Add New Registration',
                backBtn: '← Back to Home',
                selectAgeGroup: 'Select category...',
                noAgeGroups: 'No categories available',
                selectWeightFirst: 'Select age group first',
                noWeights: 'No weights available',
                noWeightsAvailable: 'No weights available for this category',
                selectBelt: 'Select belt...',
                selectTeam: 'Select team...',
                noTeams: 'No teams registered',
                gi: 'Gi',
                noGi: 'No-Gi',
                selectGiType: 'Select...',
                registrationAdded: '✅ Registration added successfully!',
                registrationDeleted: '✅ Registration deleted successfully!',
                errorDeleting: '❌ Error deleting: ',
                errorRegistering: '❌ Error registering: ',
                confirmDelete: 'Are you sure you want to delete this registration?',
                loginRequired: '❌ Please login first!',
                invalidData: '❌ Invalid data!',
                email: 'Email',
                gender: 'Gender',
                country: 'Country',
                male: 'Male',
                female: 'Female',
                unspecified: 'Unspecified',
                category: 'Category',
                weight: 'Weight',
                belt: 'Belt',
                type: 'Type',
                team: 'Team',
                delete: '🗑️ Delete',
                registration: 'Registration'
            }
        };

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            
            const t = translations[lang];
            document.getElementById('pageTitle').textContent = t.pageTitle;
            document.getElementById('pageSubtitle').textContent = t.pageSubtitle;
            document.getElementById('personalInfoTitle').textContent = t.personalInfoTitle;
            document.getElementById('loadingText').textContent = t.loadingText;
            document.getElementById('currentRegistrationsTitle').textContent = t.currentRegistrationsTitle;
            document.getElementById('participationDataTitle').textContent = t.participationDataTitle;
            document.getElementById('ageGroupLabel').textContent = t.ageGroupLabel;
            document.getElementById('weightLabel').textContent = t.weightLabel;
            document.getElementById('beltLabel').textContent = t.beltLabel;
            document.getElementById('giTypeLabel').textContent = t.giTypeLabel;
            document.getElementById('teamLabel').textContent = t.teamLabel;
            document.getElementById('rankingLabel').textContent = t.rankingLabel;
            document.getElementById('ranking').placeholder = t.rankingPlaceholder;
            document.getElementById('submitBtn').textContent = t.submitBtn;
            document.getElementById('backBtn').textContent = t.backBtn;
            
            updateSelectPlaceholders();
            if (currentPlayer) displayPlayerInfo();
            if (existingRegistrations.length > 0) displayExistingRegistrations();
        }

        function updateSelectPlaceholders() {
            const t = translations[currentLang];
            const ageSelect = document.getElementById('ageGroup');
            if (ageSelect.options.length <= 1) ageSelect.options[0].textContent = t.selectAgeGroup;
            
            const weightSelect = document.getElementById('weight');
            if (weightSelect.disabled) weightSelect.options[0].textContent = t.selectWeightFirst;
            
            const beltSelect = document.getElementById('belt');
            if (beltSelect.options.length <= 1) beltSelect.options[0].textContent = t.selectBelt;
            
            const teamSelect = document.getElementById('teamSelect');
            if (teamSelect.options.length <= 1) teamSelect.options[0].textContent = t.selectTeam;
            
            const giOptions = document.getElementById('giType');
            if (giOptions.options[0].value === '') {
                giOptions.innerHTML = `<option value="">${t.selectGiType}</option><option value="Gi">${t.gi}</option><option value="No-Gi">${t.noGi}</option>`;
            }
        }

        async function loadPlayerData(userId) {
            try {
                const { data: athlete, error: athleteError } = await supabaseClient.from('athletes').select('*').eq('user_id', userId).single();
                if (athleteError || !athlete) {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    currentPlayer = { full_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'Player', email: user.email || '', gender: user.user_metadata?.gender || 'Male', country: user.user_metadata?.country || '' };
                } else {
                    currentPlayer = { full_name: athlete.full_name || athlete.name || 'Player', email: athlete.email || '', gender: athlete.gender || 'Male', country: athlete.country || '' };
                }
                displayPlayerInfo();
            } catch (error) {
                console.error('Error loading player:', error);
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentPlayer = { full_name: user?.user_metadata?.full_name || 'Player', email: user?.email || '', gender: 'Male', country: '' };
                displayPlayerInfo();
            }
        }

        async function loadAgeDivisions() {
            const { data } = await supabaseClient.from('ajp_age_divisions').select('*').order('min_age');
            return data || [];
        }

        async function loadWeightCategories() {
            // ✅ جلب الأوزان من نفس الجدول المستخدم في Tournament Manager
            const { data } = await supabaseClient.from('ajp_weight_classes').select('*').order('min_weight');
            if (data && data.length > 0) {
                availableDivisionIds = [...new Set(data.map(w => w.age_division_id).filter(id => id !== null))];
            }
            return data || [];
        }

        async function loadBeltLevels() {
            const { data } = await supabaseClient.from('ajp_belt_levels').select('*').order('sort_order');
            return data || [];
        }

        async function loadTeams() {
            const { data } = await supabaseClient.from('teams').select('id, name, city, country').eq('is_active', true).order('name');
            return data || [];
        }

        async function loadExistingRegistrations() {
            const { data, error } = await supabaseClient.from('tournament_participants').select('*').eq('user_id', currentUserId).eq('tournament_id', tournamentId).order('created_at', { ascending: false });
            if (error) return [];
            existingRegistrations = data || [];
            displayExistingRegistrations();
            return existingRegistrations;
        }

        function populateAgeDivisions() {
            const select = document.getElementById('ageGroup');
            const t = translations[currentLang];
            select.innerHTML = `<option value="">${t.selectAgeGroup}</option>`;
            
            const divisionsWithWeights = ageDivisions.filter(div => availableDivisionIds.includes(div.id) || availableDivisionIds.length === 0);
            
            if (divisionsWithWeights.length === 0) {
                select.innerHTML = `<option value="">${t.noAgeGroups}</option>`;
                return;
            }
            
            divisionsWithWeights.forEach((div, index) {
                const option = document.createElement('option');
                option.value = div.id;
                option.textContent = div.name || `${currentLang === 'ar' ? 'الفئة' : 'Category'} ${index + 1}`;
                select.appendChild(option);
            });
        }

        function populateBeltLevels() {
            const select = document.getElementById('belt');
            const t = translations[currentLang];
            select.innerHTML = `<option value="">${t.selectBelt}</option>`;
            beltLevels.forEach(belt => {
                const option = document.createElement('option');
                option.value = belt.name;
                option.textContent = belt.name;
                select.appendChild(option);
            });
        }

        function populateTeams() {
            const select = document.getElementById('teamSelect');
            const t = translations[currentLang];
            select.innerHTML = `<option value="">${t.selectTeam}</option>`;
            if (teamsList.length === 0) {
                select.innerHTML = `<option value="">${t.noTeams}</option>`;
                return;
            }
            teamsList.forEach(team => {
                const option = document.createElement('option');
                option.value = team.name;
                option.textContent = `${team.name} - ${team.city || ''} ${team.country || ''}`;
                select.appendChild(option);
            });
        }

        function updateWeightOptions() {
            const selectedAgeDivisionId = document.getElementById('ageGroup').value;
            const weightSelect = document.getElementById('weight');
            const t = translations[currentLang];
            
            weightSelect.innerHTML = `<option value="">${t.loadingText}</option>`;
            weightSelect.disabled = true;
            
            if (!selectedAgeDivisionId) {
                weightSelect.innerHTML = `<option value="">${t.selectWeightFirst}</option>`;
                return;
            }
            
            if (weightCategories.length === 0) {
                weightSelect.innerHTML = `<option value="">${t.noWeights}</option>`;
                return;
            }
            
            const genderMap = { 'Male': 'Men', 'Female': 'Women', 'Men': 'Men', 'Women': 'Women', 'Boys': 'Boys', 'Girls': 'Girls' };
            const targetGender = genderMap[currentPlayer?.gender] || 'Men';
            
            // ✅ منطق الفلترة الذكي: يطابق الفئة العمرية (أو NULL للعامة) ويطابق الجنس (أو 'All' للعامة)
            const filteredWeights = weightCategories.filter(w => {
                const ageMatch = (w.age_division_id === null || w.age_division_id === selectedAgeDivisionId);
                const genderMatch = (w.gender === 'All' || w.gender === null || w.gender === targetGender);
                return ageMatch && genderMatch;
            });
            
            // ✅ إزالة التكرار: عرض كل اسم وزن مرة واحدة فقط
            const uniqueWeights = [];
            const seenNames = new Set();
            
            filteredWeights.forEach(w => {
                if (!seenNames.has(w.name)) {
                    seenNames.add(w.name);
                    uniqueWeights.push(w);
                }
            });
            
            if (uniqueWeights.length === 0) {
                weightSelect.innerHTML = `<option value="">${t.noWeightsAvailable}</option>`;
            } else {
                uniqueWeights.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w.name;
                    option.textContent = `${w.name} (${w.min_weight}-${w.max_weight} ${currentLang === 'ar' ? 'كجم' : 'kg'})`;
                    option.dataset.minWeight = w.min_weight;
                    option.dataset.maxWeight = w.max_weight;
                    option.dataset.weightId = w.id;
                    weightSelect.appendChild(option);
                });
                weightSelect.disabled = false;
            }
        }

        function displayPlayerInfo() {
            const infoDiv = document.getElementById('playerInfo');
            const t = translations[currentLang];
            if (!currentPlayer) { infoDiv.innerHTML = '<div class="loading">Error</div>'; return; }
            
            const genderText = currentPlayer.gender === 'Male' ? t.male : currentPlayer.gender === 'Female' ? t.female : t.unspecified;
            
            infoDiv.innerHTML = `
                <h3>👤 ${currentPlayer.full_name || 'Player'}</h3>
                <div class="info-row"><span class="info-label">${t.email}:</span><span class="info-value">${currentPlayer.email || t.unspecified}</span></div>
                <div class="info-row"><span class="info-label">${t.gender}:</span><span class="info-value">${genderText}</span></div>
                <div class="info-row"><span class="info-label">${t.country}:</span><span class="info-value">${currentPlayer.country || t.unspecified}</span></div>
            `;
        }

        function displayExistingRegistrations() {
            const container = document.getElementById('existingRegistrations');
            const section = document.getElementById('existingRegistrationsSection');
            const countLabel = document.getElementById('registrationsCount');
            const t = translations[currentLang];
            
            if (existingRegistrations.length === 0) { section.style.display = 'none'; return; }
            
            section.style.display = 'block';
            countLabel.textContent = `${existingRegistrations.length} ${t.registration}`;
            
            container.innerHTML = existingRegistrations.map((reg, index) => `
                <div class="registration-card">
                    <div class="registration-card-header">
                        <div class="registration-card-title">${t.registration} #${index + 1}</div>
                        <button type="button" class="btn btn-delete" onclick="deleteRegistration('${reg.id}')">${t.delete}</button>
                    </div>
                    <div class="registration-card-details">
                        <div class="registration-card-item">${t.category}: <span>${reg.age_group || '-'}</span></div>
                        <div class="registration-card-item">${t.weight}: <span>${reg.weight || 0} ${currentLang === 'ar' ? 'كجم' : 'kg'}</span></div>
                        <div class="registration-card-item">${t.belt}: <span>${reg.belt_level || '-'}</span></div>
                        <div class="registration-card-item">${t.type}: <span>${reg.gi_type || '-'}</span></div>
                        <div class="registration-card-item">${t.team}: <span>${reg.team || '-'}</span></div>
                    </div>
                </div>
            `).join('');
        }

        async function deleteRegistration(registrationId) {
            const t = translations[currentLang];
            if (!confirm(t.confirmDelete)) return;
            try {
                const { error } = await supabaseClient.from('tournament_participants').delete().eq('id', registrationId);
                if (error) throw error;
                showAlert('success', t.registrationDeleted);
                await loadExistingRegistrations();
            } catch (error) {
                showAlert('error', t.errorDeleting + error.message);
            }
        }

        window.onload = async () => {
            changeLanguage(currentLang);
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            if (authError || !user) {
                showAlert('error', translations[currentLang].loginRequired);
                setTimeout(() => window.location.href = 'login.html?redirect=player-registration.html?tournament_id=' + tournamentId, 2000);
                return;
            }

            if (!tournamentId) {
                showAlert('error', translations[currentLang].invalidData);
                return;
            }

            currentUserId = user.id;
            await loadPlayerData(user.id);
            
            ageDivisions = await loadAgeDivisions();
            weightCategories = await loadWeightCategories();
            beltLevels = await loadBeltLevels();
            
            populateAgeDivisions();
            populateBeltLevels();
            
            teamsList = await loadTeams();
            populateTeams();
            
            await loadExistingRegistrations();
        };

        document.getElementById('tournamentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            const weightSelect = document.getElementById('weight');
            const selectedWeightOption = weightSelect.options[weightSelect.selectedIndex];
            const ageGroupSelect = document.getElementById('ageGroup');
            const selectedDivision = ageDivisions.find(d => d.id === ageGroupSelect.value);
            
            const formData = {
                tournament_id: tournamentId,
                user_id: currentUserId,
                player_name: currentPlayer.full_name,
                age_group: selectedDivision?.name || '',
                gender: currentPlayer.gender,
                weight: parseFloat(selectedWeightOption.dataset.minWeight || 0),
                weight_class_id: selectedWeightOption.dataset.weightId || null,
                belt_level: document.getElementById('belt').value,
                gi_type: document.getElementById('giType').value,
                team: document.getElementById('teamSelect').value,
                ranking: parseInt(document.getElementById('ranking').value) || 0
            };

            try {
                const { error } = await supabaseClient.from('tournament_participants').insert([formData]).select();
                if (error) throw error;
                
                showAlert('success', t.registrationAdded);
                document.getElementById('tournamentForm').reset();
                await loadExistingRegistrations();
                populateAgeDivisions();
                populateBeltLevels();
                populateTeams();
            } catch (error) {
                showAlert('error', t.errorRegistering + error.message);
            }
        });

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
