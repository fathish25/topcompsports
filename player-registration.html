<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل في البطولة - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; position: relative; }
        
        .lang-switcher {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        html[dir="ltr"] .lang-switcher { left: auto; right: 20px; }
        
        .lang-btn {
            padding: 8px 16px;
            border: 1px solid #f1c40f;
            background: transparent;
            color: #f1c40f;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .lang-btn.active { background: #f1c40f; color: #0a0e17; }
        .lang-btn:hover:not(.active) { background: rgba(241, 196, 15, 0.1); }

        .header { background: rgba(21, 29, 43, 0.95); padding: 30px; border-radius: 16px; margin-bottom: 30px; text-align: center; border: 2px solid #f1c40f; position: relative; }
        .header h1 { color: #f1c40f; font-size: 2rem; margin-bottom: 10px; margin-top: 30px; }
        .section { background: #151d2b; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #2a3548; }
        .section-title { font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #f1c40f; }
        .form-group select:disabled { opacity: 0.5; cursor: not-allowed; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 14px 28px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.3s; width: 100%; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; margin-top: 10px; }
        .btn-delete { background: rgba(239,68,68,0.2); color: #ef4444; padding: 8px 16px; font-size: 0.85rem; width: auto; }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .player-info { background: rgba(241,196,15,0.1); padding: 20px; border-radius: 8px; border: 1px solid rgba(241,196,15,0.3); margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .info-label { color: rgba(255,255,255,0.6); }
        .info-value { color: #fff; font-weight: bold; }
        .loading { text-align: center; padding: 20px; color: rgba(255,255,255,0.6); }
        
        .existing-registrations { margin-top: 20px; }
        .registration-card { background: rgba(241,196,15,0.05); border: 1px solid rgba(241,196,15,0.2); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .registration-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .registration-card-title { font-weight: bold; color: #f1c40f; }
        .registration-card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; font-size: 0.9rem; }
        .registration-card-item { color: rgba(255,255,255,0.8); }
        .registration-card-item span { color: #fff; font-weight: 600; }
        
        @media (max-width: 600px) { 
            .form-row { grid-template-columns: 1fr; }
            .registration-card-details { grid-template-columns: 1fr; }
            .lang-switcher { position: relative; top: 0; left: 0; right: 0; margin-bottom: 15px; justify-content: center; }
            .header h1 { margin-top: 0; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="lang-switcher">
                <button class="lang-btn active" id="btnAr" onclick="setLanguage('ar')">عربي</button>
                <button class="lang-btn" id="btnEn" onclick="setLanguage('en')">English</button>
            </div>
            <h1 id="pageTitle">🏆 التسجيل في البطولة</h1>
            <p id="pageSubtitle" style="color: rgba(255,255,255,0.7);">قم بتسجيل مشاركتك في البطولة - يمكنك التسجيل أكثر من مرة لفئات مختلفة</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="section">
            <div class="section-title" id="personalInfoTitle">👤 بياناتك الشخصية (من الحساب)</div>
            <div id="playerInfo" class="player-info">
                <div class="loading" id="loadingText">جاري تحميل البيانات...</div>
            </div>
        </div>

        <div class="section" id="existingRegistrationsSection" style="display: none;">
            <div class="section-title">
                <span id="currentRegTitle">📋 تسجيلاتك الحالية في البطولة</span>
                <span id="registrationsCount" style="background: rgba(241,196,15,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;"></span>
            </div>
            <div id="existingRegistrations" class="existing-registrations"></div>
        </div>

        <div class="section">
            <div class="section-title" id="participationDataTitle"> بيانات المشاركة في البطولة (قابل للتعديل)</div>
            <form id="tournamentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label id="ageGroupLabel">الفئة العمرية *</label>
                        <select id="ageGroup" required onchange="handleAgeGroupChange()">
                            <option value="">جاري تحميل الفئات...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="genderCategoryLabel">فئة الجنس *</label>
                        <select id="genderCategory" required onchange="handleGenderCategoryChange()">
                            <option value="">اختر...</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label id="weightLabel">الوزن (كجم) *</label>
                        <select id="weight" required disabled>
                            <option value="">اختر فئة الجنس أولاً</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="beltLabel">الحزام *</label>
                        <select id="belt" required>
                            <option value="">جاري تحميل الأحزمة...</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label id="giTypeLabel">نوع المشاركة *</label>
                        <select id="giType" required>
                            <option value="">اختر...</option>
                            <option value="Gi">بدلة (Gi)</option>
                            <option value="No-Gi">بدون بدلة (No-Gi)</option>
                            <option value="Grappling">Grappling</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label id="teamLabel">اسم الفريق / الأكاديمية *</label>
                        <select id="teamSelect" required>
                            <option value="">جاري تحميل الفرق...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label id="rankingLabel">التصنيف (Ranking) - اختياري</label>
                    <input type="number" id="ranking" placeholder="0 = غير مصنف | 1-10 = محلي | 1-100 = دولي" min="0" value="0">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">✅ إضافة تسجيل جديد</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'" id="backBtn">← العودة للصفحة الرئيسية</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentPlayer = null;
        let tournamentId = null;
        let weightCategories = [];
        let teamsList = [];
        let ageDivisions = [];
        let beltLevels = [];
        let existingRegistrations = [];
        let currentUserId = null;
        let currentLang = localStorage.getItem('lang') || 'ar';

        const translations = {
            ar: {
                pageTitle: '🏆 التسجيل في البطولة', pageSubtitle: 'قم بتسجيل مشاركتك في البطولة - يمكنك التسجيل أكثر من مرة لفئات مختلفة',
                personalInfo: '👤 بياناتك الشخصية (من الحساب)', loading: 'جاري تحميل البيانات...',
                currentReg: '📋 تسجيلاتك الحالية في البطولة', regCount: 'تسجيل',
                participationData: '📝 بيانات المشاركة في البطولة (قابل للتعديل)',
                ageGroup: 'الفئة العمرية *', genderCategory: 'فئة الجنس *', weight: 'الوزن (كجم) *', belt: 'الحزام *',
                giType: 'نوع المشاركة *', team: 'اسم الفريق / الأكاديمية *',
                ranking: 'التصنيف (Ranking)', rankingPlaceholder: '0 = غير مصنف | 1-10 = محلي | 1-100 = دولي',
                submit: '✅ إضافة تسجيل جديد', back: '← العودة للصفحة الرئيسية',
                selectAge: 'اختر الفئة العمرية...', selectGender: 'اختر...', noAge: 'لا توجد فئات متاحة',
                selectWeightFirst: 'اختر فئة الجنس أولاً', noWeights: 'لا توجد موازين متاحة',
                selectBelt: 'اختر الحزام...', selectTeam: 'اختر الفريق...', noTeams: 'لا توجد فرق مسجلة',
                gi: 'بدلة (Gi)', noGi: 'بدون بدلة (No-Gi)', grappling: 'Grappling', selectGi: 'اختر...',
                successAdd: '✅ تم إضافة التسجيل بنجاح!', successDelete: '✅ تم حذف التسجيل بنجاح!',
                errorDelete: '❌ خطأ في الحذف: ', errorRegister: '❌ خطأ في التسجيل: ',
                confirmDelete: 'هل أنت متأكد من حذف هذا التسجيل؟', loginRequired: '❌ يرجى تسجيل الدخول أولاً!',
                invalidData: '❌ بيانات غير صحيحة!', email: 'البريد الإلكتروني', gender: 'الجنس',
                country: 'الدولة', male: 'ذكر', female: 'أنثى', unspecified: 'غير محدد',
                category: 'الفئة', type: 'النوع', delete: '🗑️ حذف', registration: 'تسجيل'
            },
            en: {
                pageTitle: '🏆 Tournament Registration', pageSubtitle: 'Register for the tournament - You can register multiple times for different categories',
                personalInfo: ' Personal Information (From Account)', loading: 'Loading data...',
                currentReg: ' Your Current Registrations', regCount: 'Registration(s)',
                participationData: ' Tournament Participation Data (Editable)',
                ageGroup: 'Age Group *', genderCategory: 'Gender Category *', weight: 'Weight (kg) *', belt: 'Belt *',
                giType: 'Participation Type *', team: 'Team / Academy Name *',
                ranking: 'Ranking', rankingPlaceholder: '0 = Unranked | 1-10 = Local | 1-100 = International',
                submit: '✅ Add New Registration', back: '← Back to Home',
                selectAge: 'Select age group...', selectGender: 'Select...', noAge: 'No categories available',
                selectWeightFirst: 'Select gender category first', noWeights: 'No weights available',
                selectBelt: 'Select belt...', selectTeam: 'Select team...', noTeams: 'No teams registered',
                gi: 'Gi', noGi: 'No-Gi', grappling: 'Grappling', selectGi: 'Select...',
                successAdd: '✅ Registration added successfully!', successDelete: '✅ Registration deleted successfully!',
                errorDelete: '❌ Error deleting: ', errorRegister: ' Error registering: ',
                confirmDelete: 'Are you sure you want to delete this registration?', loginRequired: ' Please login first!',
                invalidData: ' Invalid data!', email: 'Email', gender: 'Gender',
                country: 'Country', male: 'Male', female: 'Female', unspecified: 'Unspecified',
                category: 'Category', type: 'Type', delete: '️ Delete', registration: 'Registration'
            }
        };

        function safeSetText(id, text) {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            const btnAr = document.getElementById('btnAr');
            const btnEn = document.getElementById('btnEn');
            if (btnAr) btnAr.classList.toggle('active', lang === 'ar');
            if (btnEn) btnEn.classList.toggle('active', lang === 'en');
            
            const t = translations[currentLang];
            safeSetText('pageTitle', t.pageTitle);
            safeSetText('pageSubtitle', t.pageSubtitle);
            safeSetText('personalInfoTitle', t.personalInfo);
            safeSetText('loadingText', t.loading);
            safeSetText('currentRegTitle', t.currentReg);
            safeSetText('participationDataTitle', t.participationData);
            safeSetText('ageGroupLabel', t.ageGroup);
            safeSetText('genderCategoryLabel', t.genderCategory);
            safeSetText('weightLabel', t.weight);
            safeSetText('beltLabel', t.belt);
            safeSetText('giTypeLabel', t.giType);
            safeSetText('teamLabel', t.team);
            safeSetText('rankingLabel', t.ranking);
            
            const rankingInput = document.getElementById('ranking');
            if (rankingInput) rankingInput.placeholder = t.rankingPlaceholder;
            
            safeSetText('submitBtn', t.submit);
            safeSetText('backBtn', t.back);
            
            const giSelect = document.getElementById('giType');
            if (giSelect) {
                const currentValue = giSelect.value;
                giSelect.innerHTML = `<option value="">${t.selectGi}</option><option value="Gi">${t.gi}</option><option value="No-Gi">${t.noGi}</option><option value="Grappling">${t.grappling}</option>`;
                giSelect.value = currentValue;
            }

            // تحديث قائمة فئة الجنس
            populateGenderCategory();

            if (currentPlayer) displayPlayerInfo();
            if (existingRegistrations && existingRegistrations.length > 0) displayExistingRegistrations();
        }

        async function loadPlayerData(userId) {
            try {
                const { data: athlete, error: athleteError } = await supabaseClient.from('athletes').select('*').eq('user_id', userId).single();
                if (athleteError || !athlete) {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    currentPlayer = { 
                        full_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'لاعب', 
                        email: user.email || '', 
                        gender: user.user_metadata?.gender || 'Male', 
                        country: user.user_metadata?.country || '' 
                    };
                } else {
                    currentPlayer = { 
                        full_name: athlete.full_name || athlete.name || 'لاعب', 
                        email: athlete.email || '', 
                        gender: athlete.gender || 'Male', 
                        country: athlete.country || '' 
                    };
                }
                displayPlayerInfo();
            } catch (error) {
                console.error('Error loading player:', error);
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentPlayer = { 
                    full_name: user?.user_metadata?.full_name || 'لاعب', 
                    email: user?.email || '', 
                    gender: 'Male', 
                    country: '' 
                };
                displayPlayerInfo();
            }
        }

        async function loadAgeDivisions() {
            const { data, error } = await supabaseClient.from('ajp_age_divisions').select('id, name, min_age, max_age').order('min_age');
            if (error) {
                console.error('❌ خطأ في جلب الفئات العمرية:', error);
                return [];
            }
            console.log('✅ Age divisions loaded:', data?.length || 0);
            return data || [];
        }

        async function loadWeightCategories() {
            const { data, error } = await supabaseClient
                .from('ajp_weight_classes')
                .select('id, name, min_weight, max_weight, gender')
                .order('min_weight');
            
            if (error) {
                console.error(' خطأ في جلب الأوزان:', error);
                return [];
            }
            
            console.log('✅ Weight categories loaded:', data?.length || 0);
            
            // إزالة التكرار بناءً على الاسم
            const uniqueWeights = [];
            const seenNames = new Set();
            if (data) {
                data.forEach(w => {
                    if (!seenNames.has(w.name)) {
                        seenNames.add(w.name);
                        uniqueWeights.push(w);
                    }
                });
            }
            weightCategories = uniqueWeights;
            console.log('✅ Unique weights:', uniqueWeights.length);
            return uniqueWeights;
        }

        async function loadBeltLevels() {
            const { data, error } = await supabaseClient.from('ajp_belt_levels').select('id, name, sort_order').order('sort_order');
            if (error) {
                console.error('❌ خطأ في جلب الأحزمة:', error);
                return [];
            }
            
            // إزالة التكرار
            const uniqueBelts = [];
            const seenNames = new Set();
            if (data) {
                data.forEach(belt => {
                    if (!seenNames.has(belt.name)) {
                        seenNames.add(belt.name);
                        uniqueBelts.push(belt);
                    }
                });
            }
            console.log('✅ Belt levels loaded:', uniqueBelts.length);
            return uniqueBelts;
        }

        async function loadTeams() {
            const { data, error } = await supabaseClient.from('teams').select('id, name, city, country').eq('is_active', true).order('name');
            if (error) {
                console.error('❌ خطأ في جلب الفرق:', error);
                return [];
            }
            console.log('✅ Teams loaded:', data?.length || 0);
            return data || [];
        }

        async function loadExistingRegistrations() {
            const { data, error } = await supabaseClient
                .from('tournament_participants')
                .select('*')
                .eq('user_id', currentUserId)
                .eq('tournament_id', tournamentId)
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading existing registrations:', error);
                existingRegistrations = [];
            } else {
                existingRegistrations = data || [];
            }
            displayExistingRegistrations();
            return existingRegistrations;
        }

        function populateAgeDivisions() {
            const select = document.getElementById('ageGroup');
            if (!select) return;
            const t = translations[currentLang];
            
            if (!ageDivisions || ageDivisions.length === 0) {
                select.innerHTML = `<option value="">${t.noAge}</option>`;
                console.warn('⚠️ No age divisions available');
                return;
            }
            
            let optionsHTML = `<option value="">${t.selectAge}</option>`;
            ageDivisions.forEach((div) => {
                const divId = div.id || '';
                const divName = div.name || 'Unknown';
                const minAge = div.min_age || 0;
                const maxAge = div.max_age || 99;
                const yearsText = currentLang === 'ar' ? 'سنة' : 'years';
                optionsHTML += `<option value="${divId}">${divName} (${minAge}-${maxAge} ${yearsText})</option>`;
            });
            select.innerHTML = optionsHTML;
            console.log('✅ Populated', ageDivisions.length, 'age divisions');
        }

        function populateGenderCategory() {
            const select = document.getElementById('genderCategory');
            if (!select) return;
            const t = translations[currentLang];
            
            // القيم الثابتة كما طلبت
            let optionsHTML = `<option value="">${t.selectGender}</option>`;
            
            if (currentPlayer?.gender === 'Male') {
                optionsHTML += `<option value="Boys">Boys</option>`;
                optionsHTML += `<option value="Men">Men</option>`;
            } else if (currentPlayer?.gender === 'Female') {
                optionsHTML += `<option value="Girls">Girls</option>`;
                optionsHTML += `<option value="Women">Women</option>`;
            } else {
                // إذا كان الجنس غير محدد، اعرض كل الخيارات
                optionsHTML += `<option value="Boys">Boys</option>`;
                optionsHTML += `<option value="Girls">Girls</option>`;
                optionsHTML += `<option value="Men">Men</option>`;
                optionsHTML += `<option value="Women">Women</option>`;
            }
            
            select.innerHTML = optionsHTML;
            console.log('✅ Populated gender category options');
        }

        function populateBeltLevels() {
            const select = document.getElementById('belt');
            if (!select) return;
            const t = translations[currentLang];
            select.innerHTML = `<option value="">${t.selectBelt}</option>`;
            
            if (!beltLevels || beltLevels.length === 0) {
                console.warn('️ No belt levels available');
                return;
            }
            
            beltLevels.forEach(belt => {
                const option = document.createElement('option');
                option.value = belt.name;
                option.textContent = belt.name;
                select.appendChild(option);
            });
            console.log('✅ Populated', beltLevels.length, 'belt levels');
        }

        function populateTeams() {
            const select = document.getElementById('teamSelect');
            if (!select) return;
            const t = translations[currentLang];
            select.innerHTML = `<option value="">${t.selectTeam}</option>`;
            
            if (!teamsList || teamsList.length === 0) {
                select.innerHTML = `<option value="">${t.noTeams}</option>`;
                console.warn('⚠️ No teams available');
                return;
            }
            
            teamsList.forEach(team => {
                const option = document.createElement('option');
                option.value = team.name;
                option.textContent = `${team.name} - ${team.city || ''} ${team.country || ''}`.trim();
                select.appendChild(option);
            });
            console.log('✅ Populated', teamsList.length, 'teams');
        }

        function handleAgeGroupChange() {
            console.log('🔄 Age group changed');
            updateWeightOptions();
        }

        function handleGenderCategoryChange() {
            console.log('🔄 Gender category changed');
            updateWeightOptions();
        }

        // ✅ الدالة المصححة: عرض الأوزان بناءً على فئة الجنس المختارة
        function updateWeightOptions() {
            const ageGroupSelect = document.getElementById('ageGroup');
            const genderCategorySelect = document.getElementById('genderCategory');
            const weightSelect = document.getElementById('weight');
            
            if (!ageGroupSelect || !weightSelect || !genderCategorySelect) {
                console.error('❌ Select elements not found');
                return;
            }
            
            const selectedAgeDivisionId = ageGroupSelect.value;
            const selectedGenderCategory = genderCategorySelect.value;
            const t = translations[currentLang];
            
            console.log('🔍 Selected age division ID:', selectedAgeDivisionId);
            console.log('🔍 Selected gender category:', selectedGenderCategory);
            console.log(' Total weight categories:', weightCategories.length);
            
            // يجب اختيار فئة الجنس أولاً
            if (!selectedGenderCategory) {
                weightSelect.innerHTML = `<option value="">${t.selectWeightFirst}</option>`;
                weightSelect.disabled = true;
                console.log('️ No gender category selected yet');
                return;
            }
            
            if (!weightCategories || weightCategories.length === 0) {
                weightSelect.innerHTML = `<option value="">${t.noWeights}</option>`;
                weightSelect.disabled = true;
                console.error('❌ No weight categories loaded');
                return;
            }
            
            // فلترة الأوزان حسب فئة الجنس المختارة
            let filteredWeights = weightCategories.filter(w => {
                if (!w.gender) return true; // إذا لم يكن هناك جنس محدد، اعرض الوزن
                return w.gender === selectedGenderCategory;
            });
            
            console.log('🔍 Filtered weights count:', filteredWeights.length);
            
            // إزالة التكرار
            const uniqueWeights = [];
            const seenNames = new Set();
            filteredWeights.forEach(w => {
                if (!seenNames.has(w.name)) {
                    seenNames.add(w.name);
                    uniqueWeights.push(w);
                }
            });
            
            // ترتيب الأوزان من الأقل للأكثر
            uniqueWeights.sort((a, b) => (a.min_weight || 0) - (b.min_weight || 0));
            
            console.log('✅ Unique weights to display:', uniqueWeights.length);
            
            if (uniqueWeights.length === 0) {
                weightSelect.innerHTML = `<option value="">${t.noWeights}</option>`;
                weightSelect.disabled = true;
                console.warn('️ No weights found for this gender category');
            } else {
                let optionsHTML = '';
                uniqueWeights.forEach((w, idx) => {
                    const minW = w.min_weight !== null && w.min_weight !== undefined ? w.min_weight : 0;
                    const maxW = w.max_weight !== null && w.max_weight !== undefined ? w.max_weight : '';
                    const unit = currentLang === 'ar' ? 'كجم' : 'kg';
                    
                    optionsHTML += `<option value="${w.name}" data-minweight="${minW}" data-maxweight="${maxW}" data-weightid="${w.id || ''}">${w.name} (${minW}-${maxW} ${unit})</option>`;
                    
                    if (idx < 3) {
                        console.log(`  - ${w.name} (Gender: ${w.gender}, Min: ${minW}, Max: ${maxW})`);
                    }
                });
                
                weightSelect.innerHTML = optionsHTML;
                weightSelect.disabled = false;
                console.log('✅ Loaded', uniqueWeights.length, 'weights successfully');
            }
        }

        function displayPlayerInfo() {
            const infoDiv = document.getElementById('playerInfo');
            if (!infoDiv) return;
            const t = translations[currentLang];
            
            if (!currentPlayer) { 
                infoDiv.innerHTML = `<div class="loading">${t.loading}</div>`; 
                return; 
            }
            
            const genderText = currentPlayer.gender === 'Male' ? t.male : 
                              currentPlayer.gender === 'Female' ? t.female : t.unspecified;
            
            infoDiv.innerHTML = `
                <h3> ${currentPlayer.full_name || 'Player'}</h3>
                <div class="info-row"><span class="info-label">${t.email}:</span><span class="info-value">${currentPlayer.email || t.unspecified}</span></div>
                <div class="info-row"><span class="info-label">${t.gender}:</span><span class="info-value">${genderText}</span></div>
                <div class="info-row"><span class="info-label">${t.country}:</span><span class="info-value">${currentPlayer.country || t.unspecified}</span></div>
            `;
            
            // تحديث قائمة فئة الجنس بعد تحميل بيانات اللاعب
            populateGenderCategory();
        }

        function displayExistingRegistrations() {
            const container = document.getElementById('existingRegistrations');
            const section = document.getElementById('existingRegistrationsSection');
            const countLabel = document.getElementById('registrationsCount');
            if (!container || !section || !countLabel) return;

            const t = translations[currentLang];

            if (!existingRegistrations || existingRegistrations.length === 0) { 
                section.style.display = 'none'; 
                return; 
            }

            section.style.display = 'block';
            countLabel.textContent = `${existingRegistrations.length} ${t.regCount}`;

            container.innerHTML = existingRegistrations.map((reg, index) => {
                const ageGroup = reg.age_group || t.unspecified;
                const weight = reg.weight ? `${reg.weight} ${currentLang === 'ar' ? 'كجم' : 'kg'}` : t.unspecified;
                const belt = reg.belt_level || t.unspecified;
                const giType = reg.gi_type || t.unspecified;
                const team = reg.team || t.unspecified;
                const ranking = (reg.ranking !== null && reg.ranking !== undefined) ? reg.ranking : '-';

                return `
                    <div class="registration-card">
                        <div class="registration-card-header">
                            <div class="registration-card-title">${t.registration} #${index + 1}</div>
                            <button type="button" class="btn btn-delete" onclick="deleteRegistration('${reg.id}')">${t.delete}</button>
                        </div>
                        <div class="registration-card-details">
                            <div class="registration-card-item">${t.ageGroup}: <span>${ageGroup}</span></div>
                            <div class="registration-card-item">${t.weight}: <span>${weight}</span></div>
                            <div class="registration-card-item">${t.belt}: <span>${belt}</span></div>
                            <div class="registration-card-item">${t.giType}: <span>${giType}</span></div>
                            <div class="registration-card-item">${t.team}: <span>${team}</span></div>
                            <div class="registration-card-item">${t.ranking}: <span>${ranking}</span></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteRegistration(registrationId) {
            const t = translations[currentLang];
            if (!confirm(t.confirmDelete)) return;
            
            try {
                const { error } = await supabaseClient
                    .from('tournament_participants')
                    .delete()
                    .eq('id', registrationId);
                
                if (error) throw error;
                
                showAlert('success', t.successDelete);
                await loadExistingRegistrations();
            } catch (error) {
                showAlert('error', t.errorDelete + error.message);
            }
        }

        window.onload = async () => {
            console.log('🚀 Page loaded, initializing...');
            setLanguage(currentLang);
            
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            if (authError || !user) {
                showAlert('error', translations[currentLang].loginRequired);
                setTimeout(() => window.location.href = 'login.html?redirect=player-registration.html?tournament_id=' + tournamentId, 2000);
                return;
            }

            if (!tournamentId) {
                showAlert('error', translations[currentLang].invalidData);
                return;
            }

            currentUserId = user.id;
            console.log('✅ User ID:', currentUserId);
            console.log('✅ Tournament ID:', tournamentId);

            // تحميل جميع البيانات بالتوازي
            await loadPlayerData(user.id);
            ageDivisions = await loadAgeDivisions();
            weightCategories = await loadWeightCategories();
            beltLevels = await loadBeltLevels();
            teamsList = await loadTeams();
            
            populateAgeDivisions();
            populateBeltLevels();
            populateTeams();
            
            await loadExistingRegistrations();
            
            console.log('✅ All data loaded successfully');
            console.log('📊 Summary:', {
                ageDivisions: ageDivisions.length,
                weightCategories: weightCategories.length,
                beltLevels: beltLevels.length,
                teams: teamsList.length,
                existingRegistrations: existingRegistrations.length
            });
        };

        document.getElementById('tournamentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = translations[currentLang];
            
            const weightSelect = document.getElementById('weight');
            const selectedWeightOption = weightSelect.options[weightSelect.selectedIndex];
            const ageGroupSelect = document.getElementById('ageGroup');
            const genderCategorySelect = document.getElementById('genderCategory');
            const selectedDivision = ageDivisions.find(d => d.id === ageGroupSelect.value);
            
            // استخدام getAttribute للوصول إلى data attributes بشكل صحيح
            const minWeightVal = selectedWeightOption ? parseFloat(selectedWeightOption.getAttribute('data-minweight') || 0) : 0;
            const weightId = selectedWeightOption ? selectedWeightOption.getAttribute('data-weightid') : null;

            const formData = {
                tournament_id: tournamentId,
                user_id: currentUserId,
                player_name: currentPlayer.full_name,
                age_group: selectedDivision?.name || '',
                gender: genderCategorySelect.value, // استخدام فئة الجنس المختارة (Boys/Girls/Men/Women)
                weight: minWeightVal,
                weight_class_id: weightId,
                belt_level: document.getElementById('belt').value,
                gi_type: document.getElementById('giType').value,
                team: document.getElementById('teamSelect').value,
                ranking: parseInt(document.getElementById('ranking').value) || 0
            };

            console.log('📝 Submitting registration:', formData);

            try {
                const { error } = await supabaseClient
                    .from('tournament_participants')
                    .insert([formData])
                    .select();
                
                if (error) throw error;
                
                showAlert('success', t.successAdd);
                document.getElementById('tournamentForm').reset();
                document.getElementById('weight').disabled = true;
                document.getElementById('weight').innerHTML = `<option value="">${t.selectWeightFirst}</option>`;
                document.getElementById('genderCategory').value = '';
                
                await loadExistingRegistrations();
            } catch (error) {
                console.error('Registration error:', error);
                showAlert('error', t.errorRegister + error.message);
            }
        });

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            if (!alert) return;
            
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
