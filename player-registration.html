<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل في البطولة - TopCompSports</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 100%); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { background: rgba(21, 29, 43, 0.95); padding: 30px; border-radius: 16px; margin-bottom: 30px; text-align: center; border: 2px solid #f1c40f; }
        .header h1 { color: #f1c40f; font-size: 2rem; margin-bottom: 10px; }
        .section { background: #151d2b; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid #2a3548; }
        .section-title { font-size: 1.3rem; font-weight: bold; color: #f1c40f; margin-bottom: 20px; border-bottom: 2px solid #2a3548; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; background: #1a1f2e; border: 2px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #f1c40f; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 14px 28px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: all 0.3s; width: 100%; }
        .btn-primary { background: linear-gradient(135deg, #f1c40f, #d4a017); color: #0a0e17; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(241,196,15,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; margin-top: 10px; }
        .btn-add { background: linear-gradient(135deg, #10b981, #059669); color: #fff; margin-top: 15px; }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(16,185,129,0.3); }
        .btn-delete { background: rgba(239,68,68,0.2); color: #ef4444; padding: 8px 16px; font-size: 0.85rem; width: auto; }
        .btn-delete:hover { background: rgba(239,68,68,0.3); }
        .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; text-align: center; }
        .alert-success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #10b981; }
        .alert-error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
        .alert.show { display: block; }
        .player-info { background: rgba(241,196,15,0.1); padding: 20px; border-radius: 8px; border: 1px solid rgba(241,196,15,0.3); margin-bottom: 20px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .info-label { color: rgba(255,255,255,0.6); }
        .info-value { color: #fff; font-weight: bold; }
        .readonly-field { background: rgba(255,255,255,0.05) !important; color: rgba(255,255,255,0.7) !important; cursor: not-allowed; }
        .loading { text-align: center; padding: 20px; color: rgba(255,255,255,0.6); }
        
        /* تنسيق التسجيلات الحالية */
        .existing-registrations { margin-top: 20px; }
        .registration-card { background: rgba(241,196,15,0.05); border: 1px solid rgba(241,196,15,0.2); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .registration-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .registration-card-title { font-weight: bold; color: #f1c40f; }
        .registration-card-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; font-size: 0.9rem; }
        .registration-card-item { color: rgba(255,255,255,0.8); }
        .registration-card-item span { color: #fff; font-weight: 600; }
        
        @media (max-width: 600px) { 
            .form-row { grid-template-columns: 1fr; }
            .registration-card-details { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 التسجيل في البطولة</h1>
            <p style="color: rgba(255,255,255,0.7);">قم بتسجيل مشاركتك في البطولة - يمكنك التسجيل أكثر من مرة لفئات مختلفة</p>
        </div>

        <div id="alert" class="alert"></div>

        <div class="section">
            <div class="section-title"> بياناتك الشخصية (من الحساب)</div>
            <div id="playerInfo" class="player-info">
                <div class="loading">جاري تحميل البيانات...</div>
            </div>
        </div>

        <!-- التسجيلات الحالية -->
        <div class="section" id="existingRegistrationsSection" style="display: none;">
            <div class="section-title">
                <span>📋 تسجيلاتك الحالية في البطولة</span>
                <span id="registrationsCount" style="background: rgba(241,196,15,0.2); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;"></span>
            </div>
            <div id="existingRegistrations" class="existing-registrations"></div>
        </div>

        <div class="section">
            <div class="section-title">📝 بيانات المشاركة في البطولة (قابل للتعديل)</div>
            <form id="tournamentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>الفئة العمرية *</label>
                        <select id="ageGroup" required onchange="updateWeightOptions()">
                            <option value="">جاري تحميل الفئات...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>الوزن (كجم) *</label>
                        <select id="weight" required disabled>
                            <option value="">اختر الفئة العمرية أولاً</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>الحزام *</label>
                        <select id="belt" required>
                            <option value="">جاري تحميل الأحزمة...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>نوع المشاركة *</label>
                        <select id="giType" required>
                            <option value="">اختر...</option>
                            <option value="Gi">بدلة (Gi)</option>
                            <option value="No-Gi">بدون بدلة (No-Gi)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>اسم الفريق / الأكاديمية *</label>
                    <select id="teamSelect" required>
                        <option value="">جاري تحميل الفرق...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>التصنيف (Ranking) - اختياري</label>
                    <input type="number" id="ranking" placeholder="0 = غير مصنف | 1-10 = محلي | 1-100 = دولي" min="0" value="0">
                </div>

                <button type="submit" class="btn btn-primary">✅ إضافة تسجيل جديد</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">← العودة للصفحة الرئيسية</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ngiclnkmbvzjhylwhzyn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5naWNsbmttYnZ6amh5bHdoenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNDg4MzgsImV4cCI6MjEwMzkyNDgzOH0.6ourM74pyo5B4dggygmJI9Ysclumfwh-Xh08cS6qY5w';
        
        const supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentPlayer = null;
        let tournamentId = null;
        let weightCategories = [];
        let teamsList = [];
        let ageDivisions = [];
        let beltLevels = [];
        let availableDivisionIds = [];
        let existingRegistrations = [];
        let currentUserId = null;

        async function loadPlayerData(userId) {
            try {
                const { data: athlete, error: athleteError } = await supabaseClient
                    .from('athletes')
                    .select('*')
                    .eq('user_id', userId)
                    .single();
                
                if (athleteError || !athlete) {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    currentPlayer = { 
                        full_name: user.user_metadata?.full_name || user.email?.split('@')[0] || 'لاعب', 
                        email: user.email || '', 
                        gender: user.user_metadata?.gender || 'Male',
                        country: user.user_metadata?.country || ''
                    };
                } else {
                    currentPlayer = {
                        full_name: athlete.full_name || athlete.name || 'لاعب',
                        email: athlete.email || '',
                        gender: athlete.gender || 'Male',
                        country: athlete.country || ''
                    };
                }
                
                displayPlayerInfo();
                
            } catch (error) {
                console.error('Error loading player:', error);
                const { data: { user } } = await supabaseClient.auth.getUser();
                currentPlayer = { 
                    full_name: user?.user_metadata?.full_name || 'لاعب', 
                    email: user?.email || '', 
                    gender: 'Male',
                    country: ''
                };
                displayPlayerInfo();
            }
        }

        async function loadAgeDivisions() {
            const { data, error } = await supabaseClient
                .from('ajp_age_divisions')
                .select('*')
                .order('min_age');
            
            console.log('✅ Age divisions loaded from ajp_age_divisions:', data?.length || 0);
            return data || [];
        }

        async function loadWeightCategories() {
            const { data, error } = await supabaseClient
                .from('ajp_weight_classes')
                .select('*')
                .order('min_weight');
            
            console.log('✅ Weight categories loaded from ajp_weight_classes:', data?.length || 0);
            
            if (data && data.length > 0) {
                availableDivisionIds = [...new Set(data.map(w => w.age_division_id))];
                console.log('📋 Available division IDs in weight classes:', availableDivisionIds.length);
            }
            
            return data || [];
        }

        async function loadBeltLevels() {
            const { data, error } = await supabaseClient
                .from('ajp_belt_levels')
                .select('*')
                .order('sort_order');
            
            console.log('✅ Belt levels loaded from ajp_belt_levels:', data?.length || 0);
            return data || [];
        }

        async function loadTeams() {
            const { data, error } = await supabaseClient
                .from('teams')
                .select('id, name, city, country')
                .eq('is_active', true)
                .order('name');
            
            return data || [];
        }

        async function loadExistingRegistrations() {
            const { data, error } = await supabaseClient
                .from('tournament_participants')
                .select('*')
                .eq('user_id', currentUserId)
                .eq('tournament_id', tournamentId)
                .order('created_at', { ascending: false });
            
            if (error) {
                console.error('Error loading existing registrations:', error);
                return [];
            }
            
            existingRegistrations = data || [];
            displayExistingRegistrations();
            return data || [];
        }

        function populateAgeDivisions() {
            const select = document.getElementById('ageGroup');
            select.innerHTML = '<option value="">اختر الفئة...</option>';
            
            if (ageDivisions.length === 0) {
                select.innerHTML = '<option value="">لا توجد فئات متاحة</option>';
                console.log('❌ No age divisions found');
                return;
            }
            
            const divisionsWithWeights = ageDivisions.filter(div => 
                availableDivisionIds.includes(div.id)
            );
            
            console.log('📊 Divisions with weights:', divisionsWithWeights.length, 'of', ageDivisions.length);
            
            if (divisionsWithWeights.length === 0) {
                select.innerHTML = '<option value="">لا توجد فئات متاحة</option>';
                return;
            }
            
            divisionsWithWeights.forEach((div, index) => {
                const option = document.createElement('option');
                option.value = div.id;
                option.textContent = div.name || `الفئة ${index + 1} (${div.min_age || 0}-${div.max_age || 99} سنة)`;
                select.appendChild(option);
            });
            
            console.log('✅ Populated', divisionsWithWeights.length, 'age divisions');
        }

        function populateBeltLevels() {
            const select = document.getElementById('belt');
            select.innerHTML = '<option value="">اختر الحزام...</option>';
            
            if (beltLevels.length === 0) {
                console.log('⚠️ No belt levels found');
                return;
            }
            
            beltLevels.forEach(belt => {
                const option = document.createElement('option');
                option.value = belt.name;
                option.textContent = belt.name;
                option.dataset.color = belt.color_hex || '';
                select.appendChild(option);
            });
            
            console.log('✅ Populated', beltLevels.length, 'belt levels');
        }

        function populateTeams() {
            const select = document.getElementById('teamSelect');
            select.innerHTML = '<option value="">اختر الفريق...</option>';
            
            if (teamsList.length === 0) {
                select.innerHTML = '<option value="">لا توجد فرق مسجلة</option>';
                return;
            }
            
            teamsList.forEach(team => {
                const option = document.createElement('option');
                option.value = team.name;
                option.textContent = `${team.name} - ${team.city || ''} ${team.country || ''}`;
                select.appendChild(option);
            });
        }

        function updateWeightOptions() {
            const selectedAgeDivisionId = document.getElementById('ageGroup').value;
            const weightSelect = document.getElementById('weight');
            
            console.log('🔄 Updating weights...');
            console.log('Selected division:', selectedAgeDivisionId);
            console.log('Gender:', currentPlayer?.gender);
            
            weightSelect.innerHTML = '<option value="">جاري التحميل...</option>';
            weightSelect.disabled = true;
            
            if (!selectedAgeDivisionId) {
                weightSelect.innerHTML = '<option value="">اختر الفئة العمرية أولاً</option>';
                return;
            }
            
            if (weightCategories.length === 0) {
                weightSelect.innerHTML = '<option value="">لا توجد موازين</option>';
                return;
            }
            
            const genderMap = {
                'Male': 'Men',
                'Female': 'Women',
                'Men': 'Men',
                'Women': 'Women',
                'Boys': 'Boys',
                'Girls': 'Girls'
            };
            
            const targetGender = genderMap[currentPlayer?.gender] || 'Men';
            
            const filteredWeights = weightCategories.filter(w => {
                return w.age_division_id === selectedAgeDivisionId && 
                       w.gender === targetGender;
            });
            
            console.log('Filtered:', filteredWeights.length, 'Target gender:', targetGender);
            
            if (filteredWeights.length === 0) {
                const fallbackWeights = weightCategories.filter(w => 
                    w.age_division_id === selectedAgeDivisionId
                );
                
                if (fallbackWeights.length > 0) {
                    console.log('✅ Found', fallbackWeights.length, 'weights (all genders)');
                    
                    fallbackWeights.forEach(w => {
                        const option = document.createElement('option');
                        option.value = w.name;
                        option.textContent = `${w.name} (${w.min_weight}-${w.max_weight} كجم) - ${w.gender}`;
                        option.dataset.minWeight = w.min_weight;
                        option.dataset.maxWeight = w.max_weight;
                        option.dataset.weightId = w.id;
                        weightSelect.appendChild(option);
                    });
                    
                    weightSelect.disabled = false;
                    return;
                }
            }
            
            if (filteredWeights.length === 0) {
                weightSelect.innerHTML = '<option value="">لا توجد موازين متاحة</option>';
                console.log('❌ No weights found!');
            } else {
                filteredWeights.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w.name;
                    option.textContent = `${w.name} (${w.min_weight}-${w.max_weight} كجم)`;
                    option.dataset.minWeight = w.min_weight;
                    option.dataset.maxWeight = w.max_weight;
                    option.dataset.weightId = w.id;
                    weightSelect.appendChild(option);
                });
                
                weightSelect.disabled = false;
                console.log('✅ Loaded', filteredWeights.length, 'weights');
            }
        }

        function displayPlayerInfo() {
            const infoDiv = document.getElementById('playerInfo');
            if (!currentPlayer) {
                infoDiv.innerHTML = '<div class="loading">خطأ في تحميل البيانات</div>';
                return;
            }
            
            infoDiv.innerHTML = `
                <h3>👤 ${currentPlayer.full_name || 'لاعب'}</h3>
                <div class="info-row"><span class="info-label">البريد الإلكتروني:</span><span class="info-value">${currentPlayer.email || 'غير متوفر'}</span></div>
                <div class="info-row"><span class="info-label">الجنس:</span><span class="info-value">${currentPlayer.gender === 'Male' ? 'ذكر' : currentPlayer.gender === 'Female' ? 'أنثى' : currentPlayer.gender || 'غير محدد'}</span></div>
                <div class="info-row"><span class="info-label">الدولة:</span><span class="info-value">${currentPlayer.country || 'غير محدد'}</span></div>
            `;
        }

        function displayExistingRegistrations() {
            const container = document.getElementById('existingRegistrations');
            const section = document.getElementById('existingRegistrationsSection');
            const countLabel = document.getElementById('registrationsCount');
            
            if (existingRegistrations.length === 0) {
                section.style.display = 'none';
                return;
            }
            
            section.style.display = 'block';
            countLabel.textContent = `${existingRegistrations.length} تسجيل`;
            
            container.innerHTML = existingRegistrations.map((reg, index) => `
                <div class="registration-card">
                    <div class="registration-card-header">
                        <div class="registration-card-title">تسجيل #${index + 1}</div>
                        <button type="button" class="btn btn-delete" onclick="deleteRegistration('${reg.id}')">🗑️ حذف</button>
                    </div>
                    <div class="registration-card-details">
                        <div class="registration-card-item">الفئة: <span>${reg.age_group || '-'}</span></div>
                        <div class="registration-card-item">الوزن: <span>${reg.weight || 0} كجم</span></div>
                        <div class="registration-card-item">الحزام: <span>${reg.belt_level || '-'}</span></div>
                        <div class="registration-card-item">النوع: <span>${reg.gi_type || '-'}</span></div>
                        <div class="registration-card-item">الفريق: <span>${reg.team || '-'}</span></div>
                    </div>
                </div>
            `).join('');
        }

        async function deleteRegistration(registrationId) {
            if (!confirm('هل أنت متأكد من حذف هذا التسجيل؟')) {
                return;
            }
            
            try {
                const { error } = await supabaseClient
                    .from('tournament_participants')
                    .delete()
                    .eq('id', registrationId);
                
                if (error) throw error;
                
                showAlert('success', '✅ تم حذف التسجيل بنجاح!');
                await loadExistingRegistrations();
            } catch (error) {
                console.error('Error deleting registration:', error);
                showAlert('error', '❌ خطأ في الحذف: ' + error.message);
            }
        }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            tournamentId = urlParams.get('tournament_id');
            
            const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
            if (authError || !user) {
                showAlert('error', '❌ يرجى تسجيل الدخول أولاً!');
                setTimeout(() => window.location.href = 'login.html?redirect=player-registration.html?tournament_id=' + tournamentId, 2000);
                return;
            }

            if (!tournamentId) {
                showAlert('error', '❌ بيانات غير صحيحة!');
                return;
            }

            currentUserId = user.id;
            console.log('🚀 Loading data from new tables...');

            await loadPlayerData(user.id);
            
            ageDivisions = await loadAgeDivisions();
            weightCategories = await loadWeightCategories();
            beltLevels = await loadBeltLevels();
            
            populateAgeDivisions();
            populateBeltLevels();
            
            teamsList = await loadTeams();
            populateTeams();
            
            // تحميل التسجيلات الحالية
            await loadExistingRegistrations();
            
            console.log('✅ All data loaded from new tables');
        };

        // ✅ تم التعديل: السماح بتسجيلات متعددة
        document.getElementById('tournamentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const weightSelect = document.getElementById('weight');
            const selectedWeightOption = weightSelect.options[weightSelect.selectedIndex];
            const ageGroupSelect = document.getElementById('ageGroup');
            const selectedDivision = ageDivisions.find(d => d.id === ageGroupSelect.value);
            
            const formData = {
                tournament_id: tournamentId,
                user_id: currentUserId,
                player_name: currentPlayer.full_name,
                age_group: selectedDivision?.name || '',
                gender: currentPlayer.gender,
                weight: parseFloat(selectedWeightOption.dataset.minWeight || 0),
                weight_class_id: selectedWeightOption.dataset.weightId || null,
                belt_level: document.getElementById('belt').value,
                gi_type: document.getElementById('giType').value,
                team: document.getElementById('teamSelect').value,
                ranking: parseInt(document.getElementById('ranking').value) || 0
            };

            console.log('Submitting new registration:', formData);

            try {
                // ✅ دائماً إنشاء تسجيل جديد (بدون التحقق من وجود تسجيل سابق)
                const { data, error } = await supabaseClient
                    .from('tournament_participants')
                    .insert([formData])
                    .select();
                
                if (error) throw error;
                
                showAlert('success', '✅ تم إضافة التسجيل بنجاح!');
                
                // إعادة تعيين النموذج
                document.getElementById('tournamentForm').reset();
                
                // إعادة تحميل التسجيلات الحالية
                await loadExistingRegistrations();
                
                // إعادة تحميل القوائم
                populateAgeDivisions();
                populateBeltLevels();
                populateTeams();

            } catch (error) {
                console.error(' Registration error:', error);
                showAlert('error', '❌ خطأ في التسجيل: ' + error.message);
            }
        });

        function showAlert(type, message) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => alert.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
